name: V1006 Card Market Exact Identity Regression

on:
  pull_request:
    paths:
      - 'grade_market_flow.js'
      - 'test_card_identity_market_precision_v309.py'
      - 'execution/tests/test_market_key_identity_v1006.js'
      - '.github/workflows/market-key-identity-v1006.yml'
  push:
    branches: [main]
    paths:
      - 'grade_market_flow.js'
      - 'execution/tests/test_market_key_identity_v1006.js'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-identity:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Verify real market JS syntax and exact-ID fixtures
        run: |
          set -euo pipefail
          node --check grade_market_flow.js
          node execution/tests/test_market_key_identity_v1006.js
      # CI is not a physical Lenovo/PWA runtime attestation.
