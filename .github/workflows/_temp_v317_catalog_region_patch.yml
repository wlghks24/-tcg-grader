name: TEMP v317 catalog region patch
on:
  push:
    branches: [fix/card-catalog-region-isolation-v317]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install OCR test dependency
        run: python -m pip install --disable-pip-version-check --quiet pillow
      - name: Apply v317 region-aware catalog identity fix
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('card_identity_recognition.py')
          s=p.read_text(encoding='utf-8')
          old="""    known = {(row[\"game\"], normalize(row[\"card_name\"]), row[\"card_number\"]) for row in rows}\n"""
          new="""    # Catalog identity is edition-specific. The same card name/number may exist\n    # in KR/JP/US; one region must never suppress a verified reference row from\n    # another region.\n    known = {\n        (row[\"game\"], normalize(row[\"card_name\"]), row[\"card_number\"], normalize_region(row.get(\"region\")))\n        for row in rows\n    }\n"""
          if s.count(old)!=1:
              raise SystemExit(f'known-key match count={s.count(old)}')
          s=s.replace(old,new,1)
          old2="""        key = (game, normalize(name), number)\n"""
          new2="""        key = (game, normalize(name), number, region)\n"""
          if s.count(old2)!=1:
              raise SystemExit(f'reference-key match count={s.count(old2)}')
          s=s.replace(old2,new2,1)
          p.write_text(s,encoding='utf-8')

          test=Path('test_card_catalog_region_isolation_v317.py')
          test.write_text(r'''from __future__ import annotations

import json
import tempfile
import unittest
from pathlib import Path
from unittest import mock

import card_identity_recognition as identity


class CardCatalogRegionIsolationV317Tests(unittest.TestCase):
    def setUp(self) -> None:
        identity._CATALOG_CACHE_SIGNATURE = None
        identity._CATALOG_CACHE_ROWS = []

    def tearDown(self) -> None:
        identity._CATALOG_CACHE_SIGNATURE = None
        identity._CATALOG_CACHE_ROWS = []

    def test_same_name_and_number_in_different_editions_are_both_preserved(self) -> None:
        with tempfile.TemporaryDirectory() as tmp:
            root = Path(tmp)
            market = root / 'market.json'
            reference = root / 'reference.json'
            market.write_text(json.dumps({
                'entries': {
                    'JP|Pikachu|HIT': {
                        'game': 'pokemon',
                        'card_name': 'Pikachu',
                        'card_number': '025',
                    }
                }
            }), encoding='utf-8')
            reference.write_text(json.dumps({
                'cards': [
                    {
                        'game': 'pokemon',
                        'region': 'KR',
                        'card_name': 'Pikachu',
                        'card_number': '025',
                        'aliases': ['피카츄'],
                    },
                    {
                        'game': 'pokemon',
                        'region': 'US',
                        'card_name': 'Pikachu',
                        'card_number': '025',
                        'aliases': ['Pikachu'],
                    },
                ]
            }), encoding='utf-8')
            with mock.patch.object(identity, 'MARKET', market), mock.patch.object(identity, 'REFERENCE', reference):
                rows = identity.catalog()
            matches = {
                (row['region'], row['card_name'], row['card_number'])
                for row in rows
                if row['game'] == 'pokemon' and row['card_name'] == 'Pikachu' and row['card_number'] == '025'
            }
            self.assertEqual({
                ('JP', 'Pikachu', '025'),
                ('KR', 'Pikachu', '025'),
                ('US', 'Pikachu', '025'),
            }, matches)

    def test_region_filter_still_blocks_cross_edition_candidate_use(self) -> None:
        with tempfile.TemporaryDirectory() as tmp:
            store = Path(tmp) / 'learning.json'
            store.write_text(json.dumps({
                'version': 1,
                'confirmed': [
                    {'image_hash':'0000000000000001','game':'pokemon','card_name':'Pikachu','card_number':'025','market_key':'','region':'JP'},
                    {'image_hash':'0000000000000002','game':'pokemon','card_name':'Pikachu','card_number':'025','market_key':'','region':'JP'},
                    {'image_hash':'0000000000000004','game':'pokemon','card_name':'Pikachu','card_number':'025','market_key':'','region':'JP'},
                ],
                'conflicts': [],
            }), encoding='utf-8')
            with mock.patch.object(identity, 'LEARNING', store):
                self.assertEqual([], identity.match_learning('0000000000000000','pokemon','KR'))
                self.assertTrue(identity.match_learning('0000000000000000','pokemon','JP'))


if __name__ == '__main__':
    unittest.main(verbosity=2)
''',encoding='utf-8')
          PY
      - name: Run focused and related card regressions
        run: |
          python test_card_catalog_region_isolation_v317.py
          python test_card_identity_market_precision_v309.py
          python test_card_edition_precision_v302.py
          python test_card_region_generation_precision_v306.py
          python test_card_tablet_runtime_v300.py
          python test_multi_market_price_collector.py
          python verify_current_runtime.py
      - name: Remove temporary workflow and refresh exact-tree integrity manifest
        run: |
          git rm .github/workflows/_temp_v317_catalog_region_patch.yml
          python fault_injection_healing.py --manifest
          python fault_injection_healing.py --diagnose
          git diff --check
      - name: Commit validated v317 patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add card_identity_recognition.py test_card_catalog_region_isolation_v317.py integrity_manifest.json .github/workflows/_temp_v317_catalog_region_patch.yml
          git commit -m 'fix: isolate card identity catalog by edition v317'
          git push origin HEAD:fix/card-catalog-region-isolation-v317
