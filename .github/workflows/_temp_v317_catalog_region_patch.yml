name: TEMP v317 catalog region patch

on:
  push:
    branches:
      - fix/card-catalog-region-isolation-v317

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install OCR test dependency
        run: python -m pip install --disable-pip-version-check --quiet pillow

      - name: Apply v317 region-aware catalog identity fix
        run: python .github/scripts/card_catalog_region_isolation_v317.py

      - name: Run focused and related card regressions
        run: |
          python test_card_catalog_region_isolation_v317.py
          python test_card_identity_market_precision_v309.py
          python test_card_edition_precision_v302.py
          python test_card_region_generation_precision_v306.py
          python test_card_tablet_runtime_v300.py
          python test_multi_market_price_collector.py
          python verify_current_runtime.py

      - name: Remove temporary bootstrap and refresh exact-tree integrity manifest
        run: |
          git rm .github/workflows/_temp_v317_catalog_region_patch.yml
          git rm .github/scripts/card_catalog_region_isolation_v317.py
          python fault_injection_healing.py --manifest
          python fault_injection_healing.py --diagnose
          git diff --check

      - name: Commit validated v317 patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: isolate card identity catalog by edition v317'
          git push origin HEAD:fix/card-catalog-region-isolation-v317
