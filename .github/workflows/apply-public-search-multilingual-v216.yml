name: Apply public search multilingual balance v216

on:
  push:
    branches:
      - fix/public-search-url-budget-v216
    paths:
      - apply_public_search_multilingual_v216.py

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Apply multilingual URL-budget regression fix
        run: python apply_public_search_multilingual_v216.py
      - name: Compile collector
        run: python -m py_compile collection_learning_hardening_v144.py
      - name: Targeted regressions
        run: >-
          python -m unittest -v
          test_event_miss_learning_v144.py
          test_public_search_url_budget_v216.py
          test_event_quick_watch.py
          test_event_source_expansion_v145.py
      - name: Tablet runtime compile audit
        run: python tablet_runtime_manifest.py --check --compile
      - name: Commit verified source/test changes
        shell: bash
        run: |
          if git diff --quiet -- collection_learning_hardening_v144.py test_public_search_url_budget_v216.py; then
            echo 'Expected multilingual collector changes were not produced.'
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add collection_learning_hardening_v144.py test_public_search_url_budget_v216.py
          git commit -m 'fix: preserve multilingual recovery anchors within URL budget'
          git push origin HEAD:fix/public-search-url-budget-v216
