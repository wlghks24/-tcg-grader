name: Workflow Security V438

on:
  pull_request:
    paths:
      - ".github/workflows/**"
      - ".github/dependabot.yml"
  push:
    branches: [main]
    paths:
      - ".github/workflows/**"
      - ".github/dependabot.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: workflow-security-v438-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: Workflow Security V438
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install pinned actionlint
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSLo actionlint.tar.gz https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  actionlint.tar.gz" | sha256sum -c -
          tar -xzf actionlint.tar.gz actionlint
          chmod +x actionlint
      - name: Validate critical workflows
        run: |
          ./actionlint \
            .github/workflows/github-skills-quality-v438.yml \
            .github/workflows/codeql-v438.yml \
            .github/workflows/workflow-security-v438.yml \
            .github/workflows/repository-integrity-guard.yml \
            .github/workflows/selfrefine-full-repo.yml \
            .github/workflows/topology-policy-v441.yml \
            .github/workflows/colab-free-v442.yml \
            .github/workflows/github-free-usage-v444.yml \
            .github/workflows/github-drive-archive-v446.yml
      - name: Run pinned zizmor audit
        uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482
        with:
          version: "1.30.1"
          advanced-security: false
          online-audits: false
          inputs: |
            .github/workflows/github-skills-quality-v438.yml
            .github/workflows/codeql-v438.yml
            .github/workflows/workflow-security-v438.yml
            .github/workflows/repository-integrity-guard.yml
            .github/workflows/selfrefine-full-repo.yml
            .github/workflows/topology-policy-v441.yml
            .github/workflows/colab-free-v442.yml
            .github/workflows/github-free-usage-v444.yml
            .github/workflows/github-drive-archive-v446.yml
