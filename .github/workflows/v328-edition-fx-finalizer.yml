name: V328 Edition FX Finalizer

on:
  push:
    branches:
      - fix/edition-fx-failclosed-v328
    paths:
      - '.github/workflows/v328-edition-fx-finalizer.yml'

permissions:
  contents: write

concurrency:
  group: v328-edition-fx-finalizer
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/edition-fx-failclosed-v328
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '20'
      - name: Guard exact latest main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --no-tags
          test "$(git rev-parse origin/main)" = "b1ac89c1d4b59bc9e46789160118908cc3c11558" || { echo 'main moved; fail closed'; exit 1; }
      - name: Install audited dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Apply edition language and FX freshness hardening
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          ROOT=Path('.')
          def patch(path, old, new):
              p=ROOT/path
              text=p.read_text(encoding='utf-8')
              if new in text:
                  return
              if old not in text:
                  raise SystemExit(f'{path}: marker missing: {old!r}')
              p.write_text(text.replace(old,new,1),encoding='utf-8')

          # Python identity: preserve legacy market-region compatibility while making
          # KR/JP/EN edition language an explicit, separate contract.
          patch('card_identity_recognition.py',
                'REGIONS = {"KR", "JP", "US", "UNKNOWN"}\n',
                'MARKET_REGIONS = {"KR", "JP", "US", "UNKNOWN"}\nEDITION_LANGUAGES = {"KR", "JP", "EN", "UNKNOWN"}\nREGIONS = MARKET_REGIONS  # legacy market/catalog compatibility only\n')
          marker='''def infer_region_evidence(value: Any) -> dict[str, Any]:\n    """Return bounded KR/JP/US evidence and fail closed when strong signals disagree."""\n'''
          replacement='''def normalize_edition_language(value: Any) -> str:\n    """Normalize card edition/language independently from a sales market."""\n    token = unicodedata.normalize("NFKC", str(value or "")).strip().upper().replace(" ", "")\n    if token in {"KR", "KOR", "KOREA", "KOREAN", "한국", "한국판", "한글판", "한판", "국판"}:\n        return "KR"\n    if token in {"JP", "JPN", "JAPAN", "JAPANESE", "日本", "日本版", "日版", "일본판", "일판"}:\n        return "JP"\n    if token in {"EN", "ENG", "ENGLISH", "영문판", "영판", "US", "USA", "미국판"}:\n        return "EN"\n    return "UNKNOWN"\n\n\ndef market_region_for_edition(value: Any) -> str:\n    """Translate edition language to the legacy market/catalog region at one boundary."""\n    edition = normalize_edition_language(value)\n    return {"KR": "KR", "JP": "JP", "EN": "US"}.get(edition, "UNKNOWN")\n\n\ndef edition_language_for_market_region(value: Any) -> str:\n    """Translate a market/catalog region back to an edition language for identity UI/output."""\n    region = normalize_region(value)\n    return {"KR": "KR", "JP": "JP", "US": "EN"}.get(region, "UNKNOWN")\n\n\ndef infer_region_evidence(value: Any) -> dict[str, Any]:\n    """Return edition-language evidence plus a legacy market-region compatibility field."""\n'''
          patch('card_identity_recognition.py', marker, replacement)
          old='''    regions = sorted({str(item["region"]) for item in signals})\n    if len(regions) > 1:\n        return {\n            "region": "UNKNOWN", "confidence": 0.0, "basis": "edition_evidence_conflict",\n            "conflict": True, "signals": signals,\n        }\n    if not regions:\n        return {\n            "region": "UNKNOWN", "confidence": 0.0, "basis": "insufficient_evidence",\n            "conflict": False, "signals": [],\n        }\n    region = regions[0]\n    matching = [item for item in signals if item["region"] == region]\n    return {\n        "region": region,\n        "confidence": round(max(float(item["confidence"]) for item in matching), 3),\n        "basis": "+".join(dict.fromkeys(str(item["basis"]) for item in matching)),\n        "conflict": False,\n        "signals": matching,\n    }\n\n\ndef infer_region_from_text(value: Any) -> str:\n    """Compatibility wrapper for callers that only need the edition code."""\n    return str(infer_region_evidence(value).get("region") or "UNKNOWN")\n'''
          new='''    for item in signals:\n        item["market_region"] = normalize_region(item.get("region"))\n        item["edition_language"] = edition_language_for_market_region(item["market_region"])\n    editions = sorted({str(item["edition_language"]) for item in signals if item["edition_language"] != "UNKNOWN"})\n    if len(editions) > 1:\n        return {\n            "region": "UNKNOWN", "market_region": "UNKNOWN", "edition_language": "UNKNOWN",\n            "confidence": 0.0, "basis": "edition_evidence_conflict",\n            "conflict": True, "signals": signals,\n        }\n    if not editions:\n        return {\n            "region": "UNKNOWN", "market_region": "UNKNOWN", "edition_language": "UNKNOWN",\n            "confidence": 0.0, "basis": "insufficient_evidence",\n            "conflict": False, "signals": [],\n        }\n    edition = editions[0]\n    region = market_region_for_edition(edition)\n    matching = [item for item in signals if item["edition_language"] == edition]\n    return {\n        "region": region, "market_region": region, "edition_language": edition,\n        "confidence": round(max(float(item["confidence"]) for item in matching), 3),\n        "basis": "+".join(dict.fromkeys(str(item["basis"]) for item in matching)),\n        "conflict": False,\n        "signals": matching,\n    }\n\n\ndef infer_region_from_text(value: Any) -> str:\n    """Compatibility wrapper returning the legacy market region."""\n    return str(infer_region_evidence(value).get("market_region") or "UNKNOWN")\n\n\ndef infer_edition_from_text(value: Any) -> str:\n    """Return KR/JP/EN edition language without conflating EN with the US market."""\n    return str(infer_region_evidence(value).get("edition_language") or "UNKNOWN")\n'''
          patch('card_identity_recognition.py', old, new)
          old='''    requested_region = normalize_region(payload.get("region"))\n    region = requested_region\n'''
          new='''    requested_edition = normalize_edition_language(payload.get("edition_language") or payload.get("region"))\n    requested_region = market_region_for_edition(requested_edition)\n    region = requested_region\n'''
          patch('card_identity_recognition.py', old, new)
          old='''    inferred_region = str(region_evidence.get("region") or "UNKNOWN")\n    region_conflict = bool(region_evidence.get("conflict")) or (\n        region in {"KR", "JP", "US"}\n        and inferred_region in {"KR", "JP", "US"}\n        and inferred_region != region\n    )\n'''
          new='''    inferred_edition = str(region_evidence.get("edition_language") or "UNKNOWN")\n    inferred_region = market_region_for_edition(inferred_edition)\n    region_conflict = bool(region_evidence.get("conflict")) or (\n        requested_edition in EDITION_LANGUAGES - {"UNKNOWN"}\n        and inferred_edition in EDITION_LANGUAGES - {"UNKNOWN"}\n        and inferred_edition != requested_edition\n    )\n'''
          patch('card_identity_recognition.py', old, new)
          old='''    candidates = sorted(unique.values(), key=lambda row: -float(row.get("confidence") or 0.0))[:5]\n    ambiguity = _candidate_ambiguity(candidates, region)\n'''
          new='''    candidates = sorted(unique.values(), key=lambda row: -float(row.get("confidence") or 0.0))[:5]\n    for row in candidates:\n        row["market_region"] = normalize_region(row.get("region"))\n        row["edition_language"] = edition_language_for_market_region(row["market_region"])\n    ambiguity = _candidate_ambiguity(candidates, region)\n'''
          patch('card_identity_recognition.py', old, new)
          old='''        "ok": True, "game": game, "region_hint": region, "requested_region": requested_region,\n        "inferred_region": inferred_region,\n'''
          new='''        "ok": True, "game": game, "region_hint": region, "market_region": region,\n        "edition_language": edition_language_for_market_region(region),\n        "requested_region": requested_region, "requested_edition_language": requested_edition,\n        "inferred_region": inferred_region, "inferred_edition_language": inferred_edition,\n'''
          patch('card_identity_recognition.py', old, new)
          old='''    incoming_region = normalize_region(\n        payload.get("region") or (known.get(market_key) or {}).get("region") or "UNKNOWN"\n    )\n'''
          new='''    incoming_edition = normalize_edition_language(\n        payload.get("edition_language") or payload.get("region")\n        or edition_language_for_market_region((known.get(market_key) or {}).get("region"))\n    )\n    incoming_region = market_region_for_edition(incoming_edition)\n'''
          patch('card_identity_recognition.py', old, new)
          old='''                    item["region"] = effective_region\n                    promoted = True\n'''
          new='''                    item["region"] = effective_region\n                    item["edition_language"] = edition_language_for_market_region(effective_region)\n                    promoted = True\n'''
          patch('card_identity_recognition.py', old, new)
          old='''                "market_key": market_key, "game": game, "region": effective_region, "confirmed": True,\n'''
          new='''                "market_key": market_key, "game": game, "region": effective_region,\n                "edition_language": edition_language_for_market_region(effective_region), "confirmed": True,\n'''
          patch('card_identity_recognition.py', old, new)
          old='''            "region": effective_region, "identity_confirmations": count,\n'''
          new='''            "region": effective_region, "edition_language": edition_language_for_market_region(effective_region),\n            "identity_confirmations": count,\n'''
          patch('card_identity_recognition.py', old, new)

          # Browser identity: expose KR/JP/EN while retaining explicit EN->US only at market boundary.
          patch('card_identity_recognition.js',
                "const REGION_CODES=new Set(['KR','JP','US']);\n",
                "const REGION_CODES=new Set(['KR','JP','EN']);\n")
          old="function normalizeRegion(value){const r=generationText(value).replace(/\\s+/g,'');if(['JP','JPN','JAPAN','JAPANESE','日本','日版','日本版','일본판','일판'].includes(r))return 'JP';if(['US','USA','EN','ENGLISH','ENG','영문판','영판','미국판'].includes(r))return 'US';if(['KR','KOR','KOREA','KOREAN','한국','한국판','한글판','한판','국판'].includes(r))return 'KR';return 'UNKNOWN'}\n"
          new=old+"function normalizeEditionLanguage(value){const region=normalizeRegion(value);return region==='US'?'EN':region}\nfunction marketRegionForEdition(value){const edition=normalizeEditionLanguage(value);return edition==='EN'?'US':edition}\n"
          patch('card_identity_recognition.js', old, new)
          old=" const regions=[...new Set(signals.map(row=>row.region))].sort();\n if(regions.length>1)return {region:'UNKNOWN',confidence:0,basis:'edition_evidence_conflict',conflict:true,signals};\n if(!regions.length)return {region:'UNKNOWN',confidence:0,basis:'insufficient_evidence',conflict:false,signals:[]};\n const region=regions[0],matching=signals.filter(row=>row.region===region);\n return {region,confidence:Math.max(...matching.map(row=>row.confidence)),basis:[...new Set(matching.map(row=>row.basis))].join('+'),conflict:false,signals:matching};\n"
          new=" signals.forEach(row=>{row.market_region=normalizeRegion(row.region);row.edition_language=normalizeEditionLanguage(row.region)});\n const editions=[...new Set(signals.map(row=>row.edition_language).filter(row=>row!=='UNKNOWN'))].sort();\n if(editions.length>1)return {region:'UNKNOWN',market_region:'UNKNOWN',edition_language:'UNKNOWN',confidence:0,basis:'edition_evidence_conflict',conflict:true,signals};\n if(!editions.length)return {region:'UNKNOWN',market_region:'UNKNOWN',edition_language:'UNKNOWN',confidence:0,basis:'insufficient_evidence',conflict:false,signals:[]};\n const edition_language=editions[0],region=marketRegionForEdition(edition_language),matching=signals.filter(row=>row.edition_language===edition_language);\n return {region,market_region:region,edition_language,confidence:Math.max(...matching.map(row=>row.confidence)),basis:[...new Set(matching.map(row=>row.basis))].join('+'),conflict:false,signals:matching};\n"
          patch('card_identity_recognition.js', old, new)
          patch('card_identity_recognition.js',
                "window.TCGPokemonGeneration=Object.freeze({version:'v325',infer:inferPokemonGeneration,render:renderPokemonGeneration,inferRegion:inferEditionFromText});",
                "window.TCGPokemonGeneration=Object.freeze({version:'v328',infer:inferPokemonGeneration,render:renderPokemonGeneration,inferRegion:inferEditionFromText,normalizeEditionLanguage,marketRegionForEdition});")
          patch('card_identity_recognition.js',
                "if(allowRegionAutofill&&current==='UNKNOWN'&&candidateRegion!=='UNKNOWN'&&byId('identityRegion'))byId('identityRegion').value=candidateRegion;",
                "if(allowRegionAutofill&&current==='UNKNOWN'&&candidateRegion!=='UNKNOWN'&&byId('identityRegion'))byId('identityRegion').value=normalizeEditionLanguage(candidateRegion);")
          patch('card_identity_recognition.js',
                "body:JSON.stringify({game:resolvedGame,region,image_hash:hash,image_data:data,ocr_text:text})",
                "body:JSON.stringify({game:resolvedGame,region,edition_language:normalizeEditionLanguage(byId('identityRegion')?.value||region),image_hash:hash,image_data:data,ocr_text:text})")
          patch('card_identity_recognition.js',
                "if(selected==='UNKNOWN'&&effectiveRegion!=='UNKNOWN'&&byId('identityRegion'))byId('identityRegion').value=effectiveRegion;",
                "if(selected==='UNKNOWN'&&effectiveRegion!=='UNKNOWN'&&byId('identityRegion'))byId('identityRegion').value=normalizeEditionLanguage(effectiveRegion);")
          patch('card_identity_recognition.js',
                "edition=normalizeRegion(byId('identityRegion')?.value||'UNKNOWN');status.textContent=",
                "edition=normalizeEditionLanguage(byId('identityRegion')?.value||'UNKNOWN');status.textContent=")
          patch('card_identity_recognition.js',
                "const row={confirmed:true,image_hash:hash,game,card_name:name,card_number:number,market_key:safeText(byId('identityMarketKey').value),region};",
                "const row={confirmed:true,image_hash:hash,game,card_name:name,card_number:number,market_key:safeText(byId('identityMarketKey').value),region,edition_language:normalizeEditionLanguage(byId('identityRegion').value)};")

          # Identity UI uses language/edition codes; market adapters translate EN to US explicitly.
          patch('index.html',
                '<label>국가<select id="identityRegion"><option>KR</option><option>JP</option><option>US</option><option>UNKNOWN</option></select></label>',
                '<label>언어·판본<select id="identityRegion"><option value="KR">KR</option><option value="JP">JP</option><option value="EN">EN</option><option value="UNKNOWN">UNKNOWN</option></select></label>')
          patch('auto_market_center.js',
                "function normRegion(v){return ['KR','JP','US'].includes(v)?v:'ALL'}",
                "function normRegion(v){const raw=String(v||'').toUpperCase();return raw==='EN'?'US':(['KR','JP','US'].includes(raw)?raw:'ALL')}")
          patch('grade_market_flow.js',
                " if(/(^|\\b)(us|usa|english)(\\b|$)|미국|미국판|영문판/.test(low))return 'US';",
                " if(/(^|\\b)(us|usa|en|english)(\\b|$)|미국|미국판|영문판/.test(low))return 'US';")
          patch('grade_market_flow.js',
                "function editionLabel(code){return ({KR:'🇰🇷 한국판',JP:'🇯🇵 일본판',US:'🇺🇸 미국/영문판',UNKNOWN:'🌐 판본 미확인'})[code]||'🌐 판본 미확인'}",
                "function editionLabel(code){return ({KR:'🇰🇷 한국판',JP:'🇯🇵 일본판',US:'🌐 영문판(EN)',UNKNOWN:'🌐 판본 미확인'})[code]||'🌐 판본 미확인'}")

          # FX consumer fail-closed: stale or invalid timestamps cannot drive foreign conversions.
          old='''def _fx():\n    d=_safe_json(FX,{})\n    rates=d.get('rates') if isinstance(d,dict) else {}\n    return {'USD':float((rates or {}).get('USD_KRW') or 0),'JPY':float((rates or {}).get('JPY_KRW') or 0),\n            'EUR':float((rates or {}).get('EUR_KRW') or 0),'KRW':1.0}\n'''
          new='''FX_MAX_AGE_SECONDS=72*60*60\nFX_MAX_FUTURE_SKEW_SECONDS=6*60*60\n\ndef _fx():\n    d=_safe_json(FX,{})\n    rates=d.get('rates') if isinstance(d,dict) else {}\n    stamp=str(d.get('updated_at') or '') if isinstance(d,dict) else ''\n    try:\n        parsed=datetime.fromisoformat(stamp.replace('Z','+00:00'))\n        if parsed.tzinfo is None:\n            raise ValueError('timezone_required')\n        age=(datetime.now(timezone.utc)-parsed.astimezone(timezone.utc)).total_seconds()\n        fresh=(-FX_MAX_FUTURE_SKEW_SECONDS <= age <= FX_MAX_AGE_SECONDS)\n    except (TypeError,ValueError,OverflowError):\n        fresh=False\n    if not fresh:\n        return {'USD':0.0,'JPY':0.0,'EUR':0.0,'KRW':1.0}\n    return {'USD':float((rates or {}).get('USD_KRW') or 0),'JPY':float((rates or {}).get('JPY_KRW') or 0),\n            'EUR':float((rates or {}).get('EUR_KRW') or 0),'KRW':1.0}\n'''
          patch('multi_market_price_collector.py', old, new)
          patch('index.html',
                'async function loadExchangeRates(force=false){',
                'const FX_MAX_AGE_MS=72*60*60*1000,FX_MAX_FUTURE_SKEW_MS=6*60*60*1000;\nfunction fxTimestampFresh(value,now=Date.now()){const parsed=Date.parse(String(value||""));if(!Number.isFinite(parsed))return false;const age=now-parsed;return age>=-FX_MAX_FUTURE_SKEW_MS&&age<=FX_MAX_AGE_MS}\nasync function loadExchangeRates(force=false){')
          patch('index.html',
                '  const d=await r.json(),jpy=Number(d.rates?.JPY_KRW),usd=Number(d.rates?.USD_KRW);\n  if(!(Number.isFinite(jpy)&&jpy>0&&jpy<30&&Number.isFinite(usd)&&usd>500&&usd<3000))throw new Error("fx schema");\n  fxRates={JPY_KRW:jpy,USD_KRW:usd};fxUpdated=String(d.updated_at||"").slice(0,10)||fxUpdated;result.ok=true;',
                '  const d=await r.json(),jpy=Number(d.rates?.JPY_KRW),usd=Number(d.rates?.USD_KRW),stamp=String(d.updated_at||"");\n  if(!(Number.isFinite(jpy)&&jpy>0&&jpy<30&&Number.isFinite(usd)&&usd>500&&usd<3000))throw new Error("fx schema");\n  if(!fxTimestampFresh(stamp))throw new Error("fx timestamp stale");\n  fxRates={JPY_KRW:jpy,USD_KRW:usd};fxUpdated=stamp.slice(0,10)||fxUpdated;result.ok=true;')
          patch('verify_browser_runtime.js',
                '{ rates: { JPY_KRW: 8.7, USD_KRW: 1380 }, updated_at: "2026-08-25" },',
                '{ rates: { JPY_KRW: 8.7, USD_KRW: 1380 }, updated_at: new Date().toISOString() },')
          patch('sw.js',
                "const CACHE='tcg-v276-network-first-runtime';",
                "const CACHE='tcg-v328-edition-fx-failclosed';")

          # New integrated regression guard: identity edition and market are distinct,
          # stale FX is unusable, UI exposes EN, and PWA cache is refreshed.
          (ROOT/'test_edition_fx_failclosed_v328.py').write_text(r'''from __future__ import annotations\n\nimport json\nimport tempfile\nimport unittest\nfrom datetime import datetime, timedelta, timezone\nfrom pathlib import Path\nfrom unittest import mock\n\nimport card_identity_recognition as identity\nimport multi_market_price_collector as market\n\nROOT=Path(__file__).resolve().parent\n\nclass EditionFxFailClosedV328Tests(unittest.TestCase):\n    def test_english_edition_is_not_us_market_identity(self):\n        self.assertEqual("EN",identity.normalize_edition_language("EN"))\n        self.assertEqual("US",identity.market_region_for_edition("EN"))\n        self.assertEqual("EN",identity.edition_language_for_market_region("US"))\n        evidence=identity.infer_region_evidence("EN Pikachu PAL 185/193")\n        self.assertEqual("EN",evidence["edition_language"])\n        self.assertEqual("US",evidence["market_region"])\n        self.assertFalse(evidence["conflict"])\n        result=identity.recognize({"game":"pokemon","edition_language":"EN","image_hash":"0"*16,"ocr_text":"Pikachu PAL 185/193"})\n        self.assertEqual("EN",result["edition_language"])\n        self.assertEqual("US",result["market_region"])\n        self.assertEqual("EN",result["requested_edition_language"])\n\n    def test_mixed_hangul_kana_remains_fail_closed(self):\n        evidence=identity.infer_region_evidence("포켓몬 카드 ポケモン カード")\n        self.assertTrue(evidence["conflict"])\n        self.assertEqual("UNKNOWN",evidence["edition_language"])\n        self.assertEqual("UNKNOWN",evidence["market_region"])\n\n    def test_stale_fx_is_not_used_for_foreign_conversion(self):\n        with tempfile.TemporaryDirectory() as directory:\n            path=Path(directory)/"exchange_rates.json"\n            path.write_text(json.dumps({"updated_at":"2000-01-01T00:00:00+00:00","rates":{"JPY_KRW":9.1,"USD_KRW":1400.0}}),encoding="utf-8")\n            with mock.patch.object(market,"FX",path):\n                rates=market._fx()\n            self.assertEqual(0.0,rates["JPY"])\n            self.assertEqual(0.0,rates["USD"])\n            self.assertEqual(1.0,rates["KRW"])\n\n    def test_fresh_fx_is_accepted(self):\n        with tempfile.TemporaryDirectory() as directory:\n            path=Path(directory)/"exchange_rates.json"\n            stamp=(datetime.now(timezone.utc)-timedelta(minutes=5)).isoformat()\n            path.write_text(json.dumps({"updated_at":stamp,"rates":{"JPY_KRW":9.1,"USD_KRW":1400.0}}),encoding="utf-8")\n            with mock.patch.object(market,"FX",path):\n                rates=market._fx()\n            self.assertEqual(9.1,rates["JPY"])\n            self.assertEqual(1400.0,rates["USD"])\n\n    def test_ui_and_pwa_use_explicit_edition_boundary(self):\n        html=(ROOT/"index.html").read_text(encoding="utf-8")\n        browser=(ROOT/"card_identity_recognition.js").read_text(encoding="utf-8")\n        market_ui=(ROOT/"auto_market_center.js").read_text(encoding="utf-8")\n        sw=(ROOT/"sw.js").read_text(encoding="utf-8")\n        self.assertIn('언어·판본<select id="identityRegion">',html)\n        self.assertIn('<option value="EN">EN</option>',html)\n        self.assertIn('FX_MAX_AGE_MS',html)\n        self.assertIn('fxTimestampFresh',html)\n        self.assertIn('normalizeEditionLanguage',browser)\n        self.assertIn('marketRegionForEdition',browser)\n        self.assertIn("raw==='EN'?'US'",market_ui)\n        self.assertIn('tcg-v328-edition-fx-failclosed',sw)\n\nif __name__=='__main__':\n    unittest.main(verbosity=2)\n''',encoding='utf-8')

          # Remove the temporary writer before integrity generation; only permanent code/test remains.
          (ROOT/'.github/workflows/v328-edition-fx-finalizer.yml').unlink()
          PY
          git add -A
          python fault_injection_healing.py --manifest
      - name: Targeted identity and FX validation
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest -v \
            test_edition_fx_failclosed_v328.py \
            test_card_precision_v321.py \
            test_card_collector_edition_alias_v324.py \
            test_card_identity_market_precision_v309.py \
            test_card_region_generation_precision_v306.py \
            test_card_edition_precision_v302.py \
            test_card_market_edition_v297.py \
            test_card_identity_ambiguity_v320.py \
            test_card_regression_gate_v299.py \
            test_error_recovery_learning_v134.py
          node --check card_identity_recognition.js
          node --check grade_market_flow.js
          node verify_pokemon_generation_runtime.js
          node verify_browser_runtime.js
      - name: Full current regression and actual output validation
        shell: bash
        run: |
