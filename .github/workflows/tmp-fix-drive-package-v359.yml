name: Temporary Drive Package Blocker Fix v359

on:
  push:
    branches: ['fix/drive-package-blockers-v359']

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 2
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'
      - name: Apply bounded source-integrity fixes
        run: python tmp_apply_v359.py
      - name: Run targeted regressions
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile update_market_prices.py grading_company_watch.py collection_verification_gate.py
          python -m unittest -v \
            test_drive_package_blockers_v359.py \
            test_update_market_prices_packmagik_v353.py \
            test_collection_verification_gate.py \
            test_collection_verification_reporting_v244.py \
            test_grading_diagnostics_v248.py \
            test_valid_grading_source_coverage_v249.py
          git diff --check
      - name: Commit tested fix and remove temporary patch files
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/tmp-fix-drive-package-v359.yml tmp_apply_v359.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- update_market_prices.py grading_company_watch.py collection_verification_gate.py grading_company_bootstrap.json test_drive_package_blockers_v359.py .github/workflows/tmp-fix-drive-package-v359.yml tmp_apply_v359.py
          git diff --cached --check
          git commit -m 'Fix Drive package source blockers without weakening fail-closed policy'
          git push origin HEAD:fix/drive-package-blockers-v359
