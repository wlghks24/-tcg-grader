name: Temporary Drive Package Blocker Fix v359

on:
  push:
    branches:
      - 'fix/drive-package-blockers-v359'

permissions:
  contents: write

concurrency:
  group: tmp-drive-package-blocker-v359-${{ github.ref }}
  cancel-in-progress: true

jobs:
  patch-test-commit:
    if: github.actor == github.repository_owner
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Require exact owner branch and current main ancestry
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = "fix/drive-package-blockers-v359"
          test "${GITHUB_ACTOR}" = "${GITHUB_REPOSITORY_OWNER}"
          git fetch origin +refs/heads/main:refs/remotes/origin/main
          git merge-base --is-ancestor origin/main HEAD
      - name: Apply isolated provider proof and revert watched experiment
        run: python tmp_apply_drive_package_fix_v359.py
      - name: Stage obsolete bootstrap removal and remove one-shot helpers
        shell: bash
        run: |
          set -euo pipefail
          git rm -f --ignore-unmatch -- grading_company_bootstrap.json
          git rm -- tmp_apply_drive_package_fix_v359.py .github/workflows/tmp-fix-drive-package-v359.yml
      - name: Targeted validation
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile update_market_prices.py collection_verification_gate_contextual.py test_drive_package_blockers_v359.py
          python -m unittest -v \
            test_drive_package_blockers_v359.py \
            test_update_market_prices_packmagik_v353.py \
            test_collection_verification_contextual_v257.py \
            test_collection_verification_gate.py \
            test_collection_verification_reporting_v244.py \
            test_grading_company_watch_resilient_v257.py \
            test_grading_company_health_diagnostics_v252.py
      - name: Rebuild exact integrity manifest and pre-commit guard
        shell: bash
        run: |
          set -euo pipefail
          python static_integrity_manifest.py --write integrity_manifest.json
          python static_integrity_manifest.py --check integrity_manifest.json
          python repository_integrity_guard.py
          git diff --check
      - name: Commit exact final tree before lineage tests
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          python - <<'PY'
          import subprocess
          allowed={
            '.github/workflows/tmp-fix-drive-package-v359.yml','tmp_apply_drive_package_fix_v359.py',
            'update_market_prices.py','collection_verification_gate_contextual.py','provider_last_good_official.json',
            'test_drive_package_blockers_v359.py','integrity_manifest.json',
            'grading_company_watch.py','collection_verification_gate.py','grading_company_bootstrap.json',
          }
          changed=set(subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines())
          unexpected=changed-allowed
          required={'collection_verification_gate_contextual.py','provider_last_good_official.json','test_drive_package_blockers_v359.py','integrity_manifest.json','grading_company_watch.py','collection_verification_gate.py','grading_company_bootstrap.json'}
          missing=required-changed
          if unexpected or missing:
              raise SystemExit(f'unexpected={sorted(unexpected)} missing={sorted(missing)} changed={sorted(changed)}')
          PY
          git diff --cached --check
          git commit -m 'fix: isolate blocked PSA proof and quarantine OP14 market misjoin'
          git push origin "HEAD:${GITHUB_REF_NAME}"
      - name: Validate committed final tree and all Tablet GPT lineage tests
        shell: bash
        run: |
          set -euo pipefail
          python static_integrity_manifest.py --check integrity_manifest.json
          python repository_integrity_guard.py
          mapfile -t sync_tests < <(find . -maxdepth 1 -type f -name 'test_tablet_gpt_tcg_grader_sync_v*.py' -printf '%f\n' | sort -V)
          test "${#sync_tests[@]}" -gt 0
          python -m unittest -v "${sync_tests[@]}"
          git diff --check
          test -z "$(git status --porcelain)"
