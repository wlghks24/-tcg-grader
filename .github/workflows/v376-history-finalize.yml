name: Finalize V376 historical successor delegation

on:
  push:
    branches:
      - feature/tablet-autonomous-evolution-v376

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply exact historical successor delegation
        run: |
          set -euo pipefail
          python apply_v376_historical_test_delegation.py
      - name: Validate all Tablet GPT generations and V376 runtime
        run: |
          set -euo pipefail
          python -m unittest -v test_tablet_gpt_tcg_grader_sync_v*.py
          python test_tablet_autonomous_evolution_v376.py
          python tablet_autonomous_evolution_v376.py --self-test
          python tablet_runtime_manifest.py --check --compile
      - name: Remove one-shot files and rebuild exact-tree integrity
        run: |
          set -euo pipefail
          git rm .github/workflows/v376-history-finalize.yml apply_v376_historical_test_delegation.py
          python static_integrity_manifest.py --write
          python static_integrity_manifest.py --check
          python repository_integrity_guard.py
      - name: Commit finalized history-compatible tree
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'No finalization changes'
            exit 0
          fi
          git commit -m 'test: validate V376 through full historical sync lineage'
          git push origin HEAD:feature/tablet-autonomous-evolution-v376
