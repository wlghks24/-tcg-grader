name: V308 UI Bootstrap

on:
  push:
    branches: [ui-v308-sleek-polish]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui-v308-sleek-polish
          fetch-depth: 0
      - name: Append v308 presentation-only polish
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('ui_app_shell_v272.css')
          text=p.read_text(encoding='utf-8')
          marker='/* v308 sleek tablet visual system.'
          if marker in text:
              print('v308 already present')
              raise SystemExit(0)
          block=r'''

/* v308 sleek tablet visual system.
   Presentation-only additive overrides: no grading, OCR, market, sync, or collection logic changes. */
:root{
  --v308-bg:#f4f7fb;
  --v308-surface:rgba(255,255,255,.94);
  --v308-surface-strong:#ffffff;
  --v308-surface-soft:#f8fbff;
  --v308-border:rgba(148,163,184,.28);
  --v308-border-strong:rgba(100,116,139,.34);
  --v308-ink:#0f172a;
  --v308-muted:#64748b;
  --v308-blue:#2563eb;
  --v308-blue-deep:#1d4ed8;
  --v308-blue-soft:#eff6ff;
  --v308-radius:20px;
  --v308-radius-sm:14px;
  --v308-shadow:0 10px 30px rgba(15,23,42,.075),0 2px 8px rgba(15,23,42,.035);
  --v308-shadow-hover:0 16px 38px rgba(15,23,42,.105),0 3px 10px rgba(15,23,42,.045);
}

@media(prefers-color-scheme:light){
  body{
    background:
      radial-gradient(circle at 14% -2%,rgba(59,130,246,.12),transparent 32%),
      radial-gradient(circle at 92% 7%,rgba(14,165,233,.08),transparent 26%),
      linear-gradient(180deg,#f7faff 0,#f3f6fb 36%,#f6f8fb 100%)!important;
  }
}

/* App chrome and hero: premium but quiet. */
.app{isolation:isolate}
.app-title-primary{
  position:relative;overflow:hidden;border:1px solid rgba(255,255,255,.18)!important;
  border-radius:24px!important;
  background:linear-gradient(135deg,#0f172a 0%,#172554 42%,#1d4ed8 100%)!important;
  box-shadow:0 18px 44px rgba(15,23,42,.22),inset 0 1px 0 rgba(255,255,255,.12)!important;
}
.app-title-primary::after{
  content:"";position:absolute;inset:auto -8% -52% 30%;height:170px;border-radius:999px;
  background:radial-gradient(circle,rgba(96,165,250,.28),rgba(96,165,250,0) 68%);pointer-events:none
}
.app-title-primary>*{position:relative;z-index:1}
.app-title-primary h1{letter-spacing:-.035em!important;font-weight:900!important}
.app-title-summary{max-width:68ch;color:#dbeafe!important}
.app-title-help{
  border:1px solid rgba(255,255,255,.16)!important;background:rgba(255,255,255,.09)!important;
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-radius:12px!important
}

/* One consistent surface language across major cards. */
.card,.home-launcher,.feature-category-nav,.tablet-manager-hub,.release-board{
  border-radius:var(--v308-radius)!important;
}
.card,.home-launcher,.feature-category-nav,.tablet-manager-hub{
  background:var(--v308-surface)!important;border:1px solid var(--v308-border)!important;
  box-shadow:var(--v308-shadow)!important;
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)
}
.card>h2:first-child,.card>h3:first-child,.card>h4:first-child,
.feature-category-head h2,.home-launcher h2{
  letter-spacing:-.025em!important;font-weight:900!important;color:var(--v308-ink)!important
}
.card>.muted:first-of-type,.feature-category-head .muted,.home-launcher .muted{
  color:var(--v308-muted)!important
}

/* Controls: consistent geometry and focus, less generic-web feel. */
input,select,textarea{
  border-radius:13px!important;border-color:#cbd5e1!important;background:#fbfdff!important;
  color:var(--v308-ink)!important;box-shadow:inset 0 1px 2px rgba(15,23,42,.025)!important;
  transition:border-color .16s ease,box-shadow .16s ease,background .16s ease
}
input:focus,select:focus,textarea:focus{
  border-color:#60a5fa!important;background:#fff!important;
  box-shadow:0 0 0 4px rgba(37,99,235,.11)!important;outline:none!important
}
button,.feature-shortcut,.home-launch-btn,.box-menu-btn,.top-info-tab,.purchase-channel{
  transition:transform .14s ease,box-shadow .14s ease,border-color .14s ease,background .14s ease,filter .14s ease
}
button{border-radius:14px!important;letter-spacing:-.01em}
#v13search,#recalcCalibration,#siteUpdateAll{
  background:linear-gradient(135deg,#3b82f6 0%,#2563eb 50%,#1d4ed8 100%)!important;
  box-shadow:0 8px 18px rgba(37,99,235,.20)!important
}

/* Feature navigator: cleaner cards, stronger selected state, quieter secondary copy. */
.feature-category-nav{padding:15px!important}
.feature-category-grid{gap:9px!important}
.feature-category{
  overflow:hidden;border-radius:17px!important;border:1px solid var(--v308-border)!important;
  background:linear-gradient(180deg,#fff 0%,#f8fbff 100%)!important;
  box-shadow:0 3px 10px rgba(15,23,42,.035)!important
}
.feature-category summary{background:transparent!important}
.feature-category-icon{
  background:linear-gradient(145deg,#eff6ff,#dbeafe)!important;
  box-shadow:inset 0 0 0 1px rgba(37,99,235,.08),0 5px 12px rgba(37,99,235,.08)!important
}
.feature-category-title{color:#172033!important;font-weight:900!important;letter-spacing:-.015em}
.feature-category-sub{color:#718096!important}
.feature-category[open]{border-color:#93c5fd!important;box-shadow:0 8px 22px rgba(37,99,235,.10)!important}
.feature-category[open] summary{background:linear-gradient(180deg,#f8fbff,#eff6ff)!important}
.feature-shortcut{
  border:1px solid #dbe4ee!important;border-radius:14px!important;background:#fff!important;
  box-shadow:0 2px 8px rgba(15,23,42,.035)!important
}
.feature-shortcut b{color:#172033!important;letter-spacing:-.015em}
.feature-shortcut small{color:#718096!important}
.feature-quick-search{
  border-radius:16px!important;border-color:#dbe4ee!important;
  background:linear-gradient(180deg,#fff,#f8fbff)!important;box-shadow:0 3px 12px rgba(15,23,42,.035)!important
}

/* Data/stat surfaces: reduce visual noise while keeping important numbers prominent. */
.metric,.status,.workflow-part,.grade-cockpit-cell,.grade-cockpit-block,
.grade-cockpit-probability,.grade-cockpit-company{
  border-radius:14px!important;border-color:#dbe4ee!important
}
.metric,.status,.workflow-part{background:linear-gradient(180deg,#fff,#fafcff)!important}
.metric b,.validation-stats .metric b{font-variant-numeric:tabular-nums;color:#0f172a!important;letter-spacing:-.025em}
.grade-result-cockpit{
  border-radius:20px!important;border-color:#bfdbfe!important;
  background:linear-gradient(145deg,#eff6ff 0%,#fff 48%,#f8fbff 100%)!important;
  box-shadow:0 10px 28px rgba(37,99,235,.08)!important
}
.grade-result-cockpit[data-state="ready"]{
  background:linear-gradient(145deg,#ecfdf5 0%,#fff 48%,#f8fbff 100%)!important;
  border-color:#a7f3d0!important
}

/* Catalogue and release surfaces feel like one product family. */
.analysis-box,.release-item,.purchase-region,.purchase-source{
  border:1px solid var(--v308-border)!important;border-radius:16px!important;
  box-shadow:0 4px 14px rgba(15,23,42,.045)!important
}
.analysis-box{background:linear-gradient(180deg,#fff,#fbfdff)!important}
.analysis-head{border-bottom:1px solid rgba(226,232,240,.72)}
.analysis-title{font-weight:900!important;letter-spacing:-.02em!important;color:#172033!important}
.analysis-price,.analysis-box .price,.price-current{font-weight:850!important;color:#0f172a!important}
.release-board{
  background:linear-gradient(140deg,#0f172a 0%,#172554 50%,#1d4ed8 115%)!important;
  border:1px solid rgba(255,255,255,.10)!important;box-shadow:0 15px 38px rgba(30,58,138,.18)!important
}
.release-item{background:rgba(255,255,255,.97)!important}
.top-info-tab{border-radius:13px!important}
.top-info-tab.active{box-shadow:0 6px 16px rgba(15,23,42,.08)!important}

/* Bottom dock becomes a compact translucent app bar. */
body .app-bottom-dock{
  background:rgba(255,255,255,.88)!important;border:1px solid rgba(148,163,184,.30)!important;
  backdrop-filter:blur(18px) saturate(1.15);-webkit-backdrop-filter:blur(18px) saturate(1.15);
  box-shadow:0 14px 34px rgba(15,23,42,.16),inset 0 1px 0 rgba(255,255,255,.78)!important
}
body .app-bottom-dock a{color:#64748b!important}
body .app-bottom-dock a.active,body .app-bottom-dock a[aria-current="page"]{
  color:#1d4ed8!important;background:#eff6ff!important;box-shadow:inset 0 0 0 1px #dbeafe
}

@media(hover:hover) and (pointer:fine){
  .feature-category:hover,.feature-shortcut:hover,.analysis-box:hover,.release-item:hover,.purchase-source:hover{
    transform:translateY(-2px)!important;box-shadow:var(--v308-shadow-hover)!important;border-color:#bfdbfe!important
  }
  button:hover{filter:brightness(1.025)}
  #v13clear:hover,#resetCalibration:hover{background:#f8fafc!important}
}
button:active,.feature-shortcut:active,.home-launch-btn:active,.box-menu-btn:active{transform:scale(.985)!important}

/* Lenovo portrait/tablet: more breathing room without wasting vertical space. */
@media(min-width:540px) and (max-width:900px){
  .app{max-width:820px!important;padding-left:16px!important;padding-right:16px!important}
  .app-title-primary{padding:20px 21px!important;margin-top:4px!important}
  .card{padding:16px!important;margin:12px 0!important}
  .feature-category-nav{padding:16px!important}
  body .analysis-list{gap:13px!important}
  body .app-bottom-dock{width:min(calc(100% - 34px),590px)!important}
}

@media(max-width:539px){
  .app-title-primary{border-radius:20px!important}
  .card,.home-launcher,.feature-category-nav,.tablet-manager-hub,.release-board{border-radius:17px!important}
  .feature-category{border-radius:15px!important}
  body .app-bottom-dock{backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
}

@media(prefers-color-scheme:dark){
  body{background:#0b1220!important}
  .card,.home-launcher,.feature-category-nav,.tablet-manager-hub{
    background:rgba(15,23,42,.94)!important;border-color:#334155!important
  }
  .card>h2:first-child,.card>h3:first-child,.card>h4:first-child,.feature-category-head h2,.home-launcher h2{color:#f8fafc!important}
  .card>.muted:first-of-type,.feature-category-head .muted,.home-launcher .muted{color:#94a3b8!important}
  .feature-category{background:linear-gradient(180deg,#111827,#0f172a)!important;border-color:#334155!important}
  .feature-category[open] summary{background:#172033!important}
  .feature-category-title,.feature-shortcut b,.analysis-title{color:#f8fafc!important}
  .feature-category-sub,.feature-shortcut small{color:#94a3b8!important}
  .feature-shortcut,.metric,.status,.workflow-part{background:#111827!important;border-color:#334155!important}
  input,select,textarea{background:#0f172a!important;color:#f8fafc!important;border-color:#475569!important}
  body .app-bottom-dock{background:rgba(15,23,42,.88)!important;border-color:#334155!important;box-shadow:0 14px 34px rgba(0,0,0,.34)!important}
  body .app-bottom-dock a{color:#94a3b8!important}
  body .app-bottom-dock a.active,body .app-bottom-dock a[aria-current="page"]{color:#bfdbfe!important;background:#1e3a5f!important;box-shadow:inset 0 0 0 1px #315b86}
}

@media(prefers-reduced-motion:reduce){
  .feature-category,.feature-shortcut,.analysis-box,.release-item,.purchase-source,button{transform:none!important}
}
'''
          p.write_text(text.rstrip()+block+'\n',encoding='utf-8')
          print('appended v308')
          PY
      - name: Run targeted UI tests
        shell: bash
        run: |
          python test_ui_app_shell_v272.py
          python test_tablet_runtime_manifest_ui_assets_v254.py
      - name: Commit generated CSS
        shell: bash
        run: |
          if git diff --quiet -- ui_app_shell_v272.css; then
            echo 'No CSS changes to commit'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ui_app_shell_v272.css
          git commit -m 'ui: apply v308 sleek tablet visual system'
          git push origin HEAD:ui-v308-sleek-polish
