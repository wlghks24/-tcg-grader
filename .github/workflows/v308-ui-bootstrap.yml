          import base64
          import os
          from pathlib import Path
          p = Path("ui_app_shell_v272.css")
          text = p.read_text(encoding="utf-8")
          marker = "/* v308 sleek tablet visual system."
          if marker in text:
              print("v308 already present")
              raise SystemExit(0)
          block = base64.b64decode(os.environ["V308_CSS_B64"]).decode("utf-8")
          p.write_text(text.rstrip() + "\n\n" + block + "\n", encoding="utf-8")
          PY

