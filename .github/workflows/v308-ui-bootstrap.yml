name: V308 UI Repair

on:
  push:
    branches:
      - ui-v308-sleek-polish

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui-v308-sleek-polish
          fetch-depth: 0

      - name: Repair and validate v308 CSS
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('ui_app_shell_v272.css')
          text=p.read_text(encoding='utf-8')
          fixes={
            '.feature-category-head h2,.home-launcher h2y\n':'.feature-category-head h2,.home-launcher h2{\n',
            'background:linear-gradient(180deg,#fff,#fafcff)important}':'background:linear-gradient(180deg,#fff,#fafcff)!important}',
            'box-shadow:0 15px 38px rgba(30,58,138,.18)important':'box-shadow:0 15px 38px rgba(30,58,138,.18)!important',
          }
          for bad,good in fixes.items():
              if bad in text:
                  text=text.replace(bad,good)
          required=[
            '/* v308 sleek tablet visual system.',
            '.feature-category-head h2,.home-launcher h2{',
            'background:linear-gradient(180deg,#fff,#fafcff)!important}',
            'box-shadow:0 15px 38px rgba(30,58,138,.18)!important',
            '@media(prefers-reduced-motion:reduce)',
          ]
          forbidden=['.home-launcher h2y',' #fafcff)important','rgba(30,58,138,.18)important']
          assert all(x in text for x in required), 'required v308 token missing'
          assert all(x not in text for x in forbidden), 'corrupt v308 token remains'
          assert text.count('{')==text.count('}'), f'unbalanced braces: {text.count("{")} vs {text.count("}")}'
          p.write_text(text,encoding='utf-8')
          print('v308 CSS repair + structural validation OK')
          PY

      - name: Run targeted UI regression
        shell: bash
        run: |
          python test_ui_app_shell_v272.py
          python test_tablet_runtime_manifest_ui_assets_v254.py

      - name: Commit repaired CSS
        shell: bash
        run: |
          if git diff --quiet -- ui_app_shell_v272.css; then
            echo 'No CSS repair needed'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ui_app_shell_v272.css
          git commit -m 'fix: validate v308 tablet visual CSS'
          git push origin HEAD:ui-v308-sleek-polish
