name: V311 Whitespace Fix

on:
  push:
    branches: [ui-v311-clean-polish]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ui-v311-clean-polish
          fetch-depth: 0
      - name: Normalize CSS EOF and verify diff
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('ui_app_shell_v272.css')
          text=p.read_text(encoding='utf-8')
          p.write_text(text.rstrip()+'\n',encoding='utf-8')
          PY
          git diff --check origin/main...HEAD || true
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add ui_app_shell_v272.css
          if git diff --cached --quiet; then
            echo 'EOF already normalized'
          else
            git commit -m 'fix: normalize v311 CSS EOF'
            git push origin HEAD:ui-v311-clean-polish
          fi
