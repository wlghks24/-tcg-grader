name: Rename v342 scheduler helper

on:
  push:
    branches: [fix/runtime-hardening-v341]
    paths:
      - '.github/workflows/rename-v342-helper.yml'

permissions:
  contents: write

jobs:
  rename:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Rename helper without changing behavior
        shell: bash
        run: |
          set -euo pipefail
          sed -i 's/stop_verified_boot_loop/stop_verified_loop_process/g' TABLET_SCHEDULED_UPDATE.sh test_tablet_scheduled_update_v256.py test_runtime_hardening_v341.py
          bash -n TABLET_SCHEDULED_UPDATE.sh
          python -m py_compile test_tablet_scheduled_update_v256.py test_runtime_hardening_v341.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add TABLET_SCHEDULED_UPDATE.sh test_tablet_scheduled_update_v256.py test_runtime_hardening_v341.py
          git commit -m 'Avoid scheduler helper name collision v342'
          git push origin HEAD:fix/runtime-hardening-v341
