name: Card v320 Regression Reconcile

on:
  push:
    branches: [fix/card-identity-precision-v320]

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout audit branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/card-identity-precision-v320
          fetch-depth: 0

      - name: Reconcile and verify v320 runtime contracts
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python -m pip install --disable-pip-version-check pillow
          git rm .github/workflows/card-v320-regression-reconcile.yml
          python fault_injection_healing.py --manifest
          python -m py_compile \
            card_identity_recognition.py \
            verify_current_runtime.py \
            test_card_identity_ambiguity_v320.py \
            test_card_edition_precision_v302.py \
            test_card_region_generation_precision_v306.py \
            test_card_core_crosscheck_v292.py \
            test_pokemon_generation_display_v207.py
          node --check card_identity_recognition.js
          node --check grade_market_flow.js
          node verify_pokemon_generation_runtime.js
          python -m unittest -v \
            test_card_core_crosscheck_v292.py \
            test_pokemon_generation_display_v207.py \
            test_card_identity_ambiguity_v320.py \
            test_card_edition_precision_v302.py \
            test_card_region_generation_precision_v306.py \
            test_card_identity_market_precision_v309.py \
            test_card_region_conflict_failclosed_v318.py \
            test_card_tablet_runtime_v300.py
          python tablet_runtime_qa.py --profile runtime
          python test_runtime_resilience_v182.py
          python tablet_runtime_manifest.py --check --compile
          python collection_runtime_health.py
          python -m unittest -v test_tablet_standalone_hardening_v209.py
          python -m unittest -v test_verified_collection_neural_v211.py
          python -m unittest -v test_verified_collection_job_neural_v212.py
          python -m unittest -v test_collection_job_contract_v255.py
          python -m unittest -v \
            test_card_core_provenance_v296.py \
            test_card_market_edition_v297.py \
            test_card_probability_ui_v298.py \
            test_card_regression_gate_v299.py
          python -m unittest -v \
            test_card_tablet_runtime_v300.py \
            test_multi_market_price_collector.py \
            test_tablet_runtime_manifest_ui_assets_v254.py
          python -m unittest -v \
            test_card_core_crosscheck_v291.py \
            test_card_core_crosscheck_v292.py \
            test_card_core_crosscheck_v295.py \
            test_pokemon_generation_display_v207.py
          python security_self_audit.py --no-memory --fail-on high
          python repository_integrity_guard.py
          git diff --check
          git add -A
          git commit -m 'test: reconcile v320 runtime regression contracts'
          git push origin HEAD:fix/card-identity-precision-v320
