name: V676 Unified UI and Learning Review

on:
  pull_request:
    paths:
      - 'docs/tablet/v676/tablet_unified_dashboard_v676.html'
      - 'docs/tablet/v676/tablet_unified_dashboard_v676.css'
      - 'docs/tablet/v676/tablet_unified_dashboard_v676.js'
      - 'execution/tablet_learning_gap_advisor_v676.py'
      - 'execution/tests/test_tablet_learning_gap_advisor_v676.py'
      - 'execution/tests/test_tablet_unified_dashboard_v676.cjs'
      - '.github/workflows/tablet-v676-ui-learning-review.yml'
      - 'integrity_manifest.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  v676-readonly-review:
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    env:
      PYTHONPATH: '.'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Compile Python sources and validate JS syntax
        run: |
          python -m py_compile execution/tablet_learning_gap_advisor_v676.py execution/tests/test_tablet_learning_gap_advisor_v676.py
          node --check docs/tablet/v676/tablet_unified_dashboard_v676.js
          node --check execution/tests/test_tablet_unified_dashboard_v676.cjs
      - name: Check supplementary CSS and CJS file SHA256 (not in legacy manifest scope)
        run: |
          printf '%s  %s\n' \
            cb5a0732f90615ae19303e7936ee7673e0af05d1aa7d1b04395f9820990ad620 docs/tablet/v676/tablet_unified_dashboard_v676.css \
            29f6fc93ec1b2b6dca8fbfb3e66014c9e7bde031554eb64b385252107de1cab5 execution/tests/test_tablet_unified_dashboard_v676.cjs \
            | sha256sum --check --status
      - name: Test no-label-fabrication and exact image linkage
        run: |
          python -m unittest -v execution.tests.test_tablet_learning_gap_advisor_v676
          node --test execution/tests/test_tablet_unified_dashboard_v676.cjs
