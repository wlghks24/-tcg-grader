name: Apply v265 Dashboard ETag

on:
  workflow_dispatch:
  push:
    branches: [perf/device-benchmark-main-guard-v265]
    paths:
      - '.github/workflows/apply-v265-dashboard-etag.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: perf/device-benchmark-main-guard-v265
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'
      - name: Apply narrow dashboard ETag patch
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('tcg_updater_v135.py')
          text = path.read_text(encoding='utf-8')

          def replace_once(old, new, label):
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected one anchor, found {count}')
              text = text.replace(old, new, 1)

          replace_once(
              'from __future__ import annotations\n\nimport os\n',
              'from __future__ import annotations\n\nimport hashlib\nimport os\n',
              'hashlib import',
          )
          replace_once(
              'DASHBOARD_BUNDLE_CACHE = {"signature": None, "body": None}\n',
              'DASHBOARD_BUNDLE_CACHE = {"signature": None, "body": None, "etag": None}\n',
              'dashboard cache',
          )
          old_body = (
              "        body = text.encode('utf-8')\n"
              "        with DASHBOARD_BUNDLE_LOCK:\n"
              "            DASHBOARD_BUNDLE_CACHE[\"signature\"] = signature\n"
              "            DASHBOARD_BUNDLE_CACHE[\"body\"] = body\n"
              "        return body\n"
          )
          new_body = (
              "        body = text.encode('utf-8')\n"
              "        etag = '\"' + hashlib.sha256(body).hexdigest() + '\"'\n"
              "        with DASHBOARD_BUNDLE_LOCK:\n"
              "            DASHBOARD_BUNDLE_CACHE[\"signature\"] = signature\n"
              "            DASHBOARD_BUNDLE_CACHE[\"body\"] = body\n"
              "            DASHBOARD_BUNDLE_CACHE[\"etag\"] = etag\n"
              "        return body\n"
          )
          replace_once(old_body, new_body, 'bundle etag cache')

          old_response = (
              "        self.send_response(200)\n"
              "        self.send_header('Content-Type', 'application/javascript; charset=utf-8')\n"
              "        self.send_header('Cache-Control', 'no-store, no-cache, must-revalidate, max-age=0')\n"
              "        self.send_header('Pragma', 'no-cache')\n"
              "        self.send_header('Expires', '0')\n"
              "        self.send_header('X-Content-Type-Options', 'nosniff')\n"
              "        self.send_header('X-TCG-Dual-Photo-UI', 'v158-eight-zone-inline')\n"
              "        self.send_header('Content-Length', str(len(body)))\n"
              "        self.end_headers()\n"
              "        self.wfile.write(body)\n"
          )
          new_response = (
              "        with DASHBOARD_BUNDLE_LOCK:\n"
              "            etag = DASHBOARD_BUNDLE_CACHE.get('etag')\n"
              "        if not isinstance(etag, str):\n"
              "            etag = '\"' + hashlib.sha256(body).hexdigest() + '\"'\n"
              "        cache_control = 'private, no-cache, must-revalidate, max-age=0'\n"
              "        if self.headers.get('If-None-Match', '').strip() == etag:\n"
              "            self.send_response(304)\n"
              "            self.send_header('ETag', etag)\n"
              "            self.send_header('Cache-Control', cache_control)\n"
              "            self.send_header('X-Content-Type-Options', 'nosniff')\n"
              "            self.send_header('X-TCG-Dual-Photo-UI', 'v158-eight-zone-inline')\n"
              "            self.end_headers()\n"
              "            return\n"
              "        self.send_response(200)\n"
              "        self.send_header('Content-Type', 'application/javascript; charset=utf-8')\n"
              "        self.send_header('Cache-Control', cache_control)\n"
              "        self.send_header('ETag', etag)\n"
              "        self.send_header('Pragma', 'no-cache')\n"
              "        self.send_header('Expires', '0')\n"
              "        self.send_header('X-Content-Type-Options', 'nosniff')\n"
              "        self.send_header('X-TCG-Dual-Photo-UI', 'v158-eight-zone-inline')\n"
              "        self.send_header('Content-Length', str(len(body)))\n"
              "        self.end_headers()\n"
              "        self.wfile.write(body)\n"
          )
          replace_once(old_response, new_response, 'dashboard response')
          path.write_text(text, encoding='utf-8')
          PY
      - name: Verify targeted and full runtime guards
        run: |
          python -m py_compile runtime_sre_metrics.py runtime_device_benchmark.py performance_baseline_guard.py tcg_updater_v135.py test_runtime_device_benchmark_v265.py test_dashboard_etag_v265.py
          python -m unittest -v test_runtime_device_benchmark_v265.py test_dashboard_etag_v265.py test_sre_runtime_performance_v240.py test_graded_photo_runtime.py test_pc_runtime_entrypoint_v264.py
          python test_runtime_delivery_guards.py
          python tablet_runtime_manifest.py --check --compile
          git diff --check
      - name: Commit verified patch and remove one-shot workflow
        run: |
          rm .github/workflows/apply-v265-dashboard-etag.yml
          git config user.name 'wlghks24'
          git config user.email '7cnpk87b76@privaterelay.appleid.com'
          git add tcg_updater_v135.py .github/workflows/apply-v265-dashboard-etag.yml
          git commit -m 'perf: add conditional delivery for v135 dashboard bundle'
          git push origin HEAD:perf/device-benchmark-main-guard-v265
