name: Finalize Card Market Generation v324

on:
  push:
    branches:
      - card-market-generation-precision-v324

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: card-market-generation-precision-v324
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install runtime test dependency
        run: python -m pip install --disable-pip-version-check pillow
      - name: Remove one-shot workflow and refresh integrity manifest
        run: |
          rm .github/workflows/v324-finalize.yml
          git add -A
          python fault_injection_healing.py --manifest
      - name: Verify integrity and card runtime
        run: |
          python repository_integrity_guard.py
          python -m unittest -v test_card_tablet_runtime_v300.py test_card_identity_market_precision_v309.py test_card_identity_ambiguity_v320.py test_card_precision_v321.py test_card_promo_precision_v322.py test_card_variant_market_precision_v323.py test_card_market_generation_precision_v324.py test_multi_market_price_collector.py
          node --check card_identity_recognition.js
          node verify_pokemon_generation_runtime.js
      - name: Commit finalized v324
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No changes to commit'
            exit 0
          fi
          git commit -m 'test: finalize v324 runtime and integrity contracts'
          git push origin HEAD:card-market-generation-precision-v324
