name: Verify eight-zone runtime compatibility v158

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-eight-zone-runtime-compat-v158.yml'
      - 'graded_photo_dashboard.js'
      - 'manual_dual_photo_bridge.js'
      - 'manual_graded_photo_registration.py'
      - 'tcg_updater_v135.py'
      - 'REPAIR_V135_SERVER.sh'
      - 'test_graded_photo_runtime.py'
      - 'test_verified_slab_raw_learning_v155.py'
  pull_request:
    paths:
      - '.github/workflows/apply-eight-zone-runtime-compat-v158.yml'
      - 'graded_photo_dashboard.js'
      - 'manual_dual_photo_bridge.js'
      - 'manual_graded_photo_registration.py'
      - 'tcg_updater_v135.py'
      - 'REPAIR_V135_SERVER.sh'
      - 'test_graded_photo_runtime.py'
      - 'test_verified_slab_raw_learning_v155.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check --requirement requirements.txt
      - name: Verify runtime contract
        run: |
          python -m py_compile tcg_updater_v135.py manual_graded_photo_registration.py verified_slab_raw_learning_v155.py
          python -m unittest -v test_graded_photo_runtime.py test_verified_slab_raw_learning_v155.py
          grep -q '기존 등록사진 전체 재검증' graded_photo_dashboard.js
          grep -q '/api/run-existing-photo-revalidation' graded_photo_dashboard.js
          grep -q '등급사진 8구역 정밀등록' manual_dual_photo_bridge.js
          grep -q '앞면 + 뒷면 8구역 등록하기' REPAIR_V135_SERVER.sh
