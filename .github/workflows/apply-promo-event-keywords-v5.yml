name: Apply Promo Event Keyword Gap V5

on:
  push:
    branches: [selfrefine/source-gap-learning-v5]
    paths:
      - '.github/workflows/apply-promo-event-keywords-v5.yml'

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: selfrefine/source-gap-learning-v5
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Extend official event headline vocabulary
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('update_promo_events.py')
          text = path.read_text(encoding='utf-8')
          old = '''EVENT_WORDS = re.compile(\n    r"이벤트|행사|배틀|교류회|챔피언|토너먼트|프로모|팝업|팝업스토어|점프샵|JUMP SHOP|"\n    r"イベント|バトル|キャンペーン|チャンピオン|"\n    r"event|battle|championship|tournament|promo|league|cup|tutorial|fest|comic con|game night|night|giveaway|teaching session|collab|collaboration|convention|expo",\n    re.I,\n)'''
          new = '''EVENT_WORDS = re.compile(\n    r"이벤트|행사|배틀|교류회|챔피언|토너먼트|프로모|팝업|팝업스토어|점프샵|JUMP SHOP|챌린지|도전|개최|특전|배포|"\n    r"イベント|バトル|キャンペーン|チャンピオン|チャレンジ|開催|特典|配布|"\n    r"event|battle|championship|tournament|promo|league|cup|tutorial|fest|comic con|game night|night|giveaway|teaching session|collab|collaboration|convention|expo|challenge|special mission|distribution",\n    re.I,\n)'''
          if old not in text:
              raise SystemExit('EVENT_WORDS block changed; refusing blind patch')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Compile and run focused regressions
        run: |
          python -m py_compile update_promo_events.py test_promo_event_keyword_coverage_v5.py
          python -m unittest -v test_promo_event_keyword_coverage_v5.py
      - name: Commit source fix
        run: |
          if git diff --quiet -- update_promo_events.py; then
            echo 'No source change required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add update_promo_events.py
          git commit -m 'selfrefine: cover challenge-style official event headlines'
          git push origin HEAD:selfrefine/source-gap-learning-v5
