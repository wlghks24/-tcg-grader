name: TCG System Evidence Audit V573
on:
  pull_request:
    branches: [main]
    paths:
      - 'execution/**'
      - 'index.html'
      - 'box_knowledge_stats.js'
      - 'market_catalog_expander.js'
      - 'market_prices.json'
      - 'tcg_game_registry.json'
      - 'tcg_official_product_catalog_v599.json'
      - '.github/workflows/tcg-system-evidence-audit-v573.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tcg-system-evidence-audit-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  evidence:
    name: Read-only TCG data, BOX links, and UI integrity
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Python audit source syntax
        run: |
          python -m py_compile execution/tcg_system_audit_v573.py execution/test_tcg_system_audit_v573.py execution/tcg_quality_report_v575.py execution/test_tcg_quality_report_v575.py
      - name: Offline and checkout fixture regressions
        run: |
          python execution/test_tcg_system_audit_v573.py -v
          python execution/test_tcg_quality_report_v575.py -v
      - name: Generate read-only coverage report (missing prices are visible HOLD)
        run: |
          python execution/tcg_system_audit_v573.py --strict --markdown-out /tmp/tcg-audit-v573.md --json-out /tmp/tcg-audit-v573.json
          cat /tmp/tcg-audit-v573.md >> "$GITHUB_STEP_SUMMARY"
          python execution/tcg_quality_report_v575.py --html-out /tmp/tcg-quality-v575.html --json-out /tmp/tcg-quality-v575.json
      - name: Retain report only as immutable build artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: tcg-v573-readonly-evidence
          path: |
            /tmp/tcg-audit-v573.md
            /tmp/tcg-audit-v573.json
            /tmp/tcg-quality-v575.html
            /tmp/tcg-quality-v575.json
          retention-days: 7
          if-no-files-found: error
