              '            echo "- public signal persistence: purchase_signals + social_stock_signals included"\n            echo "- grader policy: official-only numeric updates; six-hour fee/service/turnaround/notice monitoring"\n')

          # Pages and local server both prefer the new verified static snapshot; the legacy API is
          # retained as a compatibility fallback.
          p=Path('grading_costs_live.js'); text=p.read_text(encoding='utf-8')
          text=text.replace("const krw=n=>`₩${Math.round(Number(n)).toLocaleString('ko-KR')}`;", "const krw=n=>`₩${Math.round(Number(n)).toLocaleString('ko-KR')}`;\nconst jpy=n=>`¥${Math.round(Number(n)).toLocaleString('ja-JP')}`;")
          text=text.replace("const money=(n,c)=>c==='KRW'?krw(n):usd(n);", "const money=(n,c)=>c==='KRW'?krw(n):c==='JPY'?jpy(n):usd(n);")
          old="const r=await fetch('/api/grading-costs?t='+Date.now(),{cache:'no-store'});const j=await r.json();if(!r.ok||!j.ok)throw 0;\n  box.innerHTML=Object.entries(j.companies||{}).map(([name,c])=>{"
          new="let r=await fetch('grading_services.json?t='+Date.now(),{cache:'no-store'});let j=await r.json();\n  if(r.ok&&j&&j.profiles){j={ok:true,checked_at:j.checked_at,notice:'공식 출처 6시간 변경감시 · 미검증 SNS 자료는 재확인 신호로만 사용',companies:Object.fromEntries(Object.entries(j.profiles).map(([k,v])=>[k,{...v,source:v.service_source}]))};}\n  else{r=await fetch('/api/grading-costs?t='+Date.now(),{cache:'no-store'});j=await r.json();if(!r.ok||!j.ok)throw 0;}\n  box.innerHTML=Object.entries(j.companies||{}).map(([name,c])=>{"
          if old not in text: raise SystemExit('missing grading_costs_live.js load anchor')
          p.write_text(text.replace(old,new,1),encoding='utf-8')
          PY

      - name: Run targeted regressions and initial official refresh
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile grading_service_monitor.py auto_update_all.py tcg_updater.py
          python -m unittest -v \
            test_grading_service_monitor_v215.py \
            test_grading_costs_live.py \
            test_0600_operational_refresh_v25.py \
            test_graded_photo_runtime.py
          python grading_service_monitor.py
          python - <<'PY'
          import json
          for name in ('grading_services.json','grading_service_changes.json'):
              data=json.load(open(name,encoding='utf-8'))
              assert data.get('engine')=='grading-service-monitor-v215'
          data=json.load(open('grading_services.json',encoding='utf-8'))
          assert data['official_only_numeric_updates'] is True
          assert len(data['profiles'])==6
          print(data['summary'])
          PY

      - name: Commit verified integration and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/apply-grading-service-monitor-v215.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- \
            grading_service_monitor.py test_grading_service_monitor_v215.py \
            grading_services.json grading_service_changes.json \
            test_0600_operational_refresh_v25.py test_graded_photo_runtime.py \
            auto_update_all.py tcg_updater.py grading_costs_live.js \
            .github/workflows/tcg-static-data-refresh.yml
          git commit -m 'feat: monitor grading service changes from official sources'
          git push origin HEAD:main
