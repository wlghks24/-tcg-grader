name: Apply grading service monitor v215

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-grading-service-monitor-v215.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 2

      - name: Write monitor and tests
        shell: bash
        run: |
          set -euo pipefail
          cat > grading_service_monitor.py <<'PY'
          #!/usr/bin/env python3
          """Official-source grading service/fee/turnaround/notice monitor.

          Official pages are authoritative. Search/social/user supplied evidence may trigger a
          recheck but can never overwrite a verified numeric field. One provider failure keeps
          its last-known-good snapshot. Verified history is append-only through change records.
          """
          from __future__ import annotations

          import copy
          import datetime as dt
          import hashlib
          import html as html_lib
          import json
          import re
          import urllib.request
          from pathlib import Path
          from typing import Any

          from safe_runtime import atomic_write_json, safe_read_text, safe_urlopen

          ROOT = Path(__file__).resolve().parent
