name: One-shot AI score freshness v270

on:
  push:
    branches: [fix/ai-score-freshness-v270]
    paths:
      - 'apply_ai_score_freshness_v270.py'
      - '.github/workflows/one-shot-ai-score-freshness-v270.yml'

permissions:
  contents: write

concurrency:
  group: one-shot-ai-score-freshness-v270
  cancel-in-progress: false

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/ai-score-freshness-v270
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Apply exact bounded patch
        run: python apply_ai_score_freshness_v270.py
      - name: Preserve LKG recovery but enforce strict score-time eligibility
        run: |
          python - <<'PY'
          from pathlib import Path

          def once(text, old, new, label):
              if text.count(old) != 1:
                  raise SystemExit(f'{label}: expected one match, got {text.count(old)}')
              return text.replace(old, new, 1)

          q = Path('verified_collection_neural.py')
          text = q.read_text(encoding='utf-8')
          text = once(text,
              '    if raw.get("schema") != SCHEMA or raw.get("feature_fingerprint") != FEATURE_FINGERPRINT:\n        return False\n    protocol = raw.get("protocol_version")\n    if not isinstance(protocol, int) or isinstance(protocol, bool) or protocol != PROTOCOL_VERSION:\n        return False\n    if require_active and raw.get("active") is not True:',
              '    if raw.get("schema") != SCHEMA or raw.get("feature_fingerprint") != FEATURE_FINGERPRINT:\n        return False\n    if require_active and raw.get("active") is not True:',
              'query backward-compatible structural loader')
          text = once(text,
              'def _runtime_model_reason(model: dict[str, Any], *, now: datetime | None = None) -> str | None:\n    text = str(model.get("trained_at") or "").strip()',
              'def _runtime_model_reason(model: dict[str, Any], *, now: datetime | None = None) -> str | None:\n    if int(model.get("protocol_version") or 0) != PROTOCOL_VERSION:\n        return "protocol_version_mismatch"\n    if int(model.get("label_count") or 0) < MIN_INDEPENDENT_LABELS:\n        return "label_count_below_activation_gate"\n    text = str(model.get("trained_at") or "").strip()',
              'query strict runtime gate')
          q.write_text(text, encoding='utf-8')

          j = Path('verified_collection_job_neural.py')
          text = j.read_text(encoding='utf-8')
          text = once(text,
              '        or _safe_int(raw.get("feature_count"), 0) != FEATURE_COUNT\n        or _safe_int(raw.get("protocol_version"), 0) != PROTOCOL_VERSION\n        or _safe_int(raw.get("label_count"), 0) < MIN_INDEPENDENT_LABELS\n        or hidden not in HIDDEN_SIZES',
              '        or _safe_int(raw.get("feature_count"), 0) != FEATURE_COUNT\n        or hidden not in HIDDEN_SIZES',
              'job backward-compatible structural loader')
          text = once(text,
              'def _runtime_model_reason(model: dict[str, Any], *, now: datetime | None = None) -> str | None:\n    text = str(model.get("trained_at") or "").strip()',
              'def _runtime_model_reason(model: dict[str, Any], *, now: datetime | None = None) -> str | None:\n    if _safe_int(model.get("protocol_version"), 0) != PROTOCOL_VERSION:\n        return "protocol_version_mismatch"\n    if _safe_int(model.get("label_count"), 0) < MIN_INDEPENDENT_LABELS:\n        return "label_count_below_activation_gate"\n    text = str(model.get("trained_at") or "").strip()',
              'job strict runtime gate')
          j.write_text(text, encoding='utf-8')
          PY
      - name: Normalize generated test source
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('test_ai_score_freshness_v270.py')
          text = path.read_text(encoding='utf-8')
          for count in (3, 2, 1):
              bad = '+ "' + ('\n' * count) + '", encoding='
              good = '+ "' + ('\\n' * count) + '", encoding='
              text = text.replace(bad, good)
          text = text.replace('+ "\nchanged-signature", encoding=', '+ "\\nchanged-signature", encoding=')
          text = text.replace('self.assertEqual("model_inactive", low_labels["reason"])', 'self.assertEqual("label_count_below_activation_gate", low_labels["reason"])')
          path.write_text(text, encoding='utf-8')
          PY
      - name: Compile touched runtime
        run: python -m py_compile verified_collection_neural.py verified_collection_job_neural.py verify_current_runtime.py test_ai_score_freshness_v270.py
      - name: Run neural regressions
        run: |
          python -m unittest -v test_ai_score_freshness_v270.py
          python -m unittest -v test_verified_collection_neural_v211.py
          python -m unittest -v test_verified_collection_job_neural_v212.py
          python ai_runtime_model_guard.py
          python tablet_runtime_manifest.py --check --compile
      - name: Remove one-shot patch machinery
        run: rm -f apply_ai_score_freshness_v270.py .github/workflows/one-shot-ai-score-freshness-v270.yml
      - name: Commit verified result to branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git commit -m 'fix: enforce AI score freshness and cache validated models'
            git push origin HEAD:fix/ai-score-freshness-v270
          fi
