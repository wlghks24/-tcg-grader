name: Finalize PR354 v370 integrity

on:
  push:
    branches:
      - auto/static-data-36709186962-1
    paths:
      - '.github/workflows/finalize-pr354-integrity-v370.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact candidate branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: auto/static-data-36709186962-1
          fetch-depth: 0

      - name: Remove one-shot workflow and rebuild exact manifest
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -- .github/workflows/finalize-pr354-integrity-v370.yml
          python static_integrity_manifest.py --write integrity_manifest.json
          python static_integrity_manifest.py --check integrity_manifest.json
          python -m unittest -v test_tablet_gpt_tcg_grader_sync_v369.py test_tablet_gpt_tcg_grader_sync_v370.py
          python repository_integrity_guard.py
          git add -- integrity_manifest.json test_tablet_gpt_tcg_grader_sync_v369.py
          git diff --cached --check
          git status --short
          if git diff --cached --quiet; then
            echo 'No finalization changes to commit.'
            exit 0
          fi
          git commit -m 'fix: finalize v370 successor integrity'
          git push origin HEAD:refs/heads/auto/static-data-36709186962-1
