name: Verify Adaptive Collector

on:
  push:
    branches: [main]
    paths:
      - 'adaptive_collection_learner.py'
      - 'verified_collection_neural.py'
      - 'verified_collection_job_neural.py'
      - 'multi_channel_agent.py'
      - 'official_direct_discovery.py'
      - 'official_channel_feed_discovery.py'
      - 'official_sitemap_discovery.py'
      - 'provider_health_learning.py'
      - 'auto_pipeline_runner.py'
      - 'multi_route_event_discovery.py'
      - 'event_gap_learning.py'
      - 'collection_meta_learning.py'
      - 'social_event_discovery.py'
      - 'update_promo_events.py'
      - 'promo_events.json'
      - 'social_source_registry.json'
      - 'supplementary_discovery.py'
      - 'test_adaptive_collection_learner.py'
      - 'test_verified_collection_neural_v211.py'
      - 'test_verified_collection_job_neural_v212.py'
      - 'test_official_direct_discovery.py'
      - 'test_official_channel_health.py'
      - 'test_jump_shop_event_watch.py'
      - 'test_event_gap_learning.py'
      - 'test_verified_evidence_freshness_v15.py'
      - 'test_collection_region_provenance_v16.py'
      - '.github/workflows/verify-adaptive-collector.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-adaptive-collector-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Compile adaptive collection modules
        run: |
          python -m py_compile \
            adaptive_collection_learner.py \
            verified_collection_neural.py \
            verified_collection_job_neural.py \
            multi_channel_agent.py \
            official_direct_discovery.py \
            official_channel_feed_discovery.py \
            official_sitemap_discovery.py \
            provider_health_learning.py \
            auto_pipeline_runner.py \
            multi_route_event_discovery.py \
            event_gap_learning.py \
            collection_meta_learning.py \
            social_event_discovery.py \
            update_promo_events.py \
            supplementary_discovery.py
      - name: Run adaptive learner regression tests
        run: |
          python -m unittest -v \
            test_adaptive_collection_learner.py \
            test_verified_collection_neural_v211.py \
            test_verified_collection_job_neural_v212.py \
            test_official_direct_discovery.py \
            test_official_channel_health.py \
            test_jump_shop_event_watch.py \
            test_event_gap_learning.py \
            test_verified_evidence_freshness_v15.py \
            test_collection_region_provenance_v16.py
