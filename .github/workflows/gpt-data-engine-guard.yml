name: GPT Data Engine Guard

on:
  push:
    paths:
      - 'gpt_data_engine.py'
      - 'test_gpt_data_engine.py'
      - 'GPT_DATA_ENGINE_GUIDE.md'
      - '.github/workflows/gpt-data-engine-guard.yml'
  pull_request:
    paths:
      - 'gpt_data_engine.py'
      - 'test_gpt_data_engine.py'
      - 'GPT_DATA_ENGINE_GUIDE.md'
      - '.github/workflows/gpt-data-engine-guard.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gpt-data-engine-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.11'
      - name: Syntax check
        run: python -m py_compile gpt_data_engine.py test_gpt_data_engine.py
      - name: Safety regression tests
        run: python -m unittest -v test_gpt_data_engine.py
      - name: Import smoke test
        run: python gpt_data_engine.py
