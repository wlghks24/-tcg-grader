name: Port Runtime SRE v264

on:
  push:
    branches: [selfrefine/runtime-sre-v264]
    paths:
      - '.github/workflows/port-runtime-sre-v264.yml'

permissions:
  contents: write

jobs:
  port:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUNBUFFERED: '1'
      SRE_HEAD: a50b258e3a40b080cfde2eff74f0a80716e25e04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: true
          fetch-depth: 0
          ref: selfrefine/runtime-sre-v264
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'
      - name: Port verified SRE blocks onto current runtime
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$SRE_HEAD"
          git show "$SRE_HEAD:runtime_sre_metrics.py" > runtime_sre_metrics.py
          git show "$SRE_HEAD:test_sre_runtime_performance_v240.py" > test_sre_runtime_performance_v240.py
          python - <<'PY'
          from pathlib import Path
          import os, subprocess

          head=os.environ['SRE_HEAD']
          old=subprocess.check_output(['git','show',f'{head}:tcg_updater.py'],text=True)
          p=Path('tcg_updater.py')
          text=p.read_text(encoding='utf-8')

          def block(src,start,end):
              a=src.index(start); b=src.index(end,a); return src[a:b]
          def replace_block(dst,start,end,source):
              a=dst.index(start); b=dst.index(end,a); return dst[:a]+block(source,start,end)+dst[b:]
          def replace_once(dst,old_value,new_value,label):
              count=dst.count(old_value)
              if count!=1: raise SystemExit(f'{label}: expected 1 anchor, got {count}')
              return dst.replace(old_value,new_value,1)

          if 'from runtime_sre_metrics import RUNTIME_METRICS' not in text:
              text=replace_once(text,'from grading_accuracy_v99 import valid_actual_grade\n',
                                'from grading_accuracy_v99 import valid_actual_grade\nfrom runtime_sre_metrics import RUNTIME_METRICS\n',
                                'metrics import')
          text=replace_block(text,'def _start_background_update(retry_only=False):','def _write_precollect_status',old)
          text=replace_block(text,'    def _manual_update(self):','    def _safe_static(self,path):',old)
          text=replace_block(text,'    def send_head(self):','    def do_HEAD(self):',old)
          text=replace_block(text,'class QuietThreadingHTTPServer(ThreadingHTTPServer):',"if __name__=='__main__':",old)
          if "if path=='/api/runtime-metrics':" not in text:
              metric=block(old,"        if path=='/api/runtime-metrics':","        if path=='/api/collection-health':")
              anchor="        if path=='/api/collection-health':"
              text=replace_once(text,anchor,metric+anchor,'metrics endpoint')
          p.write_text(text,encoding='utf-8')

          p=Path('tablet_runtime_manifest.py')
          text=p.read_text(encoding='utf-8')
          if '"runtime_sre_metrics.py"' not in text:
              text=replace_once(text,'"index.html","safe_runtime.py","collection_runtime_health.py"',
                                '"index.html","safe_runtime.py","runtime_sre_metrics.py","collection_runtime_health.py"',
                                'tablet SRE module')
          p.write_text(text,encoding='utf-8')

          p=Path('runtime_bundle_guard_v143.py')
          text=p.read_text(encoding='utf-8')
          if '"runtime_sre_metrics.py"' not in text:
              text=replace_once(text,'    "safe_runtime.py",\n','    "safe_runtime.py",\n    "runtime_sre_metrics.py",\n','bundle SRE module')
          p.write_text(text,encoding='utf-8')

          p=Path('test_runtime_delivery_guards.py')
          text=p.read_text(encoding='utf-8')
          old_assert="    assert 'no-store, no-cache, must-revalidate, max-age=0' in server\n"
          if old_assert in text:
              new_assert=("    assert 'private, no-cache, must-revalidate, max-age=0' in server\n"
                          "    assert \"self.headers.get('If-None-Match','').strip()==etag\" in server\n"
                          "    assert 'self.send_response(304)' in server\n"
                          "    assert \"self.send_header('ETag',etag)\" in server\n"
                          "    assert 'no-store, no-cache, must-revalidate, max-age=0' not in server\n")
              text=replace_once(text,old_assert,new_assert,'cache contract')
          p.write_text(text,encoding='utf-8')
          PY
          git add tcg_updater.py runtime_sre_metrics.py tablet_runtime_manifest.py runtime_bundle_guard_v143.py test_runtime_delivery_guards.py test_sre_runtime_performance_v240.py
          python -m py_compile tcg_updater.py runtime_sre_metrics.py tablet_runtime_manifest.py runtime_bundle_guard_v143.py test_runtime_delivery_guards.py test_sre_runtime_performance_v240.py test_pc_runtime_entrypoint_v264.py
          python -m unittest -v test_sre_runtime_performance_v240.py test_pc_runtime_entrypoint_v264.py
          python test_runtime_delivery_guards.py
          python tablet_runtime_manifest.py --check --compile
          git diff --cached --check
      - name: Commit verified port and remove one-shot workflow
        run: |
          set -euo pipefail
          git rm .github/workflows/port-runtime-sre-v264.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -am 'perf: port runtime single-flight and static revalidation v264'
          git push origin HEAD:selfrefine/runtime-sre-v264
