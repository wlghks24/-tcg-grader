name: Reintegrate grading parser v241

on:
  push:
    branches: [audit/grading-source-reintegration-v241]
    paths:
      - '.github/workflows/reintegrate-grading-v241.yml'

permissions:
  contents: write

jobs:
  apply-verified-parser-diff:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: audit/grading-source-reintegration-v241
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'
      - name: Apply only the validated grading watcher diff
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin selfrefine/psa-bgs-official-source-v238
          git diff b06aed673dbc3f191034c0766ce5f438a328f679..origin/selfrefine/psa-bgs-official-source-v238 -- \
            grading_company_watch.py test_grading_company_watch_v215.py > /tmp/grading-v241.patch
          test -s /tmp/grading-v241.patch
          git apply --check /tmp/grading-v241.patch
          git apply /tmp/grading-v241.patch
      - name: Focused cross-validation
        run: |
          python -m py_compile grading_company_watch.py test_grading_company_watch_v215.py
          python -m unittest -v test_grading_company_watch_v215.py test_grading_watch_integration_v220.py
      - name: Remove one-shot workflow and commit
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/reintegrate-grading-v241.yml
          git add grading_company_watch.py test_grading_company_watch_v215.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: reintegrate TAG PSA BGS official parser hardening'
          git push origin HEAD:audit/grading-source-reintegration-v241
