name: Apply graded photo quarantine cleanup v157

on:
  push:
    paths:
      - 'apply_graded_photo_quarantine_cleanup_v157.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          fetch-depth: 0
      - name: Apply quarantine cleanup patch
        run: python apply_graded_photo_quarantine_cleanup_v157.py
      - name: Verify cleanup policy
        run: |
          python -m unittest -v test_graded_photo_quarantine_cleanup_v157.py
          python -m unittest -v test_graded_photo_multi_source.py
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add graded_photo_multi_source.py test_graded_photo_quarantine_cleanup_v157.py
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "fix: reverify and prune unusable graded photo candidates"
            git push origin main
          fi
