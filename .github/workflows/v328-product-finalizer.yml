name: V328 Product Finalizer

on:
  push:
    branches:
      - fix/edition-fx-failclosed-v328
    paths:
      - '.github/workflows/v328-product-finalizer.yml'
      - 'verify_pokemon_generation_runtime.js'

permissions:
  contents: write

concurrency:
  group: v328-product-finalizer
  cancel-in-progress: false

jobs:
  validate-and-commit:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/edition-fx-failclosed-v328
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: requirements.txt
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '20'

      - name: Guard exact latest main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --no-tags
          test "$(git rev-parse origin/main)" = "b1ac89c1d4b59bc9e46789160118908cc3c11558" || {
            echo 'main moved; fail closed and rebuild from latest main'
            exit 1
          }

      - name: Install audited dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Apply exact product patch
        shell: bash
        run: |
          set -euo pipefail
          python .github/scripts/v328_edition_fx_patch.py
          git rm .github/scripts/v328_edition_fx_patch.py
          python -m py_compile card_identity_recognition.py multi_market_price_collector.py test_edition_fx_failclosed_v328.py
          node --check card_identity_recognition.js
          node --check auto_market_center.js
          node --check grade_market_flow.js
          node --check verify_pokemon_generation_runtime.js

      - name: Regenerate final-tree integrity manifest
        shell: bash
        run: |
          set -euo pipefail
          workflow='.github/workflows/v328-product-finalizer.yml'
          tmp="$(mktemp)"
          cp "$workflow" "$tmp"
          rm "$workflow"
          python fault_injection_healing.py --manifest
          mv "$tmp" "$workflow"
          python fault_injection_healing.py --diagnose
          git diff --check

      - name: Targeted identity OCR market and FX tests
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest -v \
            test_edition_fx_failclosed_v328.py \
            test_card_tablet_runtime_v300.py \
            test_card_precision_v321.py \
            test_card_collector_edition_alias_v324.py \
            test_card_identity_market_precision_v309.py \
            test_card_region_generation_precision_v306.py \
            test_card_edition_precision_v302.py \
            test_card_market_edition_v297.py \
            test_card_identity_ambiguity_v320.py \
            test_card_regression_gate_v299.py \
            test_error_recovery_learning_v134.py \
            test_learning_state_concurrency_v280.py

      - name: Related browser generation and output regressions
        shell: bash
        run: |
          set -euo pipefail
          node verify_browser_runtime.js
          node verify_pokemon_generation_runtime.js
          python verify_card_identity_recognition.py
          python feature_contract.py

      - name: Full current regression
        env:
          TCG_REQUIRE_NODE: '1'
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest -v \
            test_card_core_provenance_v296.py \
            test_card_market_edition_v297.py \
            test_card_probability_ui_v298.py \
            test_card_regression_gate_v299.py \
            test_card_tablet_runtime_v300.py \
            test_card_edition_precision_v302.py \
            test_card_region_generation_precision_v306.py \
            test_card_identity_market_precision_v309.py \
            test_card_region_conflict_failclosed_v318.py \
            test_card_identity_ambiguity_v320.py \
            test_card_precision_v321.py \
            test_card_promo_precision_v322.py \
            test_card_variant_market_precision_v323.py \
            test_card_collector_edition_alias_v324.py \
            test_card_market_generation_precision_v325.py \
            test_multi_market_price_collector.py \
            test_tablet_runtime_manifest_ui_assets_v254.py
          python -m unittest -v \
            test_card_core_crosscheck_v291.py \
            test_card_core_crosscheck_v292.py \
            test_card_core_crosscheck_v295.py \
            test_pokemon_generation_display_v207.py \
            test_card_edition_precision_v302.py \
            test_card_region_generation_precision_v306.py \
            test_card_identity_market_precision_v309.py \
            test_card_region_conflict_failclosed_v318.py \
            test_card_identity_ambiguity_v320.py
          python verify_current_runtime.py --passes 3 || { cat CURRENT_RUNTIME_VERIFICATION_REPORT.json; exit 1; }

      - name: Actual output fail-closed validation
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import tempfile
          from pathlib import Path
          from unittest import mock
          import card_identity_recognition as identity
          import multi_market_price_collector as market

          en = identity.infer_region_evidence('EN Pikachu PAL 185/193')
          assert en['edition_language'] == 'EN', en
          assert en['market_region'] == 'US', en
          assert en['conflict'] is False, en
          mixed = identity.infer_region_evidence('포켓몬 카드 ポケモン カード')
          assert mixed['edition_language'] == 'UNKNOWN', mixed
          assert mixed['market_region'] == 'UNKNOWN', mixed
          assert mixed['conflict'] is True, mixed
          with tempfile.TemporaryDirectory() as directory:
              path = Path(directory) / 'exchange_rates.json'
              path.write_text(json.dumps({
                  'updated_at':'2000-01-01T00:00:00+00:00',
                  'rates':{'JPY_KRW':9.1,'USD_KRW':1400.0},
              }), encoding='utf-8')
              with mock.patch.object(market, 'FX', path):
                  rates = market._fx()
              assert rates['JPY'] == 0.0 and rates['USD'] == 0.0 and rates['KRW'] == 1.0, rates
          print({'english_identity': en, 'mixed_identity': mixed, 'stale_fx': rates})
          PY

      - name: Repository Integrity and Main SELFREFINE
        shell: bash
        run: |
          set -euo pipefail
          python repository_integrity_guard.py
          python security_hardening_apply.py --check
          python main_selfrefine_gate.py --self-test
          python main_selfrefine_gate.py --cycles 5

      - name: Tablet runtime gates
        shell: bash
        run: |
          set -euo pipefail
          python tablet_runtime_manifest.py --check --compile
          python -m unittest -v \
            test_tablet_runtime_manifest_ui_assets_v254.py \
            test_card_tablet_runtime_v300.py
          TCG_FINAL_SKIP_HEAD_MATCH=1 bash VERIFY_TABLET_FINAL.sh

      - name: Enforce intended change scope
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git rm -f .github/workflows/v328-product-finalizer.yml
          git diff --name-only origin/main | sort > /tmp/actual.txt
          cat > /tmp/expected.txt <<'EOF'
          auto_market_center.js
          card_identity_recognition.js
          card_identity_recognition.py
          grade_market_flow.js
          index.html
          integrity_manifest.json
          multi_market_price_collector.py
          test_edition_fx_failclosed_v328.py
          test_card_tablet_runtime_v300.py
          verify_browser_runtime.js
          verify_pokemon_generation_runtime.js
          test_card_region_generation_precision_v306.py
          test_card_identity_ambiguity_v320.py
          test_card_market_generation_precision_v325.py
          test_pokemon_generation_display_v207.py
          test_card_core_crosscheck_v292.py
          EOF
          sort -o /tmp/expected.txt /tmp/expected.txt
          echo 'Final branch diff:'
          cat /tmp/actual.txt
          diff -u /tmp/expected.txt /tmp/actual.txt

      - name: Commit verified product state
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- \
            auto_market_center.js \
            card_identity_recognition.js \
            card_identity_recognition.py \
            grade_market_flow.js \
            index.html \
            integrity_manifest.json \
            multi_market_price_collector.py \
            test_edition_fx_failclosed_v328.py \
            verify_browser_runtime.js \
            verify_pokemon_generation_runtime.js \
            test_card_region_generation_precision_v306.py \
            test_card_identity_ambiguity_v320.py \
            test_card_market_generation_precision_v325.py \
            test_pokemon_generation_display_v207.py \
            test_card_core_crosscheck_v292.py \
            test_card_tablet_runtime_v300.py \
            .github/scripts/v328_edition_fx_patch.py
          git diff --cached --check
          git commit -m 'fix: separate EN edition from US market and enforce FX freshness'
          git push origin HEAD:fix/edition-fx-failclosed-v328

# retrigger after fixing the CSP helper import path
