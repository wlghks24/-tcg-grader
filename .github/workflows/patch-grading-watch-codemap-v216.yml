name: Patch Grading Watch Code Map v216

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-grading-watch-codemap-v216.yml'

permissions:
  contents: write

concurrency:
  group: patch-grading-watch-codemap-v216-main
  cancel-in-progress: true

jobs:
  patch-verify-commit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 3

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'

      - name: Patch parser association and code-map route
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          p=Path('grading_company_watch.py')
          text=p.read_text(encoding='utf-8')
          old='''    return text[max(0, match.start() - 80):min(len(text), match.end() + radius)]'''
          new='''    # Never look behind the matched service label: a preceding tier's fee can\n    # otherwise be attached to the next tier after a service-table redesign.\n    return text[match.start():min(len(text), match.end() + radius)]'''
          if old not in text:
              raise SystemExit('grading watcher window target not found')
          p.write_text(text.replace(old,new,1),encoding='utf-8')

          p=Path('code_map_intelligence.py')
          text=p.read_text(encoding='utf-8')
          old='''    "five_company_grading": (\n        "psa", "bgs", "cgc", "tag", "brg", "5개 업체", "five company", "등급사",\n    ),'''
          new='''    "five_company_grading": (\n        "psa", "bgs", "cgc", "tag", "brg", "5개 업체", "five company", "등급사",\n        "감정비", "등급업체", "등급 업체", "등급업체 가격", "등급 업체 가격",\n        "grading fee", "grading price", "grading company", "서비스 레벨", "service level",\n        "납기", "turnaround", "영업일", "업체 이벤트", "등급업체 이벤트", "grading event",\n        "접수중지", "접수 중지", "접수재개", "접수 재개",\n    ),'''
          if old not in text:
              raise SystemExit('five_company_grading alias block not found')
          text=text.replace(old,new,1)
          anchor='''FEATURE_ROUTE_OVERRIDES = {\n    "market_collection": ('''
          insert='''FEATURE_ROUTE_OVERRIDES = {\n    "five_company_grading": (\n        "grading_company_watch.py",\n        "grading_costs_live.py",\n        "grading_costs_live.js",\n        "test_grading_company_watch_v215.py",\n        "test_grading_costs_live.py",\n        ".github/workflows/grading-company-watch.yml",\n    ),\n    "market_collection": ('''
          if anchor not in text:
              raise SystemExit('feature route override insertion point not found')
          text=text.replace(anchor,insert,1)
          p.write_text(text,encoding='utf-8')
          PY

      - name: Verify parser watcher and code map
        run: |
          python -m py_compile grading_company_watch.py grading_costs_live.py code_map_intelligence.py
          python -m unittest -v \
            test_grading_company_watch_v215.py \
            test_grading_costs_live.py \
            test_code_map_fast_route_v195.py \
            test_code_map_entrypoint_route_v196.py
          python verify_code_map_internal.py
          node --check grading_costs_live.js

      - name: Commit verified patch and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -- .github/workflows/patch-grading-watch-codemap-v216.yml
          git add -- grading_company_watch.py code_map_intelligence.py
          git commit -m 'fix: bind grading changes to the correct service tier'
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
