name: V675 China Catalog Shadow Isolation

on:
  pull_request:
    paths:
      - 'tcg_reliability/china_official_catalog_v675.py'
      - 'tcg_reliability/test_china_catalog_v675.py'
      - '.github/workflows/china-catalog-v675-shadow-guard.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-isolation:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      PYTHONPATH: '.'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Prove malformed link isolation and unchanged V571 behavior
        run: |
          python -m unittest -v \
            tcg_reliability.test_china_catalog_v675 \
            tcg_reliability.test_china_official_catalog_v571 \
            tcg_reliability.test_china_catalog_retry_20261025
