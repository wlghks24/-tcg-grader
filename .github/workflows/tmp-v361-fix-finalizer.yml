name: Temporary v361 Fix Finalizer

on:
  push:
    branches:
      - 'ops/v361-fix-finalizer'

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor == github.repository_owner
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 'fix/static-sync-guard-successor-v361'
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Install audit dependencies
        run: |
          python -m pip install --disable-pip-version-check -r requirements.txt
          python -m pip install --disable-pip-version-check pyyaml
      - name: Regenerate manifest and validate fixes
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse --abbrev-ref HEAD)" = "fix/static-sync-guard-successor-v361"
          git fetch origin +refs/heads/main:refs/remotes/origin/main
          git merge-base --is-ancestor origin/main HEAD
          python -m py_compile protected_static_candidate_guard.py test_protected_static_candidate_guard_v311.py test_tablet_gpt_tcg_grader_sync_v356.py test_tablet_gpt_tcg_grader_sync_v357.py test_tablet_gpt_tcg_grader_sync_v358.py test_tablet_gpt_tcg_grader_sync_v359.py
          python static_integrity_manifest.py --write integrity_manifest.json
          python static_integrity_manifest.py --check integrity_manifest.json
          python -m unittest -v test_protected_static_candidate_guard_v311.py
          mapfile -t sync_tests < <(find . -maxdepth 1 -type f -name 'test_tablet_gpt_tcg_grader_sync_v*.py' -printf '%f\n' | sort -V)
          test "${#sync_tests[@]}" -gt 0
          python -m unittest -v "${sync_tests[@]}"
          python repository_integrity_guard.py
          git diff --check
      - name: Commit exact regenerated manifest
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git diff --name-only)"
          if [ -z "${changed}" ]; then
            echo '[OK] manifest already exact'
            exit 0
          fi
          test "${changed}" = "integrity_manifest.json"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- integrity_manifest.json
          git diff --cached --check
          git commit -m 'Reconcile integrity manifest for v361 sync guard fixes'
          git push origin HEAD:fix/static-sync-guard-successor-v361
