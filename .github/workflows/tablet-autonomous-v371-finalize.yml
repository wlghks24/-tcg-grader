name: Tablet Autonomous v371 Finalizer

on:
  push:
    branches: [feat/tablet-autonomous-intelligence-v371]
    paths:
      - 'tablet_autonomous_ai.py'
      - 'test_tablet_autonomous_ai_v371.py'
      - '.github/workflows/tablet-autonomous-intelligence.yml'
      - '.github/workflows/tablet-autonomous-v371-finalize.yml'
      - '.gitignore'

permissions:
  contents: write

concurrency:
  group: tablet-autonomous-v371-finalizer
  cancel-in-progress: true

jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/tablet-autonomous-intelligence-v371
          fetch-depth: 2

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'

      - name: Run targeted autonomous neural regressions
        run: |
          python -m py_compile tablet_autonomous_ai.py
          python -m unittest -v \
            test_tablet_autonomous_ai_v371.py \
            test_verified_neural_self_refine_v210.py \
            test_verified_collection_neural_v211.py \
            test_verified_collection_job_neural_v212.py

      - name: Remove one-shot finalizer and regenerate exact integrity manifest
        shell: bash
        run: |
          set -euo pipefail
          git rm -f -- .github/workflows/tablet-autonomous-v371-finalize.yml
          python static_integrity_manifest.py --write integrity_manifest.json
          python static_integrity_manifest.py --check integrity_manifest.json
          python repository_integrity_guard.py
          python security_self_audit.py --no-memory --fail-on high
          git add -- integrity_manifest.json
          git diff --cached --check
          test ! -e .github/workflows/tablet-autonomous-v371-finalize.yml

      - name: Commit exact verified tree to feature branch
        shell: bash
        run: |
          set -euo pipefail
          branch='feat/tablet-autonomous-intelligence-v371'
          source_sha='${{ github.sha }}'
          git fetch origin "${branch}"
          test "$(git rev-parse FETCH_HEAD)" = "${source_sha}"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore: finalize tablet autonomous v371 integrity'
          git push origin "HEAD:refs/heads/${branch}"
