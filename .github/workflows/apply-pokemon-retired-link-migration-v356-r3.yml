name: Apply Pokemon Korea Retired Link Migration v356 r3

on:
  push:
    branches:
      - 'fix/pokemon-kr-canonical-20260929'
    paths:
      - '.github/workflows/apply-pokemon-retired-link-migration-v356-r3.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-pokemon-retired-link-migration-v356-r3-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repair:
    if: github.ref == 'refs/heads/fix/pokemon-kr-canonical-20260929'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Require exact repair branch ancestry
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = "fix/pokemon-kr-canonical-20260929"
          git fetch origin +refs/heads/main:refs/remotes/origin/main
          git merge-base --is-ancestor origin/main HEAD
          test "$(git rev-parse --abbrev-ref HEAD)" != "main"
      - name: Apply path-preserving retired-host repair and regression tests
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('validate_external_links.py')
          text = path.read_text(encoding='utf-8')

          old = 'FALLBACKS={\n "pokemoncard.co.kr":"https://pokemoncard.co.kr/main",'
          new = 'FALLBACKS={\n "new.pokemonkorea.co.kr":"https://pokemoncard.co.kr/main",\n "pokemoncard.co.kr":"https://pokemoncard.co.kr/main",'
          if old not in text:
              raise SystemExit('fallback insertion anchor missing')
          text = text.replace(old, new, 1)

          anchor = '''TEMPLATE_PLACEHOLDER_PROBES = {
              "{query}": "TCG card",
              "{card_no}": "OP01-001",
              "{set_code}": "OP01",
          }


          def _render_template_probe'''
          helper = '''TEMPLATE_PLACEHOLDER_PROBES = {
              "{query}": "TCG card",
              "{card_no}": "OP01-001",
              "{set_code}": "OP01",
          }


          def _canonicalize_retired_pokemon_kr_url(url: str) -> str:
              """Migrate only proven Pokémon Korea card routes to the current official host.

              Numeric detail IDs are preserved exactly. Unknown retired paths stay
              untouched so link audit can fail closed instead of inventing a route.
              """
              if not isinstance(url, str) or not url:
                  return url
              try:
                  parsed = urllib.parse.urlsplit(url)
              except ValueError:
                  return url
              host = (parsed.hostname or "").rstrip(".").lower()
              if parsed.scheme != "https" or host != "new.pokemonkorea.co.kr":
                  return url
              old_path = parsed.path.rstrip("/") or "/"
              if old_path in {"/", "/card"}:
                  new_path = "/main"
              else:
                  parts = old_path.strip("/").split("/")
                  if not (
                      len(parts) == 2
                      and parts[0] == "card"
                      and parts[1].isdigit()
                      and 1 <= len(parts[1]) <= 8
                  ):
                      return url
                  new_path = f"/card/{parts[1]}"
              return urllib.parse.urlunsplit(
                  ("https", "pokemoncard.co.kr", new_path, parsed.query, parsed.fragment)
              )


          def _render_template_probe'''
          if anchor not in text:
              raise SystemExit('canonical helper anchor missing')
          text = text.replace(anchor, helper, 1)

          old_main = '''def main()->dict:
              now=dt.datetime.now(dt.timezone.utc).isoformat(timespec="seconds")
              loaded={}; tasks={}
              for fn in FILES:
                  p=ROOT/fn
                  if not p.exists(): continue
                  data=json.loads(safe_read_text(p)); loaded[fn]=data
                  for row,key in _records(data):
                      url=row.get(key)
                      try:_safe(url)'''
          new_main = '''def main()->dict:
              now=dt.datetime.now(dt.timezone.utc).isoformat(timespec="seconds")
              loaded={}; tasks={}; canonical_migrations=0
              for fn in FILES:
                  p=ROOT/fn
                  if not p.exists(): continue
                  data=json.loads(safe_read_text(p)); loaded[fn]=data
                  for row,key in _records(data):
                      url=row.get(key)
                      canonical=_canonicalize_retired_pokemon_kr_url(url)
                      if canonical != url:
                          row.setdefault("original_source" if key=="source" else "original_url", url)
                          row[key]=canonical
                          url=canonical
                          canonical_migrations+=1
                          _record_status(row,key,"공식 도메인 이전 · 상세 경로 보존")
                      try:_safe(url)'''
          if old_main not in text:
              raise SystemExit('main migration anchor missing')
          text = text.replace(old_main, new_main, 1)

          old_report = '"request_timeout_seconds":request_timeout,**counts,'
          new_report = '"request_timeout_seconds":request_timeout,"canonical_migrations":canonical_migrations,**counts,'
          if text.count(old_report) != 1:
              raise SystemExit(f'report anchor count unexpected: {text.count(old_report)}')
          text = text.replace(old_report, new_report, 1)
          path.write_text(text, encoding='utf-8')

          Path('test_pokemon_retired_link_migration_v356.py').write_text('''#!/usr/bin/env python3
          import unittest
          import validate_external_links as links


          class PokemonRetiredLinkMigrationV356Tests(unittest.TestCase):
              def test_numeric_detail_id_is_preserved_on_current_official_host(self):
                  self.assertEqual(links._canonicalize_retired_pokemon_kr_url("https://new.pokemonkorea.co.kr/card/668"), "https://pokemoncard.co.kr/card/668")
                  self.assertEqual(links._canonicalize_retired_pokemon_kr_url("https://new.pokemonkorea.co.kr/card/797?from=archive#detail"), "https://pokemoncard.co.kr/card/797?from=archive#detail")

              def test_retired_card_root_moves_to_current_main(self):
                  self.assertEqual(links._canonicalize_retired_pokemon_kr_url("https://new.pokemonkorea.co.kr/card"), "https://pokemoncard.co.kr/main")

              def test_unknown_retired_path_is_not_invented(self):
                  old = "https://new.pokemonkorea.co.kr/card/category/3"
                  self.assertEqual(links._canonicalize_retired_pokemon_kr_url(old), old)

              def test_retired_host_has_safe_official_home_fallback(self):
                  self.assertEqual(links.FALLBACKS["new.pokemonkorea.co.kr"], "https://pokemoncard.co.kr/main")


          if __name__ == "__main__":
              unittest.main(verbosity=2)
          '''.replace('          ', ''), encoding='utf-8')
          PY
          python -m py_compile validate_external_links.py test_pokemon_retired_link_migration_v356.py
          python -m unittest -v test_pokemon_retired_link_migration_v356.py test_collection_scope_compat_v214.py test_0600_operational_refresh_v25.py
      - name: Stage exact final tracked set then rebuild integrity manifest
        shell: bash
        run: |
          set -euo pipefail
          rm -- '.github/workflows/apply-pokemon-retired-link-migration-v356.yml'
          rm -- '.github/workflows/apply-pokemon-retired-link-migration-v356-r2.yml'
          rm -- '.github/workflows/apply-pokemon-retired-link-migration-v356-r3.yml'
          git add -A -- validate_external_links.py test_pokemon_retired_link_migration_v356.py .github/workflows/apply-pokemon-retired-link-migration-v356.yml .github/workflows/apply-pokemon-retired-link-migration-v356-r2.yml .github/workflows/apply-pokemon-retired-link-migration-v356-r3.yml
          python fault_injection_healing.py --manifest
          git add -- integrity_manifest.json
          python repository_integrity_guard.py
          git diff --cached --check
      - name: Commit exact repaired tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: preserve Pokemon Korea detail IDs during retired-link migration'
          git push origin "HEAD:${GITHUB_REF_NAME}"
