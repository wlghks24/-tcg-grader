name: Final Tablet Guard
on:
  push:
    branches: [main]
    paths:
      - 'VERIFY_TABLET_FINAL.sh'
      - 'ANDROID_RECOVER_UPDATE.sh'
      - 'ANDROID_UPDATE_AND_START.sh'
      - 'ANDROID_AUTO_START_INSTALL.sh'
      - 'START_TCG_UPDATER_ANDROID.sh'
      - 'runtime_bundle_guard_v143.py'
      - 'collection_learning_hardening_v144.py'
      - 'event_source_overlay_v144.py'
      - 'event_source_expansion_v145.py'
      - 'runtime_optimization_hardening.py'
      - 'safe_runtime.py'
      - 'auto_repair_engine.py'
      - 'auto_update_all.py'
      - 'collector_self_healing.py'
      - 'tcg_code_repair_learning.py'
      - 'GRAPHIFY_UPDATE.sh'
      - 'GRAPHIFY_SELF_HEAL.py'
      - 'GRAPHIFY_AUDIT.py'
      - 'SETUP_GRAPHIFY_TERMUX.sh'
      - '.graphifyignore'
      - '.gitignore'
      - '.github/workflows/final-tablet-guard.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.11'
      - name: Run final tablet release preflight
        env:
          TCG_FINAL_SKIP_HEAD_MATCH: '1'
        run: bash VERIFY_TABLET_FINAL.sh
      - name: Verify tablet recovery entrypoint exists
        run: |
          test -s ANDROID_RECOVER_UPDATE.sh
          test -s ANDROID_AUTO_START_INSTALL.sh
          bash -n ANDROID_AUTO_START_INSTALL.sh
          grep -Fq 'ANDROID_UPDATE_AND_START.sh' ANDROID_RECOVER_UPDATE.sh
      - name: Verify learning files remain device local
        run: |
          grep -Fq 'tcg_code_repair_learning.json' .gitignore
          grep -Fq 'tcg_code_repair_candidates.json' .gitignore
          grep -Fq 'tcg_code_repair_report.json' .gitignore
          grep -Fq 'graphify_self_heal_memory.json' .gitignore
          grep -Fq 'graphify-out/graph_audit.json' .gitignore
      - name: Verify Graphify control-plane files stay out of map
        run: |
          grep -Fxq '.codex/' .graphifyignore
          grep -Fxq '.agents/' .graphifyignore
          grep -Fxq 'AGENTS.md' .graphifyignore
          grep -Fq '25: "map_audit_failed"' GRAPHIFY_SELF_HEAL.py
          grep -Fq 'ignore_policy_synced' GRAPHIFY_AUDIT.py
