name: Apply link audit detail v191

on:
  push:
    branches: [main]
    paths:
      - 'apply_link_audit_detail_v191.py'
      - '.github/workflows/apply-link-audit-detail-v191.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply v191 patch
        run: python apply_link_audit_detail_v191.py
      - name: Verify syntax and detail markers
        run: |
          python -m py_compile auto_update_all.py
          grep -F "unresolved_summary" auto_update_all.py
          grep -F "미보정 깨진 링크" auto_update_all.py
          git diff --check
      - name: Commit v191 runtime change
        run: |
          if git diff --quiet -- auto_update_all.py; then
            echo 'No runtime changes needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add auto_update_all.py
          git commit -m 'fix: show unresolved link audit details v191'
          git push origin HEAD:main
