name: Apply PLAYGO event watch patch

# Legacy integrated feature: automatic source mutation is disabled; run manually only.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Apply collector patch
        run: |
          if grep -q 'PLAYGO' social_event_discovery.py; then
            echo 'PLAYGO collector already integrated; validation only'
          else
            python apply_playgo_event_watch_patch.py
          fi
      - name: Sync current official event data
        run: python apply_playgo_event_data_sync.py
      - name: Verify syntax and tests
        run: |
          python -m py_compile social_event_discovery.py update_promo_events.py apply_playgo_event_watch_patch.py apply_playgo_event_data_sync.py
          python -m unittest -v test_playgo_event_watch.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add social_source_registry.json social_event_discovery.py update_promo_events.py promo_events.json test_playgo_event_watch.py
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "feat: collect PLAYGO redistribution events"
            git push
          fi
