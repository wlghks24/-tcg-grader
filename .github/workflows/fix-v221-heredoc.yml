name: Fix v221 generated test indentation

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-v221-heredoc.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Remove destructive indentation rewrite
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path=Path('.github/workflows/collection-integration-audit-v221.yml')
          text=path.read_text(encoding='utf-8')
          needle="          sed -i 's/^          //' test_grading_watch_integration_v220.py\n"
          if text.count(needle) != 1:
              raise SystemExit(f'expected one destructive sed line, found {text.count(needle)}')
          path.write_text(text.replace(needle,'',1),encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -- .github/workflows/fix-v221-heredoc.yml
          git add -- .github/workflows/collection-integration-audit-v221.yml
          git diff --cached --check
          git commit -m 'ci: preserve generated regression test indentation'
          git push origin HEAD:main
