# One-shot finalizer: removes itself before regenerating the exact integrity manifest.
name: V364 Receipt Regression Refinalizer

on:
  push:
    branches:
      - fix/receipt-regression-coverage-v364
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: v364-receipt-regression-refinalizer
  cancel-in-progress: false

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          ref: fix/receipt-regression-coverage-v364
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Reconcile final tree and rerun complete receipt regression
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/v364-receipt-regression-refinalizer.yml
          python static_integrity_manifest.py --write
          python static_integrity_manifest.py --check
          mapfile -t sync_tests < <(find . -maxdepth 1 -type f -name 'test_tablet_gpt_tcg_grader_sync_v*.py' -printf '%f\n' | sort -V)
          test "${#sync_tests[@]}" -gt 0
          python -m unittest -v "${sync_tests[@]}"
          python -m unittest -v \
            test_tablet_gdrive_sync.py \
            test_tablet_gdrive_sync_perf_v262.py \
            test_tablet_gdrive_publish_v257.py
          PYTHONPATH=. python -m unittest discover -v -s trusted_ai_tests -p 'test_tablet_gdrive_receipt_completion_regression.py'
          python repository_integrity_guard.py
          git add integrity_manifest.json
          git diff --cached --check
          git commit -m 'chore: refinalize v364 receipt regression integrity'
          git push origin HEAD:fix/receipt-regression-coverage-v364
