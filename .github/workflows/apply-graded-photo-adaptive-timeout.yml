name: Apply graded photo adaptive timeout
# Legacy integrated feature: automatic source mutation is disabled; run manually only.
on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write
  checks: read
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Apply patch
        run: |
          python apply_graded_photo_adaptive_timeout.py
          python -m py_compile graded_photo_multi_source.py
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add graded_photo_multi_source.py
          if git diff --cached --quiet; then
            echo 'No changes'
          else
            git commit -m 'feat: adaptive one-hour graded photo timeout'
            GH_TOKEN="${{ github.token }}" bash scripts/publish_candidate_pr.sh
          fi
