name: Apply graded photo adaptive timeout
on:
  push:
    branches: [main]
    paths:
      - 'apply_graded_photo_adaptive_timeout.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Apply patch
        run: |
          python apply_graded_photo_adaptive_timeout.py
          python -m py_compile graded_photo_multi_source.py
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add graded_photo_multi_source.py
          git diff --cached --quiet || git commit -m 'feat: adaptive one-hour graded photo timeout'
          git push origin main
