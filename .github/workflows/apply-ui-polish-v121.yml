name: Apply UI polish v121
on:
  push:
    paths:
      - 'ui_polish_v121.css'
      - 'apply_ui_polish_v121.py'
      - 'test_ui_polish_v121.py'
      - '.github/workflows/apply-ui-polish-v121.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Apply UI patch
        run: python apply_ui_polish_v121.py
      - name: Verify Python syntax
        run: python -m py_compile tcg_updater.py apply_ui_polish_v121.py test_ui_polish_v121.py
      - name: Run UI integration tests
        run: |
          python - <<'PY'
          import test_ui_polish_v121 as t
          t.test_ui_link_present()
          t.test_server_allows_css()
          t.test_service_worker_caches_css()
          t.test_css_contains_responsive_and_dark_rules()
          print('UI polish tests passed')
          PY
      - name: Commit integrated files
        run: |
          if git diff --quiet -- index.html tcg_updater.py sw.js; then
            echo 'No integration changes needed'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html tcg_updater.py sw.js
          git commit -m 'style: integrate polished responsive UI'
          git push
