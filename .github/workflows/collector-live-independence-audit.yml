name: Collector Live Independence Audit
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Verify collector registry isolation without network execution
        run: python collector_live_independence_audit.py
      - name: Upload collector audit report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: collector-live-independence-report
          path: COLLECTOR_LIVE_INDEPENDENCE_REPORT.json
          if-no-files-found: error
