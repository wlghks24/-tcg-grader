name: Collector Live Independence Audit
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'
      - name: Verify collector registry isolation without network execution
        run: python collector_live_independence_audit.py
      - name: Upload collector audit report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: collector-live-independence-report
          path: COLLECTOR_LIVE_INDEPENDENCE_REPORT.json
          if-no-files-found: error
