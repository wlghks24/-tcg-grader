name: Apply PSA official proof grade hardening v187

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-psa-official-proof-grade-v187.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install OCR proof test dependency
        run: python -m pip install pillow
      - name: Apply v187 patch
        run: python apply_psa_official_proof_grade_v187.py
      - name: Validate v187
        run: |
          python test_psa_official_proof_grade_v187.py
          python -m py_compile manual_official_proof.py manual_graded_photo_registration.py graded_photo_evidence.py
          git diff --check
      - name: Commit v187 runtime changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add manual_official_proof.py
          git diff --cached --quiet && exit 0
          git commit -m 'fix: recover PSA official proof grade on mobile v187'
          git push origin HEAD:main
