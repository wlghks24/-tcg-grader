name: Apply runtime hardening v340

on:
  push:
    branches: [fix/runtime-hardening-v340]

permissions:
  contents: write

concurrency:
  group: apply-runtime-hardening-v340
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'

      - name: Guard exact base main
        shell: bash
        run: |
          set -euo pipefail
          BASE=ca011e21d753ac66d1e9db24b162ccb13a072a50
          git fetch origin +refs/heads/main:refs/remotes/origin/main
          test "$(git rev-parse origin/main)" = "$BASE"
          git merge-base --is-ancestor "$BASE" HEAD

      - name: Apply bounded runtime fixes
        run: python apply_runtime_hardening_v340.py

      - name: Targeted runtime regression
        shell: bash
        run: |
          set -euo pipefail
          bash -n TABLET_SCHEDULED_UPDATE.sh
          node --check sw.js
          python -m py_compile test_runtime_hardening_v340.py test_tablet_scheduled_update_v256.py
          python -m unittest -v \
            test_runtime_hardening_v340.py \
            test_tablet_scheduled_update_v256.py \
            test_ui_version_coherence_v276.py \
            test_tablet_app_dock_v275.py

      - name: Finalize exact tree and integrity manifest
        shell: bash
        run: |
          set -euo pipefail
          rm -- .github/workflows/apply-runtime-hardening-v340.yml apply_runtime_hardening_v340.py
          python fault_injection_healing.py --manifest
          git add -A
          python - <<'PY'
          import json
          from pathlib import Path
          import fault_injection_healing as healing
          root = Path('.').resolve()
          payload = json.loads((root / 'integrity_manifest.json').read_text(encoding='utf-8'))
          listed = set((payload.get('files') or {}).keys())
          current = {path.relative_to(root).as_posix() for path in healing.tracked_files(root)}
          assert listed == current, f'manifest coverage mismatch missing={sorted(current-listed)[:10]} extra={sorted(listed-current)[:10]}'
          PY
          python fault_injection_healing.py --diagnose
          python repository_integrity_guard.py
          git diff --cached --check
          test ! -e .github/workflows/apply-runtime-hardening-v340.yml
          test ! -e apply_runtime_hardening_v340.py

      - name: Commit finalized runtime patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Harden tablet scheduler and PWA fallback v340'
          git push origin HEAD:fix/runtime-hardening-v340
