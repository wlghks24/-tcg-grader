name: Fix Grading Watch Parser v217

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-grading-watch-parser-v217.yml'

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 4

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'

      - name: Diagnose official redirect endpoints
        shell: bash
        run: |
          set +e
          echo '--- Beckett effective URL ---'
          curl -LsS -A 'Mozilla/5.0 TCG-Grader-GradingCompanyWatch/1.0' -o /dev/null --max-redirs 5 -w 'BGS_FINAL_URL=%{url_effective}\nHTTP=%{http_code}\n' https://www.beckett.com/grading
          echo '--- PSA Japan effective URL ---'
          curl -LsS -A 'Mozilla/5.0 TCG-Grader-GradingCompanyWatch/1.0' -o /dev/null --max-redirs 5 -w 'PSA_JP_FINAL_URL=%{url_effective}\nHTTP=%{http_code}\n' https://www.psacard.com/ja-JP/services/tradingcardgrading/grading
          exit 0

      - name: Patch structured fee parser and version gate
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          p=Path('grading_company_watch.py')
          text=p.read_text(encoding='utf-8')
          text=text.replace('MAX_ANNOUNCEMENTS = 120\n', 'MAX_ANNOUNCEMENTS = 120\nPARSER_VERSION = 2\n', 1)

          old='''    values = [float(v.replace(",", "")) for v in re.findall(r"\\$\\s*([0-9][0-9,]*(?:\\.[0-9]{1,2})?)", window)]\n    return next((v for v in values if 5 <= v <= 50_000), None)'''
          new='''    # Prefer explicitly labelled per-card fee fields. Several official tables\n    # place maximum declared value before the fee, so the first dollar amount\n    # is not necessarily the grading price.\n    for pattern in (\n        r"Fee\\s+Per\\s+Card\\s*\\(USD\\)\\s*\\$\\s*([0-9][0-9,]*(?:\\.[0-9]{1,2})?)",\n        r"\\$\\s*([0-9][0-9,]*(?:\\.[0-9]{1,2})?)\\s*(?:per\\s*card|/\\s*card)\\b",\n        r"(?:fee|price|pricing)\\s*[:=-]?\\s*\\$\\s*([0-9][0-9,]*(?:\\.[0-9]{1,2})?)",\n    ):\n        match = re.search(pattern, window, re.I)\n        if match:\n            value = float(match.group(1).replace(",", ""))\n            if 5 <= value <= 50_000:\n                return value\n    values = [float(v.replace(",", "")) for v in re.findall(r"\\$\\s*([0-9][0-9,]*(?:\\.[0-9]{1,2})?)", window)]\n    return next((v for v in values if 5 <= v <= 50_000), None)'''
          if old not in text: raise SystemExit('USD price parser target missing')
          text=text.replace(old,new,1)

          old='''        r"(\\d{1,4})\\+?\\s*business\\s*days?",\n        r"(\\d{1,4})\\s*영업일",'''
          new='''        r"(\\d{1,4})\\+?\\s*business\\s*days?",\n        r"Current\\s+Turnaround\\s*\\(working\\s+days\\)\\s*(\\d{1,4})\\s*days?",\n        r"(\\d{1,4})\\s*영업일",'''
          if old not in text: raise SystemExit('turnaround parser target missing')
          text=text.replace(old,new,1)

          old='''    match = re.search(\n        r"(?:Max(?:imum)?\\s+(?:Insured|Declared)\\s+Value|Declared\\s+Value).{0,50}?\\$\\s*([0-9][0-9,]*(?:\\.[0-9]{1,2})?)",\n        window, re.I,\n    )'''
          new='''    match = re.search(\n        r"(?:Max\\.?\\s+Value\\s+per\\s+Card(?:\\s*\\(USD\\))?|Max(?:imum)?\\s+(?:Insured|Declared)\\s+Value|Declared\\s+Value).{0,50}?\\$\\s*([0-9][0-9,]*(?:\\.[0-9]{1,2})?)",\n        window, re.I,\n    )'''
          if old not in text: raise SystemExit('max-value parser target missing')
          text=text.replace(old,new,1)

          old='''            "availability": availability, "source": source, "verified_official_source": True,\n        }'''
          new='''            "availability": availability, "source": source, "verified_official_source": True,\n            "parser_version": PARSER_VERSION,\n        }'''
          if old not in text: raise SystemExit('service row version target missing')
          text=text.replace(old,new,1)

          old='''                    "status": "ok", "checked_at": checked_at, "signal_fingerprint": fingerprint,\n                    "services": services, "announcements": found, "verified_official_source": True,\n                }'''
          new='''                    "status": "ok", "checked_at": checked_at, "signal_fingerprint": fingerprint,\n                    "services": services, "announcements": found, "verified_official_source": True,\n                    "parser_version": PARSER_VERSION,\n                }'''
          if old not in text: raise SystemExit('source row version target missing')
          text=text.replace(old,new,1)

          old='''                    if old.get("verified_official_source") is True else []'''
          new='''                    if old.get("verified_official_source") is True and old.get("parser_version") == PARSER_VERSION else []'''
          if old not in text: raise SystemExit('baseline parser version target missing')
          text=text.replace(old,new,1)

          old='''                if old_fp and old_fp != fingerprint and not structured and not found:'''
          new='''                if old.get("parser_version") == PARSER_VERSION and old_fp and old_fp != fingerprint and not structured and not found:'''
          if old not in text: raise SystemExit('fingerprint version target missing')
          text=text.replace(old,new,1)

          # Every structured change carries the parser contract version so downstream\n          # consumers can reject history produced by obsolete parsers.\n          text=text.replace('''"verified_official_source": True,\n            })''','''"verified_official_source": True, "parser_version": PARSER_VERSION,\n            })''')
          p.write_text(text,encoding='utf-8')

          p=Path('grading_costs_live.py')
          text=p.read_text(encoding='utf-8')
          text=text.replace("PREFERRED_MARKET={'PSA':'US','BGS':'US','CGC':'US','TAG':'US','BRG':'KR'}\n", "PREFERRED_MARKET={'PSA':'US','BGS':'US','CGC':'US','TAG':'US','BRG':'KR'}\nWATCH_PARSER_MIN_VERSION=2\n", 1)
          marker='''def _merge_watch(companies,watch):\n'''
          helper='''def _current_watch_service(row):\n    if not isinstance(row,dict) or not row.get('verified_official_source') or not row.get('name'):\n        return False\n    try:return int(row.get('parser_version',0))>=WATCH_PARSER_MIN_VERSION\n    except (TypeError,ValueError,OverflowError):return False\n\n'''
          if marker not in text: raise SystemExit('merge marker missing')
          text=text.replace(marker,helper+marker,1)

          old='''        out['regional_markets']=deepcopy(markets)\n        preferred=PREFERRED_MARKET.get(name)\n        market=markets.get(preferred,{}) if isinstance(markets.get(preferred),dict) else {}\n        rows=market.get('services',[]) if isinstance(market.get('services'),list) else []'''
          new='''        clean_markets={}\n        for market_name,raw_market in markets.items():\n            if not isinstance(raw_market,dict):continue\n            clean=deepcopy(raw_market)\n            raw_rows=raw_market.get('services',[]) if isinstance(raw_market.get('services'),list) else []\n            clean['services']=[deepcopy(row) for row in raw_rows if _current_watch_service(row)]\n            if clean['services']:\n                clean_markets[market_name]=clean\n        out['regional_markets']=clean_markets\n        preferred=PREFERRED_MARKET.get(name)\n        market=clean_markets.get(preferred,{}) if isinstance(clean_markets.get(preferred),dict) else {}\n        rows=market.get('services',[]) if isinstance(market.get('services'),list) else []'''
          if old not in text: raise SystemExit('regional market sanitize target missing')
          text=text.replace(old,new,1)

          old="""            if not isinstance(observed,dict) or not observed.get('verified_official_source') or not observed.get('name'):continue"""
          new="""            if not _current_watch_service(observed):continue"""
          if old not in text: raise SystemExit('service gate target missing')
          text=text.replace(old,new,1)

          old="""        removed={str(c.get('service')) for c in changes if isinstance(c,dict) and c.get('company')==name and c.get('type')=='service_removed' and c.get('verified_official_source')}"""
          new="""        removed={str(c.get('service')) for c in changes if isinstance(c,dict) and c.get('company')==name and c.get('type')=='service_removed' and c.get('verified_official_source') and int(c.get('parser_version',0) or 0)>=WATCH_PARSER_MIN_VERSION}"""
          if old not in text: raise SystemExit('removed gate target missing')
          text=text.replace(old,new,1)
          p.write_text(text,encoding='utf-8')
          PY

      - name: Add regression tests
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('test_grading_company_watch_v215.py')
          text=p.read_text(encoding='utf-8')
          marker='''    def test_network_failure_retains_last_good_source(self):'''
          test='''    def test_cgc_fee_is_not_confused_with_max_declared_value(self):\n        text = (\n            "Bulk Cards 25-card minimum Max. Value per Card (USD) $500 Fee Per Card (USD) $17 "\n            "Current Turnaround (working days) 150 days Economy Max. Value per Card (USD) $1,000 "\n            "Fee Per Card (USD) $20 Current Turnaround (working days) 90 days "\n            "Standard Max. Value per Card (USD) $3,000 Fee Per Card (USD) $55 Current Turnaround (working days) 10 days"\n        )\n        rows=watch.parse_services('CGC','US','USD',text,'https://www.cgccards.com/submit/services-fees/cgc-grading/?view=cards')\n        by={row['name']:row for row in rows}\n        self.assertEqual(by['Bulk']['fee'],17.0)\n        self.assertEqual(by['Bulk']['max_declared_or_insured_value'],500.0)\n        self.assertEqual(by['Bulk']['turnaround_business_days'],150)\n        self.assertEqual(by['Economy']['fee'],20.0)\n        self.assertEqual(by['Standard']['fee'],55.0)\n        self.assertEqual(by['Bulk']['parser_version'],watch.PARSER_VERSION)\n\n'''
          if marker not in text: raise SystemExit('watch test marker missing')
          if 'test_cgc_fee_is_not_confused_with_max_declared_value' not in text:
              text=text.replace(marker,test+marker,1)
          p.write_text(text,encoding='utf-8')

          p=Path('test_grading_costs_live.py')
          text=p.read_text(encoding='utf-8')
          marker="if __name__=='__main__': unittest.main()"
          test='''    def test_obsolete_parser_snapshot_cannot_override_fallback_fee(self):\n        companies={k:g.deepcopy(v) for k,v in g.COMPANIES.items()}\n        watch={'companies':{'CGC':{'markets':{'US':{'services':[{'name':'Bulk','fee':500.0,'verified_official_source':True,'parser_version':1}]}}}},'history':[]}\n        g._merge_watch(companies,watch)\n        by={row['name']:row for row in companies['CGC']['services']}\n        self.assertEqual(by['Bulk']['fee'],17.0)\n        self.assertEqual(companies['CGC']['regional_markets'],{})\n\n'''
          if marker not in text: raise SystemExit('cost test marker missing')
          if 'test_obsolete_parser_snapshot_cannot_override_fallback_fee' not in text:
              text=text.replace(marker,test+'\n'+marker,1)
          p.write_text(text,encoding='utf-8')
          PY

      - name: Verify targeted grading watcher contracts
        run: |
          python -m py_compile grading_company_watch.py grading_costs_live.py test_grading_company_watch_v215.py test_grading_costs_live.py
          python -m unittest -v test_grading_company_watch_v215.py test_grading_costs_live.py
          node --check grading_costs_live.js
          python verify_code_map_internal.py

      - name: Commit tested parser safety patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -- .github/workflows/fix-grading-watch-parser-v217.yml
          git add -- grading_company_watch.py grading_costs_live.py test_grading_company_watch_v215.py test_grading_costs_live.py
          git commit -m 'fix: separate grading fees from declared values and gate parser versions'
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
