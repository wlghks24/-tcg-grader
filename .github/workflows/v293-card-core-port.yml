name: V293 Card Core Port

on:
  push:
    branches:
      - audit/card-core-crosscheck-v293

permissions:
  contents: write

concurrency:
  group: v293-card-core-port
  cancel-in-progress: false

jobs:
  port-test-finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      PYTHONPATH: ${{ github.workspace }}
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: audit/card-core-crosscheck-v293
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'
      - name: Fetch verified v292 source branch
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin audit/card-core-crosscheck-v292
      - name: Reapply v292 functional hardening and v293 fixes
        shell: bash
        run: |
          set -euo pipefail
          python prepare_v293_port.py
          python apply_v293_card_core.py
          python apply_v293_period_patch.py
      - name: Remove one-shot machinery and regenerate integrity
        shell: bash
        run: |
          set -euo pipefail
          rm -f apply_v293_card_core.py prepare_v293_port.py apply_v293_period_patch.py .github/workflows/v293-card-core-port.yml
          python fault_injection_healing.py --manifest
          python fault_injection_healing.py --diagnose
      - name: Targeted card-core and tablet validation
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile card_grading_valuation.py collection_verification_gate.py tablet_runtime_manifest.py tcg_updater.py update_market_prices.py card_identity_recognition.py
          node --check grading_probability_v292.js
          node --check market_period_filter_v293.js
          node --check card_identity_recognition.js
          python -m unittest -v \
            test_card_core_crosscheck_v291.py \
            test_card_core_crosscheck_v292.py \
            test_card_core_crosscheck_v293.py \
            test_psa_probability_market_flow_v252.py \
            test_ui_version_coherence_v276.py \
            test_tablet_app_dock_v275.py
          node verify_v99_browser_accuracy.js
          python verify_v99_cross_runtime.py
          node verify_pokemon_generation_runtime.js
          python test_runtime_delivery_guards.py
          python tablet_runtime_manifest.py --check --compile
          python tablet_runtime_qa.py --profile final
          git diff --check
      - name: Commit exact validated v293 tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Harden card grading market windows and generation v293'
          git push origin HEAD:audit/card-core-crosscheck-v293
