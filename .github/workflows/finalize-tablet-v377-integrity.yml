name: V377 Autonomy Heavy-Lane Finalizer

on:
  pull_request:
    branches: [ main ]
    types: [ opened, reopened, synchronize ]

permissions:
  contents: write

jobs:
  finalize:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'fix/tablet-autonomy-single-run-v377'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Finish V377 safely
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('tablet_autonomous_evolution_v376.py'); t=p.read_text()
          old='''    operational = v375.v374.execute_operational_skill(selected, settled["plan"])
    safe_learning = v375.v374.v373.v372.execute_safe_learning(
        settled["plan"], state_path=state_path, now=moment
    )
'''
          new='''    recipe = str(selected.get("recipe") or "") if isinstance(selected, dict) else ""
    selected_learning = settled["plan"].get("selected_safe_learning_actions")
    has_learning = isinstance(selected_learning, list) and bool(selected_learning)
    operational_recipes = {"RECOVER_FRESHNESS", "EXPAND_REGION_COVERAGE", "RECOVER_SOURCE_HEALTH"}
    if recipe in operational_recipes:
        heavy_lane = "operational"
        operational = v375.v374.execute_operational_skill(selected, settled["plan"])
        safe_learning = {"status": "DEFERRED_HEAVY_LANE_OPERATIONAL", "results": {}, "state": {"status": "NOT_WRITTEN", "written": False}, "proposals_executed": False, "git_write": False, "source_code_modified": False}
    elif has_learning:
        heavy_lane = "safe_learning"
        operational = {"status": "DEFERRED_HEAVY_LANE_SAFE_LEARNING", "executed": False, "verified": True, "recipe": recipe or None}
        safe_learning = v375.v374.v373.v372.execute_safe_learning(settled["plan"], state_path=state_path, now=moment)
    else:
        heavy_lane = "none"
        operational = v375.v374.execute_operational_skill(selected, settled["plan"]) if recipe == "OBSERVE_ONLY" else {"status": "NO_HEAVY_OPERATION", "executed": False, "verified": True, "recipe": recipe or None}
        safe_learning = {"status": "NO_SAFE_LEARNING_ACTION", "results": {}, "state": {"status": "NOT_WRITTEN", "written": False}, "proposals_executed": False, "git_write": False, "source_code_modified": False}
    settled["heavy_lane"] = heavy_lane
'''
          if '"one_heavy_lane_arbiter_enforced": True' not in t:
              if t.count(old)!=1: raise SystemExit('dual heavy block mismatch')
              t=t.replace(old,new,1).replace('    "market_direction_inferred": False,\n})','    "market_direction_inferred": False,\n    "one_heavy_lane_arbiter_enforced": True,\n})',1); p.write_text(t)
          PY
          cat > test_tablet_autonomy_heavy_lane_v377.py <<'PY'
          import unittest
          import tablet_autonomous_evolution_v376 as a
          class T(unittest.TestCase):
              def test_contract(self):
                  self.assertTrue(a.SAFETY['one_heavy_lane_arbiter_enforced'])
                  self.assertEqual(1,a.v375.v374.SAFETY['max_heavy_operations_per_cycle'])
                  text=open('tablet_autonomous_evolution_v376.py',encoding='utf-8').read()
                  self.assertIn('DEFERRED_HEAVY_LANE_OPERATIONAL',text)
                  self.assertIn('DEFERRED_HEAVY_LANE_SAFE_LEARNING',text)
          if __name__=='__main__': unittest.main(verbosity=2)
          PY
          git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tablet_autonomous_evolution_v376.py test_tablet_autonomy_heavy_lane_v377.py
          git diff --cached --quiet || git commit -m 'fix: enforce one heavy autonomy lane per cycle v377'
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          cp=Path('TCG_CROSSCHECK/TABLET_GPT_TCG_GRADER_SYNC_CONTRACT_V377.json'); dp=Path('TCG_CROSSCHECK/TABLET_GPT/learning_snapshot_v377_delta.json'); rp=Path('TCG_CROSSCHECK/TCG_GRADER/tablet_gpt_learning_receipt_v377.json')
          c=json.loads(cp.read_text()); d=json.loads(dp.read_text()); r=json.loads(rp.read_text())
          lesson={'lesson_id':'TABLET-GPT-SINGLE-HEAVY-LANE-ARBITER-V377','subsystem':'tablet_gpt_autonomous_execution_budget','issue_class':'dual_heavy_execution','trigger_condition':'operational recovery and safe-learning are both selected','prevention_rule':'choose exactly one heavy lane per cycle and preserve all V376 fail-closed gates','validation_required':['operational lane defers model training','safe-learning lane defers operational recovery','V377 lock serializes mutating cycles'],'safety_boundary':'one heavy operation per cycle'}
          d['lessons']=[x for x in d['lessons'] if x.get('lesson_id')!=lesson['lesson_id']]+[lesson]; dg=hashlib.sha256(json.dumps(d['lessons'],ensure_ascii=False,sort_keys=True,separators=(',',':')).encode()).hexdigest(); d['lesson_digest_sha256']=dg; r['delta_lesson_digest_sha256']=dg; r['accepted_lesson_ids']=[x['lesson_id'] for x in d['lessons']]; c['delta_required_lesson_count']=len(d['lessons']); c['current_required_lesson_count']=c['prior_required_lesson_count']+len(d['lessons']); c['rules']['one_heavy_lane_arbiter_enforced']=True; c['rules']['closed_loop_max_one_heavy_operation_per_cycle']=True
          cp.write_text(json.dumps(c,ensure_ascii=False,indent=2)+'\n'); dp.write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\n'); rp.write_text(json.dumps(r,ensure_ascii=False,indent=2)+'\n')
          PY
          git add TCG_CROSSCHECK/TABLET_GPT_TCG_GRADER_SYNC_CONTRACT_V377.json TCG_CROSSCHECK/TABLET_GPT/learning_snapshot_v377_delta.json TCG_CROSSCHECK/TCG_GRADER/tablet_gpt_learning_receipt_v377.json
          git commit -m 'sync: append V377 heavy-lane lesson'
          python -m unittest -v test_tablet_autonomous_evolution_v376.py test_tablet_autonomous_evolution_v377.py test_tablet_autonomy_heavy_lane_v377.py
          git rm .github/workflows/finalize-tablet-v377-integrity.yml
          git commit -m 'chore: remove V377 one-shot finalizer'
          python static_integrity_manifest.py --write
          python static_integrity_manifest.py --diagnose
          git add integrity_manifest.json
          git commit -m 'chore: refresh V377 integrity manifest' || true
          python repository_integrity_guard.py
          git push origin HEAD:${GITHUB_HEAD_REF}
