            },
          })
          contract['rules']['closed_loop_max_one_heavy_operation_per_cycle']=True
          contract['rules']['one_heavy_lane_arbiter_enforced']=True
          contract['rules']['single_mutating_cycle_lock_required']=True
          contract['rules']['concurrent_mutating_cycle_fail_closed']=True
          contract['freshness_watch']['exclude_paths']=list(dict.fromkeys(contract['freshness_watch']['exclude_paths']+generation))
          delta={
            'schema_version':'1.1-tablet-gpt-tcg-grader-learning-sync','namespace':'TABLET_GPT','snapshot_kind':'learning_delta',
            'run_date_kst':now.date().isoformat(),'built_at':now.isoformat(timespec='seconds'),'status':'finalized',
            'source_repository':'wlghks24/-tcg-grader','prior_delta':'TCG_CROSSCHECK/TABLET_GPT/learning_snapshot_v376_delta.json',
