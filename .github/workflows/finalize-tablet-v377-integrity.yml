            'lesson_digest_sha256':digest,'lessons':lessons,
          }
          receipt={
            'schema_version':'1.1-tablet-gpt-tcg-grader-learning-sync','receiver':'TCG_GRADER','source_namespace':'TABLET_GPT',
            'source_repository':'wlghks24/-tcg-grader','source_main_sha':source,'received_at':now.isoformat(timespec='seconds'),'status':'SYNCED_VERIFIED',
            'source_snapshots':['TCG_CROSSCHECK/TABLET_GPT/learning_snapshot_v376_delta.json','TCG_CROSSCHECK/TABLET_GPT/learning_snapshot_v377_delta.json'],
            'prior_lesson_digest_sha256':prior_digest,'delta_lesson_digest_sha256':digest,
            'accepted_lesson_ids':[lesson['lesson_id']],
            'alignment_policy':{'same_digest_required':True,'same_lesson_ids_required':True,'same_source_main_required_for_delta':True,'covered_patch_commits_must_be_ancestors':True,'future_watched_main_changes_require_new_delta':True,'blind_overwrite_forbidden':True,'grading_calibration_auto_import_forbidden':True,'peer_verified_never_auto_promotes_local':True},
            'verification':{'contract_version':'v377','verification_test':'test_tablet_gpt_tcg_grader_sync_v377.py','verification_mode':'exact_candidate_single_heavy_lane_and_serialized_mutation','verified_result':'TABLET_GPT_TCG_GRADER_MATCH','physical_tablet_runtime_verified':False,'physical_drive_readback_verified':False,'device_reverification_required':True},
          }
          for path,obj in [
            ('TCG_CROSSCHECK/TABLET_GPT_TCG_GRADER_SYNC_CONTRACT_V377.json',contract),
