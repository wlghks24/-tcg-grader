          Path('test_tablet_gpt_tcg_grader_sync_v377.py').write_text(f'''import hashlib\nimport json\nimport subprocess\nimport unittest\nfrom pathlib import Path\n\nROOT=Path(__file__).resolve().parent\nSOURCE={source!r}\nCANDIDATE={candidate!r}\nCONTRACT=ROOT/'TCG_CROSSCHECK/TABLET_GPT_TCG_GRADER_SYNC_CONTRACT_V377.json'\nDELTA=ROOT/'TCG_CROSSCHECK/TABLET_GPT/learning_snapshot_v377_delta.json'\nRECEIPT=ROOT/'TCG_CROSSCHECK/TCG_GRADER/tablet_gpt_learning_receipt_v377.json'\nEXPECTED_DIGEST='b7f0e3dc0ed17617118db2671febf8bfa6cc607a0450f9c4b829cb6c34a73fc4'\n\ndef load(p): return json.loads(p.read_text(encoding='utf-8'))\ndef watched(c,a,b='HEAD'):\n    w=c['freshness_watch']; exact=set(w['exact_paths']); prefixes=tuple(w['path_prefixes']); excluded=set(w['exclude_paths'])\n    changed=subprocess.check_output(['git','diff','--name-only',f'{{a}}..{{b}}'],text=True).splitlines()\n    return sorted(p for p in changed if p not in excluded and (p in exact or p.startswith(prefixes)))\n\nclass TabletGptTcgGraderSyncV377(unittest.TestCase):\n    def test_generation_digest_receipt_and_scope(self):\n        c,d,r=load(CONTRACT),load(DELTA),load(RECEIPT)\n        raw=json.dumps(d['lessons'],ensure_ascii=False,sort_keys=True,separators=(',',':'))\n        dg=hashlib.sha256(raw.encode()).hexdigest()\n        self.assertEqual(EXPECTED_DIGEST,dg); self.assertEqual(dg,d['lesson_digest_sha256']); self.assertEqual(dg,r['delta_lesson_digest_sha256'])\n        self.assertEqual(SOURCE,d['source_main_sha']); self.assertEqual(SOURCE,r['source_main_sha'])\n        self.assertEqual(['TABLET-GPT-SINGLE-HEAVY-LANE-ARBITER-V377'],r['accepted_lesson_ids'])\n        self.assertEqual('SYNCED_VERIFIED',r['status']); self.assertFalse(r['verification']['physical_tablet_runtime_verified']); self.assertFalse(r['verification']['physical_drive_readback_verified'])\n        self.assertEqual(['main','tablet_autonomous_evolution_v376.py','tablet_autonomous_evolution_v377.py','tablet_runtime_manifest.py'], watched(c,SOURCE,CANDIDATE))\n        self.assertEqual([],watched(c,CANDIDATE))\n        subprocess.run(['git','merge-base','--is-ancestor',SOURCE,'HEAD'],check=True)\n        subprocess.run(['git','merge-base','--is-ancestor',CANDIDATE,'HEAD'],check=True)\n    def test_runtime_and_safety_boundaries(self):\n        c=load(CONTRACT); rules=c['rules']\n        for key in ('closed_loop_max_one_heavy_operation_per_cycle','one_heavy_lane_arbiter_enforced','single_mutating_cycle_lock_required','concurrent_mutating_cycle_fail_closed','direct_main_push_forbidden','autonomous_source_code_generation_forbidden','autonomous_git_write_forbidden','autonomous_verification_bypass_forbidden','physical_tablet_and_drive_results_must_not_be_invented'):\n            self.assertIs(rules[key],True,key)\n        main=(ROOT/'main').read_text(encoding='utf-8'); runtime=(ROOT/'tablet_runtime_manifest.py').read_text(encoding='utf-8'); core=(ROOT/'tablet_autonomous_evolution_v376.py').read_text(encoding='utf-8')\n        self.assertIn('tablet_autonomous_evolution_v377.py --execute-safe-learning --apply-capabilities --train-meta --apply-skills',main)\n        self.assertIn('"tablet_autonomous_evolution_v377.py"',runtime)\n        self.assertIn('DEFERRED_HEAVY_LANE_OPERATIONAL',core); self.assertIn('DEFERRED_HEAVY_LANE_SAFE_LEARNING',core); self.assertIn('one_heavy_lane_arbiter_enforced',core)\n\nif __name__=='__main__': unittest.main(verbosity=2)\n''',encoding='utf-8')
          PY
