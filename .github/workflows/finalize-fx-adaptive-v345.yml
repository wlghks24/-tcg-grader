name: Finalize FX and adaptive safety v345

on:
  push:
    branches:
      - fix/fx-adaptive-failclosed-v345
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: finalize-fx-adaptive-v345
  cancel-in-progress: true

jobs:
  finalize:
    if: github.actor == github.repository_owner && github.ref == 'refs/heads/fix/fx-adaptive-failclosed-v345'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - name: Checkout exact repair branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/fx-adaptive-failclosed-v345
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install audited runtime dependencies
        shell: bash
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Repair finalizer replacement escaping
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('.github/scripts/finalize_fx_adaptive_v345.py')
          text=p.read_text(encoding='utf-8')
          old='text, count = re.subn(pattern, replacement, text, count=1, flags=re.S)'
          new='text, count = re.subn(pattern, lambda _match: replacement, text, count=1, flags=re.S)'
          if old not in text:
              raise SystemExit('replacement anchor missing')
          p.write_text(text.replace(old,new,1),encoding='utf-8')
          PY
      - name: Apply verify and finalize v345 branch
        shell: bash
        run: python .github/scripts/finalize_fx_adaptive_v345.py
