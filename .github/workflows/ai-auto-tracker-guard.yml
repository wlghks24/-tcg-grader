name: AI Auto Tracker Guard

on:
  push:
    paths:
      - 'ai_auto_tracker.py'
      - 'ai_performance_runtime.py'
      - 'ai_reasoning_enhancer.py'
      - 'ai_correlation_engine.py'
      - 'ai_intelligence_pipeline.py'
      - 'code_map_intelligence.py'
      - 'test_ai_auto_tracker.py'
      - 'test_ai_performance_runtime.py'
      - 'test_ai_reasoning_enhancer.py'
      - 'test_ai_correlation_engine.py'
      - 'selfrefine_error_quarantine.py'
      - 'safe_runtime.py'
      - '.github/workflows/ai-auto-tracker-guard.yml'
  pull_request:
    paths:
      - 'ai_auto_tracker.py'
      - 'ai_performance_runtime.py'
      - 'ai_reasoning_enhancer.py'
      - 'ai_correlation_engine.py'
      - 'ai_intelligence_pipeline.py'
      - 'code_map_intelligence.py'
      - 'test_ai_auto_tracker.py'
      - 'test_ai_performance_runtime.py'
      - 'test_ai_reasoning_enhancer.py'
      - 'test_ai_correlation_engine.py'
      - 'selfrefine_error_quarantine.py'
      - 'safe_runtime.py'
      - '.github/workflows/ai-auto-tracker-guard.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ai-auto-tracker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'
      - name: Syntax check
        run: |
          python -m py_compile \
            code_map_intelligence.py \
            ai_auto_tracker.py \
            ai_performance_runtime.py \
            ai_reasoning_enhancer.py \
            ai_correlation_engine.py \
            ai_intelligence_pipeline.py \
            test_ai_auto_tracker.py \
            test_ai_performance_runtime.py \
            test_ai_reasoning_enhancer.py \
            test_ai_correlation_engine.py
      - name: Tracker intelligence and performance regression tests
        run: >-
          python -m unittest -v
          test_ai_auto_tracker.py
          test_ai_performance_runtime.py
          test_ai_reasoning_enhancer.py
          test_ai_correlation_engine.py
      - name: Reasoning self-test
        run: python ai_reasoning_enhancer.py
      - name: Domain boundary regression
        run: python selfrefine_domain_boundary_guard.py
      - name: Integrated dry-run health check
        run: python ai_intelligence_pipeline.py --dry-run
      - name: Performance cache contract
        run: |
          python - <<'PY'
          import tempfile
          from pathlib import Path
          import ai_performance_runtime as p
          events = [
              {'domain':'market', 'path':'same.py', 'message':f'429 event {i}'}
              for i in range(50)
          ]
          with tempfile.TemporaryDirectory() as td:
              out = p.observe(events, state_path=Path(td)/'state.json', dry_run=True)
          perf = out['summary']['performance']
          assert perf['unique_code_map_paths'] == 1
          assert perf['code_map_cache_hits'] == 49
          assert perf['event_field_normalization'] == 'single_pass'
          assert perf['duplicate_severity_handoff_scan'] is False
          assert out['safety']['performance_cache_run_scoped_only'] is True
          print('AI performance cache contract: OK')
          PY
      - name: Safety contract audit
        run: |
          python - <<'PY'
          import ai_reasoning_enhancer as r
          import ai_correlation_engine as c
          sample = r.enrich_incident({
              'domain': 'github',
              'severity': 'high',
              'stage': 'CI',
              'path': 'x.py',
              'error_type': 'AssertionError',
              'message': 'regression test failed',
              'evidence': 'bounded fixture',
          }, occurrences=3, code_map={'available': True})
          safety = sample['safety']
          assert safety['learned_text_executable'] is False
          assert safety['auto_patch_from_reasoning'] is False
          assert safety['domain_state_merged'] is False
          assert safety['full_regression_required'] is True
          linked = c.correlate([{
              'domain': 'github', 'severity': 'high', 'message': 'test failed',
              'verified': True, 'regression_pass': False,
          }])
          assert linked['safety']['stateless'] is True
          assert linked['safety']['cross_domain_state_merge'] is False
          assert linked['safety']['learned_text_executable'] is False
          assert linked['safety']['auto_patch'] is False
          assert linked['safety']['correlation_is_proof'] is False
          assert linked['human_review_required'] is True
          print('Integrated AI reasoning/correlation safety contract: OK')
          PY
