name: Apply Android 7-step display

on:
  push:
    paths:
      - 'apply_android_7step_display_patch.py'
      - '.github/workflows/apply-android-7step-display.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          fetch-depth: 0
      - name: Apply patch
        run: python apply_android_7step_display_patch.py
      - name: Verify 7-step display
        run: |
          python - <<'PY'
          from pathlib import Path
          text=Path('tcg_updater.py').read_text(encoding='utf-8')
          assert "7 업체별 등급카드 사진" in text
          assert "'total':7" in text or "'total': 7" in text
          print('7-step startup display verified')
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tcg_updater.py
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "fix: show 7-step Android auto collection"
            git push origin main
          fi
