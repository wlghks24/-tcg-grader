name: Apply update guidance consistency v218

on:
  push:
    branches:
      - fix/unify-update-guidance-v218
    paths:
      - test_update_guidance_consistency_v218.py
      - .github/workflows/apply-update-guidance-v218.yml

permissions:
  contents: write

concurrency:
  group: apply-update-guidance-v218
  cancel-in-progress: true

jobs:
  apply-and-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/unify-update-guidance-v218
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'
      - name: Unify update guidance copy
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("index.html")
          text = path.read_text(encoding="utf-8")
          replacements = (
              (
                  '<div class="update-step-note">한 번 누르면 최신자료 확인 → 변경내용 비교 → 구조·보안 검증 → 정상자료 전체 반영까지 자동으로 진행합니다.</div>',
                  '<div class="update-step-note">서버에서 출시·재발매·시세·행사·구매처·환율·등급사진 7단계를 수집하고, 변경내용 비교 → 구조·보안 검증 → 정상자료 반영까지 자동으로 진행합니다.</div>',
              ),
              (
                  'b.textContent=busy?"⏳ 서버에서 업데이트 진행 중...":"🚀 전체 자료 한 번에 업데이트";',
                  'b.textContent=busy?"⏳ 전체정보 업데이트 중…":"🚀 전체 자료 한 번에 업데이트";',
              ),
              (
                  'siteStatus.textContent="🖥️ 서버 연결됨 · 출시·재발매·시세·행사·구매처·환율·등급사진 7단계를 백그라운드에서 수집하고 있습니다.";',
                  'siteStatus.textContent="🖥️ 서버 연결됨 · 출시·재발매·시세·행사·구매처·환율·등급사진 7단계 수집 → 변경내용 비교 → 구조·보안 검증 → 정상자료 반영을 진행 중입니다. 화면을 벗어나도 서버에서 계속 진행됩니다.";',
              ),
          )
          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f"missing expected UI copy: {old}")
              text = text.replace(old, new, 1)
          path.write_text(text, encoding="utf-8")
          PY
      - name: Run focused regression
        run: |
          python -m py_compile test_update_guidance_consistency_v218.py
          python -m unittest -v test_update_guidance_consistency_v218.py
      - name: Run UI compatibility checks
        run: |
          python verify_all_legacy_v99.py
          python feature_contract.py
      - name: Diff safety
        run: git diff --check
      - name: Commit unified guidance
        run: |
          if git diff --quiet -- index.html; then
            echo 'No UI change required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'fix: unify full-update guidance copy'
          git push origin HEAD:fix/unify-update-guidance-v218
