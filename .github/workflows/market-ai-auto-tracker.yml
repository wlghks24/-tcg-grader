name: Market AI Auto Tracker

on:
  push:
    branches: [main]
    paths:
      - 'market_ai_auto_tracker.py'
      - 'market_ai_decision_engine.py'
      - 'market_ai_learning_memory.py'
      - 'ai_auto_tracker.py'
      - 'code_map_intelligence.py'
      - 'test_market_ai_auto_tracker.py'
      - 'test_market_ai_decision_engine.py'
      - 'test_market_ai_learning_memory.py'
      - 'GRAPHIFY_UPDATE.sh'
      - 'GRAPHIFY_AUDIT.py'
      - '.graphifyignore'
      - 'multi_market_price_collector.py'
      - 'multi_market_prices.js'
      - 'multi_market_prices.css'
      - 'market_prices.json'
      - 'market_watch.json'
      - 'tcg_updater.py'
      - 'index.html'
      - 'main_selfrefine_gate.py'
      - 'selfrefine_*.py'
      - 'verified_code_repair_rules.py'
      - 'verified_neural_self_refine.py'
      - 'test_verified_neural_self_refine_v210.py'
      - '.github/workflows/market-ai-auto-tracker.yml'
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write
  pages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  track-repair-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 2

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'
          cache: 'pip'
          # Graphify is pinned in this workflow rather than requirements.txt.
          # Key the pip cache to this file so hourly runs can reuse downloaded
          # wheels while still invalidating immediately when the pin changes.
          cache-dependency-path: '.github/workflows/market-ai-auto-tracker.yml'

      - name: Restore verified code-map learning from previous successful run
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/market-ai-previous /tmp/market-ai-previous.zip
          mkdir -p /tmp/market-ai-previous

          prior_run_id="$(gh api             "repos/${GITHUB_REPOSITORY}/actions/workflows/market-ai-auto-tracker.yml/runs?branch=main&status=success&per_page=20"             --jq '.workflow_runs[0].id // empty' 2>/dev/null || true)"

          if [ -z "$prior_run_id" ]; then
            echo "[CodeMap] previous successful workflow run not found; starting with empty verified learning"
            exit 0
          fi

          artifact_id="$(gh api             "repos/${GITHUB_REPOSITORY}/actions/runs/${prior_run_id}/artifacts?per_page=100"             --jq '.artifacts[] | select(.name == "market-ai-auto-tracker" and .expired == false) | .id'             2>/dev/null | head -n 1 || true)"

          if [ -z "$artifact_id" ]; then
            echo "[CodeMap] previous tracker artifact not found; starting with empty verified learning"
            exit 0
          fi

          curl -fsSL             -H "Authorization: Bearer ${GH_TOKEN}"             -H 'Accept: application/vnd.github+json'             -H 'X-GitHub-Api-Version: 2026-03-10'             "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}/zip"             -o /tmp/market-ai-previous.zip
          unzip -q /tmp/market-ai-previous.zip -d /tmp/market-ai-previous

          previous_state="$(find /tmp/market-ai-previous -type f -name MARKET_AI_TRACKER_STATE.json -print -quit)"
          if [ -z "$previous_state" ]; then
            echo "[CodeMap] artifact has no state file; starting with empty verified learning"
            exit 0
          fi

          python market_ai_auto_tracker.py             --restore-code-map-learning-from "$previous_state"

      - name: Restore verified neural repair learning from previous successful run
        run: python verified_neural_self_refine.py --restore-from /tmp/market-ai-previous

      - name: Build audited Graphify code map for impact analysis
        env:
          GRAPHIFY_VERSION: '0.9.53'
          GRAPHIFY_DISABLE_SELF_HEAL: '1'
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check "graphifyy==$GRAPHIFY_VERSION"
          bash GRAPHIFY_UPDATE.sh --quiet
          python GRAPHIFY_AUDIT.py --strict
          test -s graphify-out/graph.json
          test -s graphify-out/graph_audit.json

      - name: Run market AI tracker and bounded deterministic repair
        run: python market_ai_auto_tracker.py --repair --no-tests

      - name: Run Main SELFREFINE with official-source error research
        run: python main_selfrefine_gate.py --cycles 5

      - name: Run market and tracker regression suite
        run: |
          python -m unittest -v \
            test_market_ai_auto_tracker.py \
            test_market_ai_decision_engine.py \
            test_market_ai_learning_memory.py \
            test_multi_market_price_collector.py \
            test_market_reference_sources_v130.py \
            test_apply_patch_idempotency.py \
            test_selfrefine_resolution_research_v24.py \
            test_selfrefine_error_quarantine_v20.py \
            test_verified_neural_self_refine_v210.py
          python repository_integrity_guard.py
          python security_self_audit.py --no-memory --fail-on high

      - name: Learn neural repair priority only from full-regression outcomes
        run: |
          python verified_neural_self_refine.py --ingest-full-regression MAIN_SELFREFINE_VERIFIED_REPAIR_STATE.json
          python verified_neural_self_refine.py --status

      - name: Re-scan after SELFREFINE and regression
        run: python market_ai_auto_tracker.py --no-tests

      - name: Enforce repair changed-file allowlist
        run: python market_ai_auto_tracker.py --assert-safe-diff

      - name: Promote code-map learning only after full regression
        run: python market_ai_auto_tracker.py --promote-code-map-learning --verified-regression

      - name: Record repair candidate paths
        id: changes
        shell: bash
        run: |
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "paths=" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            {
              echo "paths<<EOF"
              git diff --name-only
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Commit fully verified bounded repair
        if: steps.changes.outputs.changed == 'true' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -u
          git commit -m 'selfheal: verified market AI tracker repair'
          git push origin HEAD:main

      - name: Request Pages rebuild when browser integration changed
        if: steps.changes.outputs.changed == 'true' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && contains(steps.changes.outputs.paths, 'index.html')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api --method POST \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2026-03-10' \
            "repos/${GITHUB_REPOSITORY}/pages/builds"

      - name: Re-dispatch Main SELFREFINE against persisted repair
        if: steps.changes.outputs.changed == 'true' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run selfrefine-full-repo.yml --ref main

      - name: Upload tracker evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: market-ai-auto-tracker
          path: |
            MARKET_AI_TRACKER_REPORT.json
            MARKET_AI_TRACKER_STATE.json
            graphify-out/graph_audit.json
            MAIN_SELFREFINE_ERROR_LEDGER.json
            MAIN_SELFREFINE_RESEARCH_REPORT.json
            VERIFIED_NEURAL_REPAIR_LABELS.json
            VERIFIED_NEURAL_REPAIR_LABELS.json.bak
            VERIFIED_NEURAL_REPAIR_MODEL.json
            VERIFIED_NEURAL_REPAIR_MODEL.json.bak
            VERIFIED_NEURAL_REPAIR_REPORT.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Write concise job summary
        if: always()
        shell: bash
        run: |
          {
            echo '## Market AI Auto Tracker'
            echo
            echo "- commit: ${GITHUB_SHA}"
            echo "- event: ${{ github.event_name }}"
            echo "- bounded repair changed files: ${{ steps.changes.outputs.changed || 'unknown' }}"
            echo "- Graphify code map: built + audited before tracking"
            echo "- evidence decision engine: two-pass fail-closed verification enabled"
            echo "- verified-outcome learning memory: calibration + drift + recurrence guards enabled"
            echo "- learned confidence may only decrease/cap raw confidence, never inflate it"
            echo "- unverified history excluded from calibration memory"
            echo "- peer verified auto-promotion: disabled"
            echo "- completed-sale/market-reference promotion: blocked"
            echo "- code-map learning: pending first, promoted only after full regression + safe diff"
            echo "- code-map learning persistence: previous verified state restored when available; pending state never restored"
            echo "- code-map self-correction: repeated verified misses become bounded impact overlays"
            echo "- code-map confidence: calibrated downward when verified prediction hit-rate is weak"
            echo "- code-map generations: old overlays are disabled until re-verified on the new map"
            echo "- code-map learning: identical outcomes are de-duplicated within each run"
            echo "- code-map overlays: bounded quota keeps verified corrections from being truncated"
            echo "- impact ranking: distance + hub penalty + critical-runtime + verified history"
            echo "- 403/429 bypass: disabled"
            echo "- search/error text -> source patch: disabled"
            echo "- verified neural repair ranking: full-regression labels only; minimum 1,000 independent labels"
            echo "- neural hidden sizes: 4/8/12 compared; holdout gate required before activation"
            echo "- neural output: allowlisted repair priority only; patch generation and git writes disabled"
            echo "- publish gate: targeted regression + repository integrity + security audit + safe-diff allowlist"
          } >> "$GITHUB_STEP_SUMMARY"
