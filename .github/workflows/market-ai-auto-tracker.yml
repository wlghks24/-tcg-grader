name: Market AI Auto Tracker

on:
  push:
    branches: [main]
    paths:
      - 'market_ai_auto_tracker.py'
      - 'test_market_ai_auto_tracker.py'
      - 'multi_market_price_collector.py'
      - 'multi_market_prices.js'
      - 'multi_market_prices.css'
      - 'market_prices.json'
      - 'market_watch.json'
      - 'tcg_updater.py'
      - 'index.html'
      - 'main_selfrefine_gate.py'
      - 'selfrefine_*.py'
      - 'verified_code_repair_rules.py'
      - '.github/workflows/market-ai-auto-tracker.yml'
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write
  pages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  track-repair-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 2

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'

      - name: Run market AI tracker and bounded deterministic repair
        run: python market_ai_auto_tracker.py --repair --no-tests

      - name: Run Main SELFREFINE with official-source error research
        run: python main_selfrefine_gate.py --cycles 5

      - name: Run market and tracker regression suite
        run: |
          python -m unittest -v             test_market_ai_auto_tracker.py             test_multi_market_price_collector.py             test_market_reference_sources_v130.py             test_apply_patch_idempotency.py             test_selfrefine_resolution_research_v24.py             test_selfrefine_error_quarantine_v20.py
          python repository_integrity_guard.py
          python security_self_audit.py --no-memory --fail-on high

      - name: Re-scan after SELFREFINE and regression
        run: python market_ai_auto_tracker.py --no-tests

      - name: Enforce repair changed-file allowlist
        run: python market_ai_auto_tracker.py --assert-safe-diff

      - name: Record repair candidate paths
        id: changes
        shell: bash
        run: |
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "paths=" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            {
              echo "paths<<EOF"
              git diff --name-only
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Commit fully verified bounded repair
        if: steps.changes.outputs.changed == 'true' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -u
          git commit -m 'selfheal: verified market AI tracker repair'
          git push origin HEAD:main

      - name: Request Pages rebuild when browser integration changed
        if: steps.changes.outputs.changed == 'true' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && contains(steps.changes.outputs.paths, 'index.html')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api --method POST             -H 'Accept: application/vnd.github+json'             -H 'X-GitHub-Api-Version: 2026-03-10'             "repos/${GITHUB_REPOSITORY}/pages/builds"

      - name: Re-dispatch Main SELFREFINE against persisted repair
        if: steps.changes.outputs.changed == 'true' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run selfrefine-full-repo.yml --ref main

      - name: Upload tracker evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: market-ai-auto-tracker
          path: |
            MARKET_AI_TRACKER_REPORT.json
            MARKET_AI_TRACKER_STATE.json
            MAIN_SELFREFINE_ERROR_LEDGER.json
            MAIN_SELFREFINE_RESEARCH_REPORT.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Write concise job summary
        if: always()
        shell: bash
        run: |
          {
            echo '## Market AI Auto Tracker'
            echo
            echo "- commit: ${GITHUB_SHA}"
            echo "- event: ${{ github.event_name }}"
            echo "- bounded repair changed files: ${{ steps.changes.outputs.changed || 'unknown' }}"
            echo "- 403/429 bypass: disabled"
            echo "- search/error text -> source patch: disabled"
            echo "- publish gate: targeted regression + repository integrity + security audit + safe-diff allowlist"
          } >> "$GITHUB_STEP_SUMMARY"
