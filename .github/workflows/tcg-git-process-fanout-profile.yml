name: TCG Git Process Fanout Diagnostic

on:
  pull_request:
    paths:
      - 'execution/diagnostics/git_subprocess_profile.py'
      - 'execution/tests/test_git_subprocess_profile.py'
      - 'execution/hot_evidence_successor_v1019.py'
      - 'execution/hot_game_collision_successor_v1033.py'
      - 'execution/tests/test_hot_evidence_v1019.py'
      - '.github/workflows/tcg-git-process-fanout-profile.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  count-git-processes:
    name: Profile unchanged V383 Git command families
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Assert exact checked-out PR HEAD
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test -n "$EXPECTED_SHA"
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Install unchanged historical test dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Validate read-only process observer
        run: python -m unittest -v execution.tests.test_git_subprocess_profile
      - name: Check fixed-SHA readthrough and live HOT tamper regressions
        run: python -m unittest -v execution.tests.test_hot_evidence_v1019
      - name: Measure V383 Git fanout (preserve original assertions and failure)
        run: timeout 12m python -m execution.diagnostics.git_subprocess_profile --case v383
