name: V977 Tablet Writer Inventory Offline Guard
on:
  push:
    branches:
      - 'fix/v977-*'
  pull_request:
    paths:
      - 'execution/tablet_device_writer_inventory_v977.py'
      - 'execution/tests/test_tablet_device_writer_inventory_v977.py'
      - 'execution/tablet_boot_maintenance_preflight_v977.py'
      - 'execution/tests/test_tablet_boot_maintenance_preflight_v977.py'
      - 'execution/tablet_backup_coverage_v977.py'
      - 'execution/tests/test_tablet_backup_coverage_v977.py'
      - '.github/workflows/v977-tablet-writer-inventory-guard.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'
      - name: Compile read-only inventory
        run: python -m py_compile execution/tablet_device_writer_inventory_v977.py execution/tests/test_tablet_device_writer_inventory_v977.py execution/tablet_boot_maintenance_preflight_v977.py execution/tests/test_tablet_boot_maintenance_preflight_v977.py execution/tablet_backup_coverage_v977.py execution/tests/test_tablet_backup_coverage_v977.py
      - name: Fake procfs tests
        run: python -m unittest execution.tests.test_tablet_device_writer_inventory_v977 execution.tests.test_tablet_boot_maintenance_preflight_v977 execution.tests.test_tablet_backup_coverage_v977 -v
