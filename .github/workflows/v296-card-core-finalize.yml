name: V296 Card Core Finalize

on:
  push:
    branches:
      - audit/card-core-provenance-runtime-v296

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Apply v296 card-core hardening
        run: python apply_card_core_provenance_v296.py

      - name: Syntax and focused regressions
        run: |
          python -m py_compile card_grading_valuation.py tcg_updater.py update_market_prices.py collection_verification_gate.py tablet_runtime_manifest.py test_card_core_provenance_v296.py
          python test_card_core_provenance_v296.py
          python test_card_core_crosscheck_v295.py
          python test_card_core_crosscheck_v292.py
          python test_card_core_crosscheck_v291.py
          python test_psa_probability_market_flow_v252.py
          node verify_v99_browser_accuracy.js
          python verify_v99_cross_runtime.py
          python tablet_runtime_manifest.py --check --compile
          python feature_contract.py

      - name: Related collection and runtime regressions
        run: |
          python -m unittest -v test_collection_verification_gate.py
          python test_grading_runtime_fallback_v256.py
          python test_tablet_runtime_manifest_ui_assets_v254.py
          python test_current_runtime_verifier_v295.py

      - name: Remove transient patch machinery
        run: |
          git rm -- .github/workflows/v296-card-core-finalize.yml apply_card_core_provenance_v296.py

      - name: Regenerate exact final integrity manifest
        run: |
          python - <<'PY'
          from pathlib import Path
          import fault_injection_healing as h
          root=Path('.').resolve()
          h.build_integrity_manifest(root, root/'integrity_manifest.json')
          report=h.diagnose_integrity(root, root/'integrity_manifest.json')
          assert report['ok'] and report['failed']==0, report
          print({'ok':report['ok'],'checked':report['checked'],'failed':report['failed']})
          PY
          git add -- integrity_manifest.json
          git diff --check

      - name: Commit clean validated v296 tree
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- card_grading_valuation.py tcg_updater.py update_market_prices.py market_prices.json collection_verification_gate.py tablet_runtime_manifest.py test_card_core_provenance_v296.py integrity_manifest.json
          git add -u
          git commit -m 'Require exact-grade price provenance and fail closed FX/runtime card core (v296)'
          git push origin HEAD:audit/card-core-provenance-runtime-v296
