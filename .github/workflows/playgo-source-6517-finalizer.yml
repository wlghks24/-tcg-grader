name: Finalize PLAYGO official source repair

on:
  push:
    branches:
      - fix/playgo-source-6517-20260928

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Apply official source migration
        run: python apply_playgo_event_data_sync.py
      - name: Verify PLAYGO regression
        run: |
          python -m py_compile update_promo_events.py apply_playgo_event_data_sync.py
          python -m unittest -v test_playgo_event_watch.py
          grep -q 'events/view.do?brdno=6517' update_promo_events.py
          ! grep -q 'topics/view.do?brdno=6516' update_promo_events.py
      - name: Remove one-shot workflow and rebuild integrity manifest
        run: |
          rm .github/workflows/playgo-source-6517-finalizer.yml
          python static_integrity_manifest.py --write integrity_manifest.json
          python static_integrity_manifest.py --check integrity_manifest.json
      - name: Commit finalized tree
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'fix: use reachable PLAYGO official event source'
          git push origin HEAD:fix/playgo-source-6517-20260928
