name: Apply Source Gap Taxonomy V6

on:
  push:
    branches: [selfrefine/source-gap-learning-v6]
    paths:
      - '.github/workflows/apply-source-gap-taxonomy-v6.yml'

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: selfrefine/source-gap-learning-v6
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Patch missing source and topic coverage
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'{path}: expected block not found: {old[:120]!r}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          # provider health: expand 90 -> 117 verified-gap cells.
          replace_once('provider_health_learning.py',
              'TOPICS = ("event", "tournament", "popup", "promo", "collab", "movie", "release", "reprint", "merch", "anniversary")',
              'TOPICS = ("event", "tournament", "popup", "promo", "collab", "movie", "release", "reprint", "merch", "anniversary", "stock", "entry", "broadcast")')
          replace_once('provider_health_learning.py', '''_TOPIC_RULES = (\n    ("movie", re.compile(r"영화|극장판|개봉|movie|film|cinema|映画|劇場版|上映", re.I)),\n    ("anniversary", re.compile(r"기념|주년|anniversary|周年|記念", re.I)),\n    ("merch", re.compile(r"굿즈|점프샵|JUMP SHOP|official shop|merch|グッズ|ショップ", re.I)),\n    ("popup", re.compile(r"팝업|pop[- ]?up|ポップアップ", re.I)),\n    ("tournament", re.compile(r"대회|리그|championship|tournament|大会|リーグ|battle|배틀", re.I)),\n    ("reprint", re.compile(r"재발매|재판|재출시|추가생산|재입고|reprint|re-release|restock|再販|再版|再入荷", re.I)),\n    ("release", re.compile(r"신제품|신탄|부스터|스타터|출시|발매|release|new set|booster|starter|発売|新商品|新弾", re.I)),\n    ("promo", re.compile(r"프로모|증정|배포|특전|응모|promo|giveaway|distribution|キャンペーン|配布|特典", re.I)),\n    ("collab", re.compile(r"콜라보|협업|collab|collaboration|partnership|コラボ|タイアップ", re.I)),\n)''', '''_TOPIC_RULES = (\n    ("movie", re.compile(r"영화|극장판|개봉|movie|film|cinema|映画|劇場版|上映", re.I)),\n    ("broadcast", re.compile(r"라이브|생방송|방송|스트리밍|시청|twitch\\s*drops?|live[ -]?stream|broadcast|streaming|watch\\s+live|redeem|redemption|ライブ配信|生配信|配信|視聴|Twitch|ドロップ|コード|シリアルコード", re.I)),\n    ("anniversary", re.compile(r"기념|주년|anniversary|周年|記念", re.I)),\n    ("merch", re.compile(r"굿즈|점프샵|JUMP SHOP|official shop|merch|グッズ|ショップ", re.I)),\n    ("popup", re.compile(r"팝업|pop[- ]?up|ポップアップ", re.I)),\n    ("entry", re.compile(r"응모|신청|접수|등록|추첨|당첨|엔트리|사전신청|entry|application|apply|registration|register|lottery|drawing|sign[- ]?up|応募|申込|申し込み|受付|登録|抽選|当選|エントリー|事前応募", re.I)),\n    ("tournament", re.compile(r"대회|리그|championship|tournament|大会|リーグ|battle|배틀", re.I)),\n    ("stock", re.compile(r"재입고|입고|재고|품절|구매처|restock|in stock|sold out|availability|retailer|再入荷|入荷|在庫|売り切れ|販売店舗", re.I)),\n    ("reprint", re.compile(r"재발매|재판|재출시|추가생산|복각|reprint|re-release|additional print|rerun|再販|再版|復刻|追加生産", re.I)),\n    ("release", re.compile(r"신제품|신탄|부스터|스타터|출시|발매|release|new set|booster|starter|発売|新商品|新弾", re.I)),\n    ("promo", re.compile(r"프로모|증정|배포|특전|캠페인|promo|giveaway|distribution|campaign|キャンペーン|配布|特典|プレゼント", re.I)),\n    ("collab", re.compile(r"콜라보|협업|collab|collaboration|partnership|コラボ|タイアップ", re.I)),\n)''')
          replace_once('provider_health_learning.py', '        "version": 2,', '        "version": 3,')
          replace_once('provider_health_learning.py', '        "version": 2,\n        "runs": _num(data.get("runs")),', '        "version": 3,\n        "runs": _num(data.get("runs")),')
          replace_once('provider_health_learning.py', '''        priority = round(\n            miss_streak * 4.0\n            + verification_gap_streak * 2.0\n            + discovery_gap_streak\n            + min(3.0, _num(stat.get("misses")) * 0.08),\n            3,\n        )''', '''        topic = key.rsplit("/", 1)[-1]\n        urgency = {"entry": 3.0, "broadcast": 3.0, "stock": 2.0}.get(topic, 0.0)\n        priority = round(\n            miss_streak * 4.0\n            + verification_gap_streak * 2.0\n            + discovery_gap_streak\n            + min(3.0, _num(stat.get("misses")) * 0.08)\n            + urgency,\n            3,\n        )''')

          # route diversity: track stock, entry/application and broadcast/reward separately.
          for old, new in (
              ('        "stock": "재입고 입고 판매 자판기 재고 품절 구매처",', '        "stock": "재입고 입고 판매 자판기 재고 품절 구매처",\n        "entry": "응모 신청 접수 등록 추첨 당첨 참가신청 사전신청 엔트리",\n        "broadcast": "라이브 생방송 방송 스트리밍 시청 트위치 Twitch 드롭 드롭스 코드 교환 리딤",'),
              ('        "stock": "再入荷 入荷 在庫 売り切れ 販売 店舗",', '        "stock": "再入荷 入荷 在庫 売り切れ 販売 店舗",\n        "entry": "応募 申込 申し込み 受付 登録 抽選 当選 エントリー 事前応募",\n        "broadcast": "ライブ ライブ配信 生配信 配信 視聴 Twitch ドロップ コード シリアルコード",'),
