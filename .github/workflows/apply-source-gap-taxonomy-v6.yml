          replace_once('social_event_discovery.py', '''    ("promo", re.compile(r"프로모|증정|이벤트|행사|대회|배틀|예약|발매|출시|포토카드|promo|event|campaign|tournament|battle|release|preorder|キャンペーン|イベント|大会|発売|予約", re.I)),''', '''    ("promo", re.compile(r"프로모|증정|이벤트|행사|대회|배틀|예약|발매|출시|재입고|재고|품절|응모|신청|등록|추첨|당첨|라이브|생방송|스트리밍|시청|코드|포토카드|promo|event|campaign|tournament|battle|release|preorder|restock|sold out|entry|application|registration|lottery|livestream|broadcast|streaming|twitch drops|redeem|code|キャンペーン|イベント|大会|発売|予約|再入荷|在庫|売り切れ|応募|申込|登録|抽選|当選|ライブ配信|生配信|配信|視聴|ドロップ|コード|プレゼント", re.I)),''')
          replace_once('social_event_discovery.py', '''    "twitch.tv", "www.twitch.tv",\n}''', '''    "twitch.tv", "www.twitch.tv",\n    "facebook.com", "www.facebook.com", "m.facebook.com",\n}''')
