name: Apply strict manual proof v193

on:
  push:
    branches: [main]
    paths:
      - 'apply_strict_manual_proof_v193.py'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependency
        run: python -m pip install pillow
      - name: Apply strict manual proof patch
        run: python apply_strict_manual_proof_v193.py
      - name: Verify strict manual flow
        run: |
          python test_psa_official_proof_grade_v187.py
          python test_manual_only_official_verification_v192.py
          python test_manual_official_proof.py
          python -m py_compile manual_official_proof.py grading_cert_verifier.py manual_graded_photo_registration.py graded_photo_multi_source.py
          node --check manual_official_verify_bridge.js
          git diff --check
      - name: Commit runtime changes
        run: |
          if git diff --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add manual_official_proof.py manual_official_verify_bridge.js test_manual_official_proof.py test_manual_only_official_verification_v192.py
          git commit -m 'fix: require official screenshot grade for manual verification v193'
          git push
