name: Apply manual-only official verification v192b

on:
  push:
    branches: [main]
    paths:
      - 'apply_manual_only_official_verification_v192b.py'
      - '.github/workflows/apply-manual-only-official-verification-v192b.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install test dependency
        run: python -m pip install pillow
      - name: Apply v192b patch
        run: python apply_manual_only_official_verification_v192b.py
      - name: Verify manual proof behavior
        run: |
          python -m py_compile manual_official_proof.py test_manual_official_proof.py
          python test_manual_official_proof.py
          python test_manual_only_official_verification_v192.py
          git diff --check
      - name: Commit v192b runtime change
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add manual_official_proof.py test_manual_official_proof.py
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'fix: align manual proof policy metadata v192'
          git push origin HEAD:main
