name: Apply manual-only official verification v192b

# Legacy integrated feature: automatic source mutation is disabled; run manually only.
on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write
  checks: read

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Install test dependency
        run: python -m pip install pillow
      - name: Apply v192b patch
        run: python apply_manual_only_official_verification_v192b.py
      - name: Verify manual proof behavior
        run: |
          python -m py_compile manual_official_proof.py test_manual_official_proof.py
          python test_manual_official_proof.py
          python test_manual_only_official_verification_v192.py
          git diff --check
      - name: Commit v192b runtime change
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add manual_official_proof.py test_manual_official_proof.py
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'fix: align manual proof policy metadata v192'
          GH_TOKEN="${{ github.token }}" bash scripts/publish_candidate_pr.sh
