name: Instagram TCG Content SELFREFINE

on:
  pull_request:
    paths:
      - 'instagram_tcg_content/**'
      - 'ai_reliability_v8/**'
      - 'shared_self_learning/**'
      - 'TCG_CROSSCHECK/IG_CARDINFO/**'
      - 'selfrefine_domain_boundary_guard.py'
      - 'test_instagram_verification_scope_policy_v210.py'
      - '.github/workflows/instagram-tcg-selfrefine.yml'
  push:
    branches: [main]
    paths:
      - 'instagram_tcg_content/**'
      - 'ai_reliability_v8/**'
      - 'shared_self_learning/**'
      - 'TCG_CROSSCHECK/IG_CARDINFO/**'
      - 'selfrefine_domain_boundary_guard.py'
      - 'test_instagram_verification_scope_policy_v210.py'
      - '.github/workflows/instagram-tcg-selfrefine.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  content-selfrefine:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'

      - name: Enforce Instagram isolation from retired card-price analysis
        run: |
          python selfrefine_domain_boundary_guard.py
          python -m unittest -v instagram_tcg_content.test_state_isolation_v18

      - name: Verify Instagram-local source evidence before production
        run: |
          python -m instagram_tcg_content.test_source_verification_engine
          python -m instagram_tcg_content.test_source_route_resilience
          python -m instagram_tcg_content.persisted_crosscheck_export --self-test
          python -m instagram_tcg_content.collection_health --self-test
          python -m unittest -v instagram_tcg_content.test_collection_health
          python -m instagram_tcg_content.ai_reliability_runtime --self-test
          python -m unittest -v instagram_tcg_content.test_ai_reliability_runtime
          python -m instagram_tcg_content.cardinfo_quality_learning --self-test
          python -m unittest -v instagram_tcg_content.test_cardinfo_quality_learning
          python -m unittest -v test_instagram_verification_scope_policy_v210
          python -m json.tool instagram_tcg_content/source_routes.json >/dev/null
          python -m json.tool instagram_tcg_content/verification_scope_policy.json >/dev/null

      - name: Verify run packet, production state, and pause safety
        run: |
          python -m instagram_tcg_content.test_live_packet_guards
          python -m instagram_tcg_content.test_production_state
          python -m instagram_tcg_content.automation_state_guard --self-test
          python -m unittest -v instagram_tcg_content.test_automation_pause_recovery_v30

      - name: Run Instagram-only SELFREFINE
        run: python -m instagram_tcg_content.selfrefine_gate

      - name: Upload Instagram TCG SELFREFINE ledger
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: instagram-tcg-selfrefine-error-ledger
          path: INSTAGRAM_TCG_SELFREFINE_ERROR_LEDGER.json
          if-no-files-found: ignore
