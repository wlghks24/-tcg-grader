name: GPT Drive Package Kick v350

on:
  push:
    branches: [main]
    paths-ignore:
      - 'releases.json'
      - 'promo_events.json'
      - 'supplementary_candidates.json'
      - 'social_event_candidates.json'
      - 'purchase_signals.json'
      - 'social_stock_signals.json'
      - 'market_prices.json'
      - 'market_watch.json'
      - 'purchase_sources.json'
      - 'exchange_rates.json'
      - 'grading_company_updates.json'
      - 'graded_photo_candidates.json'
      - 'source_collection_stats.json'
      - 'adaptive_collection_stats.json'
      - 'auto_update_report.json'
      - 'auto_update_issues.json'
      - 'tcg_live_data.json'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: gpt-drive-package-kick-v350
  cancel-in-progress: true

jobs:
  dispatch-package:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Dispatch Drive package on exact latest main
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/gpt-tcg-drive-package.yml/dispatches" \
            -f ref=main
          echo "Dispatched GPT TCG Drive Package for latest main ${GITHUB_SHA}."
