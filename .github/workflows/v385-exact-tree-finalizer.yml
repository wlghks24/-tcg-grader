name: V385 Exact Tree Finalizer

on:
  push:
    branches:
      - feature/tablet-autonomous-evolution-v385

permissions:
  contents: write

concurrency:
  group: v385-exact-tree-finalizer
  cancel-in-progress: true

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Remove one-shot finalizer from final tree
        shell: bash
        run: |
          set -euo pipefail
          git rm -- .github/workflows/v385-exact-tree-finalizer.yml
      - name: Compile and self-test V385
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile tablet_autonomous_evolution_v385.py test_tablet_autonomous_evolution_v385.py test_tablet_gpt_tcg_grader_sync_v384.py sync_v376_successor_test_support.py
          python tablet_autonomous_evolution_v385.py --self-test
          python -m unittest -v test_tablet_autonomous_evolution_v385.py
      - name: Verify exact Tablet GPT sync chain
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest -v             test_tablet_gpt_tcg_grader_sync_v376.py             test_tablet_gpt_tcg_grader_sync_v377.py             test_tablet_gpt_tcg_grader_sync_v378.py             test_tablet_gpt_tcg_grader_sync_v379.py             test_tablet_gpt_tcg_grader_sync_v380.py             test_tablet_gpt_tcg_grader_sync_v381.py             test_tablet_gpt_tcg_grader_sync_v382.py             test_tablet_gpt_tcg_grader_sync_v383.py             test_tablet_gpt_tcg_grader_sync_v384.py
      - name: Verify tablet runtime and quality policy
        shell: bash
        run: |
          set -euo pipefail
          python tablet_runtime_manifest.py --check --compile
          python quality_review_policy.py --check
      - name: Rebuild exact integrity manifest
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import fault_injection_healing as healing
          root = Path('.').resolve()
          healing.build_integrity_manifest(root, root / 'integrity_manifest.json')
          PY
          python repository_integrity_guard.py
      - name: Confirm final tree and commit
        shell: bash
        run: |
          set -euo pipefail
          git status --short
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "chore: finalize V385 exact tree and integrity manifest"
          git push origin HEAD:feature/tablet-autonomous-evolution-v385
