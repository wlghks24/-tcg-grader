name: Fix v207 Workflow Quote
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-v207-workflow-quote.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Fix generated Python quote
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/apply-release-parser-recovery-v207.yml')
          s=p.read_text(encoding='utf-8')
          old='    return title.strip(" \\\\t\\\\r\\\\n「」『』\\\\\\\"")'
          new='    return title.strip().strip(\'「」『』"\')'
          if old not in s:
              raise SystemExit('quote marker not found')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/apply-release-parser-recovery-v207.yml
          git commit -m 'fix: correct v207 generated parser quote'
          git push origin HEAD:main
