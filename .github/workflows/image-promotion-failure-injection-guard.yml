name: Advisory Model Promotion Failure Injection
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: image-promotion-failure-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  fail-closed:
    name: Image Advisory Crash and Rollback Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      PYTHONPATH: ${{ github.workspace }}
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Test real safe_runtime atomic-write and promotion failure paths
        run: |
          python -m unittest -v execution.tests.test_image_promotion_failure_injection
