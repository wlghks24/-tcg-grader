name: Apply eight-job guidance v219

on:
  workflow_dispatch:
  push:
    branches:
      - fix/update-guidance-eight-jobs-v219
    paths:
      - .github/workflows/apply-eight-job-guidance-v219.yml

permissions:
  contents: write

jobs:
  apply-and-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/update-guidance-eight-jobs-v219
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'
      - name: Correct stale seven-job guidance
        run: |
          python - <<'PY'
          from pathlib import Path
          replacements = {
              'index.html': (
                  ('출시·재발매·시세·행사·구매처·환율·등급사진 7단계', '출시·재발매·시세·행사·구매처·환율·감정업체·등급사진 8단계'),
                  ('서버 백그라운드 7단계 수집 완료', '서버 백그라운드 8단계 수집 완료'),
              ),
              'START_TCG_UPDATER_ANDROID.sh': (
                  ('모든 7개 핵심수집+통합+링크감사 유지', '모든 8개 핵심수집+통합+링크감사 유지'),
              ),
              'README_v31.md': (
                  ('자료 7단계 업데이트', '자료 8단계 업데이트'),
              ),
          }
          for name, pairs in replacements.items():
              path = Path(name)
              text = path.read_text(encoding='utf-8')
              for old, new in pairs:
                  if old not in text:
                      raise SystemExit(f'missing expected stale text in {name}: {old}')
                  text = text.replace(old, new)
              path.write_text(text, encoding='utf-8')
          PY
      - name: Refresh CSP hashes
        run: python csp_hash_hardening.py
      - name: Verify focused eight-job contract
        run: |
          python -m unittest -v test_update_guidance_consistency_v218.py test_collection_job_contract_v255.py test_grading_watch_integration_v220.py test_csp_hash_hardening.py
          python csp_hash_hardening.py --check
          python feature_contract.py
          git diff --check
      - name: Persist verified correction
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html START_TCG_UPDATER_ANDROID.sh README_v31.md
          git commit -m 'fix: align update guidance with eight-job collection contract'
          git push origin HEAD:fix/update-guidance-eight-jobs-v219
      - name: Full tablet guard
        run: bash VERIFY_TABLET_FINAL.sh
