name: Release Parser Guard
on:
  push:
    branches: [main]
    paths:
      - 'update_releases.py'
      - 'release_history_backfill.py'
      - 'release_parser_learning.py'
      - 'test_release_history_coverage_v4.py'
      - 'test_release_parser_learning.py'
      - 'test_update_releases_parser_recovery.py'
      - 'safe_runtime.py'
      - '.github/workflows/release-parser-guard.yml'
  pull_request:
    paths:
      - 'update_releases.py'
      - 'release_history_backfill.py'
      - 'release_parser_learning.py'
      - 'test_release_history_coverage_v4.py'
      - 'test_release_parser_learning.py'
      - 'test_update_releases_parser_recovery.py'
      - 'safe_runtime.py'
      - '.github/workflows/release-parser-guard.yml'
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'
      - name: Compile release modules
        run: python -m py_compile update_releases.py release_history_backfill.py release_parser_learning.py safe_runtime.py
      - name: Run bounded release regression tests
        run: python -m unittest -v test_release_history_coverage_v4.py test_release_parser_learning.py test_update_releases_parser_recovery.py
      - name: Live official-source smoke test
        env:
          TCG_HTTP_TIMEOUT: '30'
        run: |
          python - <<'PY'
          import tempfile
          from pathlib import Path
          import update_releases as u
          import release_history_backfill as h

          u.PARSER_MEMORY = Path(tempfile.mkdtemp()) / 'release_parser_learning.json'
          u.PARSER_RUN_EVENTS.clear()
          rows = u.collect_pokemon_jp()
          assert rows, 'Pokémon JP: every verified parser/transport strategy returned zero rows'
          assert all(r.get('source','').startswith('https://www.pokemon-card.com/') for r in rows), rows[:3]
          assert all(r.get('release_date') and r.get('price') for r in rows), rows[:3]
          summary = u.parser_public_summary(
              u.PARSER_MEMORY,
              {'Pokémon JP': u.POKEMON_JP_STRATEGIES},
          )
          preferred = summary.get('sources',{}).get('Pokémon JP',{}).get('preferred_strategy')
          assert preferred in u.POKEMON_JP_STRATEGIES, summary

          # The matrix itself is a structural contract. Empty cells are allowed
          # when a country-specific release has not been officially confirmed.
          matrix = h.coverage_progress([])
          assert matrix['expected_cells'] == 9, matrix
          assert matrix['configured_cells'] == 9, matrix
          assert len(matrix['missing_verified_cells']) == 9, matrix
          print('pokemon_jp_rows=', len(rows))
          print('parser_events=', u.PARSER_RUN_EVENTS)
          print('preferred=', preferred)
          print('release_matrix=', matrix)
          PY
