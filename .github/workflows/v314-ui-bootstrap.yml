name: V314 UI Bootstrap

on:
  push:
    branches: [ui-v314-premium-clarity]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ui-v314-premium-clarity
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Apply v314 clarity patch
        shell: bash
        run: |
          python v314_ui_patch.py
          python -m pip install -q pytest
          python -m pytest -q \
            test_ui_app_shell_v272.py \
            test_feature_category_navigation_v26.py \
            test_tablet_app_dock_v275.py \
            test_tablet_runtime_manifest_ui_assets_v254.py
          git diff --check origin/main...HEAD
          python - <<'PY'
          from pathlib import Path
          css=Path('ui_app_shell_v272.css').read_text(encoding='utf-8')
          assert '/* v314 premium-clarity UI refinement.' in css
          assert css.count('{') == css.count('}')
          for bad in ('rgba(15,23,42,.045(!important', "content:'선택남'", "' important;", '1fr)mportant'):
              assert bad not in css, bad
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add ui_app_shell_v272.css
          if git diff --cached --quiet; then
            echo 'No UI changes needed'
          else
            git commit -m 'ui: refine premium clarity and hierarchy v314'
            git push origin HEAD:ui-v314-premium-clarity
          fi
