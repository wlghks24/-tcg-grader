name: TCG W401–W500 Pinned Historical Source Audit

# Only read historical blobs; does not invoke the original V413 source collector.
on:
  pull_request:
    paths:
      - 'execution/historical_v401_v500_forensics.py'
      - 'execution/tests/test_historical_v401_v500_forensics.py'
      - 'docs/tablet/W401_V413_V489_EVIDENCE_LIMITS.md'
      - 'execution/evidence/W401_V413_V489_FINDINGS_DELTA.json'
      - '.github/workflows/tcg-w401-pinned-source.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  w401-source:
    name: Seven selected V413–V489 source-to-test forensic records
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'
      - name: Syntax-check audited independent tools
        run: python -m py_compile execution/historical_v401_v500_forensics.py execution/tests/test_historical_v401_v500_forensics.py
      - name: Twenty pinned historical source, contract and gap tests
        run: python -m unittest discover -s execution/tests -p 'test_historical_v401_v500_forensics.py' -v
      - name: Produce ephemeral historical gap receipt (never upload, publish or install)
        run: |
          mkdir -p .tmp
          python execution/historical_v401_v500_forensics.py > .tmp/w401-selected-source.json
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('.tmp/w401-selected-source.json').read_text('utf-8'))
          assert d['selected_versions'] == [413,426,430,437,468,485,489]
          assert d['previous_finding_count'] == 17
          assert d['cumulative_finding_count'] == 24
          assert len(set(d['cumulative_finding_ids'])) == 24
          assert 'W401-F001' in d['previous_finding_ids']
          assert d['completed_full_version_reviews_in_w401'] == 0
          assert d['quality_score'] is None
          assert d['v426_device_verified'] is False
          for row in d['rows']:
              print('W401_SELECTED',row['version'],row['test_functions_found'],
                    row['evidence_scope'],'NOT_A_FULL_REVIEW')
          print('PASS: 17 prior + 7 append-only evidence gaps; no production or Lenovo certification')
          PY
