name: TCG GPT Drive Handoff Static Guard
on:
  pull_request:
    paths:
      - '.github/workflows/tcg-verified-gpt-drive-handoff.yml'
      - 'tests/test_tcg_verified_gpt_drive_handoff.py'
      - '.github/workflows/tcg-drive-handoff-static-guard.yml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/tcg-verified-gpt-drive-handoff.yml'
      - 'tests/test_tcg_verified_gpt_drive_handoff.py'
      - '.github/workflows/tcg-drive-handoff-static-guard.yml'
permissions:
  contents: read
jobs:
  static-qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -p 'test_tcg_verified_gpt_drive_handoff.py' -v
