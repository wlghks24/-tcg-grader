name: FX v330 Finalize

on:
  push:
    branches: [fix/fx-expiry-live-ui-v330]

permissions:
  contents: write

concurrency:
  group: fx-v330-finalize
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/fx-expiry-live-ui-v330
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Install runtime dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Repair stale regression assertions and browser harness
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          test = Path('test_edition_fx_failclosed_v328.py')
          text = test.read_text(encoding='utf-8')
          replacements = {
              "self.assertIn('let fxRates={JPY_KRW:0,USD_KRW:0},fxUpdated=\"\",fxTimestamp=\"\";',html)":
                  "self.assertIn('let fxRates={JPY_KRW:0,USD_KRW:0},fxUpdated=\"\",fxTimestamp=\"\",fxExpiryTimer=null;',html)",
              "self.assertIn('fxTimestamp=stamp;result.ok=true;',html)":
                  "self.assertIn('fxTimestamp=stamp;scheduleFxExpiry();result.ok=true;',html)",
              "self.assertIn('fxTimestamp=\"\";result.errors.push(\"환율자료\")',html)":
                  "self.assertIn('clearFxConversionDisplay();result.errors.push(\"환율자료\")',html)",
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'missing expected stale assertion: {old}')
              text = text.replace(old, new, 1)
          test.write_text(text, encoding='utf-8')

          verifier = Path('verify_browser_runtime.js')
          text = verifier.read_text(encoding='utf-8')
          state_old = '  fxTimestamp: "",\n  simpleGame: "pokemon",'
          state_new = '  fxTimestamp: "",\n  fxExpiryTimer: null,\n  simpleGame: "pokemon",'
          if state_old not in text:
              raise SystemExit('missing browser VM FX state insertion point')
          text = text.replace(state_old, state_new, 1)
          timer_old = 'scheduledFxExpiry.delay <= context.FX_MAX_AGE_MS,"fresh FX must schedule UI expiration"'
          timer_new = 'scheduledFxExpiry.delay <= context.FX_MAX_AGE_MS+context.FX_MAX_FUTURE_SKEW_MS+1,"fresh FX must schedule UI expiration"'
          if timer_old not in text:
              raise SystemExit('missing stale FX expiry timer assertion')
          text = text.replace(timer_old, timer_new, 1)
          verifier.write_text(text, encoding='utf-8')
          PY
      - name: Remove one-shot finalizer before final-tree manifest
        run: rm .github/workflows/fx-v330-finalize.yml
      - name: Targeted FX regressions
        run: |
          python -m unittest -v test_edition_fx_failclosed_v328.py
          node verify_browser_runtime.js
      - name: Regenerate final-tree integrity manifest
        run: python fault_injection_healing.py --manifest
      - name: Validate final tree
        run: |
          python fault_injection_healing.py --diagnose
          python repository_integrity_guard.py
          python verify_current_runtime.py --passes 1
          git diff --check
      - name: Commit verified final branch
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'No final changes to commit'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'test: align FX expiry regressions with live runtime'
          git push origin HEAD:fix/fx-expiry-live-ui-v330
