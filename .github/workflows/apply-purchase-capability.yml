name: Apply Purchase Capability Labels
# Legacy integrated feature: automatic source mutation is disabled; run manually only.
on:
  workflow_dispatch:

permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.x'
      - name: Apply capability patch
        run: |
          if grep -q '재고조회 지원' index.html; then
            echo 'Purchase capability labels already integrated; validation only'
          else
            python apply_purchase_capability_patch.py
          fi
      - name: Validate labels
        run: |
          grep -q '재고조회 지원' index.html
          grep -q '매장찾기·전화확인' index.html
          grep -q '출처 ${score}' index.html
      - name: Commit generated index
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'ui: distinguish stock lookup from store information'
          git push
