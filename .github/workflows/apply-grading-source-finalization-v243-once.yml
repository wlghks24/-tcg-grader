name: Apply grading source finalization v243 once

on:
  push:
    branches:
      - fix/grading-source-finalization-v243
    paths:
      - 'apply_grading_source_finalization_v243.py'
      - '.github/workflows/apply-grading-source-finalization-v243-once.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/grading-source-finalization-v243
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'
      - name: Apply exact-source patch
        run: python apply_grading_source_finalization_v243.py
      - name: Targeted regression
        run: |
          python -m py_compile grading_company_watch.py safe_runtime.py test_grading_source_transport_v243.py
          python -m unittest -v test_grading_source_transport_v243.py test_grading_company_watch_v215.py
          git diff --check
      - name: Commit isolated branch change
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add grading_company_watch.py safe_runtime.py
          if git diff --cached --quiet; then
            echo 'v243 already applied'
            exit 0
          fi
          git commit -m 'fix: classify grading source transport failures v243'
          git push origin HEAD:fix/grading-source-finalization-v243
