name: One-shot v232 official-source migration

"on":
  push:
    branches:
      - "selfrefine/fix-8stage-ssot-v230"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout bounded target branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: selfrefine/fix-8stage-ssot-v230
          fetch-depth: 0

      - name: Install repository requirements
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Apply SHA-guarded migration
        run: python v232_source_migration.py

      - name: Validate targeted contracts
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile update_promo_events.py update_releases.py update_purchase_sources.py
          python -m unittest -v \
            test_0600_operational_refresh_v25.py \
            test_collection_scope_compat_v214.py \
            test_release_history_coverage_v4.py \
            test_collection_verification_gate.py \
            test_runtime_bundle_guard_v143.py
          python feature_contract.py
          git diff --check
          if grep -R --line-number --fixed-strings '"source": "https://new.pokemonkorea.co.kr' releases.json promo_events.json; then
            echo 'legacy executable source remains in static snapshots' >&2
            exit 1
          fi

      - name: Commit bounded fix and remove one-shot files
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/v232-source-migration.yml v232_source_migration.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add update_promo_events.py update_releases.py \
            test_0600_operational_refresh_v25.py test_collection_scope_compat_v214.py \
            test_release_history_coverage_v4.py \
            releases.json purchase_sources.json promo_events.json \
            .github/workflows/v232-source-migration.yml v232_source_migration.py
          git diff --cached --check
          git commit -m "fix: preserve live Pokemon event evidence and migrate legacy release URLs"
          git push origin HEAD:selfrefine/fix-8stage-ssot-v230
