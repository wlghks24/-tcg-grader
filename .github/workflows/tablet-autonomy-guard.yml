name: Tablet Autonomy Guard

on:
  push:
    branches: [main]
    paths:
      - 'verified_autonomy_neural.py'
      - 'tablet_autonomy_engine.py'
      - 'test_tablet_autonomy_engine_v371.py'
      - 'auto_update_all.py'
      - 'ai_runtime_model_guard.py'
      - 'tablet_runtime_manifest.py'
      - 'verify_current_runtime.py'
      - '.gitignore'
      - '.github/workflows/tablet-autonomy-guard.yml'
  pull_request:
    paths:
      - 'verified_autonomy_neural.py'
      - 'tablet_autonomy_engine.py'
      - 'test_tablet_autonomy_engine_v371.py'
      - 'auto_update_all.py'
      - 'ai_runtime_model_guard.py'
      - 'tablet_runtime_manifest.py'
      - 'verify_current_runtime.py'
      - '.gitignore'
      - '.github/workflows/tablet-autonomy-guard.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tablet-autonomy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  guard:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'
      - name: Verify bounded autonomy safety and regressions
        run: |
          python -m py_compile verified_autonomy_neural.py tablet_autonomy_engine.py auto_update_all.py ai_runtime_model_guard.py tablet_runtime_manifest.py verify_current_runtime.py
          python -m unittest -v \
            test_tablet_autonomy_engine_v371.py \
            test_verified_collection_job_neural_v212.py \
            test_verified_collection_neural_v211.py \
            test_ai_runtime_model_guard_v269.py
          python tablet_runtime_manifest.py --check --compile
          python ai_runtime_model_guard.py
      - name: Recheck repository safety boundaries
        run: |
          python security_self_audit.py --no-memory --fail-on high
          python repository_integrity_guard.py
