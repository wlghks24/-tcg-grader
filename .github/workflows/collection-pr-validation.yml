name: Live Collection PR Verification
on:
  pull_request:
    paths:
      - '**/*.py'
      - '.github/workflows/**'
permissions:
  contents: read
concurrency:
  group: live-collection-pr-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify-live:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      PYTHONUNBUFFERED: '1'
      TCG_HTTP_TIMEOUT: '30'
      TCG_SOURCE_TIMEOUT_CAP: '30'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'
      - name: Compile and verify collection contracts
        run: |
          python -m pip install --disable-pip-version-check -r requirements.txt
          python -m py_compile grading_company_watch.py auto_repair_engine.py auto_update_all.py tcg_updater.py
          python -m unittest -v test_grading_watch_provenance_v233.py test_grading_watch_integration_v220.py test_static_data_publish_gate.py test_collection_verification_gate.py
      - name: Static Data Refresh
        run: python -c "import tcg_updater; tcg_updater.update_cycle('github-pages-static-refresh')"
      - name: Static publish validation without publishing
        if: ${{ !cancelled() }}
        run: python static_data_publish_gate.py --max-social-age-hours 12 --max-report-age-hours 2 --report STATIC_DATA_PUBLISH_REPORT.json
      - name: Collection Verification
        if: ${{ !cancelled() }}
        run: python collection_verification_gate.py --max-health-age-seconds 900 --fail-on-degraded --report COLLECTION_VERIFICATION_REPORT.json
      - name: Grading Company Watch
        if: ${{ !cancelled() }}
        run: |
          python grading_company_watch.py
          python - <<'PY'
          import json
          import auto_update_all
          data=json.load(open('grading_company_updates.json',encoding='utf-8'))
          auto_update_all.validate_json('grading_company_updates.json',data)
          assert data['summary']['healthy_sources'] >= 1, data['summary']
          print(json.dumps(data['summary'],ensure_ascii=False))
          PY
      - name: Explain verification findings
        if: always()
        run: |
          python - <<'PYCODE'
          import json
          from pathlib import Path
          for name in ('STATIC_DATA_PUBLISH_REPORT.json', 'COLLECTION_VERIFICATION_REPORT.json'):
              path = Path(name)
              if not path.is_file():
                  print(f'MISSING_VERIFICATION_REPORT {name}')
                  continue
              data = json.loads(path.read_text(encoding='utf-8'))
              print(json.dumps({'report': name, 'status': data.get('status'),
                                'findings': data.get('findings', [])}, ensure_ascii=False))
          path = Path('grading_company_updates.json')
          if path.is_file():
              data = json.loads(path.read_text(encoding='utf-8'))
              print(json.dumps({'grading_sources': [
                  {'id': key, 'status': row.get('status'), 'error': row.get('last_error')}
                  for key, row in data.get('sources', {}).items()]}, ensure_ascii=False))
          PYCODE
      - name: Preserve validation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: live-collection-pr-evidence
          path: |
            STATIC_DATA_PUBLISH_REPORT.json
            COLLECTION_VERIFICATION_REPORT.json
            grading_company_updates.json
            auto_update_report.json
          if-no-files-found: error
