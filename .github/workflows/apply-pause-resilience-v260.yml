name: Apply pause resilience v260
on:
  push:
    branches: [fix/pause-resilience-v260]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: apply-pause-resilience-v260
  cancel-in-progress: false
jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: fix/pause-resilience-v260
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'
      - name: Apply bounded resilience patch
        run: python apply_pause_resilience_v260.py
      - name: Compile and syntax check
        run: |
          python -m py_compile \
            tablet_runtime_manifest.py market_ai_auto_tracker.py test_market_ai_auto_tracker.py \
            tablet_runtime_qa.py test_tablet_pause_recovery_v260.py \
            test_tablet_runtime_dependency_closure_v257.py
          bash -n ANDROID_AUTO_START_INSTALL.sh
          node --check sw.js
      - name: Run pause and dependency scenarios
        run: |
          python -m unittest -v test_tablet_pause_recovery_v260.py
          python -m unittest -v test_tablet_runtime_dependency_closure_v257.py
          python -m unittest -v test_market_ai_auto_tracker.py
      - name: Remove one-shot machinery before repository-wide safety guards
        run: git rm apply_pause_resilience_v260.py .github/workflows/apply-pause-resilience-v260.yml
      - name: Run related tablet and security regressions on final tree
        run: |
          python tablet_runtime_qa.py --profile updater
          python test_tablet_runtime_qa_integration.py
          python tablet_runtime_manifest.py --check --compile
          python -m unittest -v \
            test_tablet_runtime_manifest_ui_assets_v254.py \
            test_grading_runtime_fallback_v256.py \
            test_termux_canonical_fetch_v257.py \
            test_security_hardening.py
          python main_selfrefine_gate.py --self-test
      - name: Align mutable runtime snapshots with current main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          python - <<'PY'
          import subprocess
          mutable=[
              'adaptive_collection_stats.json',
              'auto_update_issues.json',
              'auto_update_report.json',
              'exchange_rates.json',
              'graded_photo_candidates.json',
              'grading_company_updates.json',
              'market_prices.json',
              'market_watch.json',
              'promo_events.json',
              'purchase_signals.json',
              'purchase_sources.json',
              'releases.json',
              'social_event_candidates.json',
              'social_stock_signals.json',
              'source_collection_stats.json',
              'supplementary_candidates.json',
              'tcg_live_data.json',
          ]
          subprocess.run(['git','restore','--source=origin/main','--worktree','--',*mutable],check=True)
          print('aligned mutable runtime snapshots with origin/main:',len(mutable))
          PY
      - name: Refresh and diagnose integrity baseline
        run: |
          python fault_injection_healing.py --manifest
          python fault_injection_healing.py --diagnose
      - name: Verify bounded final diff
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import subprocess
          allowed={
              'ANDROID_AUTO_START_INSTALL.sh',
              '.github/workflows/android-updater-guard.yml',
              '.github/workflows/market-ai-auto-tracker.yml',
              'market_ai_auto_tracker.py',
              'sw.js',
              'tablet_runtime_manifest.py',
              'tablet_runtime_qa.py',
              'test_market_ai_auto_tracker.py',
              'test_tablet_pause_recovery_v260.py',
              'test_tablet_runtime_dependency_closure_v257.py',
              'integrity_manifest.json',
          }
          actual=set(filter(None,subprocess.check_output(['git','diff','--name-only','origin/main'],text=True).splitlines()))
          extra=actual-allowed
          required=allowed-{'integrity_manifest.json'}
          missing=required-actual
          assert not extra, f'unexpected final PR paths: {sorted(extra)}'
          assert not missing, f'missing expected final changes: {sorted(missing)}'
          assert 'apply_pause_resilience_v260.py' not in actual
          assert '.github/workflows/apply-pause-resilience-v260.yml' not in actual
          print('bounded final PR diff OK:',sorted(actual))
          PY
      - name: Commit verified patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Harden pause recovery and runtime dependency closure'
          git push origin HEAD:fix/pause-resilience-v260
