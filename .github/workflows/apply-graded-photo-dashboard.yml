name: Apply graded photo dashboard

on:
  push:
    paths:
      - 'apply_graded_photo_dashboard_patch.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          fetch-depth: 0
      - name: Apply dashboard patch
        run: python apply_graded_photo_dashboard_patch.py
      - name: Verify dashboard integration
        run: |
          python - <<'PY'
          from pathlib import Path
          idx=Path('index.html').read_text(encoding='utf-8')
          srv=Path('tcg_updater.py').read_text(encoding='utf-8')
          assert 'graded_photo_dashboard.css' in idx
          assert 'graded_photo_dashboard.js' in idx
          assert 'graded_photo_dashboard.js' in srv
          assert 'graded_photo_dashboard.css' in srv
          print('graded photo dashboard integration verified')
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html tcg_updater.py
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "feat: integrate graded photo learning dashboard"
            git push origin main
          fi
