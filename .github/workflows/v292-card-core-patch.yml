name: V292 Card Core Refresh

on:
  push:
    branches:
      - audit/card-core-v292-generation-evidence

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 2
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'
      - name: Apply bounded v292 production patch
        run: |
          set -euo pipefail
          python apply_card_core_generation_v292.py
      - name: Run generation grading market targeted regression
        run: |
          set -euo pipefail
          node --check card_identity_recognition.js
          python -m py_compile card_grading_valuation.py grading_accuracy_v99.py wyyyes_market_source.py test_card_core_crosscheck_v291.py test_card_core_crosscheck_v292.py
          python -m unittest -v test_card_core_crosscheck_v291.py test_card_core_crosscheck_v292.py
          node verify_pokemon_generation_runtime.js
          node verify_v99_browser_accuracy.js
          python verify_v99_cross_runtime.py
          python -m unittest -v test_psa_probability_market_flow_v252.py test_wyyyes_market_source_v267.py
      - name: Remove temporary tooling and regenerate exact manifest
        shell: bash
        run: |
          set -euo pipefail
          rm -f apply_card_core_generation_v292.py .github/workflows/v292-card-core-patch.yml
          python fault_injection_healing.py --manifest
          python fault_injection_healing.py --diagnose
          git add -A -- card_identity_recognition.js test_card_core_crosscheck_v292.py integrity_manifest.json apply_card_core_generation_v292.py .github/workflows/v292-card-core-patch.yml
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Harden generation evidence and region refresh v292'
          git push origin HEAD:audit/card-core-v292-generation-evidence
