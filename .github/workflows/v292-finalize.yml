name: v292 Finalize

on:
  push:
    branches:
      - audit/card-core-crosscheck-v292

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: audit/card-core-crosscheck-v292
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.11'
      - name: Remove one-shot patch machinery before final manifest
        shell: bash
        run: |
          set -euo pipefail
          rm -f apply_v292_followup.py .github/workflows/v292-followup.yml .github/workflows/v292-finalize.yml
          python fault_injection_healing.py --manifest
          python fault_injection_healing.py --diagnose
          python test_runtime_delivery_guards.py
          python tablet_runtime_qa.py --profile final
          python -m unittest -v test_card_core_crosscheck_v291.py test_card_core_crosscheck_v292.py test_psa_probability_market_flow_v252.py
          node --check grading_probability_v292.js
          node verify_v99_browser_accuracy.js
          python verify_v99_cross_runtime.py
          node verify_pokemon_generation_runtime.js
          python tablet_runtime_manifest.py --check --compile
          git diff --check
      - name: Commit exact final tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Finalize v292 card-core integrity snapshot'
          git push origin HEAD:audit/card-core-crosscheck-v292
