name: Apply graded photo provider merge v2
on:
  push:
    branches: [main]
    paths:
      - 'apply_graded_photo_provider_merge_v2.py'
      - '.github/workflows/apply-graded-photo-provider-merge-v2.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python apply_graded_photo_provider_merge_v2.py
      - run: python -m py_compile graded_photo_multi_source.py
      - name: Commit patch
        run: |
          if git diff --quiet -- graded_photo_multi_source.py; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add graded_photo_multi_source.py
          git commit -m 'fix: always merge graded photo search providers'
          git push
