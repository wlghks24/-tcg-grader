name: Apply pending official candidate verification v161

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-pending-official-candidate-v161.yml'
      - 'pending_official_candidate_v161.py'
      - 'pending_official_candidate_bridge_v161.js'
      - 'tcg_updater_v135.py'
      - 'REPAIR_V135_SERVER.sh'
      - 'test_pending_official_candidate_v161.py'
      - 'test_manual_official_verify_ui_v194.py'
      - 'test_runtime_delivery_guards.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: requirements.txt
      - name: Install runtime test dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Verify v161 runtime wiring without mutating source
        run: |
          python - <<'PY'
          from pathlib import Path

          server=Path('tcg_updater_v135.py').read_text(encoding='utf-8')
          bridge=Path('pending_official_candidate_bridge_v161.js').read_text(encoding='utf-8')
          repair=Path('REPAIR_V135_SERVER.sh').read_text(encoding='utf-8')

          required_server=(
              "pending_official_candidate_bridge_v161.js",
              "'pending_official_candidate_manual_verify': True",
              "'pending_official_candidate_manual_verify_version': 161",
              "if path == '/api/pending-official-candidates':",
              "if path == '/api/pending-official-candidate-proof':",
              "self._read_json_body(9000000)",
          )
          missing=[token for token in required_server if token not in server]
          if missing:
              raise SystemExit(f'v161 server wiring missing: {missing}')

          required_bridge=(
              "gpdPendingOfficialV161",
              "/api/pending-official-candidate-proof",
              "async function decodedPhoto(file)",
              "typeof canvas.toBlob==='function'",
              "blob.size>6_000_000",
              "await jpegDataUrl(canvas,quality)",
              "공식 조회 화면을 6MB 이하로 줄이지 못했습니다.",
          )
          missing=[token for token in required_bridge if token not in bridge]
          if missing:
              raise SystemExit(f'v161 bridge contract missing: {missing}')
          if "공식 조회 화면을 8MB 이하로 줄이지 못했습니다." in bridge:
              raise SystemExit('stale v161 8MB compression contract remains')

          required_repair=(
              "pending_official_candidate_v161.py",
              "pending_official_candidate_bridge_v161.js",
              '"pending_official_candidate_manual_verify": true',
              "gpdPendingOfficialV161",
              "/api/pending-official-candidate-proof",
          )
          missing=[token for token in required_repair if token not in repair]
          if missing:
              raise SystemExit(f'v161 tablet repair delivery check missing: {missing}')
          PY
      - name: Tests
        run: |
          python -m py_compile pending_official_candidate_v161.py tcg_updater_v135.py
          python -m unittest -v test_pending_official_candidate_v161.py test_manual_official_verify_ui_v194.py test_graded_photo_retry_reason_v160.py test_graded_photo_existing_revalidation_v159.py
          python test_runtime_delivery_guards.py
