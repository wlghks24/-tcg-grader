name: PR Card Main Sync v307

on:
  push:
    branches: [audit/card-edition-ocr-generation-v302]

permissions:
  contents: write

concurrency:
  group: pr-card-main-sync-v307
  cancel-in-progress: true

jobs:
  sync:
    if: github.repository == 'wlghks24/-tcg-grader' && github.ref == 'refs/heads/audit/card-edition-ocr-generation-v302'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout card audit branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: audit/card-edition-ocr-generation-v302
          fetch-depth: 0

      - name: Merge current main and regenerate integrity manifest
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          set +e
          git merge --no-commit --no-ff origin/main
          merge_rc=$?
          set -e
          if [ "$merge_rc" -ne 0 ]; then
            conflicts="$(git diff --name-only --diff-filter=U)"
            if [ "$conflicts" != "integrity_manifest.json" ]; then
              echo "Unexpected merge conflicts:"
              printf '%s\n' "$conflicts"
              exit 1
            fi
            git checkout --ours integrity_manifest.json
            git add integrity_manifest.json
          fi
          git rm .github/workflows/pr-card-main-sync-v307.yml
          python -m pip install --disable-pip-version-check pillow
          python fault_injection_healing.py --manifest
          python -m py_compile card_identity_recognition.py verify_current_runtime.py test_card_region_generation_precision_v306.py test_protected_static_pipeline_v305.py
          node --check card_identity_recognition.js
          node --check grade_market_flow.js
          node verify_pokemon_generation_runtime.js
          python -m unittest -v test_card_region_generation_precision_v306.py test_card_edition_precision_v302.py test_card_tablet_runtime_v300.py test_psa_probability_market_flow_v252.py test_protected_static_pipeline_v305.py
          python repository_integrity_guard.py
          git diff --check
          git add -A
          git commit -m 'sync: merge main into card precision audit v307'
          git push origin HEAD:audit/card-edition-ocr-generation-v302
