name: Temporary V284 Manifest Refresh

on:
  push:
    branches: [qa/tablet-gpt-crosscheck-v284]
    paths:
      - '.github/workflows/tmp-v284-manifest.yml'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 2
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Rebuild and validate exact branch manifest
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/tmp-v284-manifest.yml
          python fault_injection_healing.py --manifest
          python fault_injection_healing.py --diagnose
          git add -- integrity_manifest.json .github/workflows/tmp-v284-manifest.yml
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore: refresh integrity manifest for v284'
          git push origin HEAD:qa/tablet-gpt-crosscheck-v284
