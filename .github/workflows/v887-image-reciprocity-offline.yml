name: V887 Offline Image Reciprocity Regression

on:
  pull_request:
    paths:
      - 'execution/tablet_provider_json_v900.py'
      - 'execution/tests/test_tablet_provider_json_v900.py'
      - 'execution/tablet_boot_guard_v899.py'
      - 'execution/tablet_collection_report_v899.py'
      - 'execution/tests/test_tablet_boot_guard_v899.py'
      - 'execution/tests/test_tablet_collection_report_v899.py'
      - 'execution/tests/fixtures/tcg_boot_v898.sh'
      - 'execution/tablet_live_view_v898.py'
      - 'execution/tests/test_tablet_live_view_v898.py'
      - 'execution/start_tablet_unified_v897.sh'
      - 'execution/apply_tablet_candidate_v897.py'
      - 'execution/tablet_device_readback_v897.py'
      - 'execution/tests/test_tablet_delivery_v897.py'
      - 'execution/tests/test_tablet_apply_v897.py'
      - 'execution/tablet_event_coverage_v896.py'
      - 'execution/tests/test_tablet_event_coverage_v896.py'
      - 'execution/tablet_target_image_v895.py'
      - 'execution/tests/test_tablet_target_image_v895.py'
      - 'execution/tablet_feature_inventory_v894.py'
      - 'execution/tests/test_tablet_feature_inventory_v894.py'
      - 'execution/tablet_backlog_priority_v893.py'
      - 'execution/tests/test_tablet_backlog_priority_v893.py'
      - 'execution/tablet_entity_store_v892.py'
      - 'execution/tests/test_tablet_entity_store_v892.py'
      - 'execution/tablet_event_freshness_v891.py'
      - 'execution/tests/test_tablet_event_freshness_v891.py'
      - 'execution/tablet_unified_ui_v890.py'
      - 'execution/tablet_event_summary_v890.py'
      - 'execution/tests/test_tablet_unified_ui_v890.py'
      - 'execution/tests/test_tablet_event_summary_v890.py'
      - 'execution/tablet_unified_runtime_v889.py'
      - 'execution/tests/test_tablet_unified_runtime_v889.py'
      - 'execution/tablet_image_unified_v888.py'
      - 'execution/tests/test_tablet_image_unified_v888.py'
      - 'execution/tablet_image_reciprocity_v887.py'
      - 'execution/tablet_image_recheck_cycle_v887.py'
      - 'execution/tablet_image_recheck_review_v887.py'
      - 'execution/tablet_public_image_identity_audit_v887.py'
      - 'execution/tests/test_tablet_image_reciprocity_v887.py'
      - 'execution/tests/test_tablet_image_recheck_cycle_v887.py'
      - 'execution/tests/test_tablet_public_image_identity_audit_v887.py'
      - '.github/workflows/v887-image-reciprocity-offline.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-image-reciprocity:
    name: V887 Offline Image Reciprocity
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'
      - name: Install existing audited image test dependency
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Run real local metadata repair, catalog join and public identity fixtures
        run: |
          bash -n execution/start_tablet_unified_v897.sh
          python -m py_compile execution/tablet_provider_json_v900.py execution/tablet_boot_guard_v899.py execution/tablet_collection_report_v899.py execution/tablet_live_view_v898.py execution/apply_tablet_candidate_v897.py execution/tablet_device_readback_v897.py execution/tablet_event_coverage_v896.py execution/tablet_target_image_v895.py execution/tablet_feature_inventory_v894.py execution/tablet_backlog_priority_v893.py execution/tablet_entity_store_v892.py execution/tablet_event_freshness_v891.py execution/tablet_unified_ui_v890.py execution/tablet_event_summary_v890.py execution/tablet_unified_runtime_v889.py execution/tablet_image_unified_v888.py execution/tablet_image_reciprocity_v887.py execution/tablet_image_recheck_review_v887.py execution/tablet_image_recheck_cycle_v887.py execution/tablet_public_image_identity_audit_v887.py
          python -m unittest -v execution.tests.test_tablet_provider_json_v900 execution.tests.test_tablet_boot_guard_v899 execution.tests.test_tablet_collection_report_v899 execution.tests.test_tablet_live_view_v898 execution.tests.test_tablet_apply_v897 execution.tests.test_tablet_delivery_v897 execution.tests.test_tablet_event_coverage_v896 execution.tests.test_tablet_target_image_v895 execution.tests.test_tablet_feature_inventory_v894 execution.tests.test_tablet_backlog_priority_v893 execution.tests.test_tablet_entity_store_v892 execution.tests.test_tablet_event_freshness_v891 execution.tests.test_tablet_unified_ui_v890 execution.tests.test_tablet_event_summary_v890 execution.tests.test_tablet_unified_runtime_v889 execution.tests.test_tablet_image_unified_v888 execution.tests.test_tablet_image_reciprocity_v887 execution.tests.test_tablet_image_recheck_cycle_v887 execution.tests.test_tablet_public_image_identity_audit_v887
          git diff --exit-code -- catalog_image_manifest.json market_watch.json
          git diff --check
