name: Patch Grading Watch Baseline v216

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-grading-watch-baseline-v216.yml'

permissions:
  contents: write

concurrency:
  group: patch-grading-watch-baseline-v216-main
  cancel-in-progress: true

jobs:
  patch-verify-commit:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 4

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'

      - name: Patch source-scoped baseline semantics
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          p=Path('grading_company_watch.py')
          text=p.read_text(encoding='utf-8')
          old='''                structured = _service_changes(company, source_id, old.get("services", []) or [], services, checked_at)\n                changes.extend(structured)'''
          new='''                # First successful observation of a source establishes its baseline.\n                # A previously verified source may emit service changes, including\n                # recovery after a temporary degraded fetch that retained last-good data.\n                structured = (\n                    _service_changes(company, source_id, old.get("services", []) or [], services, checked_at)\n                    if old.get("verified_official_source") is True else []\n                )\n                changes.extend(structured)'''
          if old not in text:
              raise SystemExit('service baseline target not found')
          text=text.replace(old,new,1)

          old='''    old_keys = {_announcement_key(row) for row in previous_announcements if isinstance(row, dict)}\n    for row in announcements:\n        if _announcement_key(row) not in old_keys:\n            changes.append({\n                "company": row["company"], "source_id": row["source_id"], "type": "official_announcement",\n                "title": row["title"], "url": row["url"], "detected_at": checked_at,\n                "verified_official_source": True,\n            })'''
          new='''    old_keys = {_announcement_key(row) for row in previous_announcements if isinstance(row, dict)}\n    for row in announcements:\n        prior_source = prev_sources.get(str(row.get("source_id", "")), {})\n        # A newly introduced official source is baseline inventory even when the\n        # repository already has snapshots for other companies/sources.\n        if not (isinstance(prior_source, dict) and prior_source.get("verified_official_source") is True):\n            continue\n        if _announcement_key(row) not in old_keys:\n            changes.append({\n                "company": row["company"], "source_id": row["source_id"], "type": "official_announcement",\n                "title": row["title"], "url": row["url"], "detected_at": checked_at,\n                "verified_official_source": True,\n            })'''
          if old not in text:
              raise SystemExit('announcement baseline target not found')
          p.write_text(text.replace(old,new,1),encoding='utf-8')

          p=Path('test_grading_company_watch_v215.py')
          text=p.read_text(encoding='utf-8')
          marker='''    def test_policy_never_allows_community_posts_to_write_verified_facts(self):'''
          tests='''    def test_initial_baseline_does_not_claim_every_current_service_changed(self):\n        specs = ({"id": "psa-jp-pricing", "kind": "pricing", "market": "JP", "currency": "JPY",\n                  "url": "https://www.psacard.com/ja-JP/services/tradingcardgrading/grading"},)\n        html = (\n            "<html><body>PSA公式トレーディングカード鑑定サービス 料金と納期のご案内。"\n            "スタンダード ￥9,980 予定納期：100営業日 申告価格：￥150,000以下 申し込む。"\n            "サービス内容、申告価格、予定納期は公式ページの最新表示を確認してください。"\n            "料金、受付状況、サービスレベルの変更はこの公式案内に掲載されます。</body></html>"\n        )\n        with mock.patch.object(watch, "WATCH_SOURCES", {"PSA": specs}):\n            data = watch.collect({}, fetcher=lambda _url: html)\n        self.assertEqual(data["recent_changes"], [])\n        self.assertEqual(data["history"], [])\n        self.assertEqual(data["sources"]["psa-jp-pricing"]["services"][0]["name"], "Standard")\n\n    def test_new_source_is_baseline_even_when_other_sources_have_history(self):\n        specs = ({"id": "psa-jp-news", "kind": "news", "market": "JP", "currency": "JPY",\n                  "url": "https://www.psacard.com/ja-JP/articles"},)\n        previous = {\n            "sources": {\n                "bgs-pricing": {"verified_official_source": True, "announcements": [], "services": []}\n            },\n            "announcements": [{"company": "BGS", "source_id": "bgs-pricing", "title": "old",\n                               "url": "https://www.beckett.com/grading", "verified_official_source": True}],\n            "history": [],\n        }\n        raw = (\n            "<html><body>PSA公式ニュース、サービスレベル、料金、納期、受付状況に関する最新のお知らせ一覧です。"\n            "<a href=\"/ja-JP/articles/articleview/999/service-change\">サービスレベル変更のお知らせ 2026/09/10</a>"\n            "公式発表のみを掲載し、詳細は各記事本文で確認できます。</body></html>"\n        )\n        with mock.patch.object(watch, "WATCH_SOURCES", {"PSA": specs}):\n            data = watch.collect(previous, fetcher=lambda _url: raw)\n        self.assertEqual(data["recent_changes"], [])\n        self.assertEqual(len(data["announcements"]), 2)\n\n'''
          if marker not in text:
              raise SystemExit('test insertion marker not found')
          if 'test_initial_baseline_does_not_claim_every_current_service_changed' not in text:
              text=text.replace(marker,tests+marker,1)
          p.write_text(text,encoding='utf-8')
          PY

      - name: Verify watcher baseline contracts
        run: |
          python -m py_compile grading_company_watch.py test_grading_company_watch_v215.py grading_costs_live.py
          python -m unittest -v test_grading_company_watch_v215.py test_grading_costs_live.py
          python verify_code_map_internal.py
          node --check grading_costs_live.js

      - name: Commit verified patch and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -- .github/workflows/patch-grading-watch-baseline-v216.yml
          git add -- grading_company_watch.py test_grading_company_watch_v215.py
          git commit -m 'fix: baseline grading-company changes per verified source'
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
