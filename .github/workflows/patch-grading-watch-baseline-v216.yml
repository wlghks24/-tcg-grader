name: Patch Grading Watch Baseline v216

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-grading-watch-baseline-v216.yml'

permissions:
  contents: write

concurrency:
  group: patch-grading-watch-baseline-v216-main
  cancel-in-progress: true

jobs:
  patch-verify-commit:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 3

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'

      - name: Patch baseline semantics
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          p=Path('grading_company_watch.py')
          text=p.read_text(encoding='utf-8')
          old='''                structured = _service_changes(company, source_id, old.get("services", []) or [], services, checked_at)\n                changes.extend(structured)'''
          new='''                # The first successful observation establishes a baseline. Only a\n                # previously observed official service set can produce a change event.\n                structured = (\n                    _service_changes(company, source_id, old.get("services", []) or [], services, checked_at)\n                    if old.get("services") else []\n                )\n                changes.extend(structured)'''
          if old not in text:
              raise SystemExit('service baseline target not found')
          text=text.replace(old,new,1)
          old='''    old_keys = {_announcement_key(row) for row in previous_announcements if isinstance(row, dict)}\n    for row in announcements:\n        if _announcement_key(row) not in old_keys:\n            changes.append({\n                "company": row["company"], "source_id": row["source_id"], "type": "official_announcement",\n                "title": row["title"], "url": row["url"], "detected_at": checked_at,\n                "verified_official_source": True,\n            })'''
          new='''    old_keys = {_announcement_key(row) for row in previous_announcements if isinstance(row, dict)}\n    # Existing articles/events are baseline inventory on the first run, not\n    # fabricated "new" changes. Later runs compare against that inventory.\n    if previous:\n        for row in announcements:\n            if _announcement_key(row) not in old_keys:\n                changes.append({\n                    "company": row["company"], "source_id": row["source_id"], "type": "official_announcement",\n                    "title": row["title"], "url": row["url"], "detected_at": checked_at,\n                    "verified_official_source": True,\n                })'''
          if old not in text:
              raise SystemExit('announcement baseline target not found')
          p.write_text(text.replace(old,new,1),encoding='utf-8')

          p=Path('test_grading_company_watch_v215.py')
          text=p.read_text(encoding='utf-8')
          marker='''    def test_policy_never_allows_community_posts_to_write_verified_facts(self):'''
          test='''    def test_initial_baseline_does_not_claim_every_current_service_changed(self):\n        specs = ({"id": "psa-jp-pricing", "kind": "pricing", "market": "JP", "currency": "JPY",\n                  "url": "https://www.psacard.com/ja-JP/services/tradingcardgrading/grading"},)\n        html = "<html><body>スタンダード ￥9,980 予定納期：100営業日 申告価格：￥150,000以下 申し込む</body></html>"\n        with mock.patch.object(watch, "WATCH_SOURCES", {"PSA": specs}):\n            data = watch.collect({}, fetcher=lambda _url: html)\n        self.assertEqual(data["recent_changes"], [])\n        self.assertEqual(data["history"], [])\n        self.assertEqual(data["sources"]["psa-jp-pricing"]["services"][0]["name"], "Standard")\n\n'''
          if marker not in text:
              raise SystemExit('test insertion marker not found')
          p.write_text(text.replace(marker,test+marker,1),encoding='utf-8')
          PY

      - name: Verify watcher baseline contracts
        run: |
          python -m py_compile grading_company_watch.py test_grading_company_watch_v215.py
          python -m unittest -v test_grading_company_watch_v215.py test_grading_costs_live.py
          python verify_code_map_internal.py

      - name: Commit verified patch and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -- .github/workflows/patch-grading-watch-baseline-v216.yml
          git add -- grading_company_watch.py test_grading_company_watch_v215.py
          git commit -m 'fix: establish grading watch baseline before change alerts'
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
