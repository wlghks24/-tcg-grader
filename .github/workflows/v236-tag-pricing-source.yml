name: One-shot v236 TAG pricing source repair

on:
  push:
    branches:
      - selfrefine/tag-pricing-source-v236
    paths:
      - '.github/workflows/v236-tag-pricing-source.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: selfrefine/tag-pricing-source-v236
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'
      - name: Apply bounded TAG source parser fix
        run: python v236_tag_repair.py
      - name: Run targeted regression
        run: |
          python -m py_compile grading_company_watch.py test_grading_company_watch_v215.py
          python -m unittest -v test_grading_company_watch_v215.py test_grading_watch_integration_v220.py
      - name: Verify live TAG official collection
        run: python v236_tag_repair.py --live
      - name: Commit bounded repair
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add grading_company_watch.py test_grading_company_watch_v215.py
          git commit -m 'fix: restore TAG official grading pricing collection'
          git push origin HEAD:selfrefine/tag-pricing-source-v236
