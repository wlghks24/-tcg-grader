name: V352 Integrity Finalizer

on:
  push:
    branches:
      - fix/static-data-v352-final-20260929

permissions:
  contents: write

concurrency:
  group: v352-integrity-finalizer
  cancel-in-progress: false

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          ref: fix/static-data-v352-final-20260929

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'

      - name: Verify v351 successor and v352 exact candidate coverage
        run: |
          set -euo pipefail
          python -m py_compile test_tablet_gpt_tcg_grader_sync_v351.py test_tablet_gpt_tcg_grader_sync_v352.py static_integrity_manifest.py
          python -m unittest -v test_tablet_gpt_tcg_grader_sync_v351.py test_tablet_gpt_tcg_grader_sync_v352.py

      - name: Remove one-shot workflow and regenerate final-tree integrity manifest
        run: |
          set -euo pipefail
          git rm -- .github/workflows/v352-integrity-finalizer.yml
          python static_integrity_manifest.py --write integrity_manifest.json
          python static_integrity_manifest.py --check integrity_manifest.json
          git add -- integrity_manifest.json
          git diff --cached --check

      - name: Commit exact final tree
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'sync: finalize v352 integrity manifest'
          git push origin HEAD:fix/static-data-v352-final-20260929
