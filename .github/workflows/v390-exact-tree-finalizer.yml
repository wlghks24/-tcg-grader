name: V390 Exact Tree Finalizer

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: v390-exact-tree-finalizer-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  finalize:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'feature/tablet-autonomous-evolution-v390'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'

      - name: Remove one-shot finalizer from exact final tree
        run: git rm -- .github/workflows/v390-exact-tree-finalizer.yml

      - name: Compile and self-test V390
        run: |
          python -m py_compile tablet_autonomous_evolution_v390.py test_tablet_autonomous_evolution_v390.py sync_v376_successor_test_support.py test_tablet_gpt_tcg_grader_sync_v388.py
          python tablet_autonomous_evolution_v390.py --self-test

      - name: Targeted V390 validation
        run: |
          python -m unittest -v test_tablet_autonomous_evolution_v390.py test_tablet_gpt_tcg_grader_sync_v388.py

      - name: Related autonomy regression
        run: |
          python -m unittest -v test_tablet_autonomous_evolution_v388.py test_tablet_autonomous_evolution_v390.py

      - name: Full Tablet GPT sync regression
        run: |
          mapfile -t tests < <(find . -maxdepth 1 -type f -name 'test_tablet_gpt_tcg_grader_sync_v*.py' -printf '%f\n' | sort -V)
          python -m unittest -v "${tests[@]}"

      - name: Runtime manifest and 100+1000 quality policy
        run: |
          python tablet_runtime_manifest.py --check --compile
          python quality_review_policy.py --check

      - name: Exact-tree integrity validation
        run: |
          python fault_injection_healing.py --manifest
          python repository_integrity_guard.py
          git diff --check

      - name: Commit exact final tree
        shell: bash
        run: |
          set -euo pipefail
          git add -A -- .github/workflows/v390-exact-tree-finalizer.yml integrity_manifest.json
          git status --short
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git diff --cached --quiet; then
            echo "No exact-tree finalization changes to commit."
            exit 0
          fi
          git commit -m 'ci: finalize v390 exact tree'
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
