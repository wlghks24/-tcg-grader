name: GPT TCG Drive Package

on:
  push:
    branches: [main]
    paths:
      - 'releases.json'
      - 'promo_events.json'
      - 'supplementary_candidates.json'
      - 'social_event_candidates.json'
      - 'purchase_signals.json'
      - 'social_stock_signals.json'
      - 'market_prices.json'
      - 'market_watch.json'
      - 'purchase_sources.json'
      - 'exchange_rates.json'
      - 'grading_company_updates.json'
      - 'graded_photo_candidates.json'
      - 'source_collection_stats.json'
      - 'adaptive_collection_stats.json'
      - 'auto_update_report.json'
      - 'auto_update_issues.json'
      - 'tcg_live_data.json'
  # The protected static refresh runs at :47 every six hours. These two runs
  # are 73 minutes after the 03:47 / 15:47 KST refreshes, so the producer gates
  # remain inside their two-hour report freshness window while also producing a
  # fresh manifest for code-only main changes before the tablet's 08:00/20:00 checks.
  schedule:
    - cron: '0 8,20 * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: gpt-tcg-drive-package-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 2
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'
      - name: Build exact verified 17-JSON package
        id: package
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          log="$(mktemp)"
          set +e
          python tablet_gdrive_publish.py --output-dir .tcg_drive_outbox >"${log}" 2>&1
          rc=$?
          set -e
          cat "${log}"

          if [ "${rc}" -eq 0 ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "recovery=none" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # A freshness-only failure is not a package failure. Keep every
          # freshness threshold fail-closed, request a protected refresh, and
          # leave this run without an upload. Any non-freshness critical finding
          # still preserves the original non-zero result.
          stale_only=false
          if [ -f STATIC_DATA_PUBLISH_REPORT.json ]; then
            if python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path("STATIC_DATA_PUBLISH_REPORT.json").read_text(encoding="utf-8"))
          critical = {
              row.get("code")
              for row in data.get("findings", [])
              if isinstance(row, dict) and row.get("severity") == "critical"
          }
          freshness = {"STALE_SOCIAL_SNAPSHOT", "STALE_AUTO_UPDATE_REPORT"}
          raise SystemExit(0 if critical and critical <= freshness else 1)
          PY
            then
              stale_only=true
            fi
          fi

          if [ "${stale_only}" = true ]; then
            echo "::warning::Freshness gate stayed fail-closed; dispatching a fresh protected static collection instead of uploading stale data."
            gh api --method POST \
              "repos/${GITHUB_REPOSITORY}/actions/workflows/tcg-static-data-refresh.yml/dispatches" \
              -f ref=main
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "recovery=FRESH_STATIC_REFRESH_DISPATCHED" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          exit "${rc}"

      - name: Upload package for GPT Drive transfer
        if: steps.package.outputs.ready == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: tcg-gdrive-package
          path: .tcg_drive_outbox/*
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7

      - name: Write package recovery summary
        if: always()
        shell: bash
        run: |
          {
            echo '## GPT TCG Drive Package'
            echo
            echo "- package ready: ${{ steps.package.outputs.ready || 'false' }}"
            echo "- recovery: ${{ steps.package.outputs.recovery || 'none' }}"
            echo "- stale policy: never widen report/social freshness gates; request a fresh protected collection instead"
          } >> "$GITHUB_STEP_SUMMARY"
