name: GPT TCG Drive Package

on:
  push:
    branches: [main]
    paths:
      - 'releases.json'
      - 'promo_events.json'
      - 'supplementary_candidates.json'
      - 'social_event_candidates.json'
      - 'purchase_signals.json'
      - 'social_stock_signals.json'
      - 'market_prices.json'
      - 'market_watch.json'
      - 'purchase_sources.json'
      - 'exchange_rates.json'
      - 'grading_company_updates.json'
      - 'graded_photo_candidates.json'
      - 'source_collection_stats.json'
      - 'adaptive_collection_stats.json'
      - 'auto_update_report.json'
      - 'auto_update_issues.json'
      - 'tcg_live_data.json'
  # The normal producer schedule remains aligned after the protected static refresh,
  # while freshness-only drift can recover inside this isolated packaging run.
  # Stale inputs are never uploaded and freshness thresholds remain unchanged.
  schedule:
    - cron: '0 8,20 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gpt-tcg-drive-package-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      PYTHONPATH: ${{ github.workspace }}
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUNBUFFERED: '1'
      TCG_HTTP_TIMEOUT: '30'
      TCG_SOURCE_TIMEOUT_CAP: '30'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 2
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'
      - name: Build exact verified 17-JSON package
        id: package
        shell: bash
        run: |
          set -euo pipefail

          run_package() {
            local log_file="$1"
            set +e
            python tablet_gdrive_publish.py --output-dir .tcg_drive_outbox >"${log_file}" 2>&1
            local code=$?
            set -e
            cat "${log_file}"
            return "${code}"
          }

          static_stale_only() {
            [ -f STATIC_DATA_PUBLISH_REPORT.json ] || return 1
            python - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(Path("STATIC_DATA_PUBLISH_REPORT.json").read_text(encoding="utf-8"))
          critical = {
              row.get("code")
              for row in data.get("findings", [])
              if isinstance(row, dict) and row.get("severity") == "critical"
          }
          recoverable = {
              "STALE_AUTO_UPDATE_REPORT",
              "STALE_SOCIAL_SNAPSHOT",
              "STALE_SUPPLEMENTARY_SNAPSHOT",
          }
          # A code-only topic-matrix expansion can leave the persisted topic
          # snapshots stale and on the prior contract. Permit one fresh cycle
          # only when at least one independently verified STALE_* finding exists;
          # the unchanged publish gate still decides whether upload is allowed.
          topic_contract_drift = {
              "TOPIC_EXPECTED_CELL_MISMATCH",
              "SOCIAL_TOPIC_ATTEMPT_CONTRACT_MISMATCH",
          }
          stale_only = bool(critical and critical <= recoverable)
          stale_with_drift = bool(critical & recoverable) and critical <= (recoverable | topic_contract_drift)
          raise SystemExit(0 if stale_only or stale_with_drift else 1)
          PY
          }

          transient_degraded_only() {
            [ -f COLLECTION_VERIFICATION_REPORT.json ] || return 1
            [ -f auto_update_report.json ] || return 1
            python - <<'PY'
          import json
          import re
          from pathlib import Path
          import auto_update_all

          verification = json.loads(Path("COLLECTION_VERIFICATION_REPORT.json").read_text(encoding="utf-8"))
          update = json.loads(Path("auto_update_report.json").read_text(encoding="utf-8"))

          findings = [row for row in verification.get("findings", []) if isinstance(row, dict)]
          if any(row.get("severity") == "critical" for row in findings):
              raise SystemExit(1)
          high = [row for row in findings if row.get("severity") == "high"]
          if not high or len(high) > 4:
              raise SystemExit(1)
          if any(row.get("code") != "DEGRADED_COLLECTION_OUTPUT" for row in high):
              raise SystemExit(1)

          allowed_targets = {job[2] for job in auto_update_all.JOBS}
          targets = [str(row.get("target") or "") for row in high]
          if any(target not in allowed_targets for target in targets):
              raise SystemExit(1)

          rows = {
              str(row.get("file")): row
              for row in update.get("results", [])
              if isinstance(row, dict) and row.get("file")
          }
          structural = (
              "valueerror", "typeerror", "keyerror", "jsondecodeerror", "syntaxerror",
              "attributeerror", "importerror", "modulenotfounderror", "permissionerror",
              "security", "ssrf", "private ip", "private dns", "필수값 누락", "구조 오류",
              "보안 차단", "권한 오류",
          )
          transient = (
              "timeout", "timed out", "urlerror", "name resolution", "temporary failure",
              "connection reset", "remote end closed", "remotedisconnected",
              "incompleteread", "connection aborted", "connection refused",
          )

          def eligible(text):
              lowered = str(text or "").lower()
              if not lowered or any(marker in lowered for marker in structural):
                  return False
              statuses = {int(code) for code in re.findall(r"(?:status\s*|http\s*)(\d{3})", lowered)}
              if any(code not in {408, 425} and not 500 <= code <= 599 for code in statuses):
                  return False
              if "retry-after" in lowered or "status 429" in lowered or "http 429" in lowered:
                  return False
              return bool(statuses) or any(marker in lowered for marker in transient)

          summary = []
          for target in targets:
              row = rows.get(target)
              if not isinstance(row, dict):
                  raise SystemExit(1)
              if "remaining_collection_errors" in row:
                  raw = row.get("remaining_collection_errors")
              else:
                  raw = row.get("collection_errors")
              if not raw and row.get("recovered_after_retry"):
                  raw = row.get("collection_errors")
              if isinstance(raw, (list, tuple)):
                  errors = [str(value) for value in raw if str(value).strip()]
              elif raw:
                  errors = [str(raw)]
              else:
                  errors = []
              if row.get("error") and row.get("ok") is not True:
                  errors.append(str(row.get("error")))
              if not errors or not all(eligible(error) for error in errors):
                  raise SystemExit(1)
              summary.append({"file": target, "errors": len(errors)})

          print(json.dumps({"retryable_transient_degraded": summary}, ensure_ascii=False))
          PY
          }

          print_failure_diagnostics() {
            python - <<'PY'
          import json
          from pathlib import Path
          import auto_repair_engine

          for name in ("STATIC_DATA_PUBLISH_REPORT.json", "COLLECTION_VERIFICATION_REPORT.json"):
              path = Path(name)
              if not path.is_file():
                  continue
              try:
                  data = json.loads(path.read_text(encoding="utf-8"))
              except Exception as exc:
                  print(f"{name}: unreadable ({type(exc).__name__})")
                  continue
              findings = [
                  row for row in data.get("findings", [])
                  if isinstance(row, dict) and row.get("severity") in {"critical", "high"}
              ]
              text = json.dumps({"status": data.get("status"), "findings": findings[:12]}, ensure_ascii=False)
              print(f"{name}: {auto_repair_engine.redact_sensitive(text, 6000)}")
          PY
          }

          log="$(mktemp)"
          if run_package "${log}"; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "recovery=none" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          recovery="none"
          rc=1
          if static_stale_only; then
            echo "::warning::Freshness-only inputs are stale; collecting fresh verified inputs inside this isolated package run. Stale files remain ineligible for upload."
            python - <<'PY'
          import json
          import tcg_updater
          data = tcg_updater.update_cycle('gpt-drive-package-refresh')
          print(json.dumps({
              'updated_at': data.get('updated_at'),
              'auto_update': data.get('auto_update', {}),
          }, ensure_ascii=False, indent=2))
          PY
            rm -rf .tcg_drive_outbox
            retry_log="$(mktemp)"
            if run_package "${retry_log}"; then
              echo "ready=true" >> "$GITHUB_OUTPUT"
              echo "recovery=FRESH_LOCAL_COLLECTION_RETRY" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            retry_rc=1
            if [ "${retry_rc}" -ne 0 ]; then
              echo "::warning::Fresh local collection did not satisfy the unchanged production gates; evaluating only bounded transient degraded recovery."
              recovery="FRESH_LOCAL_COLLECTION_RETRY"
              rc="${retry_rc}"
            fi
          fi

          if transient_degraded_only; then
            echo "::warning::Verified package is blocked only by bounded transient collection failures; running one additional full verified collection cycle without changing any gate."
            python - <<'PY'
          import json
          import tcg_updater
          data = tcg_updater.update_cycle('gpt-drive-package-transient-recovery')
          print(json.dumps({
              'updated_at': data.get('updated_at'),
              'auto_update': data.get('auto_update', {}),
          }, ensure_ascii=False, indent=2))
          PY
            rm -rf .tcg_drive_outbox
            transient_log="$(mktemp)"
            if run_package "${transient_log}"; then
              echo "ready=true" >> "$GITHUB_OUTPUT"
              if [ "${recovery}" = "FRESH_LOCAL_COLLECTION_RETRY" ]; then
                echo "recovery=FRESH_LOCAL_COLLECTION_PLUS_TRANSIENT_RETRY" >> "$GITHUB_OUTPUT"
              else
                echo "recovery=TRANSIENT_DEGRADED_COLLECTION_RETRY" >> "$GITHUB_OUTPUT"
              fi
              exit 0
            fi
            echo "::error::Bounded transient recovery did not satisfy the unchanged production gates; package remains blocked."
          else
            echo "::error::Package failure is not freshness-only or safely retryable transient degradation; no additional collection retry is allowed."
          fi

          print_failure_diagnostics
          exit "${rc}"

      - name: Upload package for GPT Drive transfer
        if: steps.package.outputs.ready == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: tcg-gdrive-package
          path: .tcg_drive_outbox/*
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7

      - name: Write package recovery summary
        if: always()
        shell: bash
        run: |
          {
            echo '## GPT TCG Drive Package'
            echo
            echo "- package ready: ${{ steps.package.outputs.ready || 'false' }}"
            echo "- recovery: ${{ steps.package.outputs.recovery || 'none' }}"
            echo "- stale policy: never widen freshness gates and never upload stale inputs; freshness-only drift is recollected and fully revalidated in this isolated run"
          } >> "$GITHUB_STEP_SUMMARY"
