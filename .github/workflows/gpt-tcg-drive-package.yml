name: GPT TCG Drive Package

on:
  push:
    branches: [main]
    paths:
      - 'releases.json'
      - 'promo_events.json'
      - 'supplementary_candidates.json'
      - 'social_event_candidates.json'
      - 'purchase_signals.json'
      - 'social_stock_signals.json'
      - 'market_prices.json'
      - 'market_watch.json'
      - 'purchase_sources.json'
      - 'exchange_rates.json'
      - 'grading_company_updates.json'
      - 'graded_photo_candidates.json'
      - 'source_collection_stats.json'
      - 'adaptive_collection_stats.json'
      - 'auto_update_report.json'
      - 'auto_update_issues.json'
      - 'tcg_live_data.json'
  # The normal producer schedule remains aligned after the protected static refresh,
  # while freshness-only drift can recover inside this isolated packaging run.
  # Stale inputs are never uploaded and freshness thresholds remain unchanged.
  schedule:
    - cron: '0 8,20 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gpt-tcg-drive-package-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      PYTHONPATH: ${{ github.workspace }}
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUNBUFFERED: '1'
      TCG_HTTP_TIMEOUT: '30'
      TCG_SOURCE_TIMEOUT_CAP: '30'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 2
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'
      - name: Build exact verified 17-JSON package
        id: package
        shell: bash
        run: |
          set -euo pipefail
          log="$(mktemp)"
          set +e
          python tablet_gdrive_publish.py --output-dir .tcg_drive_outbox >"${log}" 2>&1
          rc=$?
          set -e
          cat "${log}"

          if [ "${rc}" -eq 0 ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "recovery=none" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          stale_only=false
          if [ -f STATIC_DATA_PUBLISH_REPORT.json ]; then
            if python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path("STATIC_DATA_PUBLISH_REPORT.json").read_text(encoding="utf-8"))
          critical = {
              row.get("code")
              for row in data.get("findings", [])
              if isinstance(row, dict) and row.get("severity") == "critical"
          }
          recoverable = {
              "STALE_AUTO_UPDATE_REPORT",
              "STALE_SOCIAL_SNAPSHOT",
              "STALE_SUPPLEMENTARY_SNAPSHOT",
          }
          raise SystemExit(0 if critical and critical <= recoverable else 1)
          PY
            then
              stale_only=true
            fi
          fi

          if [ "${stale_only}" = true ]; then
            echo "::warning::Freshness-only inputs are stale; collecting fresh verified inputs inside this isolated package run. Stale files remain ineligible for upload."

            for recovery_attempt in 1 2; do
              echo "::notice::bounded fresh collection attempt ${recovery_attempt}/2"
              python - <<'PY'
          import json
          import tcg_updater
          data = tcg_updater.update_cycle('gpt-drive-package-refresh')
          print(json.dumps({
              'updated_at': data.get('updated_at'),
              'auto_update': data.get('auto_update', {}),
          }, ensure_ascii=False, indent=2))
          PY

              rm -rf .tcg_drive_outbox
              retry_log="$(mktemp)"
              set +e
              python tablet_gdrive_publish.py --output-dir .tcg_drive_outbox >"${retry_log}" 2>&1
              retry_rc=$?
              set -e
              cat "${retry_log}"

              if [ "${retry_rc}" -eq 0 ]; then
                echo "ready=true" >> "$GITHUB_OUTPUT"
                echo "recovery=FRESH_LOCAL_COLLECTION_RETRY_ATTEMPT_${recovery_attempt}" >> "$GITHUB_OUTPUT"
                exit 0
              fi

              echo "::warning::Fresh collection attempt ${recovery_attempt}/2 did not satisfy the unchanged production gates."
              if [ -f COLLECTION_VERIFICATION_REPORT.json ]; then
                python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path("COLLECTION_VERIFICATION_REPORT.json").read_text(encoding="utf-8"))
          print(json.dumps({
              "status": report.get("status"),
              "counts": report.get("counts"),
              "findings": [
                  row for row in report.get("findings", [])
                  if isinstance(row, dict) and row.get("severity") in {"critical", "high", "medium"}
              ],
              "contextual_freshness": report.get("contextual_freshness"),
          }, ensure_ascii=False, indent=2))
          PY
              fi

              if [ "${recovery_attempt}" -lt 2 ]; then
                echo "::notice::Retrying one final bounded fresh collection; freshness and quality thresholds remain unchanged."
                continue
              fi

              echo "::error::Fresh local collection did not satisfy the unchanged production gates after 2 bounded attempts; package remains blocked."
              exit "${retry_rc}"
            done
          fi

          exit "${rc}"

      - name: Upload package for GPT Drive transfer
        if: steps.package.outputs.ready == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: tcg-gdrive-package
          path: .tcg_drive_outbox/*
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7

      - name: Write package recovery summary
        if: always()
        shell: bash
        run: |
          {
            echo '## GPT TCG Drive Package'
            echo
            echo "- package ready: ${{ steps.package.outputs.ready || 'false' }}"
            echo "- recovery: ${{ steps.package.outputs.recovery || 'none' }}"
            echo "- stale policy: never widen freshness gates and never upload stale inputs; freshness-only drift is recollected and fully revalidated in this isolated run"
          } >> "$GITHUB_STEP_SUMMARY"
