name: GPT TCG Drive Package

on:
  push:
    branches: [main]
    paths:
      - 'releases.json'
      - 'promo_events.json'
      - 'supplementary_candidates.json'
      - 'social_event_candidates.json'
      - 'purchase_signals.json'
      - 'social_stock_signals.json'
      - 'market_prices.json'
      - 'market_watch.json'
      - 'purchase_sources.json'
      - 'exchange_rates.json'
      - 'grading_company_updates.json'
      - 'graded_photo_candidates.json'
      - 'source_collection_stats.json'
      - 'adaptive_collection_stats.json'
      - 'auto_update_report.json'
      - 'auto_update_issues.json'
      - 'tcg_live_data.json'
  # The normal producer schedule remains aligned after the protected static refresh,
  # while freshness-only drift can recover inside this isolated packaging run.
  # Stale inputs are never uploaded and freshness thresholds remain unchanged.
  schedule:
    - cron: '0 8,20 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gpt-tcg-drive-package-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      PYTHONPATH: ${{ github.workspace }}
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUNBUFFERED: '1'
      TCG_HTTP_TIMEOUT: '30'
      TCG_SOURCE_TIMEOUT_CAP: '30'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 2
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'
      - name: Build exact verified 17-JSON package
        id: package
        shell: bash
        run: |
          set -euo pipefail
          log="$(mktemp)"
          set +e
          python tablet_gdrive_publish.py --output-dir .tcg_drive_outbox >"${log}" 2>&1
          rc=$?
          set -e
          cat "${log}"

          if [ "${rc}" -eq 0 ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "recovery=none" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          stale_only=false
          if [ -f STATIC_DATA_PUBLISH_REPORT.json ]; then
            if python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path("STATIC_DATA_PUBLISH_REPORT.json").read_text(encoding="utf-8"))
          critical = {
              row.get("code")
              for row in data.get("findings", [])
              if isinstance(row, dict) and row.get("severity") == "critical"
          }
          recoverable = {
              "STALE_AUTO_UPDATE_REPORT",
              "STALE_SOCIAL_SNAPSHOT",
              "STALE_SUPPLEMENTARY_SNAPSHOT",
          }
          raise SystemExit(0 if critical and critical <= recoverable else 1)
          PY
            then
              stale_only=true
            fi
          fi

          if [ "${stale_only}" = true ]; then
            echo "::warning::Freshness-only inputs are stale; collecting fresh verified inputs inside this isolated package run. Stale files remain ineligible for upload."
            python - <<'PY'
          import json
          import tcg_updater
          data = tcg_updater.update_cycle('gpt-drive-package-refresh')
          print(json.dumps({
              'updated_at': data.get('updated_at'),
              'auto_update': data.get('auto_update', {}),
          }, ensure_ascii=False, indent=2))
          PY

            # A full update can intentionally preserve the previous verified social
            # snapshot when its first auxiliary pass times out/degrades. The normal
            # static publisher already has a bounded second-pass recovery for this
            # case. Reuse the same fail-closed recovery before rerunning the exact
            # package gates; never widen freshness or accept degraded output.
            TCG_HTTP_TIMEOUT=60 TCG_SOURCE_TIMEOUT_CAP=60 python - <<'PY'
          import datetime as dt
          import json
          import time
          from pathlib import Path

          import auto_pipeline_runner
          import auto_update_all
          import static_data_publish_gate as gate
          import update_promo_events
          from safe_runtime import atomic_write_json

          root = Path('.')
          report_path = root / 'auto_update_report.json'
          report = json.loads(report_path.read_text(encoding='utf-8'))
          integration = report.get('integration') if isinstance(report.get('integration'), dict) else {}
          preflight = gate.verify(
              root,
              now=dt.datetime.now(dt.timezone.utc),
              max_social_age_hours=12,
              max_report_age_hours=2,
          )
          critical_codes = {
              str(row.get('code'))
              for row in (preflight.get('findings') or [])
              if isinstance(row, dict) and row.get('severity') == 'critical'
          }
          recoverable_aux = {
              'STALE_SOCIAL_SNAPSHOT',
              'STALE_SUPPLEMENTARY_SNAPSHOT',
              'AUXILIARY_INTEGRATION_NOT_CLEAN',
              'AUXILIARY_COVERAGE_SYNC_FAILED',
              'SOCIAL_COVERAGE_SYNC_MISMATCH',
              'SOCIAL_FRESH_COLLECTION_NOT_CONFIRMED',
          }
          needs_recovery = bool(
              integration.get('degraded') is True
              or integration.get('deferred_timeout_pending') is True
              or critical_codes.intersection(recoverable_aux)
          )
          if not needs_recovery:
              print('Drive package auxiliary recovery not required after fresh collection')
              raise SystemExit(0)

          started = time.monotonic()
          result = auto_pipeline_runner.run_pipeline()
          if (not isinstance(result, dict) or result.get('ok') is not True
                  or result.get('degraded') is True):
              print(json.dumps({
                  'ok': result.get('ok') if isinstance(result, dict) else None,
                  'degraded': result.get('degraded') if isinstance(result, dict) else None,
                  'failure_count': result.get('failure_count') if isinstance(result, dict) else None,
              }, ensure_ascii=False, indent=2))
              raise SystemExit('Drive package auxiliary integration recovery did not finish cleanly')

          errors = [str(x) for x in (result.get('errors') or []) if str(x).strip()]
          report['integration'] = {
              'ok': True,
              'degraded': False,
              'candidate_count': (
                  sum(len(x.get('results', [])) for x in (result.get('queries') or []) if isinstance(x, dict))
                  + int((result.get('supplementary') or {}).get('candidate_count') or 0)
                  + int((result.get('social') or {}).get('candidate_count') or 0)
              ),
              'social_candidate_count': int((result.get('social') or {}).get('candidate_count') or 0),
              'official_social_candidate_count': int((result.get('social') or {}).get('official_social_candidate_count') or 0),
              'failure_count': int(result.get('failure_count') or len(errors)),
              'error': ' / '.join(errors)[-1200:] if errors else '',
              'platform': result.get('platform', {}),
              'note': result.get('notice'),
              'recovered_after_gpt_drive_refresh': True,
              'recovery_duration_seconds': round(time.monotonic() - started, 2),
          }

          synced = update_promo_events.refresh_auxiliary_coverage_metadata(write=True)
          auto_update_all.validate_json('promo_events.json', synced)
          report['auxiliary_coverage_sync'] = {
              'ok': True,
              'expected_topic_cells': int(synced.get('social_topic_expected_cells') or 0),
              'attempted_topic_cells': int(synced.get('social_topic_attempted_cells') or 0),
              'successful_topic_cells': int(synced.get('social_topic_successful_cells') or 0),
              'failed_topic_cells': len(synced.get('social_topic_failed_cells') or []),
              'undiscovered_topic_cells': len(synced.get('social_topic_undiscovered_cells') or []),
              'source_updated_at': synced.get('social_topic_source_updated_at'),
              'recovered_after_gpt_drive_refresh': True,
          }

          link = report.get('link_audit') if isinstance(report.get('link_audit'), dict) else {}
          report['ok_with_aux'] = bool(
              report.get('ok')
              and report['integration'].get('ok')
              and not report['integration'].get('degraded')
              and link.get('ok')
              and not link.get('degraded')
              and report['auxiliary_coverage_sync'].get('ok')
          )
          postflight = report.get('postflight_monitor') if isinstance(report.get('postflight_monitor'), dict) else {}
          report['ok_with_monitor'] = bool(report['ok_with_aux'] and postflight.get('ok'))
          report['gpt_drive_refresh_recovery'] = {
              'ok': True,
              'reason': 'fresh auxiliary integration recovered with a second verified pipeline pass',
              'recovered_at': dt.datetime.now(dt.timezone.utc).isoformat(timespec='seconds'),
          }
          auto_update_all.atomic_report(report)
          auto_update_all.atomic_issues(report)

          live_path = root / 'tcg_live_data.json'
          if live_path.exists():
              live = json.loads(live_path.read_text(encoding='utf-8'))
              if isinstance(live, dict):
                  auto = live.setdefault('auto_update', {})
                  if isinstance(auto, dict):
                      auto['report_ok'] = bool(report['ok_with_monitor'])
                  atomic_write_json(live_path, live, suffix='.gpt-drive-refresh-recovery.tmp')

          print(json.dumps({
              'recovered': True,
              'integration': report['integration'],
              'auxiliary_coverage_sync': report['auxiliary_coverage_sync'],
              'report_ok': report['ok_with_monitor'],
          }, ensure_ascii=False, indent=2))
          PY

            rm -rf .tcg_drive_outbox
            retry_log="$(mktemp)"
            set +e
            python tablet_gdrive_publish.py --output-dir .tcg_drive_outbox >"${retry_log}" 2>&1
            retry_rc=$?
            set -e
            cat "${retry_log}"
            if [ "${retry_rc}" -ne 0 ]; then
              echo "::error::Fresh local collection and bounded auxiliary recovery did not satisfy the unchanged production gates; package remains blocked."
              exit "${retry_rc}"
            fi
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "recovery=FRESH_LOCAL_COLLECTION_PLUS_AUX_RETRY" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          exit "${rc}"

      - name: Upload package for GPT Drive transfer
        if: steps.package.outputs.ready == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: tcg-gdrive-package
          path: .tcg_drive_outbox/*
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7

      - name: Write package recovery summary
        if: always()
        shell: bash
        run: |
          {
            echo '## GPT TCG Drive Package'
            echo
            echo "- package ready: ${{ steps.package.outputs.ready || 'false' }}"
            echo "- recovery: ${{ steps.package.outputs.recovery || 'none' }}"
            echo "- stale policy: never widen freshness gates and never upload stale inputs; freshness-only drift is recollected, bounded auxiliary recovery runs only when needed, and all unchanged production gates are rerun before upload"
          } >> "$GITHUB_STEP_SUMMARY"
