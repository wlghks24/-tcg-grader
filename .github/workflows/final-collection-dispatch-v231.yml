name: Final collection dispatch v231

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/final-collection-dispatch-v231.yml'

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Dispatch current-main verification workflows
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${REPO}/actions/workflows"
          for workflow in collection-verification-guard.yml tcg-static-data-refresh.yml; do
            code=$(curl --silent --show-error --output /tmp/resp --write-out '%{http_code}' \
              --request POST \
              --header 'Accept: application/vnd.github+json' \
              --header "Authorization: Bearer ${GH_TOKEN}" \
              --header 'X-GitHub-Api-Version: 2022-11-28' \
              "${api}/${workflow}/dispatches" \
              --data '{"ref":"main"}')
            if [ "$code" != '204' ]; then
              cat /tmp/resp
              echo "dispatch failed for ${workflow}: HTTP ${code}" >&2
              exit 1
            fi
            echo "dispatched ${workflow}"
          done
