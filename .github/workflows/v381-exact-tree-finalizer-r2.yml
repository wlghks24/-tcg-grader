name: V381 Exact Tree Finalizer R2

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: v381-exact-tree-finalizer-r2-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  finalize:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'feature/autonomous-evolution-v381'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Remove one-shot workflow from final tree
        run: git rm -- .github/workflows/v381-exact-tree-finalizer-r2.yml
      - name: Targeted V381 validation
        run: |
          python -m py_compile tablet_autonomous_evolution_v381.py test_tablet_autonomous_evolution_v381.py sync_v376_successor_test_support.py test_tablet_gpt_tcg_grader_sync_v381.py
          python tablet_autonomous_evolution_v381.py --self-test
          python -m unittest -v test_tablet_autonomous_evolution_v381.py test_tablet_gpt_tcg_grader_sync_v381.py
      - name: Related Tablet sync regression
        run: |
          mapfile -t tests < <(find . -maxdepth 1 -type f -name 'test_tablet_gpt_tcg_grader_sync_v*.py' -printf '%f\n' | sort -V)
          python -m unittest -v "${tests[@]}"
      - name: Runtime and quality validation
        run: |
          python tablet_runtime_manifest.py --check --compile
          python quality_review_policy.py --check
      - name: Rebuild exact-tree integrity manifest
        run: |
          python fault_injection_healing.py --manifest
          python repository_integrity_guard.py
          git diff --check
      - name: Commit exact final tree to PR branch
        shell: bash
        run: |
          set -euo pipefail
          git add -- integrity_manifest.json
          git status --short
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'ci: finalize lock-safe v381 exact tree'
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
