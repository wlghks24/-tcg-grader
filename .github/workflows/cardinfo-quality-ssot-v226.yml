name: Card-info quality task SSOT v226

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cardinfo-quality-ssot-v226.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONPATH: ${{ github.workspace }}
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 2
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Align quality learner with canonical task SSOT
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('instagram_tcg_content/cardinfo_quality_learning.py')
          text = path.read_text(encoding='utf-8')
          old = 'from typing import Any\n\nPROJECT = "instagram_card"\nTASK_ID = "6a9b8a22e72c8191849c273e1240378e"\n'
          new = 'from typing import Any\n\nfrom instagram_tcg_content.automation_state_guard import CANONICAL_ID\n\nPROJECT = "instagram_card"\nTASK_ID = CANONICAL_ID\n'
          if new not in text:
              if text.count(old) != 1:
                  raise SystemExit('cardinfo quality task-id anchor mismatch')
              path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Verify quality SSOT and recovery regressions
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile \
            instagram_tcg_content/cardinfo_quality_learning.py \
            instagram_tcg_content/production_recovery_policy.py \
            instagram_tcg_content/automation_state_guard.py
          python -m unittest -v \
            instagram_tcg_content.test_cardinfo_quality_learning \
            instagram_tcg_content.test_production_recovery_policy
          python - <<'PY'
          from instagram_tcg_content import automation_state_guard as state
          from instagram_tcg_content import cardinfo_quality_learning as quality
          from instagram_tcg_content import production_recovery_policy as recovery
          assert quality.TASK_ID == state.CANONICAL_ID
          assert recovery.TASK_ID == state.CANONICAL_ID
          print('canonical card-info task SSOT: PASS')
          PY
      - name: Commit verified production fix
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- instagram_tcg_content/cardinfo_quality_learning.py; then
            echo 'No production change required'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- instagram_tcg_content/cardinfo_quality_learning.py
          git commit -m 'fix: bind card-info quality learning to canonical task'
          git push origin HEAD:main
