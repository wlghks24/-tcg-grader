name: One Shot Deep Audit V4

on:
  push:
    branches: [main]
    paths:
      - 'ONE_SHOT_DEEP_AUDIT_V4.py'
      - '.github/workflows/one-shot-deep-audit-v4.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: one-shot-deep-audit-v4-main
  cancel-in-progress: false

jobs:
  patch-verify-push:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Compile deterministic patcher
        run: python -m py_compile ONE_SHOT_DEEP_AUDIT_V4.py
      - name: Apply deep audit hardening
        run: python ONE_SHOT_DEEP_AUDIT_V4.py
      - name: Compile security-sensitive runtime
        run: |
          python -m py_compile safe_runtime.py security_hardening_apply.py security_self_audit.py test_security_hardening.py
      - name: Run security regression suite
        run: |
          python -m unittest -v test_security_hardening.py
          python security_hardening_apply.py --check
          python security_self_audit.py --fail-on medium --no-memory
      - name: Verify focused deep-audit contracts
        run: |
          python - <<'PY'
          import json
          import os
          import tempfile
          import time
          from pathlib import Path
          import security_self_audit
          from safe_runtime import exclusive_file_lock

          workflow='''name: synthetic\non:\n  push:\n    branches: [main]\njobs:\n  patch:\n    permissions:\n      contents: write\n    runs-on: ubuntu-latest\n    steps:\n      - run: echo ok\n'''
          findings=[]
          security_self_audit.scan_workflow(workflow, findings, '.github/workflows/synthetic.yml')
          assert any(row.get('rule')=='GHA_CONTENTS_WRITE' for row in findings), findings

          with tempfile.TemporaryDirectory() as tmp:
              target=Path(tmp)/'state.json'
              lock=target.with_suffix(target.suffix+'.lock')
              lock.write_text(json.dumps({'pid':os.getpid(),'created_at':'2000-01-01T00:00:00Z'}),encoding='utf-8')
              old=time.time()-120
              os.utime(lock,(old,old))
              try:
                  with exclusive_file_lock(target,timeout_seconds=0.05,stale_seconds=60):
                      raise AssertionError('live lock owner was stolen')
              except TimeoutError:
                  pass
              assert lock.exists()
          print('deep audit v4 focused contracts: OK')
          PY
      - name: Run final tablet preflight
        env:
          TCG_FINAL_SKIP_HEAD_MATCH: '1'
        run: bash VERIFY_TABLET_FINAL.sh
      - name: Verify formatting
        run: git diff --check
      - name: Commit verified source hardening
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add safe_runtime.py security_hardening_apply.py security_self_audit.py test_security_hardening.py
          git diff --cached --quiet && { echo 'No source changes to commit'; exit 0; }
          git commit -m 'security: preserve live lock owners and audit job write tokens'
          git pull --rebase origin main
          git push origin HEAD:main
