name: Apply Auto Market Center
# Legacy integrated feature: automatic source mutation is disabled; run manually only.
on:
  workflow_dispatch:

permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'
      - name: Apply integration
        run: python apply_auto_market_center_patch.py
      - name: Validate integration
        run: |
          grep -q 'auto_market_center.css' index.html
          grep -q 'auto_market_center.js' index.html
          grep -q 'market12section' index.html
          grep -q 'identityCardName' index.html
          grep -q "auto_market_center.js','auto_market_center.css" tcg_updater.py
          python -m py_compile tcg_updater.py
      - name: Commit generated integration
        run: |
          if git diff --quiet -- index.html tcg_updater.py; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html tcg_updater.py
          git commit -m 'feat: connect card recognition to automatic v12 market search'
          git push
