name: BOX Price Evidence V572

on:
  pull_request:
    paths:
      - 'execution/box_price_ui_v572.js'
      - 'execution/box_price_ui_v572.css'
      - 'execution/test_box_price_summary_v572.js'
      - '.github/workflows/box-price-evidence-v572.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-box-price:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Check runtime JavaScript syntax
        run: node --check execution/box_price_ui_v572.js
      - name: Verify BOX pricing contract
        run: node execution/test_box_price_summary_v572.js
