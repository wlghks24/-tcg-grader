name: One-shot v240 SRE performance hardening

on:
  push:
    branches: [selfrefine/sre-performance-v240]
    paths:
      - 'v240_sre_performance_patch.py'
      - 'runtime_sre_metrics.py'
      - 'test_sre_runtime_performance_v240.py'
      - '.github/workflows/v240-sre-performance-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: selfrefine/sre-performance-v240
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'
      - name: Apply bounded patch
        run: python v240_sre_performance_patch.py
      - name: Verify syntax and deterministic burst regression
        run: |
          python -m py_compile tcg_updater.py runtime_sre_metrics.py test_sre_runtime_performance_v240.py
          python -m unittest -v test_sre_runtime_performance_v240.py
          python feature_contract.py
      - name: Verify no legacy synchronous update call remains
        run: |
          python - <<'PY'
          from pathlib import Path
          text=Path('tcg_updater.py').read_text(encoding='utf-8')
          block=text.split('    def _manual_update(self):',1)[1].split('    def _safe_static(self,path):',1)[0]
          if "update_cycle('manual')" in block:
              raise SystemExit('legacy /api/update still performs synchronous collection')
          if "_start_background_update(False)" not in block:
              raise SystemExit('legacy /api/update is not delegated to single-flight background update')
          print('legacy update worker-blocking path: removed')
          PY
      - name: Commit verified patch and remove one-shot helpers
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm v240_sre_performance_patch.py .github/workflows/v240-sre-performance-patch.yml
          git add tcg_updater.py runtime_sre_metrics.py test_sre_runtime_performance_v240.py
          git commit -m 'perf: harden runtime single-flight and overload observability'
          git push origin HEAD:selfrefine/sre-performance-v240
