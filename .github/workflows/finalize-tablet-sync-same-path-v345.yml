name: Finalize Tablet Sync Same-Path v345

on:
  push:
    branches:
      - 'fix/tablet-sync-same-path-v345'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: finalize-tablet-sync-same-path-v345-${{ github.ref }}
  cancel-in-progress: true

jobs:
  finalize:
    if: github.ref == 'refs/heads/fix/tablet-sync-same-path-v345' && github.actor == github.repository_owner
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Require exact repair branch and current main ancestry
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = "fix/tablet-sync-same-path-v345"
          git fetch origin +refs/heads/main:refs/remotes/origin/main
          git merge-base --is-ancestor origin/main HEAD
          test "$(git rev-parse --abbrev-ref HEAD)" != "main"
      - name: Remove one-shot workflow and rebuild final-tree manifest
        shell: bash
        run: |
          set -euo pipefail
          git rm -- .github/workflows/finalize-tablet-sync-same-path-v345.yml
          python fault_injection_healing.py --manifest
          python fault_injection_healing.py --diagnose
          python repository_integrity_guard.py
          python -m unittest -v test_tablet_gpt_tcg_grader_sync_v344.py
          git diff --check
      - name: Commit exact finalizer deletion and manifest reconciliation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- .github/workflows/finalize-tablet-sync-same-path-v345.yml integrity_manifest.json
          actual="$(git diff --cached --name-only | sort)"
          expected="$(printf '%s\n' '.github/workflows/finalize-tablet-sync-same-path-v345.yml' 'integrity_manifest.json' | sort)"
          test "$actual" = "$expected"
          git diff --cached --check
          git commit -m 'Finalize same-path freshness repair v345 manifest'
          git push origin "HEAD:${GITHUB_REF_NAME}"
