name: Apply initial graded-photo no-timeout mode
on:
  push:
    branches: [main]
    paths:
      - apply_first_full_collection_no_timeout.py
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply patch
        run: python apply_first_full_collection_no_timeout.py
      - name: Syntax check
        run: python -m py_compile graded_photo_multi_source.py
      - name: Unit tests
        run: python -m unittest -v test_graded_photo_multi_source.py
      - name: Commit change
        run: |
          if git diff --quiet -- graded_photo_multi_source.py; then
            echo "No collector changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "4189826+github-actions[bot]@users.noreply.github.com"
          git add graded_photo_multi_source.py
          git commit -m "fix: let first graded-photo collection run fully"
          git push
