name: TCG Agent Skills Guard

on:
  pull_request:
    paths:
      - '.agents/skills/**'
      - '.codex/skills/**'
      - 'agent_skills_guard.py'
      - 'AGENT_SKILL_SOURCES.md'
      - '.github/instructions/tcg-repository.instructions.md'
      - '.github/instructions/**'
      - '.graphifyignore'
      - '.github/workflows/agent-skills-guard.yml'
  push:
    branches: [main]
    paths:
      - '.agents/skills/**'
      - '.codex/skills/**'
      - 'agent_skills_guard.py'
      - 'AGENT_SKILL_SOURCES.md'
      - '.github/instructions/tcg-repository.instructions.md'
      - '.github/instructions/**'
      - '.graphifyignore'
      - '.github/workflows/agent-skills-guard.yml'

permissions:
  contents: read

concurrency:
  group: tcg-agent-skills-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'
      - name: Self-test skill guard
        run: python agent_skills_guard.py --self-test
      - name: Verify project skill mirrors and metadata
        run: python agent_skills_guard.py --check
      - name: Verify Graphify control-plane exclusion
        run: |
          grep -Fxq '.agents/' .graphifyignore
          grep -Fxq '.codex/' .graphifyignore
