name: TCG Social CSS Input Guard
on:
  pull_request:
    paths:
      - 'social_event_discovery.py'
      - 'social_event_candidates.json'
      - 'tests/test_social_css_pollution_v134.py'
      - '.github/workflows/tcg-social-css-input-guard.yml'
  push:
    branches: [main]
    paths:
      - 'social_event_discovery.py'
      - 'social_event_candidates.json'
      - 'tests/test_social_css_pollution_v134.py'
      - '.github/workflows/tcg-social-css-input-guard.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-css-candidates:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'
      - name: Verify CSS evidence quarantine
        run: |
          python -m py_compile social_event_discovery.py tests/test_social_css_pollution_v134.py
          python -m unittest discover -s tests -p 'test_social_css_pollution_v134.py' -v
          git diff --check
