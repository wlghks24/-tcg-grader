name: Temporary Integrity Diagnostic v359

on:
  push:
    branches: ['ops/integrity-manifest-sync']

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Regenerate static manifest
        run: python static_integrity_manifest.py --write integrity_manifest.json
      - name: Check regenerated static manifest
        run: python static_integrity_manifest.py --check integrity_manifest.json
      - name: Fault injection diagnosis
        run: python fault_injection_healing.py --diagnose
      - name: Repository integrity guard
        run: python repository_integrity_guard.py
      - name: Static integrity manifest tests
        run: python -m unittest -v test_static_integrity_manifest_v345.py
      - name: Tablet GPT sync tests
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t sync_tests < <(find . -maxdepth 1 -type f -name 'test_tablet_gpt_tcg_grader_sync_v*.py' -printf '%f\n' | sort -V)
          test "${#sync_tests[@]}" -gt 0
          python -m unittest -v "${sync_tests[@]}"
      - name: Diff check
        run: git diff --check
