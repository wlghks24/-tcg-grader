name: Final current-head collection verification dispatch

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/post-hardening-dispatch-v232.yml'

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Dispatch current-main collection verification
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          code=$(curl --silent --show-error --output /tmp/resp --write-out '%{http_code}' \
            --request POST \
            --header 'Accept: application/vnd.github+json' \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${REPO}/actions/workflows/collection-verification-guard.yml/dispatches" \
            --data '{"ref":"main"}')
          if [ "$code" != '204' ]; then
            cat /tmp/resp
            echo "dispatch failed: HTTP ${code}" >&2
            exit 1
          fi
          echo 'dispatched collection-verification-guard.yml on current main'
