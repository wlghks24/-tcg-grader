name: One-shot v237 source identity migration hardening

on:
  push:
    branches:
      - selfrefine/tag-pricing-source-v236
    paths:
      - '.github/workflows/v237-source-identity-migration.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: selfrefine/tag-pricing-source-v236
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'
      - name: Apply source identity hardening
        run: python v237_source_identity_repair.py
      - name: Run grading regression
        run: |
          python -m py_compile grading_company_watch.py test_grading_company_watch_v215.py
          python -m unittest -v test_grading_company_watch_v215.py test_grading_watch_integration_v220.py
      - name: Reverify live TAG collection
        run: |
          python - <<'PY'
          import json
          import grading_company_watch as watch
          source = next(row for row in watch.WATCH_SOURCES['TAG'] if row['id'] == 'tag-pricing')['url']
          raw = watch._fetch_raw(source)
          rows = watch.parse_services('TAG', 'US', 'USD', watch._text(raw), source)
          required = {'Basic', 'Standard', 'Express', 'Priority', 'Walkthrough'}
          if not required.issubset({row['name'] for row in rows}):
              raise SystemExit('TAG live tier parse incomplete')
          print(json.dumps(rows, ensure_ascii=False))
          PY
      - name: Commit hardening
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add grading_company_watch.py test_grading_company_watch_v215.py
          git commit -m 'fix: preserve grading source identity across URL migration'
          git push origin HEAD:selfrefine/tag-pricing-source-v236
