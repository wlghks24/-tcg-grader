name: Apply graded photo image parser v2
on:
  push:
    branches: [main]
    paths:
      - 'apply_graded_photo_image_parser_v2.py'
      - '.github/workflows/apply-graded-photo-image-parser-v2.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Apply image parser v2 when missing
        run: |
          if grep -q 'def _ebay_public_rows' graded_photo_multi_source.py; then
            echo 'Image parser v2 already integrated; validation only'
          else
            python apply_graded_photo_image_parser_v2.py
          fi
      - run: python -m py_compile graded_photo_multi_source.py
      - run: |
          if git diff --quiet; then
            echo 'No changes'
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add graded_photo_multi_source.py
          git commit -m 'fix: improve graded photo image acquisition'
          git push
