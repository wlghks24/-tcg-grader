name: Apply graded photo image parser v2
# Legacy integrated feature: automatic source mutation is disabled; run manually only.
on:
  workflow_dispatch:

permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Apply image parser v2 when missing
        run: |
          if grep -q 'def _ebay_public_rows' graded_photo_multi_source.py; then
            echo 'Image parser v2 already integrated; validation only'
          else
            python apply_graded_photo_image_parser_v2.py
          fi
      - run: python -m py_compile graded_photo_multi_source.py
      - run: |
          if git diff --quiet; then
            echo 'No changes'
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add graded_photo_multi_source.py
          git commit -m 'fix: improve graded photo image acquisition'
          git push
