name: Apply graded photo image parser v2
on:
  push:
    branches: [main]
    paths:
      - 'apply_graded_photo_image_parser_v2.py'
      - '.github/workflows/apply-graded-photo-image-parser-v2.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python apply_graded_photo_image_parser_v2.py
      - run: python -m py_compile graded_photo_multi_source.py
      - run: |
          if git diff --quiet; then
            echo 'No changes'
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add graded_photo_multi_source.py
          git commit -m 'fix: improve graded photo image acquisition'
          git push
