name: Apply v300 generation ambiguity guard

on:
  push:
    branches: [audit/unknown-region-generation-v300]
    paths:
      - '.github/workflows/apply-v300-generation-ambiguity.yml'

permissions:
  contents: write

jobs:
  apply-test-finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 2
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'

      - name: Apply v300 production patch and focused regression
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          js = Path('card_identity_recognition.js')
          text = js.read_text(encoding='utf-8')

          old = """function generationByYear(year,region){\n if(!Number.isInteger(year))return null;\n if(generationRegion(region)==='JP'){"""
          new = """function generationByYear(year,region){\n if(!Number.isInteger(year))return null;\n const resolvedRegion=generationRegion(region);\n // Japan can enter a TCG era one calendar year before KR/US.\n // A year-only observation at those boundaries is ambiguous without region.\n if(resolvedRegion==='UNKNOWN'&&[2006,2010,2013,2016,2019].includes(year))return null;\n if(resolvedRegion==='JP'){"""
          if old not in text:
              raise SystemExit('generationByYear patch anchor missing')
          text = text.replace(old, new, 1)

          legacy_anchor = " if(year&&year<2007)return {status:'legacy'"
          ambiguity = " if(year&&generationRegion(input?.region)==='UNKNOWN'&&[2006,2010,2013,2016,2019].includes(year))return {status:'unknown',game:'pokemon',generation:null,generation_label:'세대 확인 필요',series:'지역 확인 필요',era:'AMBIGUOUS',expansion_code:'',regulation_mark:'',year,confidence:0,confidence_level:'unknown',basis:[`©/제작연도 ${year}`],note:'일본과 KR/US의 TCG 세대 전환연도가 달라 지역 확인 전에는 세대를 단정하지 않습니다.'};\n"
          if legacy_anchor not in text:
              raise SystemExit('ambiguous-year insertion anchor missing')
          text = text.replace(legacy_anchor, ambiguity + legacy_anchor, 1)
          js.write_text(text, encoding='utf-8')

          test = Path('test_generation_unknown_region_v300.py')
          test.write_text(r'''from __future__ import annotations

import json
import subprocess
from pathlib import Path
import unittest

ROOT = Path(__file__).resolve().parent


class UnknownRegionGenerationV300Tests(unittest.TestCase):
    def _run(self):
        script = r"""
const fs=require('fs'),vm=require('vm');
global.window={};
global.document={readyState:'loading',addEventListener(){},getElementById(){return null;}};
global.localStorage={getItem(){return null;},setItem(){}};
global.Option=function(){};
vm.runInThisContext(fs.readFileSync('card_identity_recognition.js','utf8'),{filename:'card_identity_recognition.js'});
const api=global.window.TCGPokemonGeneration;
const ambiguous=[2006,2010,2013,2016,2019].map(year=>api.infer({game:'pokemon',ocr_text:`©${year} Pokémon`}));
const knownJp=api.infer({game:'pokemon',region:'JP',ocr_text:'©2019 Pokémon'});
const knownKr=api.infer({game:'pokemon',region:'KR',ocr_text:'©2019 Pokémon'});
const knownUs=api.infer({game:'pokemon',region:'US',ocr_text:'©2019 Pokémon'});
const stable=api.infer({game:'pokemon',ocr_text:'©2020 Pokémon'});
process.stdout.write(JSON.stringify({ambiguous,knownJp,knownKr,knownUs,stable}));
"""
        proc = subprocess.run(['node','-e',script], cwd=ROOT, text=True, capture_output=True, check=True, timeout=30)
        return json.loads(proc.stdout)

    def test_transition_years_without_region_do_not_invent_generation(self):
        result = self._run()
        for row in result['ambiguous']:
            self.assertEqual('unknown', row['status'])
            self.assertIsNone(row['generation'])
            self.assertEqual('AMBIGUOUS', row['era'])
            self.assertIn('지역', row['note'])

    def test_known_region_and_stable_year_contracts_are_preserved(self):
        result = self._run()
        self.assertEqual(8, result['knownJp']['generation'])
        self.assertEqual(7, result['knownKr']['generation'])
        self.assertEqual(7, result['knownUs']['generation'])
        self.assertEqual(8, result['stable']['generation'])


if __name__ == '__main__':
    unittest.main(verbosity=2)
''', encoding='utf-8')
          PY

          node --check card_identity_recognition.js
          python -m unittest -v \
            test_generation_unknown_region_v300.py \
            test_card_core_crosscheck_v291.py \
            test_card_generation_evidence_v292.py \
            test_card_core_crosscheck_v295.py \
            test_card_market_edition_v297.py \
            test_card_probability_ui_v298.py \
            test_card_regression_gate_v299.py

      - name: Remove transient workflow and refresh integrity
        shell: bash
        run: |
          set -euo pipefail
          git rm -- .github/workflows/apply-v300-generation-ambiguity.yml
          python fault_injection_healing.py --manifest
          python fault_injection_healing.py --diagnose
          git add -- card_identity_recognition.js test_generation_unknown_region_v300.py integrity_manifest.json
          git diff --cached --check

      - name: Commit finalized v300 tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Fail closed ambiguous unknown-region generation years (v300)'
          git push origin HEAD:audit/unknown-region-generation-v300
