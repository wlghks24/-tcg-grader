name: Verify retry reason UI v160

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-retry-reason-ui-v160.yml'
      - 'graded_photo_retry_reason_v160.py'
      - 'test_graded_photo_retry_reason_v160.py'
      - 'graded_photo_existing_revalidation_v159.py'
      - 'test_graded_photo_existing_revalidation_v159.py'
      - 'tcg_updater.py'
      - 'tcg_updater_v135.py'
      - 'REPAIR_V135_SERVER.sh'
  pull_request:
    paths:
      - '.github/workflows/apply-retry-reason-ui-v160.yml'
      - 'graded_photo_retry_reason_v160.py'
      - 'test_graded_photo_retry_reason_v160.py'
      - 'graded_photo_existing_revalidation_v159.py'
      - 'test_graded_photo_existing_revalidation_v159.py'
      - 'tcg_updater.py'
      - 'tcg_updater_v135.py'
      - 'REPAIR_V135_SERVER.sh'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - name: Verify retry reason integration
        run: |
          python -m py_compile graded_photo_retry_reason_v160.py graded_photo_existing_revalidation_v159.py tcg_updater.py tcg_updater_v135.py
          python -m unittest -v test_graded_photo_retry_reason_v160.py test_graded_photo_existing_revalidation_v159.py
          grep -q 'graded_photo_retry_reason_v160' tcg_updater.py
          grep -q "'retry_reason_explainer': True" tcg_updater_v135.py
          grep -q 'graded_photo_retry_reason_v160.py' REPAIR_V135_SERVER.sh
