name: Apply same-host link fallback v189

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-link-same-host-fallback-v189.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply v189 patch
        run: python apply_link_same_host_fallback_v189.py
      - name: Validate v189
        run: |
          python test_link_audit_hardening_v184.py
          python test_link_same_host_fallback_v189.py
          python -m py_compile validate_external_links.py auto_update_all.py
          git diff --check
      - name: Commit v189 runtime changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add validate_external_links.py
          git diff --cached --quiet && exit 0
          git commit -m 'fix: repair retired deep links with verified same-host home v189'
          git push origin HEAD:main
