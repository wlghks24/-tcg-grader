name: TCG PC Auditor Offline Regression

on:
  pull_request:
    paths:
      - "tools/pc_version_auditor/**"
      - ".github/workflows/tcg-pc-auditor-offline-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tcg-pc-auditor-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pc-auditor-regression:
    name: PC Auditor isolated Git tests
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11"
      - name: Run PC-only real-Git unit and adversarial regression suite
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          PYTHONNOUSERSITE: "1"
        run: |
          python -V
          git --version
          python -m unittest discover -s tools/pc_version_auditor/tests -p 'test_*.py' -v
