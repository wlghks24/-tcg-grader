name: Apply Release Parser Recovery v209
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-release-parser-recovery-v209.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply parser recovery and learning compatibility
        run: |
          python fix_release_parser_learning_label_v209.py
          python apply_release_parser_recovery_v208.py
      - name: Compile changed modules
        run: python -m py_compile update_releases.py release_parser_learning.py
      - name: Verify safe strategy memory behavior
        run: |
          python - <<'PY'
          import json, tempfile
          from pathlib import Path
          import release_parser_learning as l
          root = Path(tempfile.mkdtemp())
          path = root / 'memory.json'
          assert l.record_attempt(path, 'Pokémon JP', 'official_result_api_v1', allowed_strategies=('html_chain_v1','official_result_api_v1'), success=True, row_count=7, outcome='recovered', fingerprint='0123456789abcdef')
          summary = l.public_summary(path, {'Pokémon JP': ('html_chain_v1','official_result_api_v1')})
          assert summary['sources']['Pokémon JP']['preferred_strategy'] == 'official_result_api_v1', summary
          raw = json.loads(path.read_text(encoding='utf-8'))
          raw['sources']['Pokémon JP']['last_successful_strategy'] = 'unknown_disk_code'
          path.write_text(json.dumps(raw, ensure_ascii=False), encoding='utf-8')
          order = l.strategy_order(path, 'Pokémon JP', ('html_chain_v1','official_result_api_v1'), ('html_chain_v1','official_result_api_v1'))
          assert 'unknown_disk_code' not in order and order[0] == 'html_chain_v1', order
          print('memory_summary=', summary)
          PY
      - name: Smoke-test live learned Pokemon recovery
        env:
          TCG_HTTP_TIMEOUT: '30'
        run: |
          python - <<'PY'
          import tempfile
          from pathlib import Path
          import update_releases as u
          u.PARSER_MEMORY = Path(tempfile.mkdtemp()) / 'parser-memory.json'
          u.PARSER_RUN_EVENTS.clear()
          rows = u.collect_pokemon_jp()
          assert rows, 'Pokemon JP recovery produced zero rows'
          assert all(r.get('source','').startswith('https://www.pokemon-card.com/') for r in rows)
          assert any(r.get('name') == '30th CELEBRATION' for r in rows), rows[:5]
          first = list(u.PARSER_RUN_EVENTS)
          summary = u.parser_public_summary(u.PARSER_MEMORY, {'Pokémon JP': u.POKEMON_JP_STRATEGIES})
          preferred = summary['sources']['Pokémon JP']['preferred_strategy']
          assert preferred == 'official_result_api_v1', summary
          u.PARSER_RUN_EVENTS.clear()
          rows2 = u.collect_pokemon_jp()
          assert rows2, 'learned retry produced zero rows'
          assert u.PARSER_RUN_EVENTS and u.PARSER_RUN_EVENTS[0]['strategy'] == 'official_result_api_v1', u.PARSER_RUN_EVENTS
          print('first_events=', first)
          print('learned_events=', u.PARSER_RUN_EVENTS)
          print('preferred=', preferred, 'rows=', len(rows2))
          PY
      - name: Commit recovery implementation
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add update_releases.py release_parser_learning.py
          git commit -m 'fix: learn and auto-recover release parser drift v209'
          git push origin HEAD:main
