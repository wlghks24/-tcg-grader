name: v292 Cache Contract Fix

on:
  push:
    branches:
      - audit/card-core-crosscheck-v292

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: audit/card-core-crosscheck-v292
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.11'
      - name: Align service-worker cache contract and regenerate integrity
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path=Path('sw.js')
          text=path.read_text(encoding='utf-8')
          old="const CACHE='tcg-v292-card-core-runtime';"
          new="const CACHE='tcg-v292-network-first-runtime';"
          if new not in text:
              if old not in text:
                  raise SystemExit('expected v292 cache marker missing')
              text=text.replace(old,new,1)
              path.write_text(text,encoding='utf-8')
          PY
          python test_runtime_delivery_guards.py
          python fault_injection_healing.py --manifest
          python fault_injection_healing.py --diagnose
          rm -f .github/workflows/v292-cache-contract-fix.yml
          git add -- sw.js integrity_manifest.json .github/workflows/v292-cache-contract-fix.yml
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Fix v292 service-worker delivery contract'
          git push origin HEAD:audit/card-core-crosscheck-v292
