name: Apply graded-photo game inference v188

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-graded-photo-game-inference-v188.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install runtime test dependency
        run: python -m pip install pillow
      - name: Apply v188 patch
        run: python apply_graded_photo_game_inference_v188.py
      - name: Validate v188
        run: |
          python test_graded_photo_game_inference_v188.py
          python -m py_compile graded_photo_multi_source.py graded_photo_evidence.py
          git diff --check
      - name: Commit v188 runtime changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add graded_photo_multi_source.py
          git diff --cached --quiet && exit 0
          git commit -m 'feat: recover graded-photo game labels safely v188'
          git push origin HEAD:main
