name: Diagnose Root Regressions v315

on:
  push:
    branches: [card-intelligence-v315-precision]
    paths:
      - '.github/workflows/diagnose-root-regressions-v315.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: requirements.txt
      - name: Install test dependencies
        run: |
          python -m pip install --disable-pip-version-check -r requirements.txt
          python -m pip install --disable-pip-version-check pyyaml
      - name: Print only failing root regressions
        shell: bash
        run: |
          set +e
          shopt -s nullglob
          failed=0
          root_tests=(test_*.py)
          for file in "${root_tests[@]}"; do
            out="$(mktemp)"
            python "$file" >"$out" 2>&1
            rc=$?
            if [ "$rc" -ne 0 ]; then
              echo "::error file=${file}::root regression failed with exit code ${rc}"
              echo "===== FAIL ${file} ====="
              tail -n 160 "$out"
              failed=1
            fi
            rm -f "$out"
          done
          if [ "$failed" -ne 0 ]; then
            exit 1
          fi
          echo "All isolated root regressions passed."
