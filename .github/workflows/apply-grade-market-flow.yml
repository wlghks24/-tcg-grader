name: Apply Grade Market Flow
on:
  push:
    branches: [main]
    paths:
      - grade_market_flow.js
      - grade_market_flow.css
      - apply_grade_market_flow_patch.py
      - .github/workflows/apply-grade-market-flow.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Apply UI integration
        run: python apply_grade_market_flow_patch.py
      - name: Validate integration
        run: |
          grep -q 'grade_market_flow.css' index.html
          grep -q 'grade_market_flow.js' index.html
          grep -q 'identityCardName' index.html
          grep -q 'identityCardNumber' index.html
          grep -q 'gradingEconomics' index.html
          grep -q 'tcgLastGrades' index.html
          grep -q "'grade_market_flow.js'" tcg_updater.py
          grep -q "'grade_market_flow.css'" tcg_updater.py
      - name: Commit generated integration
        run: |
          if git diff --quiet -- index.html tcg_updater.py; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html tcg_updater.py
          git commit -m 'fix: serve automatic grading market flow assets'
          git push
