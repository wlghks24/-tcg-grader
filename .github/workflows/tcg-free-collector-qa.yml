name: TCG free data-collection quality gate

on:
  push:
    branches:
      - feat/v628-official-sealed-proof-20261012
    paths:
      - "tcg_*"
      - "official_box_catalog_v626.*"
      - "execution/official_box_coverage_audit_v623.py"
      - "test_tcg_*"
      - ".github/workflows/tcg-free-collector-qa.yml"
  pull_request:
    paths:
      - "tcg_*"
      - "official_box_catalog_v626.*"
      - "execution/official_box_coverage_audit_v623.py"
      - "test_tcg_*"
      - ".github/workflows/tcg-free-collector-qa.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tcg-free-data-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  offline-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - name: Python version
        run: python3 --version
      - name: Node version
        run: node --version
      - name: Compile free collector Python files
        run: |
          python3 -m py_compile tcg_multi_source_queue_v639.py tcg_tcgdex_sets_v640.py tcg_scryfall_sets_v643.py tcg_ygoprodeck_sets_v651.py tcg_source_audit_v633.py tcg_source_staging_v642.py tcg_event_intelligence_v644.py tcg_event_rss_v647.py tcg_manufacturer_card_discovery_v650.py tcg_official_overlay_v657.py tcg_official_overlay_v659.py tcg_card_trade_evidence_v660.py tcg_tcgdex_card_ids_v661.py
      - name: Python standard library regression (offline, no API calls)
        run: |
          python3 -m unittest -v \
            test_tcg_sealed_box_v638 \
            test_tcg_collection_v641 \
            test_tcg_source_staging_v642 \
            test_tcg_scryfall_v643 \
            test_tcg_official_coverage_v649 \
            test_tcg_manufacturer_card_discovery_v650 \
            test_tcg_ygoprodeck_sets_v651 \
            test_tcg_coverage_radar_v652 \
            test_tcg_jp_manufacturer_box_v654 \
            test_tcg_source_truth_v655 \
            test_tcg_event_category_v648 \
            test_tcg_event_intelligence_v646 \
            test_tcg_event_rss_v647 \
            test_tcg_official_overlay_v657 \
            test_tcg_v658_alignment \
            test_tcg_v659_v660 \
            test_tcg_tcgdex_card_ids_v661
      - name: JavaScript syntax and standalone module smoke tests
        run: |
          node --check tcg_coverage_radar_v652.js
          node --check tcg_source_research_v634.js
          node --check tcg_30_game_catalog_v629.js
          node --check official_box_catalog_v626.js
          node --check tcg_event_intelligence_v646.js
          node --check tcg_30_game_catalog_v629.js
