name: Apply Release Parser Recovery v208
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-release-parser-recovery-v208.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply verified release parser recovery
        run: python apply_release_parser_recovery_v208.py
      - name: Compile changed modules
        run: python -m py_compile update_releases.py release_parser_learning.py
      - name: Smoke-test learned Pokemon recovery
        env:
          TCG_HTTP_TIMEOUT: '30'
        run: |
          python - <<'PY'
          import tempfile
          from pathlib import Path
          import update_releases as u
          u.PARSER_MEMORY = Path(tempfile.mkdtemp()) / 'parser-memory.json'
          u.PARSER_RUN_EVENTS.clear()
          rows = u.collect_pokemon_jp()
          assert rows, 'Pokemon JP recovery produced zero rows'
          assert all(r.get('source','').startswith('https://www.pokemon-card.com/') for r in rows)
          assert any(r.get('name') == '30th CELEBRATION' for r in rows), rows[:5]
          first = list(u.PARSER_RUN_EVENTS)
          u.PARSER_RUN_EVENTS.clear()
          rows2 = u.collect_pokemon_jp()
          assert rows2, 'learned retry produced zero rows'
          summary = u.parser_public_summary(u.PARSER_MEMORY, {'Pokémon JP': u.POKEMON_JP_STRATEGIES})
          source = summary['sources'].get('Pokémon JP', {})
          assert source.get('preferred_strategy') == 'official_result_api_v1', summary
          print('first_events=', first)
          print('second_events=', u.PARSER_RUN_EVENTS)
          print('preferred=', source.get('preferred_strategy'), 'rows=', len(rows2))
          PY
      - name: Commit recovery implementation
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add update_releases.py
          git commit -m 'fix: auto-recover learned release parser drift v208'
          git push origin HEAD:main
