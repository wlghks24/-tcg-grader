name: Card Region Conflict V317

on:
  push:
    branches:
      - fix/card-region-conflict-v317

permissions:
  contents: write

jobs:
  apply-test-finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/card-region-conflict-v317
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install focused dependency
        run: python -m pip install --disable-pip-version-check pillow
      - name: Apply v317 patch
        run: python .github/scripts/card_region_conflict_failclosed_v317.py
      - name: Remove temporary bootstrap files before manifest
        run: |
          rm -f .github/workflows/card-region-conflict-v317.yml
          rm -f .github/scripts/card_region_conflict_failclosed_v317.py
      - name: Refresh integrity manifest on final tree
        run: python fault_injection_healing.py --manifest
      - name: Focused card identity and market regressions
        run: |
          python -m unittest -v \
            test_card_region_conflict_failclosed_v317.py \
            test_card_identity_market_precision_v309.py \
            test_card_core_crosscheck_v291.py \
            test_card_core_crosscheck_v292.py \
            test_card_core_crosscheck_v295.py \
            test_card_edition_precision_v302.py \
            test_card_region_generation_precision_v306.py \
            test_multi_market_price_collector.py
          node verify_pokemon_generation_runtime.js
      - name: Diff sanity before finalization
        run: git diff --check
      - name: Commit and push exact final v317 tree
        env:
          BRANCH: fix/card-region-conflict-v317
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 1
          fi
          git commit -m "fix: fail closed on card edition evidence conflicts v317"
          git push origin "HEAD:${BRANCH}"
      - name: Verify committed final tree is clean
        run: |
          test -z "$(git status --porcelain)"
          test ! -e .github/workflows/card-region-conflict-v317.yml
          test ! -e .github/scripts/card_region_conflict_failclosed_v317.py
      - name: Full current runtime verification on committed tree
        run: python verify_current_runtime.py --passes 1
