name: Apply Multi Market Prices
# Legacy integrated feature: automatic source mutation is disabled; run manually only.
on:
  workflow_dispatch:

permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'
      - name: Apply integration
        run: python apply_multi_market_prices_patch.py
      - name: Validate
        run: |
          grep -q 'multi_market_prices.css' index.html
          grep -q 'multi_market_prices.js' index.html
          grep -q '/api/multi-market-prices' tcg_updater.py
          grep -q "multi_market_prices.js','multi_market_prices.css" tcg_updater.py
          python - <<'PY'
          from pathlib import Path
          html=Path('index.html').read_text(encoding='utf-8')
          assert html.count('multi_market_prices.css') == 1, 'duplicate multi-market CSS tag'
          assert html.count('multi_market_prices.js') == 1, 'duplicate multi-market JS tag'
          PY
          python -m py_compile tcg_updater.py multi_market_price_collector.py apply_multi_market_prices_patch.py
          python -m unittest -v test_multi_market_price_collector.py test_market_reference_sources_v130.py test_apply_patch_idempotency.py
      - name: Commit generated integration
        run: |
          if git diff --quiet -- index.html tcg_updater.py .gitignore; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html tcg_updater.py .gitignore
          git commit -m 'feat: connect multi-market prices to v12 search'
          git push
