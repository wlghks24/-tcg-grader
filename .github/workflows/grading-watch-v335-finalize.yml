name: Grading Watch v335 Finalize

on:
  push:
    branches:
      - fix/grading-watch-protected-publish-v335
    paths:
      - '.github/workflows/grading-company-watch.yml'
      - 'test_grading_company_watch_protected_publish_v335.py'
      - '.github/workflows/grading-watch-v335-finalize.yml'

permissions:
  contents: write

concurrency:
  group: grading-watch-v335-finalize
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/grading-watch-protected-publish-v335
          fetch-depth: 0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'

      - name: Final-tree validation and manifest refresh
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin +refs/heads/main:refs/remotes/origin/main
          base_sha="$(git merge-base HEAD origin/main)"
          if [ "${base_sha}" != "$(git rev-parse origin/main)" ]; then
            echo 'main advanced before finalization; refusing stale finalize'
            exit 1
          fi

          python -m unittest -v test_grading_company_watch_protected_publish_v335.py
          python -m unittest -v \
            test_safe_runtime_redirect_diagnostics_v253.py \
            test_grading_company_watch_v215.py \
            test_grading_company_watch_resilient_v257.py \
            test_grading_company_health_diagnostics_v252.py \
            test_grading_costs_live.py
          node --check grading_costs_live.js

          git rm -- .github/workflows/grading-watch-v335-finalize.yml
          python fault_injection_healing.py --manifest
          python fault_injection_healing.py --diagnose
          python repository_integrity_guard.py
          if ! python verify_current_runtime.py --passes 1; then
            python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path('CURRENT_RUNTIME_VERIFICATION_REPORT.json').read_text(encoding='utf-8'))
          for verification_pass in report.get('passes', []):
              for check in verification_pass.get('checks', []):
                  if not check.get('ok'):
                      print(f"failed_check={check.get('name')}")
                      print(check.get('detail', ''))
          PY
            exit 1
          fi
          git diff --check

          git add -A
          if git diff --cached --quiet; then
            echo 'nothing to finalize'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Finalize grading watch protected publish v335'
          git push origin HEAD:fix/grading-watch-protected-publish-v335
