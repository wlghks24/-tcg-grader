name: Apply Source Gap V6C

on:
  push:
    branches: [selfrefine/source-gap-learning-v6]
    paths:
      - '.github/workflows/apply-source-gap-v6c.yml'

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: selfrefine/source-gap-learning-v6
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Apply source patch
        run: python apply_source_gap_v6.py
      - name: Compile and test
        run: |
          python -m py_compile provider_health_learning.py multi_channel_agent.py multi_route_event_discovery.py social_event_discovery.py auto_pipeline_runner.py test_source_gap_taxonomy_v6.py
          python -m unittest -v test_provider_source_gap_learning_v5.py
          python -m unittest -v test_promo_event_keyword_coverage_v5.py
          python -m unittest -v test_extended_discovery_channels_v5.py
          python -m unittest -v test_source_gap_taxonomy_v6.py
      - name: Commit verified source changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add provider_health_learning.py multi_channel_agent.py multi_route_event_discovery.py social_event_discovery.py auto_pipeline_runner.py .github/workflows/provider-source-gap-learning-guard.yml
          git commit -m 'selfrefine: track stock entry broadcast and Facebook gaps'
          git push origin HEAD:selfrefine/source-gap-learning-v6
