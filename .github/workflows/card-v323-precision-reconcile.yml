name: Card v323 Variant Price Precision Reconcile

on:
  push:
    branches:
      - fix/card-variant-price-precision-v323

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout precision branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/card-variant-price-precision-v323
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'

      - name: Apply v323 precision patch and verify
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python -m pip install --disable-pip-version-check pillow
          python tmp_v323_patch.py
          git rm tmp_v323_patch.py .github/workflows/card-v323-precision-reconcile.yml
          python fault_injection_healing.py --manifest
          python -m py_compile multi_market_price_collector.py test_card_variant_market_precision_v323.py verify_current_runtime.py
          python -m unittest -v test_card_variant_market_precision_v323.py test_multi_market_price_collector.py test_card_promo_precision_v322.py test_card_identity_ambiguity_v320.py
          python security_self_audit.py --no-memory --fail-on high
          python repository_integrity_guard.py
          python verify_current_runtime.py --passes 1
          git diff --check
          git add -A
          git commit -m 'fix: separate card print variants and edition evidence v323'
          git push origin HEAD:fix/card-variant-price-precision-v323
