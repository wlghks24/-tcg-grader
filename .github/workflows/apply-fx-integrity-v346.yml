name: Apply FX Integrity v346

on:
  push:
    branches:
      - fix/v346-fx-integrity
    paths:
      - .github/workflows/apply-fx-integrity-v346.yml

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install declared runtime dependency
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Capture current-main legacy baseline
        run: |
          git worktree add --detach ../main-baseline origin/main
          (cd ../main-baseline && python verify_all_legacy_v99.py > /tmp/legacy-main.log 2>&1) || true
      - name: Apply bounded patch
        run: python apply_fx_integrity_v346_patch.py
      - name: Refresh CSP hashes
        run: python csp_hash_hardening.py
      - name: Compile changed Python paths
        run: python -m py_compile fx_policy.py update_exchange_rates.py multi_market_price_collector.py auto_repair_engine.py auto_update_all.py test_fx_integrity_v346.py test_edition_fx_failclosed_v328.py
      - name: Targeted regressions
        run: python -m unittest -v test_fx_integrity_v346.py test_edition_fx_failclosed_v328.py test_error_recovery_learning_v134.py
      - name: Legacy non-regression against current main
        run: |
          python verify_all_legacy_v99.py > /tmp/legacy-head.log 2>&1 || true
          python - <<'PY'
          from pathlib import Path

          def failures(path):
              rows=[]
              for line in Path(path).read_text(encoding='utf-8',errors='replace').splitlines():
                  if line.startswith('- 실패: '):
                      label=line[len('- 실패: '):].split(' · ',1)[0].strip()
                      rows.append(label)
              return set(rows)

          baseline=failures('/tmp/legacy-main.log')
          head=failures('/tmp/legacy-head.log')
          new=sorted(head-baseline)
          print(f'legacy baseline failures={len(baseline)} head failures={len(head)} new={len(new)}')
          if new:
              print('new legacy failures:')
              for item in new:
                  print('-',item)
              raise SystemExit(1)
          PY
      - name: CSP and diff validation
        run: |
          python csp_hash_hardening.py --check
          git diff --check
      - name: Commit validated generated patch
        run: |
          if git diff --quiet -- multi_market_price_collector.py auto_repair_engine.py auto_update_all.py index.html; then
            echo 'Expected v346 patch produced no diff' >&2
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add multi_market_price_collector.py auto_repair_engine.py auto_update_all.py index.html
          git commit -m 'fix: enforce FX provenance across consumers'
          git push origin HEAD:fix/v346-fx-integrity
