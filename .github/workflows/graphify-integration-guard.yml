name: Graphify Integration Guard
on:
  push:
    branches: [main]
    paths:
      - 'SETUP_GRAPHIFY_TERMUX.sh'
      - 'GRAPHIFY_UPDATE.sh'
      - 'GRAPHIFY_SELF_HEAL.py'
      - 'GRAPHIFY_CHATGPT_GUIDE.md'
      - '.graphifyignore'
      - '.gitignore'
      - 'ANDROID_UPDATE_AND_START.sh'
      - '.github/workflows/graphify-integration-guard.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GRAPHIFY_FIXTURE: /tmp/graphify-fixture
      GRAPHIFY_VERSION: '0.9.53'

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validate shell and Python syntax
        run: |
          bash -n SETUP_GRAPHIFY_TERMUX.sh
          bash -n GRAPHIFY_UPDATE.sh
          bash -n ANDROID_UPDATE_AND_START.sh
          python -m py_compile GRAPHIFY_SELF_HEAL.py
          python GRAPHIFY_SELF_HEAL.py --self-test

      - name: Verify required safety contracts
        run: |
          grep -Fq 'GRAPHIFY_VERSION="${GRAPHIFY_VERSION:-0.9.53}"' SETUP_GRAPHIFY_TERMUX.sh
          grep -Fq 'graphify codex install --project' SETUP_GRAPHIFY_TERMUX.sh
          grep -Fq 'graphify hook install' SETUP_GRAPHIFY_TERMUX.sh
          grep -Fq 'TCG_GRAPHIFY_POST_MERGE' SETUP_GRAPHIFY_TERMUX.sh
          grep -Fq 'GRAPHIFY_UPDATE.sh --quiet' SETUP_GRAPHIFY_TERMUX.sh
          grep -Fq 'run_graphify update . --force || return 21' GRAPHIFY_UPDATE.sh
          grep -Fq 'run_graphify extract . --code-only || return 22' GRAPHIFY_UPDATE.sh
          grep -Fq 'run_graphify cluster-only . --no-label || return 23' GRAPHIFY_UPDATE.sh
          grep -Fq 'GRAPHIFY_DISABLE_SELF_HEAL' GRAPHIFY_UPDATE.sh
          grep -Fq '자가복구 적용 후 실제 지도 갱신을 1회 재검증' GRAPHIFY_UPDATE.sh
          grep -Fq 'APPROVED_STRATEGIES' GRAPHIFY_SELF_HEAL.py
          grep -Fq 'blocked unapproved strategy' GRAPHIFY_SELF_HEAL.py
          grep -Fq 'failure_signature' GRAPHIFY_SELF_HEAL.py
          grep -Fq 'restore_quarantined' GRAPHIFY_SELF_HEAL.py
          grep -Fq 'graphify_self_heal_memory.json' .gitignore
          grep -Fq 'graphify_self_heal_candidates.json' .gitignore
          grep -Fq '.graphify_recovery/' .gitignore

      - name: Install repository-verified Graphify version
        run: |
          python -m pip install --disable-pip-version-check "graphifyy==$GRAPHIFY_VERSION"
          graphify --version | tee /tmp/graphify-version.txt
          grep -Eq "(^|[^0-9])${GRAPHIFY_VERSION//./\\.}([^0-9]|$)" /tmp/graphify-version.txt
          graphify hook --help >/dev/null
          graphify update --help >/dev/null
          graphify extract --help >/dev/null
          graphify cluster-only --help >/dev/null
          graphify codex install --help >/dev/null
          graphify agents install --help >/dev/null

      - name: Prepare Graphify fixture repository
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$GRAPHIFY_FIXTURE"
          mkdir -p "$GRAPHIFY_FIXTURE"
          cd "$GRAPHIFY_FIXTURE"
          git init -q
          git config user.name graphify-guard
          git config user.email graphify-guard@example.invalid
          cat > models.py <<'PY'
          class Card:
              def __init__(self, score: float):
                  self.score = score

              def needs_review(self) -> bool:
                  return self.score < 9.0
          PY
          cat > service.py <<'PY'
          from models import Card

          def card_grade(score: float) -> str:
              card = Card(score)
              return "review" if card.needs_review() else "high"

          def summarize(scores: list[float]) -> list[str]:
              return [card_grade(score) for score in scores]
          PY
          git add models.py service.py
          git commit -qm initial
          cp "$GITHUB_WORKSPACE/GRAPHIFY_UPDATE.sh" .
          cp "$GITHUB_WORKSPACE/GRAPHIFY_SELF_HEAL.py" .

      - name: Exercise Codex and Agent Skills project install
        shell: bash
        run: |
          set -euo pipefail
          cd "$GRAPHIFY_FIXTURE"
          graphify codex install --project
          graphify agents install --project
          test -f AGENTS.md

      - name: Exercise complete project map wrapper
        shell: bash
        run: |
          set -euo pipefail
          cd "$GRAPHIFY_FIXTURE"
          bash ./GRAPHIFY_UPDATE.sh
          python ./GRAPHIFY_SELF_HEAL.py --validate-only
          test -s graphify-out/graph.json
          test -s graphify-out/GRAPH_REPORT.md
          test -s graphify-out/graph.html

      - name: Exercise incremental wrapper refresh
        shell: bash
        run: |
          set -euo pipefail
          cd "$GRAPHIFY_FIXTURE"
          printf '\ndef health_probe():\n    return card_grade(9.1)\n' >> service.py
          bash ./GRAPHIFY_UPDATE.sh
          python ./GRAPHIFY_SELF_HEAL.py --validate-only

      - name: Prove structural validation detects corrupt outputs
        shell: bash
        run: |
          set -euo pipefail
          cd "$GRAPHIFY_FIXTURE"
          cp graphify-out/graph.json /tmp/graphify-valid.json
          printf '{broken json' > graphify-out/graph.json
          set +e
          python ./GRAPHIFY_SELF_HEAL.py --validate-only
          rc=$?
          set -e
          test "$rc" -ne 0
          mv /tmp/graphify-valid.json graphify-out/graph.json
          python ./GRAPHIFY_SELF_HEAL.py --validate-only

      - name: Prove bounded self-heal repairs and learns missing outputs
        shell: bash
        run: |
          set -euo pipefail
          cd "$GRAPHIFY_FIXTURE"
          rm -f graphify-out/GRAPH_REPORT.md graphify-out/graph.html
          GRAPHIFY_SELF_HEAL_MEMORY=/tmp/graphify-memory.json \
          GRAPHIFY_SELF_HEAL_REPORT=/tmp/graphify-report.json \
          python ./GRAPHIFY_SELF_HEAL.py \
            --repair \
            --failure-code 24 \
            --reason 'required missing output GRAPH_REPORT.md graph.html'
          python ./GRAPHIFY_SELF_HEAL.py --validate-only
          test -s /tmp/graphify-memory.json
          test -s /tmp/graphify-report.json
          grep -Fq '"preferred_strategy": "materialize_outputs"' /tmp/graphify-memory.json
          grep -Fq '"success": true' /tmp/graphify-report.json

      - name: Prove failed rebuild restores last good outputs
        shell: bash
        run: |
          set -euo pipefail
          cd "$GRAPHIFY_FIXTURE"
          cp graphify-out/graph.json /tmp/graph-before-failed-heal.json
          cat > /tmp/fake-graphify-rebuild-fail <<'SH'
          #!/usr/bin/env bash
          if [ "${1:-}" = "--version" ]; then
            echo 'graphify 0.9.53'
            exit 0
          fi
          case "${1:-}" in
            extract|cluster-only|update) echo 'forced repair failure' >&2; exit 42 ;;
            hook) exit 0 ;;
            *) exit 0 ;;
          esac
          SH
          chmod +x /tmp/fake-graphify-rebuild-fail
          set +e
          GRAPHIFY_BIN=/tmp/fake-graphify-rebuild-fail \
          GRAPHIFY_SELF_HEAL_MEMORY=/tmp/graphify-failed-memory.json \
          GRAPHIFY_SELF_HEAL_REPORT=/tmp/graphify-failed-report.json \
          GRAPHIFY_SELF_HEAL_CANDIDATES=/tmp/graphify-candidates.json \
          python ./GRAPHIFY_SELF_HEAL.py \
            --repair \
            --failure-code 21 \
            --reason 'update failed'
          rc=$?
          set -e
          test "$rc" -ne 0
          cmp /tmp/graph-before-failed-heal.json graphify-out/graph.json
          python ./GRAPHIFY_SELF_HEAL.py --validate-only
          test -s /tmp/graphify-candidates.json
          grep -Fq '"needs_code_review"' /tmp/graphify-candidates.json

      - name: Prove primary Graphify failures cannot be masked
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/fake-graphify-fail <<'SH'
          #!/usr/bin/env bash
          if [ "${1:-}" = "--version" ]; then
            echo 'graphify 0.9.53'
            exit 0
          fi
          case "${1:-}" in
            update|extract|cluster-only) echo 'forced graphify failure' >&2; exit 42 ;;
            *) exit 0 ;;
          esac
          SH
          chmod +x /tmp/fake-graphify-fail
          cd "$GRAPHIFY_FIXTURE"
          set +e
          GRAPHIFY_BIN=/tmp/fake-graphify-fail GRAPHIFY_DISABLE_SELF_HEAL=1 bash ./GRAPHIFY_UPDATE.sh
          rc=$?
          set -e
          test "$rc" -ne 0
          grep -Fq '최종 status=' GRAPHIFY_UPDATE.log

      - name: Exercise Graphify git hooks
        shell: bash
        run: |
          set -euo pipefail
          cd "$GRAPHIFY_FIXTURE"
          graphify hook install
          graphify hook status
          test -x .git/hooks/post-commit
          test -x .git/hooks/post-checkout
