name: Instagram Cardinfo Guard

on:
  push:
    paths:
      - 'instagram_tcg_content/**'
      - '.github/workflows/instagram-cardinfo-guard.yml'
  pull_request:
    paths:
      - 'instagram_tcg_content/**'
      - '.github/workflows/instagram-cardinfo-guard.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: instagram-cardinfo-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'
      - name: Syntax check
        run: |
          python -m py_compile \
            instagram_tcg_content/source_verification_engine.py \
            instagram_tcg_content/source_registry.py \
            instagram_tcg_content/collector_runtime.py \
            instagram_tcg_content/official_source_adapters.py \
            instagram_tcg_content/official_collection_bridge.py \
            instagram_tcg_content/market_evidence_bridge.py \
            instagram_tcg_content/canonical_taxonomy.py \
            instagram_tcg_content/collection_normalizer.py \
            instagram_tcg_content/persisted_crosscheck_export.py \
            instagram_tcg_content/collection_health.py \
            instagram_tcg_content/pause_monitor_exchange.py \
            instagram_tcg_content/test_collection_pipeline_hardening.py \
            instagram_tcg_content/test_market_evidence_bridge.py
      - name: Collection and market bridge regression
        run: |
          python -m unittest -v \
            instagram_tcg_content.test_collection_pipeline_hardening \
            instagram_tcg_content.test_market_evidence_bridge
      - name: Taxonomy self-test
        run: python -m instagram_tcg_content.canonical_taxonomy
      - name: Registry validation
        run: python -m instagram_tcg_content.source_registry
      - name: Collection health self-test
        run: python -m instagram_tcg_content.collection_health --self-test
      - name: Persisted snapshot self-test
        run: python -m instagram_tcg_content.persisted_crosscheck_export --self-test
