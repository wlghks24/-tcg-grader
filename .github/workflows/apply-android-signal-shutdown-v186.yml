name: Apply Android signal shutdown hardening v186

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-android-signal-shutdown-v186.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply v186 patch
        run: python apply_android_signal_shutdown_v186.py
      - name: Validate v186
        run: |
          bash -n START_TCG_UPDATER_ANDROID.sh
          python test_runtime_delivery_guards.py
          python test_runtime_resilience_v182.py
          git diff --check
      - name: Commit v186 runtime changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add START_TCG_UPDATER_ANDROID.sh test_runtime_delivery_guards.py
          git diff --cached --quiet && exit 0
          git commit -m 'fix: terminate Android server children on signals v186'
          git push origin HEAD:main
