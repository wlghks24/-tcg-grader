name: Tablet Autonomy Patch Checks
on:
  pull_request:
    paths:
      - 'TABLET_SCHEDULED_UPDATE.sh'
      - 'tablet_autonomous_evolution_v372.py'
      - 'tablet_autonomous_evolution_v387.py'
      - 'test_tablet_autonomous_evolution_v372.py'
      - 'test_tablet_autonomous_evolution_v387.py'
      - 'test_tablet_autonomy_pr768_review.py'
      - 'tablet_autonomy_pr768_review.json'
      - '.github/workflows/tablet-autonomy-patch-checks.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  syntax-and-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Check shell syntax
        run: bash -n TABLET_SCHEDULED_UPDATE.sh
      - name: Check Python syntax
        run: |
          python -m py_compile tablet_autonomous_evolution_v372.py tablet_autonomous_evolution_v387.py test_tablet_autonomous_evolution_v372.py test_tablet_autonomous_evolution_v387.py
      - name: Run targeted regression tests
        run: |
          python -m unittest -v test_tablet_autonomous_evolution_v372 test_tablet_autonomous_evolution_v387 test_tablet_autonomy_pr768_review
