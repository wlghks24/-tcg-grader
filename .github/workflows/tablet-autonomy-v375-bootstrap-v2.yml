name: V375 Tablet Autonomy Bootstrap V2

on:
  push:
    branches:
      - feature/tablet-autonomous-evolution-v375

permissions:
  contents: write

concurrency:
  group: tablet-autonomy-v375-bootstrap-v2
  cancel-in-progress: true

jobs:
  finalize:
    if: github.repository_owner == 'wlghks24'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact feature head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feature/tablet-autonomous-evolution-v375
          fetch-depth: 0

      - name: Refuse stale base or wrong branch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "feature/tablet-autonomous-evolution-v375"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git fetch origin main --no-tags
          test "$(git rev-parse origin/main)" = "2b1112318fa23f4e8edd525695ee3711ea715e18"
          git merge-base --is-ancestor 2b1112318fa23f4e8edd525695ee3711ea715e18 HEAD
          git merge-base --is-ancestor d7c8577b514abdbbc15ba9323c4c0deb1945efed HEAD

      - name: Repair historical successor lineage
        shell: bash
        run: |
          set -euo pipefail
          python .github/scripts/finalize_v375.py
          git diff --check

      - name: Remove all temporary finalization files and commit lineage repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -- \
            .github/workflows/tablet-autonomy-v375-bootstrap.yml \
            .github/workflows/tablet-autonomy-v375-finalizer.yml \
            .github/workflows/tablet-autonomy-v375-bootstrap-v2.yml \
            .github/scripts/finalize_v375.py
          git add -- \
            test_tablet_gpt_tcg_grader_sync_v369.py \
            test_tablet_gpt_tcg_grader_sync_v370.py \
            test_tablet_gpt_tcg_grader_sync_v371.py \
            test_tablet_gpt_tcg_grader_sync_v372.py \
            test_tablet_gpt_tcg_grader_sync_v373.py
          git commit -m "test: finalize Tablet sync successor lineage through v375"

      - name: Verify V375 and complete Tablet sync lineage
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile tablet_autonomous_evolution_v375.py tablet_runtime_manifest.py
          python tablet_autonomous_evolution_v375.py --self-test
          python -m unittest -v \
            test_tablet_autonomous_evolution_v375.py \
            test_tablet_gpt_tcg_grader_sync_v374.py \
            test_tablet_gpt_tcg_grader_sync_v375.py
          python -m unittest discover -v -p 'test_tablet_gpt_tcg_grader_sync_v*.py'
          python tablet_runtime_manifest.py --check --compile

      - name: Rebuild exact-tree integrity and verify repository
        shell: bash
        run: |
          set -euo pipefail
          python static_integrity_manifest.py --write integrity_manifest.json
          python static_integrity_manifest.py --check integrity_manifest.json
          python repository_integrity_guard.py
          git add -- integrity_manifest.json
          git diff --cached --quiet || git commit -m "chore: sync integrity manifest for Tablet autonomy v375"
          test ! -e .github/workflows/tablet-autonomy-v375-bootstrap.yml
          test ! -e .github/workflows/tablet-autonomy-v375-finalizer.yml
          test ! -e .github/workflows/tablet-autonomy-v375-bootstrap-v2.yml
          test ! -e .github/scripts/finalize_v375.py
          test -z "$(git status --porcelain)"

      - name: Push only verified final tree
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin feature/tablet-autonomous-evolution-v375 --no-tags
          test "$(git rev-parse origin/feature/tablet-autonomous-evolution-v375)" = "$GITHUB_SHA"
          git push origin HEAD:feature/tablet-autonomous-evolution-v375
