name: V375 Tablet Autonomy Bootstrap V2

on:
  push:
    branches:
      - feature/tablet-autonomous-evolution-v375

permissions:
  contents: write

concurrency:
  group: tablet-autonomy-v375-bootstrap-v2
  cancel-in-progress: true

jobs:
  finalize:
    if: github.repository_owner == 'wlghks24'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact feature head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feature/tablet-autonomous-evolution-v375
          fetch-depth: 0

      - name: Refuse stale base or wrong branch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "feature/tablet-autonomous-evolution-v375"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git fetch origin main --no-tags
          test "$(git rev-parse origin/main)" = "2b1112318fa23f4e8edd525695ee3711ea715e18"
          git merge-base --is-ancestor 2b1112318fa23f4e8edd525695ee3711ea715e18 HEAD
          git merge-base --is-ancestor d7c8577b514abdbbc15ba9323c4c0deb1945efed HEAD

      - name: Remove temporary workflows and extend successor lineage idempotently
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_idempotent(path, old, new):
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              if new in text:
                  return
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"expected one old or existing new target in {path}: old={count} new={text.count(new)}")
              p.write_text(text.replace(old, new, 1), encoding="utf-8")

          v369_old = '''                            self.assertEqual(
                                [],
                                watched_paths(successor374, candidate374["candidate_commit"]),
                                "verified v374 successor has uncovered watched changes",
                            )'''
          v369_new = '''                            after374 = watched_paths(successor374, candidate374["candidate_commit"])
                            if after374:
                                successor375, candidate375 = assert_successor_generation(
                                    self,
                                    "TCG_CROSSCHECK/TABLET_GPT_TCG_GRADER_SYNC_CONTRACT_V374.json",
                                    "TCG_CROSSCHECK/TABLET_GPT/learning_snapshot_v374_delta.json",
                                    "TCG_CROSSCHECK/TABLET_GPT_TCG_GRADER_SYNC_CONTRACT_V375.json",
                                )
                                sixth_hop = watched_paths(successor374, candidate374["candidate_commit"], candidate375["candidate_commit"])
                                self.assertEqual(sorted(sixth_hop), sorted(candidate375["watched_paths"]))
                                self.assertEqual([], watched_paths(successor375, candidate375["candidate_commit"]), "verified v375 successor has uncovered watched changes")
                            else:
                                self.assertEqual([], after374)'''
          replace_idempotent("test_tablet_gpt_tcg_grader_sync_v369.py", v369_old, v369_new)

          v370_old = '''                        self.assertEqual(
                            [],
                            watched_paths(successor374, candidate374["candidate_commit"]),
                            "verified v374 successor has uncovered watched changes",
                        )'''
          v370_new = '''                        after374 = watched_paths(successor374, candidate374["candidate_commit"])
                        if after374:
                            successor375, candidate375 = assert_successor_generation(
                                self,
                                "TCG_CROSSCHECK/TABLET_GPT_TCG_GRADER_SYNC_CONTRACT_V374.json",
                                "TCG_CROSSCHECK/TABLET_GPT/learning_snapshot_v374_delta.json",
                                "TCG_CROSSCHECK/TABLET_GPT_TCG_GRADER_SYNC_CONTRACT_V375.json",
                            )
                            fifth_hop = watched_paths(successor374, candidate374["candidate_commit"], candidate375["candidate_commit"])
                            self.assertEqual(sorted(fifth_hop), sorted(candidate375["watched_paths"]))
                            self.assertEqual([], watched_paths(successor375, candidate375["candidate_commit"]), "verified v375 successor has uncovered watched changes")
                        else:
                            self.assertEqual([], after374)'''
          replace_idempotent("test_tablet_gpt_tcg_grader_sync_v370.py", v370_old, v370_new)

          helper_old = '''def assert_v374_successor(testcase, relevant):
    contract, candidate = _verify_successor(
        testcase, V374_CONTRACT, V374_SOURCE, V374_CANDIDATE, relevant
    )
    testcase.assertEqual([], watched_paths(contract, V374_CANDIDATE))
    return contract, candidate'''
          helper_new = '''def assert_v374_successor(testcase, relevant):
    return _verify_successor(
        testcase, V374_CONTRACT, V374_SOURCE, V374_CANDIDATE, relevant
    )'''
          replace_idempotent("test_tablet_gpt_tcg_grader_sync_v371.py", helper_old, helper_new)
          replace_idempotent("test_tablet_gpt_tcg_grader_sync_v372.py", helper_old, helper_new)

          v371_old = '''                if after373:
                    assert_v374_successor(self, after373)
                else:
                    self.assertEqual([], after373)'''
          v371_new = '''                if after373:
                    third_hop = watched_paths(v373_contract, v373_candidate["candidate_commit"], V374_CANDIDATE)
                    v374_contract, v374_candidate = assert_v374_successor(self, third_hop)
                    after374 = watched_paths(v374_contract, v374_candidate["candidate_commit"])
                    if after374:
                        v375_path = ROOT / "TCG_CROSSCHECK/TABLET_GPT_TCG_GRADER_SYNC_CONTRACT_V375.json"
                        v375_contract, v375_candidate = _verify_successor(self, v375_path, "2b1112318fa23f4e8edd525695ee3711ea715e18", "d7c8577b514abdbbc15ba9323c4c0deb1945efed", after374)
                        self.assertEqual([], watched_paths(v375_contract, v375_candidate["candidate_commit"]))
                    else:
                        self.assertEqual([], after374)
                else:
                    self.assertEqual([], after373)'''
          replace_idempotent("test_tablet_gpt_tcg_grader_sync_v371.py", v371_old, v371_new)

          v372_old = '''            if after373:
                assert_v374_successor(self, after373)
            else:
                self.assertEqual([], after373)'''
          v372_new = '''            if after373:
                second_hop = watched_paths(v373_contract, v373_candidate["candidate_commit"], V374_CANDIDATE)
                v374_contract, v374_candidate = assert_v374_successor(self, second_hop)
                after374 = watched_paths(v374_contract, v374_candidate["candidate_commit"])
                if after374:
                    v375_path = ROOT / "TCG_CROSSCHECK/TABLET_GPT_TCG_GRADER_SYNC_CONTRACT_V375.json"
                    v375_contract, v375_candidate = _verify_successor(self, v375_path, "2b1112318fa23f4e8edd525695ee3711ea715e18", "d7c8577b514abdbbc15ba9323c4c0deb1945efed", after374)
                    self.assertEqual([], watched_paths(v375_contract, v375_candidate["candidate_commit"]))
                else:
                    self.assertEqual([], after374)
            else:
                self.assertEqual([], after373)'''
          replace_idempotent("test_tablet_gpt_tcg_grader_sync_v372.py", v372_old, v372_new)

          v373_compare_old = '''            self.assertEqual(later, watched_paths(successor, sc["base_main_sha"], sc["candidate_commit"]))'''
          v373_compare_new = '''            first_hop = watched_paths(contract, CANDIDATE, sc["candidate_commit"])
            self.assertEqual(first_hop, watched_paths(successor, sc["base_main_sha"], sc["candidate_commit"]))'''
          replace_idempotent("test_tablet_gpt_tcg_grader_sync_v373.py", v373_compare_old, v373_compare_new)

          v373_tail_old = '''            self.assertEqual([], watched_paths(successor, sc["candidate_commit"]))'''
          v373_tail_new = '''            after374 = watched_paths(successor, sc["candidate_commit"])
            if after374:
                successor375 = read(ROOT / "TCG_CROSSCHECK/TABLET_GPT_TCG_GRADER_SYNC_CONTRACT_V375.json")
                sc375 = successor375["candidate_sync"]
                self.assertEqual("2b1112318fa23f4e8edd525695ee3711ea715e18", sc375["base_main_sha"])
                self.assertEqual("d7c8577b514abdbbc15ba9323c4c0deb1945efed", sc375["candidate_commit"])
                self.assertEqual(after374, watched_paths(successor375, sc375["base_main_sha"], sc375["candidate_commit"]))
                self.assertEqual([], watched_paths(successor375, sc375["candidate_commit"]))
            else:
                self.assertEqual([], after374)'''
          replace_idempotent("test_tablet_gpt_tcg_grader_sync_v373.py", v373_tail_old, v373_tail_new)

          v373_meta_old = '''            self.assertIn(
                "python tablet_autonomous_evolution_v374.py --execute-safe-learning --apply-capabilities --train-meta --apply-skills",
                main_text,
            )
            self.assertIn('"tablet_autonomous_evolution_v374.py"', manifest_text)'''
          v373_meta_new = '''            v374_cmd = "python tablet_autonomous_evolution_v374.py --execute-safe-learning --apply-capabilities --train-meta --apply-skills"
            v375_cmd = "python tablet_autonomous_evolution_v375.py --execute-safe-learning --apply-capabilities --train-meta --apply-skills"
            if v374_cmd in main_text:
                self.assertIn('"tablet_autonomous_evolution_v374.py"', manifest_text)
            else:
                self.assertIn(v375_cmd, main_text)
                self.assertIn('"tablet_autonomous_evolution_v375.py"', manifest_text)'''
          replace_idempotent("test_tablet_gpt_tcg_grader_sync_v373.py", v373_meta_old, v373_meta_new)
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -- .github/workflows/tablet-autonomy-v375-bootstrap.yml .github/workflows/tablet-autonomy-v375-finalizer.yml .github/workflows/tablet-autonomy-v375-bootstrap-v2.yml
          git add -- test_tablet_gpt_tcg_grader_sync_v369.py test_tablet_gpt_tcg_grader_sync_v370.py test_tablet_gpt_tcg_grader_sync_v371.py test_tablet_gpt_tcg_grader_sync_v372.py test_tablet_gpt_tcg_grader_sync_v373.py
          git diff --check
          git commit -m "test: finalize Tablet sync successor lineage through v375"

      - name: Verify V375 and complete Tablet sync lineage
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile tablet_autonomous_evolution_v375.py tablet_runtime_manifest.py
          python tablet_autonomous_evolution_v375.py --self-test
          python -m unittest -v test_tablet_autonomous_evolution_v375.py test_tablet_gpt_tcg_grader_sync_v374.py test_tablet_gpt_tcg_grader_sync_v375.py
          python -m unittest discover -v -p 'test_tablet_gpt_tcg_grader_sync_v*.py'
          python tablet_runtime_manifest.py --check --compile

      - name: Rebuild exact-tree integrity and verify repository
        shell: bash
        run: |
          set -euo pipefail
          python static_integrity_manifest.py --write integrity_manifest.json
          python static_integrity_manifest.py --check integrity_manifest.json
          python repository_integrity_guard.py
          git add -- integrity_manifest.json
          git diff --cached --quiet || git commit -m "chore: sync integrity manifest for Tablet autonomy v375"
          test ! -e .github/workflows/tablet-autonomy-v375-bootstrap.yml
          test ! -e .github/workflows/tablet-autonomy-v375-finalizer.yml
          test ! -e .github/workflows/tablet-autonomy-v375-bootstrap-v2.yml
          test -z "$(git status --porcelain)"

      - name: Push only verified final tree
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin feature/tablet-autonomous-evolution-v375 --no-tags
          test "$(git rev-parse origin/feature/tablet-autonomous-evolution-v375)" = "$GITHUB_SHA"
          git push origin HEAD:feature/tablet-autonomous-evolution-v375
