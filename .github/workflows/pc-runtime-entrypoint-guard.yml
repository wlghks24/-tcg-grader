name: PC Runtime Entrypoint Guard

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'START_TCG_UPDATER.bat'
      - 'TCG_SERVER_AUTO_RUN.cmd'
      - 'PC_SERVER_AUTO_START_INSTALL.bat'
      - 'tcg_updater.py'
      - 'tcg_updater_v135.py'
      - 'runtime_bundle_guard_v143.py'
      - 'test_pc_runtime_entrypoint_v264.py'
      - '.github/workflows/pc-runtime-entrypoint-guard.yml'
  push:
    branches: [main]
    paths:
      - 'START_TCG_UPDATER.bat'
      - 'TCG_SERVER_AUTO_RUN.cmd'
      - 'PC_SERVER_AUTO_START_INSTALL.bat'
      - 'tcg_updater.py'
      - 'tcg_updater_v135.py'
      - 'runtime_bundle_guard_v143.py'
      - 'test_pc_runtime_entrypoint_v264.py'
      - '.github/workflows/pc-runtime-entrypoint-guard.yml'

permissions:
  contents: read

concurrency:
  group: pc-runtime-entrypoint-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'
      - name: Verify canonical Windows runtime
        run: |
          python -m py_compile tcg_updater.py tcg_updater_v135.py runtime_bundle_guard_v143.py test_pc_runtime_entrypoint_v264.py
          python -m unittest -v test_pc_runtime_entrypoint_v264.py
          git diff --check origin/${{ github.base_ref || 'main' }}...HEAD || git diff --check HEAD^
