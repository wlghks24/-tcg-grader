name: Senior runtime hardening audit v181

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-android-index-clean-guard-v180.yml'

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply veteran runtime hardening
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def read(path):
              return Path(path).read_text(encoding='utf-8')

          def write(path, text):
              Path(path).write_text(text, encoding='utf-8')

          # 1) App shell: remove duplicate market loader and force cache-busted critical assets.
          path=Path('index.html')
          text=read(path)
          text=re.sub(
              r'<script src="multi_market_prices\.js(?:\?v=\d+)?"></script>\s*<script src="multi_market_prices\.js(?:\?v=\d+)?"></script>',
              '<script src="multi_market_prices.js?v=181"></script>', text, count=1,
          )
          text=re.sub(r'<script src="multi_market_prices\.js(?:\?v=\d+)?"></script>',
                      '<script src="multi_market_prices.js?v=181"></script>', text, count=1)
          text=re.sub(r'<script src="auto_validation_flow\.js(?:\?v=\d+)?"></script>',
                      '<script src="auto_validation_flow.js?v=181"></script>', text, count=1)
          text=re.sub(r'<script src="graded_photo_dashboard\.js(?:\?v=\d+)?"></script>',
                      '<script src="graded_photo_dashboard.js?v=181"></script>', text, count=1)
          text=re.sub(r'<script src="\./manual_dual_photo_bridge\.js(?:\?v=\d+)?"></script>',
                      '<script src="./manual_dual_photo_bridge.js?v=181"></script>', text, count=1)
          text=text.replace(
              '<script src="card_identity_recognition.js"></script>\\n<script src="inventory_lookup.js"></script>',
              '<script src="card_identity_recognition.js?v=181"></script>\n<script src="inventory_lookup.js"></script>',
              1,
          )
          if '<script src="card_identity_recognition.js"></script>' in text:
              text=text.replace('<script src="card_identity_recognition.js"></script>',
                                '<script src="card_identity_recognition.js?v=181"></script>',1)
          write(path,text)

          # 2) Multi-market singleton: even accidental duplicate injection must not bind listeners twice.
          path=Path('multi_market_prices.js')
          text=read(path)
          if '__TCG_MULTI_MARKET_PRICES__' not in text:
              needle="'use strict';\n"
              if needle not in text:
                  raise SystemExit('multi_market strict-mode anchor missing')
              guard=("'use strict';\n"
                     "const GLOBAL_KEY='__TCG_MULTI_MARKET_PRICES__';\n"
                     "if(globalThis[GLOBAL_KEY]?.loaded)return;\n"
                     "globalThis[GLOBAL_KEY]={loaded:true,version:181};\n")
              text=text.replace(needle,guard,1)
          write(path,text)

          # 3) Service worker: network-first for mutable app code/data, tolerant precache, new cache epoch.
          path=Path('sw.js')
          text=read(path)
          text=re.sub(r"const CACHE='[^']+';", "const CACHE='tcg-v181-network-first-runtime';", text, count=1)
          old_install="""self.addEventListener('install',event=>event.waitUntil(\n  caches.open(CACHE).then(cache=>cache.addAll(CORE)).then(()=>self.skipWaiting())\n));"""
          new_install="""self.addEventListener('install',event=>event.waitUntil((async()=>{\n  const cache=await caches.open(CACHE);\n  await Promise.allSettled(CORE.map(async asset=>{\n    try{\n      const response=await fetch(asset,{cache:'no-store'});\n      if(response&&response.ok)await cache.put(asset,response.clone());\n    }catch(_){/* one optional asset must never block a service-worker upgrade */}\n  }));\n  await self.skipWaiting();\n})()));"""
          if old_install in text:
              text=text.replace(old_install,new_install,1)
          elif 'Promise.allSettled(CORE.map' not in text:
              raise SystemExit('service-worker install anchor missing')
          text=text.replace('const cached=await caches.match(request);',
                            "const cached=await caches.match(request,{ignoreSearch:true});",1)
          fetch_start="self.addEventListener('fetch',event=>{"
          pos=text.find(fetch_start)
          if pos < 0:
              raise SystemExit('service-worker fetch handler missing')
          text=text[:pos]+"""self.addEventListener('fetch',event=>{\n  if(event.request.method!=='GET')return;\n  const url=new URL(event.request.url);\n  if(url.origin!==self.location.origin||url.pathname.startsWith('/api/'))return;\n  const mutable=event.request.mode==='navigate'||/\\.(?:html|js|css|json|webmanifest)$/i.test(url.pathname);\n  if(mutable){\n    event.respondWith(fetch(event.request,{cache:'no-store'})\n      .then(response=>event.request.mode==='navigate'?enhanceNavigationResponse(response):response)\n      .then(response=>rememberSuccessfulResponse(event.request,response))\n      .catch(()=>unavailableResponse(event.request)));\n    return;\n  }\n  event.respondWith(caches.match(event.request,{ignoreSearch:true}).then(cached=>cached||fetch(event.request,{cache:'no-store'})\n    .then(response=>rememberSuccessfulResponse(event.request,response))\n    .catch(()=>unavailableResponse(event.request))));\n});\n"""
          write(path,text)

          # 4) Local server: mutable static assets must revalidate instead of relying on stale HTTP cache.
          path=Path('tcg_updater.py')
          text=read(path)
          old="""            self.send_header('Last-Modified',self.date_time_string(metadata.st_mtime))\n            self.end_headers()"""
          new="""            self.send_header('Last-Modified',self.date_time_string(metadata.st_mtime))\n            if target.suffix.lower() in {'.html','.js','.css','.json','.webmanifest'}:\n                self.send_header('Cache-Control','no-store, no-cache, must-revalidate, max-age=0')\n                self.send_header('Pragma','no-cache')\n                self.send_header('Expires','0')\n            else:\n                self.send_header('Cache-Control','public, max-age=3600')\n            self.end_headers()"""
          if old in text:
              text=text.replace(old,new,1)
          elif "target.suffix.lower() in {'.html','.js','.css','.json','.webmanifest'}" not in text:
              raise SystemExit('static cache header anchor missing')
          write(path,text)

          # 5) Boot supervisor: avoid a GitHub fetch every 10 seconds when another healthy server already owns the singleton.
          path=Path('ANDROID_AUTO_START_INSTALL.sh')
          text=read(path)
          old="  echo 'while true; do bash ANDROID_UPDATE_AND_START.sh >> TCG_ANDROID_STARTUP.log 2>&1; sleep 10; done'"
          new="""  echo 'LOG=TCG_ANDROID_STARTUP.log'\n  echo 'if [ -f "$LOG" ] && [ "$(wc -c < "$LOG" 2>/dev/null || echo 0)" -gt 2097152 ]; then mv -f "$LOG" "$LOG.1"; fi'\n  echo 'delay=30'\n  echo 'while true; do'\n  echo '  bash ANDROID_UPDATE_AND_START.sh >> "$LOG" 2>&1'\n  echo '  rc=$?'\n  echo \"  if pgrep -f '[p]ython.*tcg_updater_v135.py' >/dev/null 2>&1; then exit 0; fi\"\n  echo '  echo "[WARN] TCG server stopped (rc=$rc); retrying in ${delay}s." >> "$LOG"'\n  echo '  sleep "$delay"'\n  echo '  if [ "$delay" -lt 300 ]; then delay=$((delay*2)); [ "$delay" -gt 300 ] && delay=300; fi'\n  echo 'done'"""
          if old in text:
              text=text.replace(old,new,1)
          elif 'retrying in ${delay}s' not in text:
              raise SystemExit('boot loop anchor missing')
          text=text.replace('Android boot auto-start installed (v176 safe update + singleton launcher).',
                            'Android boot auto-start installed (v181 safe update + singleton supervisor).')
          write(path,text)

          # 6) Launcher lifecycle: terminate its queue child when the server exits; remove obsolete repair advice.
          path=Path('START_TCG_UPDATER_ANDROID.sh')
          text=read(path)
          if 'PAIR_QUEUE_PID=""' not in text:
              text=text.replace('WAKE_LOCKED=0\n','WAKE_LOCKED=0\nPAIR_QUEUE_PID=""\n',1)
          cleanup_anchor='cleanup_android_start() {\n'
          cleanup_body="""cleanup_android_start() {\n  if [ -n "${PAIR_QUEUE_PID:-}" ] && kill -0 "$PAIR_QUEUE_PID" 2>/dev/null; then\n    kill "$PAIR_QUEUE_PID" 2>/dev/null || true\n    wait "$PAIR_QUEUE_PID" 2>/dev/null || true\n  fi\n"""
          if cleanup_anchor in text and 'kill "$PAIR_QUEUE_PID"' not in text:
              text=text.replace(cleanup_anchor,cleanup_body,1)
          text=text.replace('echo "[안전] 혼합 업데이트 상태로 서버를 시작하지 않습니다. INSTALL_MANUAL_OFFICIAL_FALLBACK.sh를 다시 실행하세요."',
                            'echo "[안전] 혼합 업데이트 상태로 서버를 시작하지 않습니다. bash ANDROID_UPDATE_AND_START.sh 로 GitHub main을 다시 확인하세요."')
          queue_anchor="""nohup python graded_photo_manual_pair_queue.py --watch --interval 60 \\\n  > TCG_MANUAL_PAIR_QUEUE.log 2>&1 &\n"""
          if queue_anchor in text and 'PAIR_QUEUE_PID=$!' not in text:
              text=text.replace(queue_anchor,queue_anchor+'PAIR_QUEUE_PID=$!\n',1)
          if 'PAIR_QUEUE_PID=$!' not in text:
              raise SystemExit('queue pid anchor missing')
          write(path,text)

          # 7) Safe updater: normal collector-written tracked JSON must not block code fast-forward.
          path=Path('ANDROID_UPDATE_AND_START.sh')
          text=read(path)
          start=text.find("if command -v git >/dev/null 2>&1 && git rev-parse --is-inside-work-tree")
          end=text.find('\nif [ "$updated" = "1" ]; then',start)
          if start < 0 or end < 0:
              raise SystemExit('android updater git block missing')
          new_git=r'''if command -v git >/dev/null 2>&1 && git rev-parse --is-inside-work-tree >/dev/null 2>&1; then
  before="$(git rev-parse --short=8 HEAD 2>/dev/null || echo local)"
  branch="$(git branch --show-current 2>/dev/null || true)"
  can_update=1
  if [ "$branch" != "main" ]; then
    echo "[안내] 현재 브랜치가 main이 아닙니다(${branch:-detached}). 자동 업데이트는 건너뜁니다."
    can_update=0
  elif ! git diff --cached --quiet --ignore-submodules --; then
    echo "[안전] staged 변경이 있어 자동 업데이트를 건너뜁니다. 사용자가 준비한 변경은 자동으로 건드리지 않습니다."
    can_update=0
  else
    dirty_paths="$(git diff --name-only --ignore-submodules --)"
    unsafe_paths=""
    if [ -n "$dirty_paths" ]; then
      while IFS= read -r changed; do
        [ -z "$changed" ] && continue
        case "$changed" in
          tcg_live_data.json|releases.json|market_watch.json|market_prices.json|promo_events.json|purchase_sources.json|purchase_signals.json|social_stock_signals.json|exchange_rates.json|graded_photo_candidates.json|supplementary_candidates.json|social_event_candidates.json|web_discovery_candidates.json|link_health_report.json|auto_update_report.json|auto_update_issues.json|auto_repair_memory.json|adaptive_collection_stats.json|adaptive_collection_stats.json.bak|verified_certifications.json|learning_store.json|vision_self_learning_report.json|ebay_grader_candidates.json|card_identity_learning.json|source_collection_stats.json|source_collection_stats.json.bak|precollect_status.json)
            ;;
          *) unsafe_paths="${unsafe_paths}${unsafe_paths:+, }$changed" ;;
        esac
      done <<EOF
$dirty_paths
EOF
    fi
    if [ -n "$unsafe_paths" ]; then
      echo "[안전] 코드/설정 추적파일에 로컬 수정이 있어 자동 업데이트를 건너뜁니다: $unsafe_paths"
      can_update=0
    elif [ -n "$dirty_paths" ]; then
      echo "[OK] 정상 수집으로 변경된 런타임 JSON만 감지했습니다. Git이 덮어쓰지 않는 범위에서 fast-forward를 시도합니다."
    fi
  fi

  if [ "$can_update" = "1" ]; then
    echo "[업데이트] GitHub main 최신 상태를 확인합니다..."
    if git fetch origin main --prune; then
      local_head="$(git rev-parse HEAD 2>/dev/null || true)"
      remote_head="$(git rev-parse origin/main 2>/dev/null || true)"
      if [ -n "$remote_head" ] && [ "$local_head" != "$remote_head" ]; then
        if git merge --ff-only origin/main; then
          updated=1
        else
          echo "[안전] 원격 변경과 로컬 런타임 자료가 같은 파일을 건드려 자동 병합을 중단했습니다. 로컬 자료는 그대로 보존합니다."
        fi
      else
        echo "[OK] 이미 최신 main입니다."
      fi
    else
      echo "[안내] 네트워크/GitHub 연결 문제로 업데이트 확인을 건너뜁니다. 현재 버전으로 시작합니다."
    fi
  fi
  after="$(git rev-parse --short=8 HEAD 2>/dev/null || echo local)"
fi
'''
          text=text[:start]+new_git+text[end:]
          write(path,text)

          # 8) Market collector: distinguish transient KREAM transport failures and harden fragile UI coverage parsing.
          path=Path('update_market_prices.py')
          text=read(path)
          old_cov="""def coverage(db):\n    raw=safe_read_text(APP);block=raw.split('const COUNTRY_BOX_DATA=',1)[1].split('const LEARNING_PRICE_DATA=',1)[0]\n    products=re.findall(r'\\{country:\"(KR|JP|US)\",game:\"[^\"]+\",name:\"([^\"]+)\"',block)\n    required={f'{region}|{name}|{asset}' for region,name in products for asset in ('BOX','HIT')}\n    verified=required & set(db.get('entries',{}));missing=sorted(required-verified)\n    return {'total':len(required),'verified':len(verified),'pending':len(missing),'missing_keys':missing}\n"""
          new_cov="""def coverage(db):\n    raw=safe_read_text(APP)\n    start='const COUNTRY_BOX_DATA='; end='const LEARNING_PRICE_DATA='\n    if start not in raw or end not in raw:\n        return {'total':0,'verified':0,'pending':0,'missing_keys':[],\n                'warning':'catalog_marker_missing · 가격자료는 유지하고 UI 카탈로그 커버리지 계산만 보류'}\n    try:\n        block=raw.split(start,1)[1].split(end,1)[0]\n        products=re.findall(r'\\{country:\"(KR|JP|US)\",game:\"[^\"]+\",name:\"([^\"]+)\"',block)\n    except (IndexError,TypeError,ValueError):\n        return {'total':0,'verified':0,'pending':0,'missing_keys':[],\n                'warning':'catalog_parse_failed · 가격자료는 유지하고 UI 카탈로그 커버리지 계산만 보류'}\n    required={f'{region}|{name}|{asset}' for region,name in products for asset in ('BOX','HIT')}\n    verified=required & set(db.get('entries',{}));missing=sorted(required-verified)\n    return {'total':len(required),'verified':len(verified),'pending':len(missing),'missing_keys':missing}\n"""
          if old_cov in text:
              text=text.replace(old_cov,new_cov,1)
          elif 'catalog_marker_missing' not in text:
              raise SystemExit('market coverage anchor missing')
          old_class="""        if re.search(r'^KREAM .*HTTPError: status 5(?:00|02|03|04)\\b',text,re.I):\n            transient_market_errors.append(text)\n        else:\n            hard_market_errors.append(text)"""
          new_class="""        kream_transient=(\n            re.search(r'^KREAM ',text,re.I) is not None and (\n                re.search(r'HTTPError: status (?:403|429|5(?:00|02|03|04))\\b',text,re.I) is not None\n                or re.search(r'(?:URLError|TimeoutError|timed out|temporary failure|connection reset|name resolution|DNS)',text,re.I) is not None\n            )\n        )\n        if kream_transient:\n            transient_market_errors.append(text)\n        else:\n            hard_market_errors.append(text)"""
          if old_class in text:
              text=text.replace(old_class,new_class,1)
          elif 'kream_transient=(' not in text:
              raise SystemExit('KREAM classification anchor missing')
          text=text.replace("db['collection_note']='KREAM 원출처 5xx 시 직전 검증자료 유지 · 다음 업데이트에서 재확인' if transient_market_errors else ''",
                            "db['collection_note']='KREAM 원출처 403/429/5xx/네트워크 지연 시 직전 검증자료 유지 · 다음 업데이트에서 재확인' if transient_market_errors else ''")
          write(path,text)

          # 9) Permanent regression test: future edits must preserve these runtime invariants.
          Path('test_runtime_delivery_guards.py').write_text(r'''from pathlib import Path

ROOT=Path(__file__).resolve().parent

def text(name):
    return (ROOT/name).read_text(encoding='utf-8')

def main():
    index=text('index.html')
    assert index.count('multi_market_prices.js') == 1, 'multi-market script must load exactly once'
    assert 'multi_market_prices.js?v=181' in index
    assert 'auto_validation_flow.js?v=181' in index
    assert 'graded_photo_dashboard.js?v=181' in index
    assert 'manual_dual_photo_bridge.js?v=181' in index
    assert '__TCG_MULTI_MARKET_PRICES__' in text('multi_market_prices.js')

    sw=text('sw.js')
    assert "tcg-v181-network-first-runtime" in sw
    assert "cache:'no-store'" in sw
    assert 'Promise.allSettled(CORE.map' in sw
    assert "(?:html|js|css|json|webmanifest)" in sw

    server=text('tcg_updater.py')
    assert "target.suffix.lower() in {'.html','.js','.css','.json','.webmanifest'}" in server
    assert "no-store, no-cache, must-revalidate, max-age=0" in server

    updater=text('ANDROID_UPDATE_AND_START.sh')
    assert '정상 수집으로 변경된 런타임 JSON만 감지했습니다' in updater
    assert 'market_prices.json' in updater and 'graded_photo_candidates.json' in updater

    boot=text('ANDROID_AUTO_START_INSTALL.sh')
    assert 'retrying in ${delay}s' in boot
    assert 'sleep 10; done' not in boot

    launcher=text('START_TCG_UPDATER_ANDROID.sh')
    assert 'PAIR_QUEUE_PID=$!' in launcher
    assert 'kill "$PAIR_QUEUE_PID"' in launcher
    assert '혼합 업데이트 상태로 서버를 시작하지 않습니다. INSTALL_MANUAL_OFFICIAL_FALLBACK.sh' not in launcher

    market=text('update_market_prices.py')
    assert 'catalog_marker_missing' in market
    assert 'kream_transient=(' in market
    print('[OK] runtime delivery guards v181')

if __name__=='__main__':
    main()
''', encoding='utf-8')

          Path('.github/workflows/runtime-delivery-guard.yml').write_text(r'''name: Runtime delivery guard

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'sw.js'
      - 'multi_market_prices.js'
      - 'tcg_updater.py'
      - 'ANDROID_UPDATE_AND_START.sh'
      - 'ANDROID_AUTO_START_INSTALL.sh'
      - 'START_TCG_UPDATER_ANDROID.sh'
      - 'update_market_prices.py'
      - 'test_runtime_delivery_guards.py'
      - '.github/workflows/runtime-delivery-guard.yml'
  pull_request:
    paths:
      - 'index.html'
      - 'sw.js'
      - 'multi_market_prices.js'
      - 'tcg_updater.py'
      - 'ANDROID_UPDATE_AND_START.sh'
      - 'ANDROID_AUTO_START_INSTALL.sh'
      - 'START_TCG_UPDATER_ANDROID.sh'
      - 'update_market_prices.py'
      - 'test_runtime_delivery_guards.py'

permissions:
  contents: read

concurrency:
  group: runtime-delivery-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify runtime delivery invariants
        run: |
          python test_runtime_delivery_guards.py
          python -m py_compile tcg_updater.py update_market_prices.py
          bash -n ANDROID_UPDATE_AND_START.sh
          bash -n ANDROID_AUTO_START_INSTALL.sh
          bash -n START_TCG_UPDATER_ANDROID.sh
          node --check multi_market_prices.js
          node --check sw.js
''', encoding='utf-8')

          print('[OK] veteran runtime hardening patch prepared')
          PY

      - name: Validate before commit
        shell: bash
        run: |
          python test_runtime_delivery_guards.py
          python -m py_compile tcg_updater.py update_market_prices.py
          bash -n ANDROID_UPDATE_AND_START.sh
          bash -n ANDROID_AUTO_START_INSTALL.sh
          bash -n START_TCG_UPDATER_ANDROID.sh
          node --check multi_market_prices.js
          node --check sw.js

      - name: Commit hardening and remove one-shot patcher
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/apply-android-index-clean-guard-v180.yml
          git add index.html multi_market_prices.js sw.js tcg_updater.py \
                  ANDROID_UPDATE_AND_START.sh ANDROID_AUTO_START_INSTALL.sh \
                  START_TCG_UPDATER_ANDROID.sh update_market_prices.py \
                  test_runtime_delivery_guards.py .github/workflows/runtime-delivery-guard.yml
          git commit -m 'fix: harden tablet runtime delivery v181'
          git push origin HEAD:main
