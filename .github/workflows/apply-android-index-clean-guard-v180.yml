name: Apply Android clean-index guard v180

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-android-index-clean-guard-v180.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Prevent legacy installer from dirtying index
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          start = Path('START_TCG_UPDATER_ANDROID.sh')
          text = start.read_text(encoding='utf-8')
          text = text.replace(
              'echo "[조치] bash INSTALL_MANUAL_OFFICIAL_FALLBACK.sh 를 다시 실행하세요."',
              'echo "[조치] 로컬 index.html을 직접 수정하지 말고 GitHub main 최신본으로 갱신하세요: bash ANDROID_UPDATE_AND_START.sh"',
          )
          start.write_text(text, encoding='utf-8')

          installer = Path('INSTALL_MANUAL_OFFICIAL_FALLBACK.sh')
          text = installer.read_text(encoding='utf-8')
          marker = '# Android/WebView가 오래된 앞뒤 업로드 UI JS를 잡지 않도록 캐시 버전도 갱신합니다.'
          end_marker = 'if command -v node >/dev/null 2>&1; then'
          if marker in text:
              start_at = text.index(marker)
              end_at = text.index(end_marker, start_at)
              replacement = (
                  '# index.html은 GitHub main의 추적 파일이므로 태블릿에서 직접 수정하지 않습니다.\n'
                  '# 로컬 수정은 다음 안전 업데이트를 막을 수 있으므로 연결 존재만 검증합니다.\n'
                  'python - <<\'PY\'\n'
                  'from pathlib import Path\n'
                  'text=Path(\'index.html\').read_text(encoding=\'utf-8\')\n'
                  'if \'manual_dual_photo_bridge.js\' not in text:\n'
                  '    raise SystemExit(\'[오류] index.html에 manual_dual_photo_bridge.js 연결이 없습니다. GitHub main 최신본으로 갱신하세요.\')\n'
                  'print(\'[OK] 앞뒤사진 UI 브리지 연결 확인 · index.html 무수정\')\n'
                  'PY\n\n'
              )
              text = text[:start_at] + replacement + text[end_at:]
          text = text.replace(
              "grep -q 'manual_dual_photo_bridge.js?v=149' index.html",
              "grep -q 'manual_dual_photo_bridge.js' index.html",
          )
          installer.write_text(text, encoding='utf-8')

          start_text = start.read_text(encoding='utf-8')
          installer_text = installer.read_text(encoding='utf-8')
          assert 'INSTALL_MANUAL_OFFICIAL_FALLBACK.sh 를 다시 실행하세요' not in start_text
          assert 'index.html 무수정' in installer_text
          assert "manual_dual_photo_bridge.js?v=149' index.html" not in installer_text
          print('[OK] legacy local index mutation removed')
          PY
          bash -n START_TCG_UPDATER_ANDROID.sh
          bash -n INSTALL_MANUAL_OFFICIAL_FALLBACK.sh
          grep -q 'manual_dual_photo_bridge.js' index.html
      - name: Commit guard
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git diff --quiet -- START_TCG_UPDATER_ANDROID.sh INSTALL_MANUAL_OFFICIAL_FALLBACK.sh; then
            echo 'guard already applied'
            exit 0
          fi
          git add START_TCG_UPDATER_ANDROID.sh INSTALL_MANUAL_OFFICIAL_FALLBACK.sh
          git commit -m 'fix: keep Android index clean during manual fallback v180'
          git push origin HEAD:main
