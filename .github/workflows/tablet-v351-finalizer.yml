name: Finalize Tablet GPT V351 post-merge checkpoint

on:
  push:
    branches:
      - fix/playgo-source-6517-20260928

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Verify V351 checkpoint
        run: |
          python -m unittest -v test_tablet_gpt_tcg_grader_sync_v351.py
          python -m unittest -v test_playgo_event_watch.py
      - name: Remove one-shot workflow and rebuild integrity manifest
        run: |
          rm .github/workflows/tablet-v351-finalizer.yml
          python static_integrity_manifest.py --write integrity_manifest.json
          python static_integrity_manifest.py --check integrity_manifest.json
      - name: Commit finalized V351 tree
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'chore: anchor Tablet GPT alignment at v351'
          git push origin HEAD:fix/playgo-source-6517-20260928
