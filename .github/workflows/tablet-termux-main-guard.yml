name: Tablet Termux Main Guard

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
    paths:
      - 'main'
      - 'ANDROID_UPDATE_AND_START.sh'
      - 'TABLET_SCHEDULED_UPDATE.sh'
      - 'tablet_runtime_manifest.py'
      - 'quality_review_policy.py'
      - 'quality_review_policy_v2.json'
      - 'test_quality_review_policy_v2.py'
      - 'VERIFY_TABLET_FINAL.sh'
      - 'test_tablet_scheduled_update_v256.py'
      - 'tablet_collection_publish.py'
      - 'tablet_collection_publish_contextual.py'
      - 'collection_verification_gate_contextual.py'
      - 'test_tablet_collection_publish.py'
      - 'test_tablet_main_entrypoint_v251.py'
      - 'TABLET_COLLECT_AND_SEND.sh'
      - 'TABLET_COLLECTION_PUBLISH.md'
      - '.github/workflows/tablet-termux-main-guard.yml'

permissions:
  contents: read

concurrency:
  group: tablet-termux-main-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      PYTHONPATH: ${{ github.workspace }}
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'

      - name: Static and targeted regression
        run: |
          python -m py_compile tablet_collection_publish.py tablet_collection_publish_contextual.py collection_verification_gate_contextual.py test_tablet_collection_publish.py test_tablet_main_entrypoint_v251.py test_tablet_scheduled_update_v256.py quality_review_policy.py test_quality_review_policy_v2.py tablet_runtime_manifest.py
          bash -n main
          bash -n ANDROID_UPDATE_AND_START.sh
          bash -n TABLET_SCHEDULED_UPDATE.sh
          bash -n VERIFY_TABLET_FINAL.sh
          bash -n TABLET_COLLECT_AND_SEND.sh
          python quality_review_policy.py --check
          python tablet_runtime_manifest.py --check --compile
          python -m unittest -v test_tablet_collection_publish.py test_tablet_main_entrypoint_v251.py test_tablet_scheduled_update_v256.py test_quality_review_policy_v2.py
          git diff --check origin/${{ github.base_ref || 'main' }}...HEAD || git diff --check HEAD^

      - name: Detect submitted tablet snapshot
        if: github.event_name == 'pull_request'
        id: snapshot
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          python - <<'PY'
          import os, subprocess
          base = os.environ['BASE_SHA']
          changed = subprocess.check_output(['git', 'diff', '--name-only', base, 'HEAD'], text=True).splitlines()
          mode = 'snapshot' if 'tablet_collection_receipt.json' in changed else 'code'
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as out:
              out.write(f'mode={mode}\n')
          print({'mode': mode, 'changed_count': len(changed)})
          PY

      - name: Verify submitted tablet snapshot fail-closed
        if: github.event_name == 'pull_request' && steps.snapshot.outputs.mode == 'snapshot'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: python tablet_collection_publish.py --verify-base "$BASE_SHA"

      - name: Safety contract
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('tablet_collection_publish.py').read_text(encoding='utf-8')
          contextual = Path('tablet_collection_publish_contextual.py').read_text(encoding='utf-8')
          main = Path('main').read_text(encoding='utf-8')
          required = [
              "'--fail-on-degraded'",
              "if publish and source != base",
              "changed <= set(OUTPUTS) | {RECEIPT}",
              "git(work, 'push', 'origin', f'HEAD:refs/heads/{branch}')",
              "'gh', 'pr', 'create'",
          ]
          missing = [item for item in required if item not in p]
          if missing:
              raise SystemExit(f'tablet fail-closed contract missing: {missing}')
          contextual_required = [
              'collection_verification_gate_contextual.py',
              '"--fail-on-degraded"',
              'core.gates = gates',
              'return core.main()',
          ]
          contextual_missing = [item for item in contextual_required if item not in contextual]
          if contextual_missing:
              raise SystemExit(f'contextual freshness contract missing: {contextual_missing}')
          if 'tablet_collection_publish_contextual.py' not in main:
              raise SystemExit('main entrypoint bypasses contextual collection gate')
          forbidden = ["--force", "push', 'origin', 'main'"]
          bad = [item for item in forbidden if item in p]
          if bad:
              raise SystemExit(f'unsafe tablet publish contract detected: {bad}')
          print('tablet Termux fail-closed + contextual freshness contract: PASS')
          PY
