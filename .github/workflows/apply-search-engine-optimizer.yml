name: Apply learned search engine optimizer

on:
  push:
    branches: [main]
    paths:
      - 'apply_search_engine_optimizer_patch.py'
      - 'test_search_engine_optimizer.py'
      - '.github/workflows/apply-search-engine-optimizer.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Apply optimizer patch
        run: |
          if grep -q 'def route_policy' search_method_learning.py; then
            echo 'Search optimizer already integrated; validation only'
          else
            python apply_search_engine_optimizer_patch.py
          fi
      - name: Verify syntax
        run: |
          python -m py_compile search_method_learning.py multi_channel_agent.py auto_pipeline_runner.py
      - name: Run optimizer and regression tests
        run: |
          python -m unittest test_search_engine_optimizer.py
          if [ -f test_search_method_learning.py ]; then python -m unittest test_search_method_learning.py; fi
          if [ -f test_adaptive_collection_learner.py ]; then python -m unittest test_adaptive_collection_learner.py; fi
      - name: Verify integration markers
        run: |
          grep -q 'def route_policy' search_method_learning.py
          grep -q 'def recommended_budget' search_method_learning.py
          grep -q 'search_engine_profile.json' search_method_learning.py
          grep -q 'route_timeout_seconds' multi_channel_agent.py
          grep -q 'engine_profile_file' multi_channel_agent.py
      - name: Commit integrated changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add search_method_learning.py multi_channel_agent.py test_search_engine_optimizer.py
          if ! git diff --cached --quiet; then
            git commit -m 'feat: use cumulative metrics to optimize search routing'
            git push origin main
          fi
