name: Product Event Review Proof
on:
  pull_request:
    paths:
      - 'promo_events.json'
      - 'execution/tests/test_product_event_review_20261120.py'
      - 'execution/product_event_quarantine.py'
      - 'execution/static_refresh_event_preflight.py'
      - 'auto_update_all.py'
      - 'update_promo_events.py'
      - 'execution/tests/test_static_refresh_product_stage_20261120.py'
      - 'execution/tests/test_promo_writer_candidate_lineage_20261121.py'
      - 'execution/tests/test_tablet_sync_successor_v1021.py'
      - 'execution/tests/test_tablet_sync_successor_v1043.py'
      - 'TCG_CROSSCHECK/TABLET_GPT_TCG_GRADER_SYNC_CONTRACT_V1043.json'
      - 'TCG_CROSSCHECK/TABLET_GPT/learning_snapshot_v1043_delta.json'
      - 'TCG_CROSSCHECK/TCG_GRADER/tablet_gpt_learning_receipt_v1043.json'
      - 'sync_v376_successor_test_support.py'
      - '.github/workflows/tcg-static-data-refresh.yml'
      - '.github/workflows/tcg-product-event-review-proof.yml'
  push:
    branches: [main]
    paths:
      - 'promo_events.json'
      - 'execution/tests/test_product_event_review_20261120.py'
      - 'execution/product_event_quarantine.py'
      - 'execution/static_refresh_event_preflight.py'
      - 'auto_update_all.py'
      - 'update_promo_events.py'
      - 'execution/tests/test_static_refresh_product_stage_20261120.py'
      - 'execution/tests/test_promo_writer_candidate_lineage_20261121.py'
      - 'execution/tests/test_tablet_sync_successor_v1021.py'
      - 'execution/tests/test_tablet_sync_successor_v1043.py'
      - 'TCG_CROSSCHECK/TABLET_GPT_TCG_GRADER_SYNC_CONTRACT_V1043.json'
      - 'TCG_CROSSCHECK/TABLET_GPT/learning_snapshot_v1043_delta.json'
      - 'TCG_CROSSCHECK/TCG_GRADER/tablet_gpt_learning_receipt_v1043.json'
      - 'sync_v376_successor_test_support.py'
      - '.github/workflows/tcg-static-data-refresh.yml'
      - '.github/workflows/tcg-product-event-review-proof.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          # The exact V1040 ancestry proof needs the original reviewed commits.
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'
      - name: Verify quarantined product evidence
        run: python -m unittest -v execution.tests.test_product_event_review_20261120
      - name: Verify static recovery preflight and pinned workflow descendant
        run: python -m unittest -v execution.tests.test_static_refresh_product_stage_20261120
      - name: Prove proposed promo writer exact candidate (no promotion)
        run: python -m unittest -v execution.tests.test_promo_writer_candidate_lineage_20261121
      - name: Verify V1043 post-V1021 exact reviewed lineage and tamper rejection
        run: python -m unittest -v execution.tests.test_tablet_sync_successor_v1043
      - name: Verify current immutable file hashes
        run: python static_integrity_manifest.py --check integrity_manifest.json
