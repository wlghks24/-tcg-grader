name: PackMagik V353 Finalizer

on:
  push:
    branches:
      - fix/packmagik-edition-parser-v353-20260929

permissions:
  contents: write

concurrency:
  group: packmagik-v353-finalizer
  cancel-in-progress: false

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          ref: fix/packmagik-edition-parser-v353-20260929

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'

      - name: Apply edition-safe Pack Magik fix
        run: |
          set -euo pipefail
          python apply_packmagik_v353.py
          python -m py_compile update_market_prices.py test_update_market_prices_packmagik_v353.py
          python -m unittest -v test_update_market_prices_packmagik_v353.py
          python -m unittest -v test_market_reference_sources_v130.py test_multi_market_price_collector.py

      - name: Remove one-shot files and regenerate final-tree integrity manifest
        run: |
          set -euo pipefail
          git rm -- .github/workflows/apply-packmagik-v353.yml apply_packmagik_v353.py
          python static_integrity_manifest.py --write integrity_manifest.json
          python static_integrity_manifest.py --check integrity_manifest.json
          python repository_integrity_guard.py
          git add -- update_market_prices.py test_update_market_prices_packmagik_v353.py integrity_manifest.json
          git diff --cached --check

      - name: Commit exact final tree
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: separate Pack Magik JP price and parse Market Value'
          git push origin HEAD:fix/packmagik-edition-parser-v353-20260929
