name: Finalize V351 Manifest Clean

on:
  push:
    branches:
      - fix/v351-integrity-manifest-20260928

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/v351-integrity-manifest-20260928
          fetch-depth: 0
      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'
      - name: Rebuild manifest for final tree and self-remove
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/finalize-v351-manifest-clean.yml
          python static_integrity_manifest.py --write
          python static_integrity_manifest.py --check
          python repository_integrity_guard.py
          git add integrity_manifest.json
          git diff --cached --check
          git commit -m "fix: synchronize v351 integrity manifest"
          git push origin HEAD:fix/v351-integrity-manifest-20260928
