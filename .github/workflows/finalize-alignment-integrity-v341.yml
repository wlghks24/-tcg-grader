name: Finalize alignment integrity v341

on:
  push:
    branches: [fix/alignment-integrity-v341]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: finalize-alignment-integrity-v341
  cancel-in-progress: true

jobs:
  finalize:
    if: github.repository == 'wlghks24/-tcg-grader'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact repair branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'

      - name: Install audited test dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Build and validate intended final tree
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = "fix/alignment-integrity-v341"
          python - <<'PY'
          from pathlib import Path
          p = Path('apply_alignment_integrity_v341.py')
          s = p.read_text(encoding='utf-8')
          old = 's = one(s, "          import json\\n          import re\\n", "          import json\\n          import os\\n          import re\\n", "freshness os import")'
          new = 's = s.replace("          import json\\n          import re\\n", "          import json\\n          import os\\n          import re\\n")'
          if s.count(old) != 1:
              raise SystemExit(f'helper ambiguity repair expected one match, got {s.count(old)}')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
          python apply_alignment_integrity_v341.py
          cp .github/workflows/tablet-gpt-tcg-grader-main-alignment.yml ALIGNMENT_V341_PAYLOAD.txt
          git rm -f -- apply_alignment_integrity_v341.py
          git rm -- .github/workflows/finalize-alignment-integrity-v341.yml
          git add -A
          python fault_injection_healing.py --manifest
          python repository_integrity_guard.py
          python fault_injection_healing.py --diagnose

      - name: Run targeted and related regressions
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest -v \
            test_repository_selfrefine_v13.py \
            test_tablet_gpt_tcg_grader_sync_v330.py \
            test_tablet_gpt_tcg_grader_sync_v331.py \
            test_tablet_gpt_tcg_grader_sync_v334.py \
            test_tablet_gpt_tcg_grader_sync_v339.py \
            test_tablet_gpt_tcg_grader_sync_v341.py
          python test_runtime_delivery_guards.py
          python verify_fault_injection_healing.py
          python verify_current_runtime.py
          git diff --check

      - name: Push validated non-workflow portion only
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = "fix/alignment-integrity-v341"
          # GitHub Actions tokens cannot update workflow files. Restore those two
          # workflow paths to this run's HEAD before committing; the manifest was
          # already generated and tested against the intended final alignment and
          # with the temporary finalizer absent. The user-authorized GitHub
          # connection applies those workflow tree changes atomically afterward.
          git checkout HEAD -- \
            .github/workflows/tablet-gpt-tcg-grader-main-alignment.yml \
            .github/workflows/finalize-alignment-integrity-v341.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          test ! -e apply_alignment_integrity_v341.py
          test -f ALIGNMENT_V341_PAYLOAD.txt
          test -f .github/workflows/finalize-alignment-integrity-v341.yml
          if git diff --cached --quiet; then
            echo 'No finalized non-workflow changes to commit.' >&2
            exit 1
          fi
          git diff --cached --name-only | grep -Fvx '.github/workflows/tablet-gpt-tcg-grader-main-alignment.yml' >/dev/null || true
          if git diff --cached --name-only | grep -q '^\.github/workflows/'; then
            echo 'Refusing bot push with workflow-file changes.' >&2
            git diff --cached --name-only >&2
            exit 1
          fi
          git commit -m 'Prepare validated alignment integrity repair v341'
          git push origin "HEAD:${GITHUB_REF_NAME}"
