name: v273 Result Cockpit Preflight

on:
  push:
    branches:
      - improve/grading-result-cockpit-v273

permissions:
  contents: write

jobs:
  verify-and-finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: improve/grading-result-cockpit-v273
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax and targeted UI regressions
        run: |
          node --check ui_app_shell_v272.js
          python -m py_compile test_ui_app_shell_v272.py
          python -m unittest -v \
            test_ui_app_shell_v272.py \
            test_pokemon_generation_display_v207.py \
            test_psa_probability_market_flow_v252.py
          python tablet_runtime_manifest.py --check --compile
      - name: Remove one-shot workflow and refresh integrity manifest
        run: |
          git rm .github/workflows/v273-result-cockpit-preflight.yml
          python - <<'PY'
          from pathlib import Path
          import fault_injection_healing as healing
          root = Path('.').resolve()
          healing.build_integrity_manifest(root, root / 'integrity_manifest.json')
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add integrity_manifest.json
          git commit -m "ci: finalize v273 result cockpit verification"
          git push origin HEAD:improve/grading-result-cockpit-v273
