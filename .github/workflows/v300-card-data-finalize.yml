name: V300 Card Data Consumer Finalize

on:
  push:
    branches:
      - audit/card-data-consumer-v300

permissions:
  contents: write

concurrency:
  group: v300-card-data-consumer-finalize
  cancel-in-progress: true

jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          ref: audit/card-data-consumer-v300

      - name: Apply bounded v300 hardening
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def read(path):
              return Path(path).read_text(encoding='utf-8')

          def write(path, text):
              Path(path).write_text(text, encoding='utf-8')

          # 1) Any runtime-consumed grading/market data change must execute the same
          # tablet/runtime regression guard as source-code changes.
          runtime_path = Path('.github/workflows/runtime-delivery-guard.yml')
          runtime = read(runtime_path)
          runtime_anchor = "      - 'update_market_prices.py'\n"
          additions = (
              "      - 'market_prices.json'\n"
              "      - 'exchange_rates.json'\n"
              "      - 'grading_company_updates.json'\n"
              "      - 'vision_calibration.json'\n"
              "      - 'graded_photo_candidates.json'\n"
              "      - 'test_card_data_delivery_gate_v300.py'\n"
              "      - '.github/workflows/tcg-static-data-refresh.yml'\n"
          )
          if runtime.count(runtime_anchor) != 2:
              raise SystemExit(f'runtime path anchor count changed: {runtime.count(runtime_anchor)}')
          if "      - 'market_prices.json'\n" not in runtime:
              runtime = runtime.replace(runtime_anchor, runtime_anchor + additions)

          suite = "test_card_core_provenance_v296.py test_card_market_edition_v297.py test_card_probability_ui_v298.py test_card_regression_gate_v299.py"
          if runtime.count(suite) != 1:
              raise SystemExit(f'runtime card suite anchor count changed: {runtime.count(suite)}')
          if 'test_card_regression_gate_v299.py test_card_data_delivery_gate_v300.py' not in runtime:
              runtime = runtime.replace(suite, suite + " test_card_data_delivery_gate_v300.py")

          compile_anchor = "verify_current_runtime.py test_card_regression_gate_v299.py tcg_updater.py"
          if runtime.count(compile_anchor) != 1:
              raise SystemExit(f'runtime compile anchor count changed: {runtime.count(compile_anchor)}')
          runtime = runtime.replace(
              compile_anchor,
              "verify_current_runtime.py test_card_regression_gate_v299.py test_card_data_delivery_gate_v300.py tcg_updater.py",
          )
          write(runtime_path, runtime)

          # 2) Generated data must be re-tested AFTER collection and BEFORE publish.
          refresh_path = Path('.github/workflows/tcg-static-data-refresh.yml')
          refresh = read(refresh_path)
          path_anchor = "      - 'test_static_data_publish_gate.py'\n"
          if refresh.count(path_anchor) != 1:
              raise SystemExit(f'static refresh path anchor count changed: {refresh.count(path_anchor)}')
          if "      - 'test_card_data_delivery_gate_v300.py'\n" not in refresh:
              refresh = refresh.replace(path_anchor, path_anchor + "      - 'test_card_data_delivery_gate_v300.py'\n")

          lines = refresh.splitlines()
          unit_hits = [i for i, line in enumerate(lines) if line.lstrip().startswith('test_static_data_publish_gate.py')]
          if len(unit_hits) != 1:
              raise SystemExit(f'static refresh unit anchor count changed: {len(unit_hits)}')
          if not any(line.lstrip().startswith('test_card_data_delivery_gate_v300.py') for line in lines):
              i = unit_hits[0]
              indent = lines[i][:len(lines[i]) - len(lines[i].lstrip())]
              lines.insert(i + 1, indent + 'test_card_data_delivery_gate_v300.py ' + chr(92))
          refresh = '\n'.join(lines) + '\n'

          publish_anchor = "      - name: Fail closed before publishing static data\n"
          if refresh.count(publish_anchor) != 1:
              raise SystemExit(f'publish anchor count changed: {refresh.count(publish_anchor)}')
          if 'Cross-check generated card data with runtime consumers' not in refresh:
              bs = chr(92)
              cross_lines = [
                  '      - name: Cross-check generated card data with runtime consumers',
                  '        run: |',
                  '          python -m unittest -v ' + bs,
                  '            test_card_core_provenance_v296.py ' + bs,
                  '            test_card_market_edition_v297.py ' + bs,
                  '            test_card_probability_ui_v298.py ' + bs,
                  '            test_psa_probability_market_flow_v252.py ' + bs,
                  '            test_card_data_delivery_gate_v300.py',
                  '          python -m unittest -v ' + bs,
                  '            test_card_core_crosscheck_v292.py ' + bs,
                  '            test_card_core_crosscheck_v295.py ' + bs,
                  '            test_pokemon_generation_display_v207.py',
                  '',
              ]
              refresh = refresh.replace(publish_anchor, '\n'.join(cross_lines) + '\n' + publish_anchor)
          write(refresh_path, refresh)

          # 3) The normal current-runtime verifier permanently carries this delivery gate.
          current_path = Path('verify_current_runtime.py')
          current = read(current_path)
          old_tests = '       "test_card_probability_ui_v298.py","test_card_regression_gate_v299.py"],300,False),'
          if current.count(old_tests) != 1:
              raise SystemExit(f'current runtime card anchor count changed: {current.count(old_tests)}')
          current = current.replace(
              old_tests,
              '       "test_card_probability_ui_v298.py","test_card_regression_gate_v299.py","test_card_data_delivery_gate_v300.py"],300,False),',
          )
          if current.count('current-main-v299-card-core-gated') != 1:
              raise SystemExit('current runtime engine marker changed')
          current = current.replace('current-main-v299-card-core-gated', 'current-main-v300-card-data-gated')
          write(current_path, current)

          # 4) Self-test the end-to-end ordering/trigger contract so later refactors fail closed.
          test_lines = [
              'from __future__ import annotations',
              '',
              'import unittest',
              'from pathlib import Path',
              '',
              'import verify_current_runtime as runtime',
              '',
              'ROOT = Path(__file__).resolve().parent',
              '',
              '',
              'class CardDataDeliveryGateV300Tests(unittest.TestCase):',
              '    def test_runtime_delivery_triggers_on_card_data_consumed_by_runtime(self) -> None:',
              '        workflow = (ROOT / ".github/workflows/runtime-delivery-guard.yml").read_text(encoding="utf-8")',
              '        for path in (',
              '            "market_prices.json",',
              '            "exchange_rates.json",',
              '            "grading_company_updates.json",',
              '            "vision_calibration.json",',
              '            "graded_photo_candidates.json",',
              '            "test_card_data_delivery_gate_v300.py",',
              '            ".github/workflows/tcg-static-data-refresh.yml",',
              '        ):',
              '            self.assertGreaterEqual(workflow.count(f"- \'{path}\'"), 2, path)',
              '',
              '    def test_fresh_static_snapshot_is_crosschecked_before_publish(self) -> None:',
              '        workflow = (ROOT / ".github/workflows/tcg-static-data-refresh.yml").read_text(encoding="utf-8")',
              '        collect = workflow.index("- name: Run full verified collection cycle")',
              '        cross = workflow.index("- name: Cross-check generated card data with runtime consumers")',
              '        publish = workflow.index("- name: Fail closed before publishing static data")',
              '        self.assertLess(collect, cross)',
              '        self.assertLess(cross, publish)',
              '        block = workflow[cross:publish]',
              '        for test_name in (',
              '            "test_card_core_provenance_v296.py",',
              '            "test_card_market_edition_v297.py",',
              '            "test_card_probability_ui_v298.py",',
              '            "test_psa_probability_market_flow_v252.py",',
              '            "test_card_core_crosscheck_v292.py",',
              '            "test_card_core_crosscheck_v295.py",',
              '            "test_pokemon_generation_display_v207.py",',
              '            "test_card_data_delivery_gate_v300.py",',
              '        ):',
              '            self.assertIn(test_name, block)',
              '',
              '    def test_current_runtime_keeps_v300_delivery_gate_in_card_regressions(self) -> None:',
              '        commands = {name: cmd for name, cmd, _timeout, _optional in runtime._commands()}',
              '        self.assertIn("card_core_static_regressions", commands)',
              '        self.assertIn("test_card_data_delivery_gate_v300.py", commands["card_core_static_regressions"])',
              '',
              '    def test_runtime_delivery_executes_and_compiles_v300_gate(self) -> None:',
              '        workflow = (ROOT / ".github/workflows/runtime-delivery-guard.yml").read_text(encoding="utf-8")',
              '        self.assertIn("test_card_regression_gate_v299.py test_card_data_delivery_gate_v300.py", workflow)',
              '        self.assertIn("test_card_data_delivery_gate_v300.py tcg_updater.py", workflow)',
              '',
              '',
              'if __name__ == "__main__":',
              '    unittest.main(verbosity=2)',
          ]
          Path('test_card_data_delivery_gate_v300.py').write_text('\n'.join(test_lines) + '\n', encoding='utf-8')
          PY

      - name: Remove one-shot workflow and rebuild integrity manifest
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/v300-card-data-finalize.yml
          python fault_injection_healing.py --manifest
          python fault_injection_healing.py --diagnose

      - name: Run focused card regressions
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check pillow
          python -m py_compile verify_current_runtime.py test_card_data_delivery_gate_v300.py
          python -m unittest -v test_card_data_delivery_gate_v300.py
          python -m unittest -v \
            test_card_core_provenance_v296.py \
            test_card_market_edition_v297.py \
            test_card_probability_ui_v298.py \
            test_psa_probability_market_flow_v252.py \
            test_card_core_crosscheck_v292.py \
            test_card_core_crosscheck_v295.py \
            test_pokemon_generation_display_v207.py
          python tablet_runtime_manifest.py --check --compile
          node --check grading_accuracy_v99.js
          node --check grade_market_flow.js
          node --check card_identity_recognition.js
          node --check ui_app_shell_v272.js

      - name: Final integrity diagnosis and commit
        shell: bash
        run: |
          set -euo pipefail
          python fault_injection_healing.py --diagnose
          git add -- \
            .github/workflows/runtime-delivery-guard.yml \
            .github/workflows/tcg-static-data-refresh.yml \
            verify_current_runtime.py \
            test_card_data_delivery_gate_v300.py \
            integrity_manifest.json \
            .github/workflows/v300-card-data-finalize.yml
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Guard generated card data against runtime regressions (v300)'
          git push origin HEAD:audit/card-data-consumer-v300
