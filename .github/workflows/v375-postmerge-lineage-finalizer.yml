name: V375 Postmerge Lineage Finalizer

on:
  push:
    branches:
      - fix/tablet-v375-postmerge-lineage

permissions:
  contents: write

concurrency:
  group: v375-postmerge-lineage-finalizer
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/tablet-v375-postmerge-lineage
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Repair historical successor anchors
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          old = "d7c8577b514abdbbc15ba9323c4c0deb1945efed"
          new = "c0fe7ed9b4e351ee18a0d76eab0424787cb7b2f2"
          changed = []
          for path in sorted(Path('.').glob('test_tablet_gpt_tcg_grader_sync_v*.py')):
              text = path.read_text(encoding='utf-8')
              if old in text:
                  path.write_text(text.replace(old, new), encoding='utf-8')
                  changed.append(path.as_posix())
          print('updated:', changed)
          PY
      - name: Remove one-shot workflow before exact-tree manifest
        shell: bash
        run: git rm .github/workflows/v375-postmerge-lineage-finalizer.yml
      - name: Rebuild exact-tree integrity manifest
        shell: bash
        run: |
          set -euo pipefail
          python static_integrity_manifest.py --write
          python static_integrity_manifest.py --check
      - name: Run complete Tablet GPT lineage regression
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t tests < <(find . -maxdepth 1 -type f -name 'test_tablet_gpt_tcg_grader_sync_v*.py' -printf '%f\n' | sort -V)
          test "${#tests[@]}" -gt 0
          python -m unittest -v "${tests[@]}"
      - name: Commit finalized repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add TCG_CROSSCHECK/TABLET_GPT_TCG_GRADER_SYNC_CONTRACT_V375.json test_tablet_gpt_tcg_grader_sync_v*.py integrity_manifest.json
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'No finalization changes required.'
            exit 0
          fi
          git commit -m 'fix: finalize v375 clean lineage evidence'
          git push origin HEAD:fix/tablet-v375-postmerge-lineage
