name: One-shot CodeQL alert evidence 20261125
on:
  push:
    branches: [review/codeql-alert-evidence-20261125]
    paths: ['.github/workflows/codeql-alert-evidence-20261125.yml']
permissions:
  contents: read
jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript-typescript]
        revision: [9b96d702e128f65afc0b4ef80e288f2ab86a409c, b76592b2435005314512a3bb4a14e3ebd3a497e8]
    steps:
      - name: Checkout immutable analyzed tree
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ matrix.revision }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify exact checkout
        env:
          EXPECTED: ${{ matrix.revision }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED"
      - name: Initialize unchanged CodeQL configuration
        uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2
        with:
          languages: ${{ matrix.language }}
          config-file: ./.github/codeql/codeql-config-v438.yml
      - name: Analyze for local evidence only
        id: analysis
        uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2
        with:
          upload: never
          output: ../tcg-diagnostic-sarif
          category: "/language:${{ matrix.language }}"
      - name: Emit rule and location metadata (no source snippets)
        env:
          SARIF_DIR: ${{ steps.analysis.outputs.sarif-output }}
          ANALYZED_REVISION: ${{ matrix.revision }}
          LANGUAGE: ${{ matrix.language }}
        run: |
          python - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          from urllib.parse import unquote, urlsplit
          base = "9b96d702e128f65afc0b4ef80e288f2ab86a409c"
          head = "b76592b2435005314512a3bb4a14e3ebd3a497e8"
          changed = set(subprocess.check_output(
              ["git", "diff", "--no-renames", "--name-only", "-z", base, head]
          ).decode("utf-8").split("\0")) - {""}
          folder = Path(os.environ["SARIF_DIR"])
          files = sorted(folder.glob("*.sarif"))
          if not files:
              raise SystemExit("SARIF_MISSING")
          rows = []
          high_total = 0
          result_count = 0
          for file in files:
              data = json.loads(file.read_text(encoding="utf-8"))
              for run in data["runs"]:
                  rules = {r["id"]: r for r in run["tool"]["driver"].get("rules", [])}
                  for result in run.get("results", []):
                      result_count += 1
                      rid = result.get("ruleId", "")
                      rule = rules.get(rid, {})
                      value = rule.get("properties", {}).get("security-severity")
                      score = float(value) if value is not None else None
                      if score is not None and score >= 7:
                          high_total += 1
                      for loc in result.get("locations", []):
                          physical = loc.get("physicalLocation", {})
                          uri = physical.get("artifactLocation", {}).get("uri", "")
                          path = unquote(urlsplit(uri).path)
                          if Path(path).is_absolute():
                              try:
                                  path = Path(path).relative_to(Path.cwd()).as_posix()
                              except ValueError:
                                  continue
                          if path not in changed:
                              continue
                          region = physical.get("region", {})
                          rows.append({"path": path, "line": region.get("startLine"),
                                       "rule": rid, "severity": score,
                                       "level": result.get("level", rule.get("defaultConfiguration", {}).get("level")),
                                       "fingerprints": result.get("partialFingerprints", {})})
          print("CODEQL_EVIDENCE_SUMMARY " + json.dumps({
              "revision": os.environ["ANALYZED_REVISION"], "language": os.environ["LANGUAGE"],
              "total_results": result_count, "high_total": high_total,
              "changed_path_results": len(rows), "truncated": len(rows) > 4000
          }, sort_keys=True))
          for row in sorted(rows, key=lambda r: (-(r["severity"] or 0), r["path"], r["line"] or 0, r["rule"]))[:4000]:
              print("CODEQL_EVIDENCE_ROW " + json.dumps(row, sort_keys=True, ensure_ascii=True))
          if len(rows) > 4000:
              raise SystemExit("EVIDENCE_TRUNCATED")
          PY
