name: Temporary v359 Candidate Manifest Finalizer

on:
  push:
    branches:
      - 'ops/v359-manifest-finalizer'

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor == github.repository_owner
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 'fix/drive-package-blockers-v359'
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Require exact candidate and current-main ancestry
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse --abbrev-ref HEAD)" = "fix/drive-package-blockers-v359"
          git fetch origin +refs/heads/main:refs/remotes/origin/main
          git merge-base --is-ancestor origin/main HEAD
      - name: Rebuild and verify exact candidate manifest
        shell: bash
        run: |
          set -euo pipefail
          python static_integrity_manifest.py --write integrity_manifest.json
          python static_integrity_manifest.py --check integrity_manifest.json
          python repository_integrity_guard.py
          mapfile -t sync_tests < <(find . -maxdepth 1 -type f -name 'test_tablet_gpt_tcg_grader_sync_v*.py' -printf '%f\n' | sort -V)
          test "${#sync_tests[@]}" -gt 0
          python -m unittest -v "${sync_tests[@]}"
          python -m unittest -v test_drive_package_blockers_v359.py test_update_market_prices_packmagik_v353.py test_collection_verification_contextual_v257.py
          git diff --check
      - name: Commit only manifest when changed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- integrity_manifest.json; then
            echo '[OK] candidate manifest already exact'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- integrity_manifest.json
          test "$(git diff --cached --name-only)" = "integrity_manifest.json"
          git diff --cached --check
          git commit -m 'Reconcile integrity manifest for v359 Drive blocker fix'
          git push origin HEAD:fix/drive-package-blockers-v359
