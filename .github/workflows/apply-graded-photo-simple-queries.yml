name: Apply graded photo simple queries
on:
  push:
    paths:
      - 'apply_graded_photo_simple_queries.py'
      - '.github/workflows/apply-graded-photo-simple-queries.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Apply simple queries when missing
        run: |
          if grep -q 'tuple\[tuple\[str,str\],\.\.\.\]' graded_photo_multi_source.py; then
            echo 'Simple per-grader queries already integrated; validation only'
          else
            python apply_graded_photo_simple_queries.py
          fi
      - run: python -m py_compile graded_photo_multi_source.py
      - run: python -m unittest -v test_graded_photo_multi_source.py
      - name: Commit patched collector
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add graded_photo_multi_source.py
          if ! git diff --cached --quiet; then
            git commit -m 'fix: use simple per-grader photo queries'
            git push
          fi
