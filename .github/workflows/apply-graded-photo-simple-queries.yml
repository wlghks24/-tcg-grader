name: Apply graded photo simple queries
# Legacy integrated feature: automatic source mutation is disabled; run manually only.
on:
  workflow_dispatch:

permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Apply simple queries when missing
        run: |
          if grep -q 'tuple\[tuple\[str,str\],\.\.\.\]' graded_photo_multi_source.py; then
            echo 'Simple per-grader queries already integrated; validation only'
          else
            python apply_graded_photo_simple_queries.py
          fi
      - run: python -m py_compile graded_photo_multi_source.py
      - run: python -m unittest -v test_graded_photo_multi_source.py
      - name: Commit patched collector
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add graded_photo_multi_source.py
          if ! git diff --cached --quiet; then
            git commit -m 'fix: use simple per-grader photo queries'
            git push
          fi
