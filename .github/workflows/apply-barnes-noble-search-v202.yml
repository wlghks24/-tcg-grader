name: Apply Barnes Noble Search v202
on:
  push:
    branches: [main]
    paths:
      - 'apply_barnes_noble_search_v202.py'
      - '.github/workflows/apply-barnes-noble-search-v202.yml'
permissions:
  contents: write
jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply verified Barnes Noble search route
        run: python apply_barnes_noble_search_v202.py
      - name: Validate JSON and selected route
        run: |
          python - <<'PY'
          import json
          data=json.load(open('purchase_sources.json',encoding='utf-8'))
          rows=[x for x in data['sources'] if x.get('name')=='Barnes & Noble']
          assert len(rows)==1
          assert rows[0]['url_template']=='https://www.barnesandnoble.com/search?q={query}'
          print('[OK] purchase_sources Barnes & Noble route')
          PY
          code=$(curl -A 'Mozilla/5.0 TCG-Grader-Link-Checker/1.0' -L -sS --max-time 20 -o /dev/null -w '%{http_code}' 'https://www.barnesandnoble.com/search?q=Pokemon%20cards')
          echo "Barnes Noble live HTTP=$code"
          test "$code" = "200"
      - name: Run link recovery regression tests
        run: |
          python test_link_audit_hardening_v184.py
          python test_link_same_host_fallback_v189.py
          python test_link_recovery_learning_v201.py
      - name: Check diff
        run: git diff --check
      - name: Commit verified retailer route
        run: |
          if git diff --quiet -- purchase_sources.json; then
            echo 'No route update needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add purchase_sources.json
          git commit -m 'fix: replace broken Barnes Noble search route v202'
          git push origin HEAD:main
