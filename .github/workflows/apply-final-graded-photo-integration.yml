name: Apply final graded photo integration
on:
  push:
    paths:
      - 'apply_final_graded_photo_integration.py'
      - '.github/workflows/apply-final-graded-photo-integration.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python apply_final_graded_photo_integration.py
      - run: python -m py_compile graded_photo_multi_source.py detailed_collection_intelligence.py
      - name: Commit integrated collector
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add graded_photo_multi_source.py
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "fix: integrate adaptive timeout with detailed collection"
            git push origin main
          fi
