name: Apply manual-only official verification v192

on:
  push:
    branches: [main]
    paths:
      - 'apply_manual_only_official_verification_v192.py'
      - '.github/workflows/apply-manual-only-official-verification-v192.yml'

permissions:
  contents: write

concurrency:
  group: apply-manual-only-official-verification-v192
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependency
        run: python -m pip install pillow
      - name: Apply v192 patch
        run: python apply_manual_only_official_verification_v192.py
      - name: Verify Python and JS syntax
        run: |
          python -m py_compile grading_cert_verifier.py manual_graded_photo_registration.py manual_official_proof.py graded_photo_multi_source.py pending_official_candidate_v161.py test_manual_only_official_verification_v192.py
          node --check manual_official_verify_bridge.js
          node --check pending_official_candidate_bridge_v161.js
      - name: Verify manual-only behavior
        run: |
          python test_manual_only_official_verification_v192.py
          python test_pending_official_candidate_v161.py
          git diff --check
      - name: Commit v192 runtime change
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add grading_cert_verifier.py manual_graded_photo_registration.py manual_official_proof.py graded_photo_multi_source.py manual_official_verify_bridge.js pending_official_candidate_bridge_v161.js index.html test_manual_only_official_verification_v192.py
          if git diff --cached --quiet; then
            echo 'No runtime changes to commit'
            exit 0
          fi
          git commit -m 'fix: make all grader verification manual-only v192'
          git push origin HEAD:main
