name: Finalize Tablet Autonomous Evolution v381

on:
  push:
    branches:
      - 'feature/tablet-autonomous-evolution-v381'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: finalize-tablet-autonomous-evolution-v381-${{ github.ref }}
  cancel-in-progress: true

jobs:
  finalize:
    if: github.actor == github.repository_owner
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'

      - name: Finalize exact V381 tree and verify
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = "feature/tablet-autonomous-evolution-v381"
          git fetch origin +refs/heads/main:refs/remotes/origin/main
          git merge-base --is-ancestor origin/main HEAD

          git rm -- .github/workflows/finalize-tablet-autonomous-evolution-v381.yml

          python -m py_compile             tablet_autonomous_evolution_v381.py             test_tablet_autonomous_evolution_v381.py             sync_v376_successor_test_support.py             test_tablet_gpt_tcg_grader_sync_v380.py             test_tablet_gpt_tcg_grader_sync_v381.py
          python tablet_autonomous_evolution_v381.py --self-test
          python -m unittest -v             test_tablet_autonomous_evolution_v381.py             test_tablet_gpt_tcg_grader_sync_v380.py             test_tablet_gpt_tcg_grader_sync_v381.py

          mapfile -t sync_tests < <(find . -maxdepth 1 -type f -name 'test_tablet_gpt_tcg_grader_sync_v*.py' -printf '%f\n' | sort -V)
          test "${#sync_tests[@]}" -gt 0
          python -m unittest -v "${sync_tests[@]}"

          bash -n main
          python tablet_runtime_manifest.py --check --compile

          python static_integrity_manifest.py --write integrity_manifest.json
          git add -- integrity_manifest.json
          python static_integrity_manifest.py --check integrity_manifest.json
          python fault_injection_healing.py --diagnose
          python repository_integrity_guard.py
          python -m unittest -v test_static_integrity_manifest_v345.py
          git diff --check
          git diff --cached --check

          mapfile -t staged < <(git diff --cached --name-only | sort)
          test "${#staged[@]}" -eq 2
          test "${staged[0]}" = ".github/workflows/finalize-tablet-autonomous-evolution-v381.yml"
          test "${staged[1]}" = "integrity_manifest.json"

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Finalize v381 integrity manifest'
          git push origin "HEAD:${GITHUB_REF_NAME}"
