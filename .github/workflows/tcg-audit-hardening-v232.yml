name: TCG audit hardening v232

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tcg-audit-hardening-v232.yml'

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 5
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'
      - name: Patch verified collection contracts
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path, old, new, count=1):
              p=Path(path); text=p.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'anchor not found: {path}: {old[:100]!r}')
              text=text.replace(old,new,count)
              p.write_text(text,encoding='utf-8')

          # 1) Collection verifier: use the actual shared 3x3x24 topic contract,
          # current release coverage schema, and preserve degraded source reasons.
          replace('collection_verification_gate.py',
                  'import auto_update_all\n',
                  'import auto_update_all\nimport multi_route_event_discovery\n')
          replace('collection_verification_gate.py',
                  'CRITICAL_FILES = MANDATORY_OUTPUT_FILES\n',
                  'CRITICAL_FILES = MANDATORY_OUTPUT_FILES\nEXPECTED_EVENT_TOPIC_CELLS = (\n    len(multi_route_event_discovery.GAMES)\n    * len(multi_route_event_discovery.REGIONS)\n    * len(multi_route_event_discovery.COVERAGE_TOPICS)\n)\nEXPECTED_RELEASE_COVERAGE_CELLS = (\n    len(multi_route_event_discovery.GAMES) * len(multi_route_event_discovery.REGIONS)\n)\n')
          replace('collection_verification_gate.py',
                  '    coverage = db.get("collection_coverage") if isinstance(db.get("collection_coverage"), dict) else {}\n    expected = int(coverage.get("expected_cells") or 0)\n    configured = int(coverage.get("configured_cells") or 0)\n    if expected and configured < expected:\n        findings.append({"severity": "high", "code": "INCOMPLETE_RELEASE_SOURCE_MATRIX",\n                         "target": "releases.json", "expected_cells": expected,\n                         "configured_cells": configured})\n',
                  '    history_progress = db.get("history_backfill_progress") if isinstance(db.get("history_backfill_progress"), dict) else {}\n    coverage = history_progress.get("coverage_matrix") if isinstance(history_progress.get("coverage_matrix"), dict) else {}\n    if not coverage:\n        coverage = db.get("collection_coverage") if isinstance(db.get("collection_coverage"), dict) else {}\n    expected = int(coverage.get("expected_cells") or 0)\n    configured = int(coverage.get("configured_cells") or 0)\n    if coverage and (expected != EXPECTED_RELEASE_COVERAGE_CELLS or configured < EXPECTED_RELEASE_COVERAGE_CELLS):\n        findings.append({"severity": "high", "code": "INCOMPLETE_RELEASE_SOURCE_MATRIX",\n                         "target": "releases.json", "expected_cells": EXPECTED_RELEASE_COVERAGE_CELLS,\n                         "reported_expected_cells": expected, "configured_cells": configured})\n')
          replace('collection_verification_gate.py',
                  '    if expected_topics and expected_topics < 207:\n        findings.append({"severity": "high", "code": "INCOMPLETE_EVENT_TOPIC_MATRIX",\n                         "target": "promo_events.json", "expected_minimum": 207,\n                         "configured_cells": expected_topics})\n    if expected_topics and attempted_topics < expected_topics:\n        findings.append({"severity": "high", "code": "INCOMPLETE_EVENT_TOPIC_COLLECTION_ATTEMPTS",\n                         "target": "promo_events.json", "expected_cells": expected_topics,\n                         "attempted_cells": attempted_topics})\n',
                  '    topic_contract_present = any(key in db for key in (\n        "social_topic_expected_cells", "social_topic_attempted_cells", "social_topic_successful_cells"\n    ))\n    if topic_contract_present and expected_topics != EXPECTED_EVENT_TOPIC_CELLS:\n        findings.append({"severity": "high", "code": "INCOMPLETE_EVENT_TOPIC_MATRIX",\n                         "target": "promo_events.json", "expected_cells": EXPECTED_EVENT_TOPIC_CELLS,\n                         "configured_cells": expected_topics})\n    if topic_contract_present and attempted_topics < EXPECTED_EVENT_TOPIC_CELLS:\n        findings.append({"severity": "high", "code": "INCOMPLETE_EVENT_TOPIC_COLLECTION_ATTEMPTS",\n                         "target": "promo_events.json", "expected_cells": EXPECTED_EVENT_TOPIC_CELLS,\n                         "attempted_cells": attempted_topics})\n')
          replace('collection_verification_gate.py',
                  '                degraded_errors.append({"source": str(source_id), "error": str(row.get("error") or "")[:300]})\n',
                  '                degraded_errors.append({"source": str(source_id), "error": str(row.get("error") or row.get("last_error") or "")[:300]})\n')

          # 2) Grading watcher: fetch success is not pricing-parse success; a repeated
          # failure can never promote an unverified source into a verified one.
          replace('grading_company_watch.py',
                  '                services = parse_services(company, spec["market"], spec["currency"], text, spec["url"]) if "pricing" in spec["kind"] else []\n                found = extract_announcements(raw, spec["url"], company, source_id) if spec["kind"] in {"news", "events", "pricing_news"} else []\n',
                  '                services = parse_services(company, spec["market"], spec["currency"], text, spec["url"]) if "pricing" in spec["kind"] else []\n                if "pricing" in spec["kind"] and not services:\n                    raise ValueError("pricing parser yielded zero verified services")\n                found = extract_announcements(raw, spec["url"], company, source_id) if spec["kind"] in {"news", "events", "pricing_news"} else []\n')
          replace('grading_company_watch.py',
                  '            except Exception as exc:\n                retained = dict(old) if old else {\n',
                  '            except Exception as exc:\n                old_verified = bool(\n                    old.get("verified_official_source") is True\n                    and old.get("signal_fingerprint")\n                )\n                retained = dict(old) if old else {\n')
          replace('grading_company_watch.py',
                  '                    "status": "degraded", "checked_at": checked_at,\n                    "last_error": diagnostic_exception(exc), "verified_official_source": bool(old),\n',
                  '                    "status": "degraded", "checked_at": checked_at,\n                    "last_error": diagnostic_exception(exc), "verified_official_source": old_verified,\n')
          replace('grading_company_watch.py',
                  '                if retained.get("services"):\n                    markets[spec["market"]] = {\n                        "currency": spec["currency"], "source": spec["url"],\n                        "services": retained["services"], "retained_last_good": True,\n                        "verified_official_source": bool(old),\n                    }\n                announcements.extend(retained.get("announcements", []) or [])\n',
                  '                if old_verified and retained.get("services"):\n                    markets[spec["market"]] = {\n                        "currency": spec["currency"], "source": spec["url"],\n                        "services": retained["services"], "retained_last_good": True,\n                        "verified_official_source": True,\n                    }\n                if old_verified:\n                    announcements.extend(retained.get("announcements", []) or [])\n')

          # 3) Retired Pokemon Korea URLs remain migration aliases only, never active discovery routes.
          p=Path('multi_route_event_discovery.py'); text=p.read_text(encoding='utf-8')
          text=text.replace('        "https://pokemoncard.co.kr/card/category/info1",\n        "https://www.pokemonkorea.co.kr/",\n',
                            '        "https://new.pokemonkorea.co.kr/card",\n')
          p.write_text(text,encoding='utf-8')

          p=Path('social_event_discovery.py'); text=p.read_text(encoding='utf-8')
          text=text.replace('    "pokemoncard.co.kr", "www.pokemoncard.co.kr", "pokemonkorea.co.kr", "www.pokemonkorea.co.kr",\n',
                            '    "new.pokemonkorea.co.kr",\n')
          text=text.replace('    ("포켓몬 카드", "KR", "https://www.pokemonkorea.co.kr/"),\n',
                            '    ("포켓몬 카드", "KR", "https://new.pokemonkorea.co.kr/card"),\n')
          p.write_text(text,encoding='utf-8')

          replace('update_promo_events.py',
                  '        "source": "https://www.pokemonkorea.co.kr/",\n        "collection_source": "https://new.pokemonkorea.co.kr/card",\n',
                  '        "source": "https://new.pokemonkorea.co.kr/card",\n        "collection_source": "https://new.pokemonkorea.co.kr/card",\n')

          # 4) Regression contracts.
          p=Path('test_collection_verification_gate.py'); text=p.read_text(encoding='utf-8')
          anchor='    def test_missing_topic_collection_attempt_is_degraded(self):\n'
          test='''    def test_topic_matrix_cannot_silently_shrink_below_shared_contract(self):\n        self.valid_fixture()\n        self.write("promo_events.json", {\n            "items": [{"region": "KR", "category": "promo", "name_ko": "Test",\n                       "source": "https://example.com/event", "source_grade": "official"}],\n            "social_topic_expected_cells": gate.EXPECTED_EVENT_TOPIC_CELLS - 1,\n            "social_topic_attempted_cells": gate.EXPECTED_EVENT_TOPIC_CELLS - 1,\n            "social_topic_successful_cells": gate.EXPECTED_EVENT_TOPIC_CELLS - 1,\n        })\n        report = gate.verify(self.root, now=self.now)\n        self.assertEqual(216, gate.EXPECTED_EVENT_TOPIC_CELLS)\n        self.assertEqual("degraded", report["status"])\n        self.assertTrue(any(x["code"] == "INCOMPLETE_EVENT_TOPIC_MATRIX" for x in report["findings"]))\n\n'''
          if anchor not in text: raise SystemExit('collection test anchor missing')
          text=text.replace(anchor,test+anchor,1); p.write_text(text,encoding='utf-8')

          p=Path('test_grading_company_watch_v215.py'); text=p.read_text(encoding='utf-8')
          anchor='    def test_initial_baseline_does_not_claim_every_current_service_changed(self):\n'
          test='''    def test_repeated_failure_never_promotes_unverified_source(self):\n        specs = ({"id": "psa-jp-pricing", "kind": "pricing", "market": "JP", "currency": "JPY",\n                  "url": "https://www.psacard.com/ja-JP/services/tradingcardgrading/grading"},)\n        previous = {"sources": {"psa-jp-pricing": {\n            "company": "PSA", "source_id": "psa-jp-pricing", "kind": "pricing",\n            "market": "JP", "currency": "JPY", "url": specs[0]["url"],\n            "status": "degraded", "services": [], "announcements": [],\n            "verified_official_source": False,\n        }}, "announcements": [], "history": []}\n        with mock.patch.object(watch, "WATCH_SOURCES", {"PSA": specs}):\n            data = watch.collect(previous, fetcher=mock.Mock(side_effect=OSError("still blocked")))\n        self.assertFalse(data["sources"]["psa-jp-pricing"]["verified_official_source"])\n\n    def test_pricing_fetch_without_verified_services_is_degraded(self):\n        specs = ({"id": "tag-pricing", "kind": "pricing", "market": "US", "currency": "USD",\n                  "url": "https://taggrading.com/pages/pricing"},)\n        html = "<html><body>TAG official grading pricing page is reachable but the dynamic price table is unavailable in this response.</body></html>"\n        with mock.patch.object(watch, "WATCH_SOURCES", {"TAG": specs}):\n            data = watch.collect({}, fetcher=lambda _url: html)\n        source = data["sources"]["tag-pricing"]\n        self.assertEqual("degraded", source["status"])\n        self.assertIn("zero verified services", source["last_error"])\n        self.assertFalse(source["verified_official_source"])\n\n'''
          if anchor not in text: raise SystemExit('grading test anchor missing')
          text=text.replace(anchor,test+anchor,1); p.write_text(text,encoding='utf-8')

          p=Path('test_collection_scope_compat_v214.py'); text=p.read_text(encoding='utf-8')
          text=text.replace('import feature_contract\n', 'import feature_contract\nimport multi_route_event_discovery\nimport social_event_discovery\n')
          anchor='    def test_event_and_link_audit_recovery_never_fall_back_to_retired_root(self):\n'
          test='''    def test_retired_pokemon_korea_urls_are_not_active_discovery_routes(self):\n        current = "https://new.pokemonkorea.co.kr/card"\n        self.assertEqual((current,), multi_route_event_discovery.OFFICIAL_ROUTES[("포켓몬 카드", "KR")])\n        pages = {row[:2]: row[2] for row in social_event_discovery.OFFICIAL_DISCOVERY_PAGES}\n        self.assertEqual(current, pages[("포켓몬 카드", "KR")])\n        self.assertIn("new.pokemonkorea.co.kr", social_event_discovery.OFFICIAL_HOSTS)\n        self.assertNotIn("pokemoncard.co.kr", social_event_discovery.OFFICIAL_HOSTS)\n        self.assertNotIn("pokemonkorea.co.kr", social_event_discovery.OFFICIAL_HOSTS)\n        tracker = next(row for row in update_promo_events.KR_MOVIE_TRACKERS if row["game"] == "포켓몬 카드")\n        self.assertEqual(current, tracker["source"])\n\n'''
          if anchor not in text: raise SystemExit('scope test anchor missing')
          text=text.replace(anchor,test+anchor,1); p.write_text(text,encoding='utf-8')
          PY

      - name: Verify patched contracts
        run: |
          python -m py_compile collection_verification_gate.py grading_company_watch.py multi_route_event_discovery.py social_event_discovery.py update_promo_events.py test_collection_verification_gate.py test_grading_company_watch_v215.py test_collection_scope_compat_v214.py
          python -m unittest -v \
            test_collection_verification_gate.py \
            test_grading_company_watch_v215.py \
            test_collection_scope_compat_v214.py \
            test_static_data_publish_gate.py \
            test_release_history_cumulative_coverage_v229.py \
            test_social_event_topic_coverage.py \
            test_social_topic_capacity_v213.py \
            test_information_lifecycle_archive_v209.py \
            test_grading_watch_integration_v220.py
          python feature_contract.py
          python repository_integrity_guard.py
      - name: Commit verified fixes
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add collection_verification_gate.py grading_company_watch.py multi_route_event_discovery.py social_event_discovery.py update_promo_events.py test_collection_verification_gate.py test_grading_company_watch_v215.py test_collection_scope_compat_v214.py
          git diff --cached --check
          git commit -m 'fix: harden TCG collection trust and coverage contracts'
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then exit 0; fi
            git fetch origin main
            git rebase origin/main
            sleep $((attempt * 2))
          done
          exit 1
