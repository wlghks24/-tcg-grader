name: Collection Verification Guard
# v252 — grading-provider RCA diagnostics are part of the verified regression chain.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'safe_runtime.py'
      - 'test_safe_runtime_redirect_diagnostics_v253.py'
      - 'collection_verification_gate.py'
      - 'test_collection_verification_gate.py'
      - 'tcg_updater.py'
      - 'auto_update_all.py'
      - 'update_market_watch.py'
      - 'update_market_prices.py'
      - 'market_public_crosscheck.py'
      - 'test_market_public_crosscheck_resilience_v228.py'
      - 'test_market_public_crosscheck_performance_v251.py'
      - 'test_collection_restored_state_guard_v229.py'
      - 'test_release_history_cumulative_coverage_v229.py'
      - 'multi_market_price_collector.py'
      - 'update_releases.py'
      - 'release_history_backfill.py'
      - 'update_promo_events.py'
      - 'update_purchase_sources.py'
      - 'update_exchange_rates.py'
      - 'grading_company_watch.py'
      - 'grading_company_health_diagnostics.py'
      - 'grading_company_updates.json'
      - 'graded_photo_multi_source.py'
      - 'verified_collection_job_neural.py'
      - 'validate_external_links.py'
      - 'feature_contract.py'
      - 'runtime_bundle_guard_v143.py'
      - 'multi_route_event_discovery.py'
      - 'social_event_discovery.py'
      - 'auto_pipeline_runner.py'
      - 'supplementary_discovery.py'
      - 'static_data_publish_gate.py'
      - 'test_static_data_publish_gate.py'
      - 'test_collection_scope_compat_v214.py'
      - 'test_social_event_topic_coverage.py'
      - 'test_social_topic_capacity_v213.py'
      - 'test_information_lifecycle_archive_v209.py'
      - 'test_grading_company_watch_v215.py'
      - 'test_grading_company_health_diagnostics_v252.py'
      - 'test_grading_watch_integration_v220.py'
      - 'test_verified_collection_job_neural_v212.py'
      - 'source_collection_stats.json'
      - 'adaptive_collection_stats.json'
      - '.github/workflows/collection-verification-guard.yml'
      - '.github/workflows/tcg-static-data-refresh.yml'
      - '.github/workflows/grading-company-watch.yml'
  push:
    branches: [main]
    paths:
      - 'safe_runtime.py'
      - 'test_safe_runtime_redirect_diagnostics_v253.py'
      - 'collection_verification_gate.py'
      - 'test_collection_verification_gate.py'
      - 'tcg_updater.py'
      - 'auto_update_all.py'
      - 'update_market_watch.py'
      - 'update_market_prices.py'
      - 'market_public_crosscheck.py'
      - 'test_market_public_crosscheck_resilience_v228.py'
      - 'test_market_public_crosscheck_performance_v251.py'
      - 'test_collection_restored_state_guard_v229.py'
      - 'test_release_history_cumulative_coverage_v229.py'
      - 'multi_market_price_collector.py'
      - 'update_releases.py'
      - 'release_history_backfill.py'
      - 'update_promo_events.py'
      - 'update_purchase_sources.py'
      - 'update_exchange_rates.py'
      - 'grading_company_watch.py'
      - 'grading_company_health_diagnostics.py'
      - 'grading_company_updates.json'
      - 'graded_photo_multi_source.py'
      - 'verified_collection_job_neural.py'
      - 'validate_external_links.py'
      - 'feature_contract.py'
      - 'runtime_bundle_guard_v143.py'
      - 'multi_route_event_discovery.py'
      - 'social_event_discovery.py'
      - 'auto_pipeline_runner.py'
      - 'supplementary_discovery.py'
      - 'static_data_publish_gate.py'
      - 'test_static_data_publish_gate.py'
      - 'test_collection_scope_compat_v214.py'
      - 'test_social_event_topic_coverage.py'
      - 'test_social_topic_capacity_v213.py'
      - 'test_information_lifecycle_archive_v209.py'
      - 'test_grading_company_watch_v215.py'
      - 'test_grading_company_health_diagnostics_v252.py'
      - 'test_grading_watch_integration_v220.py'
      - 'test_verified_collection_job_neural_v212.py'
      - 'source_collection_stats.json'
      - 'adaptive_collection_stats.json'
      - '.github/workflows/collection-verification-guard.yml'
      - '.github/workflows/tcg-static-data-refresh.yml'
      - '.github/workflows/grading-company-watch.yml'

permissions:
  contents: read

concurrency:
  group: collection-verification-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PYTHONPATH: ${{ github.workspace }}
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUNBUFFERED: '1'
      TCG_SOURCE_TIMEOUT_CAP: '30'
      TCG_HTTP_TIMEOUT: '30'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'

      - name: Static and regression verification
        run: |
          python -m py_compile \
            safe_runtime.py test_safe_runtime_redirect_diagnostics_v253.py collection_verification_gate.py static_data_publish_gate.py feature_contract.py \
            update_market_watch.py update_market_prices.py market_public_crosscheck.py release_history_backfill.py \
            update_purchase_sources.py update_exchange_rates.py \
            grading_company_watch.py grading_company_health_diagnostics.py graded_photo_multi_source.py verified_collection_job_neural.py \
            validate_external_links.py \
            test_collection_verification_gate.py test_static_data_publish_gate.py \
            test_market_public_crosscheck_resilience_v228.py test_market_public_crosscheck_performance_v251.py \
            test_collection_restored_state_guard_v229.py test_release_history_cumulative_coverage_v229.py \
            test_collection_scope_compat_v214.py test_social_event_topic_coverage.py \
            test_social_topic_capacity_v213.py test_information_lifecycle_archive_v209.py \
            test_grading_company_watch_v215.py test_grading_company_health_diagnostics_v252.py test_grading_watch_integration_v220.py \
            test_verified_collection_job_neural_v212.py
          python -m unittest -v \
            test_safe_runtime_redirect_diagnostics_v253.py \
            test_collection_verification_gate.py \
            test_static_data_publish_gate.py \
            test_market_public_crosscheck_resilience_v228.py \
            test_market_public_crosscheck_performance_v251.py \
            test_collection_restored_state_guard_v229.py \
            test_release_history_cumulative_coverage_v229.py \
            test_collection_scope_compat_v214.py \
            test_social_event_topic_coverage.py \
            test_social_topic_capacity_v213.py \
            test_information_lifecycle_archive_v209.py \
            test_grading_company_watch_v215.py \
            test_grading_company_health_diagnostics_v252.py \
            test_grading_watch_integration_v220.py \
            test_verified_collection_job_neural_v212.py
          python feature_contract.py
          python selfrefine_domain_boundary_guard.py

      - name: Run bounded live collection cycle
        timeout-minutes: 22
        run: |
          python - <<'PY'
          import json
          import tcg_updater
          result = tcg_updater.update_cycle('collection-verification-guard')
          print(json.dumps({
              'auto_update_status': (result.get('auto_update') or {}).get('status'),
              'trigger': result.get('trigger'),
          }, ensure_ascii=False))
          PY

      - name: Verify collected evidence fail-closed
        run: |
          # Critical correctness/safety failures still return non-zero. A provider
          # degradation remains explicit in the report but is isolated from code-health
          # status so a third-party outage cannot keep main permanently red.
          python collection_verification_gate.py \
            --max-health-age-seconds 900 \
            --report COLLECTION_VERIFICATION_REPORT.json

      - name: Build grading-provider RCA diagnostics
        if: always()
        run: |
          if [ -f grading_company_updates.json ]; then
            python grading_company_health_diagnostics.py \
              --snapshot grading_company_updates.json \
              --report GRADING_COMPANY_HEALTH_DIAGNOSTICS.json
          fi

      - name: Surface external provider degradation
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path('COLLECTION_VERIFICATION_REPORT.json')
          if path.is_file():
              report = json.loads(path.read_text(encoding='utf-8'))
              if report.get('status') == 'degraded':
                  counts = report.get('counts') or {}
                  findings = report.get('findings') or []
                  codes = sorted({str(row.get('code')) for row in findings if row.get('severity') == 'high'})
                  print(f"::warning title=External collection degraded::high={counts.get('high', 0)} codes={','.join(codes[:12])}")
          health_path = Path('GRADING_COMPANY_HEALTH_DIAGNOSTICS.json')
          if health_path.is_file():
              health = json.loads(health_path.read_text(encoding='utf-8'))
              providers = ','.join((health.get('summary') or {}).get('companies_without_healthy_source') or [])
              if providers:
                  print(f"::warning title=Grading provider health degraded::companies_without_healthy_source={providers}")
          PY

      - name: Validate verification safety contract
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path('COLLECTION_VERIFICATION_REPORT.json')
          if not path.is_file():
              raise SystemExit('collection verification report missing')
          report = json.loads(path.read_text(encoding='utf-8'))
          if report.get('schema_version') != 1:
              raise SystemExit('unexpected collection verification schema')
          safety = report.get('safety') or {}
          expected = {
              'bypass_403_429': False,
              'learned_text_executable': False,
              'source_code_auto_rewritten': False,
          }
          bad = {k: {'expected': v, 'actual': safety.get(k)} for k, v in expected.items() if safety.get(k) is not v}
          if bad:
              raise SystemExit(f'collection verification safety mismatch: {bad}')
          metrics = report.get('metrics') or {}
          if metrics.get('mandatory_outputs_expected') != 8:
              raise SystemExit(f'unexpected mandatory collector count: {metrics.get("mandatory_outputs_expected")}')
          print(json.dumps({'status': report.get('status'), 'counts': report.get('counts'), 'metrics': metrics}, ensure_ascii=False))
          PY

      - name: Upload collection verification reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: collection-verification-reports
          path: |
            COLLECTION_VERIFICATION_REPORT.json
            GRADING_COMPANY_HEALTH_DIAGNOSTICS.json
          if-no-files-found: error
          retention-days: 30
