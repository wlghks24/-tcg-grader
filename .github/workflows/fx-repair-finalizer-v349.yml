name: FX Repair Finalizer v349

on:
  push:
    branches:
      - 'fix/fx-failclosed-recovery-v349'

permissions:
  contents: write

concurrency:
  group: fx-repair-finalizer-v349-${{ github.ref }}
  cancel-in-progress: true

jobs:
  finalize:
    if: github.ref == 'refs/heads/fix/fx-failclosed-recovery-v349' && github.actor == github.repository_owner
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Install runtime dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Require exact repair branch and fresh main ancestry
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = "fix/fx-failclosed-recovery-v349"
          git fetch origin +refs/heads/main:refs/remotes/origin/main
          git merge-base --is-ancestor origin/main HEAD
          test "$(git rev-parse --abbrev-ref HEAD)" != "main"
      - name: Run targeted FX and market regressions
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile multi_market_price_collector.py update_exchange_rates.py test_fx_failclosed_recovery_v349.py
          python -m unittest -v test_fx_failclosed_recovery_v349.py test_multi_market_price_collector.py test_market_reference_sources_v130.py
      - name: Remove one-shot finalizer and rebuild exact-tree manifest
        shell: bash
        run: |
          set -euo pipefail
          rm -- .github/workflows/fx-repair-finalizer-v349.yml
          python fault_injection_healing.py --manifest
          python fault_injection_healing.py --diagnose
          python repository_integrity_guard.py
          git diff --check
      - name: Commit manifest and finalizer removal
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- integrity_manifest.json .github/workflows/fx-repair-finalizer-v349.yml
          test "$(git diff --cached --name-only | sort | tr '\n' ' ')" = ".github/workflows/fx-repair-finalizer-v349.yml integrity_manifest.json "
          git diff --cached --check
          git commit -m 'Reconcile integrity manifest for FX fail-closed repair'
          git push origin "HEAD:${GITHUB_REF_NAME}"
