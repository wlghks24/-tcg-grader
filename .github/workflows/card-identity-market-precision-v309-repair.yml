name: Card Identity Market Precision v309 Repair

on:
  push:
    branches: [audit/card-identity-market-precision-v309]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout v309 audit branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: audit/card-identity-market-precision-v309
          fetch-depth: 0

      - name: Apply v309 hardening and compatibility repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python -m pip install --disable-pip-version-check pillow
          python .github/scripts/card_identity_precision_v309.py
          python .github/scripts/card_identity_precision_v309_repair.py
          git rm .github/scripts/card_identity_precision_v309.py
          git rm .github/scripts/card_identity_precision_v309_repair.py
          git rm .github/workflows/card-identity-market-precision-v309.yml
          git rm .github/workflows/card-identity-market-precision-v309-repair.yml
          python fault_injection_healing.py --manifest
          python -m py_compile card_identity_recognition.py card_grading_valuation.py grading_accuracy_v99.py test_card_identity_market_precision_v309.py verify_current_runtime.py
          node --check card_identity_recognition.js
          node --check grade_market_flow.js
          node verify_pokemon_generation_runtime.js
          python -m unittest -v test_card_identity_market_precision_v309.py test_card_region_generation_precision_v306.py test_card_edition_precision_v302.py test_card_core_crosscheck_v291.py test_card_core_crosscheck_v292.py test_card_core_crosscheck_v295.py test_card_core_provenance_v296.py test_card_market_edition_v297.py test_card_probability_ui_v298.py test_card_regression_gate_v299.py test_card_tablet_runtime_v300.py test_psa_probability_market_flow_v252.py test_ocr_multistage_v16.py test_ocr_selfrefine_v15.py test_pokemon_generation_display_v207.py
          python verify_current_runtime.py
          python repository_integrity_guard.py
          git diff --check
          git add -A
          git commit -m 'fix: finalize card identity and market precision v309'
          git push origin HEAD:audit/card-identity-market-precision-v309
