name: TEMP v370 Regression Migration

on:
  push:
    branches: [fix/drive-package-freshness-v370]
    paths:
      - '.github/workflows/temp-v370-regression-migration.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: temp-v370-regression-migration
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'
      - name: Migrate historical policy assertions to verified successor semantics
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one replacement target, found {count}')
              p.write_text(text.replace(old, new), encoding='utf-8')

          replace_once(
              'test_tablet_gpt_tcg_grader_sync_v346.py',
              '''        self.assertIn("actions: write", workflow)\n        self.assertIn("STALE_AUTO_UPDATE_REPORT", workflow)\n        self.assertIn("FRESH_STATIC_REFRESH_DISPATCHED", workflow)\n        self.assertIn("tcg-static-data-refresh.yml/dispatches", workflow)\n        self.assertIn("steps.package.outputs.ready == 'true'", workflow)\n        self.assertIn("--max-report-age-hours', '2'", publisher)\n        self.assertNotIn("--max-report-age-hours 12", workflow)\n        self.assertIn("protected_static_candidate_guard.py", repo_guard)\n        contract = read(CONTRACT)\n        self.assertTrue(contract["rules"]["static_candidate_scope_must_be_data_only"])\n        self.assertTrue(contract["rules"]["stale_drive_package_must_not_upload_artifact"])\n''',
              '''        self.assertIn("STALE_AUTO_UPDATE_REPORT", workflow)\n        self.assertIn("STALE_SOCIAL_SNAPSHOT", workflow)\n        self.assertIn("STALE_SUPPLEMENTARY_SNAPSHOT", workflow)\n        self.assertIn("critical and critical <= recoverable", workflow)\n        self.assertIn("tcg_updater.update_cycle('gpt-drive-package-refresh')", workflow)\n        self.assertIn("FRESH_LOCAL_COLLECTION_RETRY", workflow)\n        self.assertIn("steps.package.outputs.ready == 'true'", workflow)\n        self.assertNotIn("actions: write", workflow)\n        self.assertNotIn("tcg-static-data-refresh.yml/dispatches", workflow)\n        self.assertIn("--max-report-age-hours', '2'", publisher)\n        self.assertNotIn("--max-report-age-hours 12", workflow)\n        self.assertIn("protected_static_candidate_guard.py", repo_guard)\n        contract = read(CONTRACT)\n        self.assertTrue(contract["rules"]["static_candidate_scope_must_be_data_only"])\n        self.assertTrue(contract["rules"]["stale_drive_package_must_not_upload_artifact"])\n        latest = read(ROOT / "TCG_CROSSCHECK/TABLET_GPT_TCG_GRADER_SYNC_CONTRACT_V370.json")\n        self.assertTrue(latest["rules"]["drive_package_freshness_only_local_retry_required"])\n        self.assertTrue(latest["rules"]["drive_package_non_freshness_critical_remains_blocking"])\n        self.assertTrue(latest["rules"]["drive_package_stale_inputs_upload_forbidden"])\n        self.assertTrue(latest["rules"]["freshness_threshold_widening_forbidden"])\n'''
          )

          replace_once(
              'test_tablet_gpt_tcg_grader_sync_v361.py',
              '''        self.assertIn("FRESH_STATIC_REFRESH_DISPATCHED",workflow); self.assertIn("never widen the two-hour report freshness gate",workflow)\n''',
              '''        self.assertIn("FRESH_LOCAL_COLLECTION_RETRY",workflow)\n        self.assertIn("tcg_updater.update_cycle('gpt-drive-package-refresh')",workflow)\n        self.assertIn("never widen freshness gates",workflow)\n        self.assertNotIn("actions: write",workflow)\n        latest=read(ROOT/"TCG_CROSSCHECK/TABLET_GPT_TCG_GRADER_SYNC_CONTRACT_V370.json")\n        self.assertTrue(latest["rules"]["drive_package_stale_inputs_upload_forbidden"])\n        self.assertTrue(latest["rules"]["drive_package_non_freshness_critical_remains_blocking"])\n'''
          )

          replace_once(
              'test_tablet_gpt_tcg_grader_sync_v365.py',
              '''        self.assertIn('recoverable = {"STALE_AUTO_UPDATE_REPORT", "STALE_SOCIAL_SNAPSHOT"}',workflow)\n        self.assertIn("critical and critical <= recoverable",workflow)\n        self.assertIn("FRESH_STATIC_REFRESH_DISPATCHED",workflow)\n        self.assertIn("tcg-static-data-refresh.yml/dispatches",workflow)\n        self.assertIn('echo "ready=false"',workflow)\n        self.assertIn('exit "${rc}"',workflow)\n        self.assertIn("never widen the two-hour report freshness gate",workflow)\n        self.assertNotIn("publish_allowed = true",workflow)\n''',
              '''        self.assertIn("STALE_AUTO_UPDATE_REPORT",workflow)\n        self.assertIn("STALE_SOCIAL_SNAPSHOT",workflow)\n        self.assertIn("STALE_SUPPLEMENTARY_SNAPSHOT",workflow)\n        self.assertIn("critical and critical <= recoverable",workflow)\n        self.assertIn("tcg_updater.update_cycle('gpt-drive-package-refresh')",workflow)\n        self.assertIn("FRESH_LOCAL_COLLECTION_RETRY",workflow)\n        self.assertIn('exit "${rc}"',workflow)\n        self.assertIn("never widen freshness gates",workflow)\n        self.assertNotIn("tcg-static-data-refresh.yml/dispatches",workflow)\n        self.assertNotIn("actions: write",workflow)\n        self.assertNotIn("publish_allowed = true",workflow)\n        latest=read(ROOT/"TCG_CROSSCHECK/TABLET_GPT_TCG_GRADER_SYNC_CONTRACT_V370.json")\n        self.assertTrue(latest["rules"]["drive_package_freshness_only_local_retry_required"])\n        self.assertTrue(latest["rules"]["drive_package_stale_inputs_upload_forbidden"])\n'''
          )

          replace_once(
              'test_tablet_gpt_tcg_grader_sync_v368.py',
              '''        self.assertIn(\n            'recoverable = {"STALE_AUTO_UPDATE_REPORT", "STALE_SOCIAL_SNAPSHOT"}', workflow\n        )\n        self.assertIn("critical and critical <= recoverable", workflow)\n        self.assertIn(\n            'expanded_recoverable = recoverable | {"STALE_SUPPLEMENTARY_SNAPSHOT"}', workflow\n        )\n        self.assertIn("critical and critical <= expanded_recoverable", workflow)\n        self.assertIn("FRESH_STATIC_REFRESH_DISPATCHED", workflow)\n        self.assertIn("tcg-static-data-refresh.yml/dispatches", workflow)\n        self.assertIn('echo "ready=false"', workflow)\n        self.assertIn('exit "${rc}"', workflow)\n        self.assertIn("never widen the two-hour report freshness gate", workflow)\n        self.assertNotIn("publish_allowed = true", workflow)\n        rules = read(CONTRACT)["rules"]\n        self.assertIs(rules["supplementary_staleness_may_only_request_protected_refresh"], True)\n        self.assertIs(rules["non_freshness_critical_findings_must_remain_blocking"], True)\n        self.assertIs(rules["freshness_threshold_widening_forbidden"], True)\n''',
              '''        self.assertIn("STALE_AUTO_UPDATE_REPORT", workflow)\n        self.assertIn("STALE_SOCIAL_SNAPSHOT", workflow)\n        self.assertIn("STALE_SUPPLEMENTARY_SNAPSHOT", workflow)\n        self.assertIn("critical and critical <= recoverable", workflow)\n        self.assertIn("tcg_updater.update_cycle('gpt-drive-package-refresh')", workflow)\n        self.assertIn("FRESH_LOCAL_COLLECTION_RETRY", workflow)\n        self.assertNotIn("tcg-static-data-refresh.yml/dispatches", workflow)\n        self.assertNotIn("actions: write", workflow)\n        self.assertIn('exit "${rc}"', workflow)\n        self.assertIn("never widen freshness gates", workflow)\n        self.assertNotIn("publish_allowed = true", workflow)\n        rules = read(CONTRACT)["rules"]\n        self.assertIs(rules["supplementary_staleness_may_only_request_protected_refresh"], True)\n        self.assertIs(rules["non_freshness_critical_findings_must_remain_blocking"], True)\n        self.assertIs(rules["freshness_threshold_widening_forbidden"], True)\n        latest = read(ROOT / "TCG_CROSSCHECK/TABLET_GPT_TCG_GRADER_SYNC_CONTRACT_V370.json")["rules"]\n        self.assertIs(latest["drive_package_freshness_only_local_retry_required"], True)\n        self.assertIs(latest["drive_package_non_freshness_critical_remains_blocking"], True)\n        self.assertIs(latest["drive_package_stale_inputs_upload_forbidden"], True)\n'''
          )

          replace_once(
              'test_tablet_gpt_tcg_grader_sync_v369.py',
              '''        self.assertEqual([], watched_paths(contract, CANDIDATE))\n''',
              '''        remaining = watched_paths(contract, CANDIDATE)\n        if remaining:\n            successor = read(ROOT / "TCG_CROSSCHECK/TABLET_GPT_TCG_GRADER_SYNC_CONTRACT_V370.json")\n            self.assertEqual("TCG_CROSSCHECK/TABLET_GPT_TCG_GRADER_SYNC_CONTRACT_V369.json", successor["prior_contract"])\n            self.assertEqual("TCG_CROSSCHECK/TABLET_GPT/learning_snapshot_v369_delta.json", successor["prior_delta_snapshot"])\n            candidate2 = successor["candidate_sync"]\n            self.assertEqual(sorted(remaining), sorted(candidate2["watched_paths"]))\n            self.assertEqual(sorted(candidate2["watched_paths"]), watched_paths(successor, candidate2["base_main_sha"], candidate2["candidate_commit"]))\n            self.assertEqual([], watched_paths(successor, candidate2["candidate_commit"]), "verified v370 successor has uncovered watched changes")\n            for key in ("delta_snapshot", "receiver_receipt", "verification_test"):\n                self.assertTrue((ROOT / successor[key]).is_file(), successor[key])\n            receipt2 = read(ROOT / successor["receiver_receipt"])\n            self.assertEqual("SYNCED_VERIFIED", receipt2["status"])\n            self.assertEqual("TABLET_GPT_TCG_GRADER_MATCH", receipt2["verification"]["verified_result"])\n            self.assertFalse(receipt2["verification"]["physical_tablet_runtime_verified"])\n            self.assertFalse(receipt2["verification"]["physical_drive_readback_verified"])\n'''
          )

          replace_once(
              'test_protected_static_pipeline_v305.py',
              '''        self.assertIn('before the tablet\\'s 08:00/20:00 checks', self.package)\n''',
              '''        self.assertIn("steps.package.outputs.ready == 'true'", self.package)\n        self.assertIn("never widen freshness gates", self.package)\n        self.assertIn("Stale inputs are never uploaded", self.package)\n        self.assertIn("FRESH_LOCAL_COLLECTION_RETRY", self.package)\n'''
          )
          PY

          python -m py_compile \
            test_tablet_gpt_tcg_grader_sync_v346.py \
            test_tablet_gpt_tcg_grader_sync_v361.py \
            test_tablet_gpt_tcg_grader_sync_v365.py \
            test_tablet_gpt_tcg_grader_sync_v368.py \
            test_tablet_gpt_tcg_grader_sync_v369.py \
            test_tablet_gpt_tcg_grader_sync_v370.py \
            test_protected_static_pipeline_v305.py
          python -m unittest -v \
            test_tablet_gpt_tcg_grader_sync_v346.py \
            test_tablet_gpt_tcg_grader_sync_v361.py \
            test_tablet_gpt_tcg_grader_sync_v365.py \
            test_tablet_gpt_tcg_grader_sync_v368.py \
            test_tablet_gpt_tcg_grader_sync_v369.py \
            test_tablet_gpt_tcg_grader_sync_v370.py \
            test_protected_static_pipeline_v305.py

          temp='.github/workflows/temp-v370-regression-migration.yml'
          git rm --cached -- "$temp"
          python static_integrity_manifest.py --write integrity_manifest.json
          python static_integrity_manifest.py --check integrity_manifest.json
          python fault_injection_healing.py --diagnose
          git reset HEAD -- "$temp"
          git diff --check

      - name: Commit migrated regressions and exact manifest
        shell: bash
        run: |
          set -euo pipefail
          git add -- \
            test_tablet_gpt_tcg_grader_sync_v346.py \
            test_tablet_gpt_tcg_grader_sync_v361.py \
            test_tablet_gpt_tcg_grader_sync_v365.py \
            test_tablet_gpt_tcg_grader_sync_v368.py \
            test_tablet_gpt_tcg_grader_sync_v369.py \
            test_protected_static_pipeline_v305.py \
            integrity_manifest.json
          allowed='^(test_tablet_gpt_tcg_grader_sync_v346.py|test_tablet_gpt_tcg_grader_sync_v361.py|test_tablet_gpt_tcg_grader_sync_v365.py|test_tablet_gpt_tcg_grader_sync_v368.py|test_tablet_gpt_tcg_grader_sync_v369.py|test_protected_static_pipeline_v305.py|integrity_manifest.json)$'
          if git diff --cached --name-only | grep -Ev "$allowed"; then
            echo 'unexpected staged path' >&2
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'test: delegate historical Drive policy checks to verified v370 successor'
          git push origin HEAD:refs/heads/fix/drive-package-freshness-v370
