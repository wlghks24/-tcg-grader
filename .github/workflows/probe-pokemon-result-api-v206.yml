name: Probe Pokemon Result API v206
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/probe-pokemon-result-api-v206.yml'
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Inspect and probe official result API
        env:
          TCG_HTTP_TIMEOUT: '30'
        run: |
          python - <<'PY'
          import json,re,urllib.parse,urllib.request
          import update_releases as u
          jsurl='https://www.pokemon-card.com/assets/js/products/bundle.js?v=1998061658402'
          req=urllib.request.Request(jsurl,headers={'User-Agent':u.HEADERS['User-Agent'],'Accept':'*/*'})
          with urllib.request.urlopen(req,timeout=20) as r: js=r.read(2_000_000).decode('utf-8','replace')
          for needle in ['/products/resultAPI.php','/products/topList.php','searchRequest:function','searchRequest', 'new URLSearchParams']:
            print('\n=== CONTEXT',needle,'===')
            start=0
            count=0
            while True:
              i=js.find(needle,start)
              if i<0 or count>=6: break
              print(js[max(0,i-650):min(len(js),i+1200)])
              start=i+len(needle);count+=1
          base='https://www.pokemon-card.com/products/resultAPI.php'
          candidates=[
            {'productType':'expansion'},
            {'productType':'expansion','page':'1'},
            {'productType':'expansion','thisPage':'1'},
            {'productType':'expansion','search':'1'},
          ]
          for params in candidates:
            url=base+'?'+urllib.parse.urlencode(params)
            print('\n=== PROBE',url,'===')
            try:
              req=urllib.request.Request(url,headers={**u.HEADERS,'Accept':'application/json,text/plain,*/*','Referer':'https://www.pokemon-card.com/products/index.html?productType=expansion'})
              with urllib.request.urlopen(req,timeout=20) as r:
                body=r.read(1_000_000).decode('utf-8','replace')
                print('status',r.status,'content-type',r.headers.get('Content-Type'),'len',len(body))
              print('head',body[:1600])
              try:
                data=json.loads(body)
                print('json_type',type(data).__name__)
                if isinstance(data,dict):
                  print('keys',sorted(data.keys()))
                  products=data.get('products')
                  print('products_count',len(products) if isinstance(products,list) else None)
                  if isinstance(products,list): print('sample_product',products[:2])
              except Exception as exc: print('json_error',type(exc).__name__,str(exc)[:200])
            except Exception as exc:
              print('probe_error',type(exc).__name__,str(exc)[:300])
          PY
