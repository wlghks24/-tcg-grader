name: Sync and Verify Catalog Images

on:
  pull_request:
    paths:
      - index.html
      - catalog_image_manifest.json
      - apply_catalog_image_patch.py
      - test_catalog_images.py
      - .github/workflows/catalog-image-sync.yml
  push:
    branches: [main]
    paths:
      - index.html
      - catalog_image_manifest.json
      - apply_catalog_image_patch.py
      - test_catalog_images.py
      - .github/workflows/catalog-image-sync.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: catalog-image-sync-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'

      - name: Rebuild reviewed BOX image integration in workspace
        run: python apply_catalog_image_patch.py

      - name: Verify catalog image coverage
        run: python -m unittest -v test_catalog_images.py

      - name: Check generated diff
        run: git diff --check

      - name: Require generated integration to be committed in the reviewed change
        shell: bash
        run: |
          if git diff --quiet -- index.html; then
            echo "Catalog image integration is synchronized."
            exit 0
          fi
          echo "::error::catalog_image_manifest.json and index.html are out of sync. Commit the generated index.html change in the PR instead of mutating main after merge."
          git diff -- index.html
          exit 1
