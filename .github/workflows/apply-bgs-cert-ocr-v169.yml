name: Apply BGS certificate OCR v169

on:
  push:
    branches: [main]
    paths:
      - 'apply_bgs_cert_ocr_v169.py'
      - 'test_bgs_cert_ocr_v169.py'
      - '.github/workflows/apply-bgs-cert-ocr-v169.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install test dependency
        run: python -m pip install --disable-pip-version-check pillow
      - name: Apply patch
        run: python apply_bgs_cert_ocr_v169.py
      - name: Verify
        run: |
          python -m py_compile library_slab_corpus.py graded_photo_evidence.py manual_graded_photo_registration.py
          python -m unittest -v test_bgs_cert_ocr_v169.py
          grep -F 'bgs_top_right_digits_psm6' library_slab_corpus.py
          grep -F 'BECKETT CERT' library_slab_corpus.py
      - name: Commit
        run: |
          if git diff --quiet -- library_slab_corpus.py graded_photo_evidence.py; then
            echo 'No patch changes needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add library_slab_corpus.py graded_photo_evidence.py
          git commit -m 'fix: recover BGS leading-zero certificates from slab labels v169'
          git push origin HEAD:main
