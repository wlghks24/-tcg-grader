name: V292 Follow-up

on:
  push:
    branches:
      - audit/card-core-crosscheck-v292

permissions:
  contents: write

concurrency:
  group: v292-followup
  cancel-in-progress: false

jobs:
  patch-test-commit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONPATH: ${{ github.workspace }}
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 2
          ref: audit/card-core-crosscheck-v292
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'
      - name: Apply follow-up
        run: python apply_v292_followup.py
      - name: Remove one-shot files and regenerate integrity
        run: |
          rm -f apply_v292_followup.py .github/workflows/v292-followup.yml
          python fault_injection_healing.py --manifest
          python fault_injection_healing.py --diagnose
      - name: Verify runtime and card core
        run: |
          python test_runtime_delivery_guards.py
          python tablet_runtime_qa.py --profile quick
          python -m unittest -v test_card_core_crosscheck_v291.py test_card_core_crosscheck_v292.py test_ui_version_coherence_v276.py test_tablet_app_dock_v275.py
          node --check grading_probability_v292.js
          node verify_v99_browser_accuracy.js
          python verify_v99_cross_runtime.py
          node verify_pokemon_generation_runtime.js
          python tablet_runtime_manifest.py --check --compile
          git diff --check
      - name: Commit follow-up
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Align v292 cache with runtime delivery contract'
          git push origin HEAD:audit/card-core-crosscheck-v292
