name: V380 Tablet Decision Governance Finalizer

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: v380-tablet-finalizer-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  finalize:
    if: >-
      github.actor == github.repository_owner &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'feature/tablet-autonomous-evolution-v380-decision-governance'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feature/tablet-autonomous-evolution-v380-decision-governance
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Pin current main and validate branch ancestry
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin +refs/heads/main:refs/remotes/origin/main
          test "$(git rev-parse origin/main)" = "6a1006cc699133f0bf8a5b1e4ee40db01ffa605b"
          git merge-base --is-ancestor origin/main HEAD
          git diff --check origin/main...HEAD
      - name: Remove one-shot workflow in local history
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -- .github/workflows/tablet-v380-decision-finalizer.yml
          git commit -m 'Remove V380 one-shot finalizer'
      - name: Run V380 targeted and complete Tablet sync lineage
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile             tablet_autonomous_evolution_v380.py             test_tablet_autonomous_evolution_v380.py             sync_v376_successor_test_support.py             test_tablet_gpt_tcg_grader_sync_v379.py             test_tablet_gpt_tcg_grader_sync_v380.py
          python tablet_autonomous_evolution_v380.py --self-test
          python -m unittest -v             test_tablet_autonomous_evolution_v380.py             test_tablet_gpt_tcg_grader_sync_v379.py             test_tablet_gpt_tcg_grader_sync_v380.py
          mapfile -t sync_tests < <(find . -maxdepth 1 -type f -name 'test_tablet_gpt_tcg_grader_sync_v*.py' -printf '%f\n' | sort -V)
          test "${#sync_tests[@]}" -gt 0
          python -m unittest -v "${sync_tests[@]}"
          python quality_review_policy.py --check
          python tablet_runtime_manifest.py --check --compile
          bash -n main
          git diff --check 79d61e1b08a35b55454c7582d85e986f46f32442..HEAD
      - name: Rebuild exact final-tree integrity manifest
        shell: bash
        run: |
          set -euo pipefail
          python static_integrity_manifest.py --write integrity_manifest.json
          python static_integrity_manifest.py --check integrity_manifest.json
          python fault_injection_healing.py --diagnose
          python repository_integrity_guard.py
          git diff --check
      - name: Commit manifest and push exact final candidate
        shell: bash
        run: |
          set -euo pipefail
          git add -- integrity_manifest.json
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git commit -m 'Reconcile integrity manifest for V380'
          fi
          git push origin "HEAD:${GITHUB_HEAD_REF}"
