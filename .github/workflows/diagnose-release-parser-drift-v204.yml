name: Diagnose Release Parser Drift v204
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diagnose-release-parser-drift-v204.yml'
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Probe live release collectors
        env:
          TCG_HTTP_TIMEOUT: '30'
        run: |
          python - <<'PY'
          import re
          import update_releases as u
          jobs=[
            ('Pokemon JP',u.collect_pokemon_jp,u.POKEMON_JP_PRODUCT_URLS),
            ('ONE PIECE KR',u.collect_onepiece_kr,('https://onepiece-cardgame.kr/products.do',)),
            ('ONE PIECE JP',u.collect_onepiece_jp,u.ONEPIECE_JP_PRODUCT_URLS),
            ('ONE PIECE US',lambda:u.collect_onepiece('https://en.onepiece-cardgame.com/products/','US'),('https://en.onepiece-cardgame.com/products/',)),
            ('NARUTO Global',u.collect_naruto,('https://www.naruto-cardgame.com/asia-en/',)),
          ]
          for label,fn,urls in jobs:
            print('\n===',label,'===')
            try:
              rows=fn();print('collector_count=',len(rows));print('sample=',rows[:2])
            except Exception as exc:
              print('collector_error=',type(exc).__name__,str(exc)[:400])
            for url in urls:
              try:
                raw=u.fetch(url); text=u.html_to_text(raw)
                anchors={
                  'release_date':len(re.findall(r'Release\s*Date',text,re.I)),
                  'msrp':len(re.findall(r'MSRP',text,re.I)),
                  'op_code':len(re.findall(r'\b(?:OP|EB|PRB)-\d+\b',text,re.I)),
                  'opk_code':len(re.findall(r'\b(?:OPK|EBK)-\d+\b',text,re.I)),
                  'jp_date':len(re.findall(r'(?:発売日|販売日)',text)),
                  'jp_price':len(re.findall(r'(?:希望小売価格|メーカー希望小売価格|価格)',text)),
                  'summer_2027':len(re.findall(r'(?:Summer\s+2027|Arriving\s+in\s+Summer\s+2027)',text,re.I)),
                }
                print('url=',url,'html_len=',len(raw),'text_len=',len(text),'anchors=',anchors)
                print('text_head=',re.sub(r'\s+',' ',text)[:500])
              except Exception as exc:
                print('fetch_error=',url,type(exc).__name__,str(exc)[:300])
          PY
