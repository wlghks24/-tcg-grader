name: Apply link audit learning hardening v184

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-link-audit-learning-v184.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply v184 learning patch
        run: python apply_link_audit_learning_v184.py
      - name: Refresh deterministic scenario profiles
        run: python error_scenario_lab.py
      - name: Validate v184
        run: |
          python test_link_audit_hardening_v184.py
          python test_runtime_delivery_guards.py
          python -m py_compile validate_external_links.py auto_update_all.py auto_repair_engine.py error_scenario_lab.py
      - name: Commit v184 runtime changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add auto_repair_engine.py auto_update_all.py error_scenario_lab.py scenario_learning_profiles.json
          git diff --cached --quiet && exit 0
          git commit -m 'fix: classify and count external link failures v184'
          git push origin HEAD:main
