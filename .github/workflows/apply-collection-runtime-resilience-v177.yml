name: Apply collection runtime resilience v177

# Legacy integrated feature: automatic source mutation is disabled; run manually only.
on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write
  checks: read

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - name: Apply v177 patch
        run: python apply_collection_runtime_resilience_v177.py
      - name: Verify syntax
        run: python -m py_compile update_market_prices.py auto_update_all.py validate_external_links.py
      - name: Verify clean patch
        run: git diff --check
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add update_market_prices.py auto_update_all.py
          if ! git diff --cached --quiet; then
            git commit -m 'fix: defer transient market and auxiliary network failures v177'
            GH_TOKEN="${{ github.token }}" bash scripts/publish_candidate_pr.sh
          fi
