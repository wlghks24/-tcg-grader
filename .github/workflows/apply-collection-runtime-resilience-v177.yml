name: Apply collection runtime resilience v177

on:
  push:
    branches: [main]
    paths:
      - 'apply_collection_runtime_resilience_v177.py'
      - '.github/workflows/apply-collection-runtime-resilience-v177.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Apply v177 patch
        run: python apply_collection_runtime_resilience_v177.py
      - name: Verify syntax
        run: python -m py_compile update_market_prices.py auto_update_all.py validate_external_links.py
      - name: Verify v177 safety markers
        run: |
          python - <<'PY'
          from pathlib import Path
          checks={
              'update_market_prices.py':[
                  'collection_warnings',
                  'KREAM 원출처 5xx',
              ],
              'auto_update_all.py':[
                  'deferred_timeout_pending',
                  'web_discovery_candidates.json',
                  'unresolved_broken=max(0,broken-repaired)',
                  'transient_deferred',
              ],
              'validate_external_links.py':[
                  'exc.code in {404,410}',
              ],
          }
          for filename, markers in checks.items():
              text=Path(filename).read_text(encoding='utf-8')
              missing=[m for m in markers if m not in text]
              if missing:
                  raise SystemExit(f'{filename}: missing markers: {missing}')
          print('v177 markers verified')
          PY
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add update_market_prices.py auto_update_all.py
          if ! git diff --cached --quiet; then
            git commit -m 'fix: defer transient market and auxiliary network failures v177'
            git push origin main
          fi
