name: Main SELFREFINE

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  selfrefine:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'
      - name: Enforce Main vs Instagram domain boundary
        run: python selfrefine_domain_boundary_guard.py
      - name: Verify shared stateless learning and crosscheck contracts
        run: |
          python main_selfrefine_gate.py --self-test
          python main_crosscheck_export.py --self-test
          python selfrefine_crosscheck_gate.py --self-test
          python -m unittest -v test_selfrefine_domain_isolation_v18.py test_main_selfrefine_state_isolation_v18.py test_verified_code_repair_rules_v19.py test_selfrefine_error_quarantine_v20.py test_secure_self_modify_v21.py
          python verified_code_repair_rules.py --self-test
      - name: Run bounded Main SELFREFINE only
        run: python main_selfrefine_gate.py --cycles 5
      - name: Confirm fail-closed repository integrity
        run: python repository_integrity_guard.py
      - name: Confirm no high or critical security finding
        run: python security_self_audit.py --no-memory --fail-on high
      - name: Confirm security hardening is idempotent
        run: python security_hardening_apply.py --check
      - name: Confirm collector self-healing safety contracts
        run: |
          python - <<'PY'
          import collector_self_healing as c
          status = c.safety_contract_status()
          assert status.get('process_safe_transactions') is True, status
          assert status.get('unique_policy_observation_per_run') is True, status
          assert c.QUARANTINE_CODES
          print('collector self-healing safety contracts: PASS')
          PY
      - name: Confirm runtime hardening patch is already idempotent
        run: |
          python - <<'PY'
          from pathlib import Path
          import runtime_optimization_hardening as r
          source = Path('collector_self_healing.py').read_text(encoding='utf-8')
          assert r.patch_collector_self_healing(source) == source
          print('runtime hardening idempotence: PASS')
          PY
      - name: Upload Main SELFREFINE ledger
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: main-selfrefine-error-ledger
          path: MAIN_SELFREFINE_ERROR_LEDGER.json
          if-no-files-found: ignore

      - name: Upload Main SELFREFINE error quarantine state
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: main-selfrefine-error-quarantine
          path: MAIN_SELFREFINE_ERROR_QUARANTINE_STATE.json
          if-no-files-found: ignore
