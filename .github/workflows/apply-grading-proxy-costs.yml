name: Apply Grading Proxy Costs
# Legacy integrated feature: automatic source mutation is disabled; run manually only.
on:
  workflow_dispatch:

permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'
      - name: Apply integration
        run: python apply_grading_proxy_costs_patch.py
      - name: Validate
        run: |
          python -m py_compile grading_proxy_costs.py tcg_updater.py
          python -m unittest -v test_grading_proxy_costs.py
          grep -q 'grading_proxy_costs.js' index.html
          grep -q "/api/grading-proxy-costs" tcg_updater.py
      - name: Commit generated files
        run: |
          if git diff --quiet -- index.html tcg_updater.py; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html tcg_updater.py
          git commit -m 'feat: integrate grading proxy fee comparison'
          git push
