name: Card v326 Runtime Publication Finalizer

on:
  push:
    branches: [fix/card-classification-price-generation-v326]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  finalize-and-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout v326 branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/card-classification-price-generation-v326
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Apply v326 runtime wiring and publish clean verified tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          # Remove both bootstrap workflows from the final tree before integrity checks.
          rm -f .github/workflows/card-region-learning-hardening-v307.yml
          rm -f .github/workflows/v326-runtime-publish-fix.yml

          python apply_v326_runtime_publish_fix.py
          rm -f apply_v326_runtime_publish_fix.py

          # Rebuild integrity metadata from the exact final tree.
          python fault_injection_healing.py --manifest
          python fault_injection_healing.py --diagnose

          # Targeted card classification / market / runtime gates.
          node --check card_metadata_classifier_v326.js
          node verify_card_metadata_classifier_v326.js
          node --check grade_market_flow.js
          node verify_service_worker_runtime.js
          python verify_link_runtime.py
          python tablet_runtime_manifest.py --check --compile
          python -m unittest -v test_tablet_runtime_manifest_ui_assets_v254.py test_card_tablet_runtime_v300.py

          # Full current-runtime and integrity gates on the clean tree.
          python verify_current_runtime.py
          python repository_integrity_guard.py
          git diff --check

          git add -A
          git commit -m 'fix: publish card classification runtime v326'
          git push origin HEAD:fix/card-classification-price-generation-v326
