name: Apply remove auto cert endpoint v199
on:
  push:
    branches: [main]
    paths:
      - 'apply_remove_auto_cert_endpoint_v199.py'
      - '.github/workflows/apply-remove-auto-cert-endpoint-v199.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply v199 endpoint removal
        run: python apply_remove_auto_cert_endpoint_v199.py
      - name: Verify manual-only certification contract
        run: |
          python -m py_compile tcg_updater.py grading_cert_verifier.py
          node --check auto_validation_flow.js
          python - <<'PY'
          from pathlib import Path
          import grading_cert_verifier as g
          ui=Path('auto_validation_flow.js').read_text(encoding='utf-8')
          server=Path('tcg_updater.py').read_text(encoding='utf-8')
          assert "if path=='/api/verify-grading-cert':" not in server
          assert '/api/verify-grading-cert' not in ui
          assert g.automatic_lookup_disabled() is True
          for company in ('PSA','BGS','CGC','TAG','BRG'):
              r=g.verify_cert(company,'12345678',expected_grade=10)
              assert r.get('verified') is False
              assert r.get('manual_verification_required') is True
          PY
      - name: Verify clean patch
        run: git diff --check
      - name: Commit runtime endpoint removal
        run: |
          if git diff --quiet -- tcg_updater.py; then
            echo 'No runtime change needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tcg_updater.py
          git commit -m 'security: remove automatic cert verification endpoint v199'
          git push origin HEAD:main
