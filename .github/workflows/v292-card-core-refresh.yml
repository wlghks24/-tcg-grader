name: V292 Card Core Refresh

on:
  push:
    branches:
      - audit/card-core-crosscheck-v292

permissions:
  contents: write

concurrency:
  group: v292-card-core-refresh
  cancel-in-progress: false

jobs:
  patch-test-commit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONPATH: ${{ github.workspace }}
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Checkout exact audit branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 2
          ref: audit/card-core-crosscheck-v292

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'

      - name: Apply bounded v292 patch
        run: python apply_card_core_v292.py

      - name: Regenerate integrity metadata for patched tree
        run: python fault_injection_healing.py --manifest

      - name: Syntax and focused card-core tests
        run: |
          node --check grading_probability_v292.js
          node --check grading_accuracy_v99.js
          node --check card_identity_recognition.js
          node --check ui_app_shell_v272.js
          python -m py_compile \
            card_grading_valuation.py grading_accuracy_v99.py card_identity_recognition.py \
            collection_verification_gate.py update_market_prices.py tcg_updater.py \
            tablet_runtime_manifest.py feature_contract.py test_card_core_crosscheck_v292.py
          python -m unittest -v \
            test_card_core_crosscheck_v291.py \
            test_card_core_crosscheck_v292.py \
            test_psa_probability_market_flow_v252.py \
            test_grading_hierarchy_v17.py \
            test_grading_runtime_fallback_v256.py \
            test_ui_version_coherence_v276.py \
            test_tablet_app_dock_v275.py
          node verify_v99_browser_accuracy.js
          python verify_v99_cross_runtime.py
          node verify_pokemon_generation_runtime.js
          node verify_vision_runtime.js
          python feature_contract.py
          python tablet_runtime_manifest.py --check --compile
          python fault_injection_healing.py --diagnose

      - name: Remove one-shot patch machinery and refresh final integrity manifest
        run: |
          rm -f apply_card_core_v292.py .github/workflows/v292-card-core-refresh.yml
          python fault_injection_healing.py --manifest
          python fault_injection_healing.py --diagnose
          python -m unittest -v test_card_core_crosscheck_v291.py test_card_core_crosscheck_v292.py
          node verify_v99_browser_accuracy.js
          python verify_v99_cross_runtime.py
          node verify_pokemon_generation_runtime.js
          python tablet_runtime_manifest.py --check --compile
          git diff --check

      - name: Commit verified v292 patch
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No changes to commit'
            exit 0
          fi
          git commit -m 'Harden PSA probability and grade-price provenance v292'
          git push origin HEAD:audit/card-core-crosscheck-v292
