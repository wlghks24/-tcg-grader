name: Card Variant Precision v322 Rebase

on:
  push:
    branches: [fix/card-identity-variant-precision-v322]

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest-main branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/card-identity-variant-precision-v322
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'

      - name: Integrate validated variant precision onto latest main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python -m pip install --disable-pip-version-check pillow

          # Squash the already validated variant/finish/rarity implementation onto
          # the newer main that contains PR #266 edition-consensus/provenance hardening.
          git merge --squash a9fc174de5454084c9d0778d8d302f01223c3593 || true
          git checkout dde6e04fa4f45cd40fcaf7787440dd31fd45d69a -- integrity_manifest.json verify_current_runtime.py
          git add integrity_manifest.json verify_current_runtime.py
          conflicts="$(git diff --name-only --diff-filter=U)"
          if [ -n "$conflicts" ]; then
            echo "Unexpected merge conflicts:" >&2
            printf '%s\n' "$conflicts" >&2
            exit 1
          fi

          # This is the follow-up to the already merged v321 precision work.
          git mv test_card_variant_market_precision_v321.py test_card_variant_market_precision_v322.py
          python - <<'PY'
          from pathlib import Path

          def replace(path, old, new, label):
              p=Path(path); s=p.read_text(encoding='utf-8'); n=s.count(old)
              if n!=1:
                  raise SystemExit(f'{label}: anchor count={n}')
              p.write_text(s.replace(old,new,1),encoding='utf-8')

          replace('card_identity_recognition.py','CARD_IDENTITY_METADATA_VERSION = 321','CARD_IDENTITY_METADATA_VERSION = 322','metadata version')
          replace('card_identity_recognition.js',"version:'v321'","version:'v322'",'browser metadata version')
          page=Path('index.html'); text=page.read_text(encoding='utf-8')
          for old,new in (('meta=321','meta=322'),('grade_market_flow.js?v=321','grade_market_flow.js?v=322'),('auto_market_center.js?v=321','auto_market_center.js?v=322'),('auto_validation_flow.js?v=321','auto_validation_flow.js?v=322')):
              if text.count(old)!=1: raise SystemExit(f'index version {old}: count={text.count(old)}')
              text=text.replace(old,new,1)
          page.write_text(text,encoding='utf-8')

          test=Path('test_card_variant_market_precision_v322.py'); t=test.read_text(encoding='utf-8')
          t=t.replace('CardVariantMarketPrecisionV321Tests','CardVariantMarketPrecisionV322Tests')
          t=t.replace("version:'v321'","version:'v322'")
          t=t.replace('v321','v322')
          test.write_text(t,encoding='utf-8')

          verify=Path('verify_current_runtime.py'); v=verify.read_text(encoding='utf-8')
          old='"test_card_identity_ambiguity_v320.py","test_card_precision_v321.py","test_multi_market_price_collector.py"'
          new='"test_card_identity_ambiguity_v320.py","test_card_precision_v321.py","test_card_variant_market_precision_v322.py","test_multi_market_price_collector.py"'
          if v.count(old)!=1: raise SystemExit(f'verify static anchor count={v.count(old)}')
          v=v.replace(old,new,1)
          old='"test_card_identity_ambiguity_v320.py"],360,False)'
          new='"test_card_identity_ambiguity_v320.py","test_card_variant_market_precision_v322.py"],360,False)'
          if v.count(old)!=1: raise SystemExit(f'verify node anchor count={v.count(old)}')
          v=v.replace(old,new,1)
          old='current-main-v321-edition-consensus-valuation-provenance'
          new='current-main-v322-edition-variant-market-provenance'
          if v.count(old)!=1: raise SystemExit(f'verify engine anchor count={v.count(old)}')
          verify.write_text(v.replace(old,new,1),encoding='utf-8')
          PY

          # The bootstrap workflow must not survive into production or its integrity manifest.
          git rm .github/workflows/card-variant-rebase-v322.yml
          python fault_injection_healing.py --manifest

          python -m py_compile card_identity_recognition.py verify_current_runtime.py test_card_precision_v321.py test_card_variant_market_precision_v322.py
          node --check card_identity_recognition.js
          node --check grade_market_flow.js
          node --check auto_market_center.js
          node --check auto_validation_flow.js
          node verify_pokemon_generation_runtime.js

          python -m unittest -v \
            test_card_precision_v321.py \
            test_card_variant_market_precision_v322.py \
            test_card_identity_ambiguity_v320.py \
            test_card_edition_precision_v302.py \
            test_card_region_generation_precision_v306.py \
            test_card_identity_market_precision_v309.py \
            test_card_region_conflict_failclosed_v318.py \
            test_card_tablet_runtime_v300.py \
            test_card_core_provenance_v296.py \
            test_multi_market_price_collector.py
          python tablet_runtime_qa.py --profile runtime
          python test_runtime_resilience_v182.py
          python tablet_runtime_manifest.py --check --compile
          python security_self_audit.py --no-memory --fail-on high
          python repository_integrity_guard.py
          python verify_current_runtime.py --passes 1
          git diff --check

          git add -A
          git commit -m 'fix: separate card set variant finish rarity and market identity v322'
          git push origin HEAD:fix/card-identity-variant-precision-v322
