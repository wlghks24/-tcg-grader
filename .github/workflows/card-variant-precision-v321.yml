name: Card Variant Precision v321

on:
  push:
    branches: [fix/card-identity-variant-precision-v321]

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout audit branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/card-identity-variant-precision-v321
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'

      - name: Apply reconcile and validate v321
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python -m pip install --disable-pip-version-check pillow
          python - <<'PY'
          from pathlib import Path
          p=Path('apply_card_identity_variant_v321.py')
          s=p.read_text(encoding='utf-8')
          old='out, count = re.subn(pattern, replacement, text, count=1, flags=re.S)'
          new='out, count = re.subn(pattern, lambda _m: replacement, text, count=1, flags=re.S)'
          if s.count(old)!=1:
              raise SystemExit(f'replace_regex anchor count={s.count(old)}')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
          python apply_card_identity_variant_v321.py
          python - <<'PY'
          from pathlib import Path

          def patch(path, old, new, label):
              p=Path(path); s=p.read_text(encoding='utf-8'); n=s.count(old)
              if n!=1:
                  raise SystemExit(f'{label}: anchor count={n}')
              p.write_text(s.replace(old,new,1),encoding='utf-8')

          # Keep v302/v306 wording contracts while making variant identity explicit.
          patch('card_identity_recognition.js',
                '같은 사진에 서로 다른 카드/판본/버전 정보가 입력되어 학습을 중단했습니다.',
                '같은 사진에 서로 다른 카드/판본 정보 또는 버전 정보가 입력되어 학습을 중단했습니다.',
                'browser conflict wording')
          patch('card_identity_recognition.js',
                '동일 판본·버전 유사 사진 재인식 활성화',
                '동일 판본 유사 사진 재인식 활성화 · 동일 버전 확인',
                'browser learning wording')
          patch('card_identity_recognition.js',
                "const identityAmbiguous=server?.identity_ambiguous===true||server?.region_ambiguous===true||server?.market_ambiguous===true;",
                "const identityAmbiguous=server?.identity_ambiguous===true||server?.region_ambiguous===true||server?.market_ambiguous===true||server?.metadata_ambiguous===true;",
                'browser metadata ambiguity')

          # Avoid guessing single-letter rarity from noisy whole-card OCR; explicit fields still accept it.
          patch('card_identity_recognition.py',
                'for rarity in ("BWR", "MUR", "SAR", "CSR", "CHR", "SSR", "RRR", "SEC", "SR", "UR", "HR", "AR", "SP", "TR", "RR", "L", "R", "U", "C"):',
                'for rarity in ("BWR", "MUR", "SAR", "CSR", "CHR", "SSR", "RRR", "SEC", "SR", "UR", "HR", "AR", "SP", "TR", "RR"):',
                'python conservative rarity')
          patch('card_identity_recognition.js',
                "for(const r of ['BWR','MUR','SAR','CSR','CHR','SSR','RRR','SEC','SR','UR','HR','AR','SP','TR','RR','L','R','U','C'])",
                "for(const r of ['BWR','MUR','SAR','CSR','CHR','SSR','RRR','SEC','SR','UR','HR','AR','SP','TR','RR'])",
                'browser conservative rarity')

          # Preserve legacy core identity markers while extending the real comparison with print metadata.
          patch('card_identity_recognition.py',
                '    core_identity = (card_name, card_number, market_key, game, meta["set_code"], meta["variant"], meta["finish"], meta["rarity"])\n',
                '    core_identity = (card_name, card_number, market_key, game)\n    metadata_identity = (meta["set_code"], meta["variant"], meta["finish"], meta["rarity"])\n    full_core_identity = (*core_identity, *metadata_identity)\n',
                'server core identity structure')
          patch('card_identity_recognition.py',
                '            if item_core != core_identity:\n',
                '            if item_core != full_core_identity:\n',
                'server conflict full identity')
          patch('card_identity_recognition.py',
                '                if item.get("image_hash") == image_hash and item_core == core_identity and normalize_region(item.get("region")) == "UNKNOWN":\n',
                '                if item.get("image_hash") == image_hash and item_core == full_core_identity and normalize_region(item.get("region")) == "UNKNOWN":\n',
                'server promotion full identity')
          patch('card_identity_recognition.py',
                '                "reason": "same_image_conflicting_identity_edition_or_variant",\n',
                '                "reason": "same_image_conflicting_identity_or_edition",\n                "conflict_scope": "identity_edition_or_variant",\n',
                'server conflict reason compatibility')
          patch('card_identity_recognition.py',
                '        identity = (*core_identity, effective_region)\n        keys = set()\n',
                '        identity = (*core_identity, effective_region)\n        full_identity = (*core_identity, *metadata_identity, effective_region)\n        keys = set()\n',
                'server full identity declaration')
          patch('card_identity_recognition.py',
                '        if (image_hash, *identity) not in keys:\n',
                '        if (image_hash, *full_identity) not in keys:\n',
                'server full identity insert')
          patch('card_identity_recognition.py',
                '            if item_identity == identity:\n',
                '            if item_identity == full_identity:\n',
                'server full identity count')

          # Restore exact edition fail-closed source contracts without loosening behavior.
          patch('grade_market_flow.js',
                "const title=norm(row.title),n=norm(name),cn=norm(number),qcn=norm(row.card_number),target=currentIdentityMeta(),actual=quoteIdentityMeta(row);",
                "const title=norm(row.title),n=norm(name),cn=norm(number),qcn=norm(row.card_number),target=currentIdentityMeta(),quoteMeta=quoteIdentityMeta(row);",
                'market quote metadata variable')
          patch('grade_market_flow.js',
                "const wanted=editionCode(region),actualRegion=editionCode(row.card_region||'UNKNOWN');if(wanted!=='UNKNOWN'&&actualRegion===wanted)score+=20;else if(wanted!=='UNKNOWN'&&actualRegion!==wanted)return -999;",
                "const wanted=editionCode(region),actual=editionCode(row.card_region||'UNKNOWN');if(wanted!=='UNKNOWN'&&actual===wanted)score+=20;else if(wanted!=='UNKNOWN'&&actual!==wanted)return -999;",
                'market quote edition contract')
          patch('grade_market_flow.js',
                "for(const field of ['set_code','variant','finish','rarity'])if(metadataKnown(target[field])&&target[field]===actual[field])score+=8;",
                "for(const field of ['set_code','variant','finish','rarity'])if(metadataKnown(target[field])&&target[field]===quoteMeta[field])score+=8;",
                'market quote metadata score')
          patch('grade_market_flow.js',
                "if(directOption&&marketKeyEdition(direct)===wanted&&marketMetadataCompatible(target,optionIdentityMeta(directOption))){",
                "if(directOption&&(wanted==='UNKNOWN'||marketKeyEdition(direct)===wanted)&&marketMetadataCompatible(target,optionIdentityMeta(directOption))){",
                'saved direct edition contract')
          patch('grade_market_flow.js',
                "for(const option of options){const actualRegion=marketKeyEdition(option.value);if(actualRegion!==wanted)continue;",
                "for(const option of options){const actual=marketKeyEdition(option.value);if(wanted!=='UNKNOWN'&&actual!==wanted)continue;",
                'saved option edition contract')
          patch('grade_market_flow.js',
                "const q=marketQuery();\n if(el('quickCardQuery'))",
                "const q=[name,number,editionSearchToken(editionCode(region)),...marketMetadataTokens(meta)].filter(Boolean).join(' ').trim();\n if(el('quickCardQuery'))",
                'market query legacy edition token')
          patch('grade_market_flow.js',
                "'다른 판본·세트·버전·홀로·레어도 가격은 자동 대체하지 않습니다.'",
                "'다른 판본 가격은 자동 대체하지 않습니다. 세트·버전·홀로·레어도도 일치해야 합니다.'",
                'market failclosed wording')
          PY
          git rm -f apply_card_identity_variant_v321.py .github/workflows/card-variant-precision-v321.yml
          python fault_injection_healing.py --manifest
          python -m py_compile card_identity_recognition.py verify_current_runtime.py test_card_variant_market_precision_v321.py
          node --check card_identity_recognition.js
          node --check grade_market_flow.js
          node --check auto_market_center.js
          node --check auto_validation_flow.js
          node verify_pokemon_generation_runtime.js
          python -m unittest -v \
            test_card_variant_market_precision_v321.py \
            test_card_identity_ambiguity_v320.py \
            test_card_edition_precision_v302.py \
            test_card_region_generation_precision_v306.py \
            test_card_identity_market_precision_v309.py \
            test_card_region_conflict_failclosed_v318.py \
            test_card_tablet_runtime_v300.py
          python tablet_runtime_qa.py --profile runtime
          python test_runtime_resilience_v182.py
          python tablet_runtime_manifest.py --check --compile
          python security_self_audit.py --no-memory --fail-on high
          python repository_integrity_guard.py
          git diff --check
          git add -A
          git commit -m 'fix: separate card set variant finish rarity and market identity v321'
          git push origin HEAD:fix/card-identity-variant-precision-v321
