name: V400 exact-tree finalizer

on:
  push:
    branches:
      - feature/tablet-autonomous-evolution-v400
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: v400-exact-tree-finalizer
  cancel-in-progress: false

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: feature/tablet-autonomous-evolution-v400

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Compile and self-test V400
        run: |
          set -euo pipefail
          python -m py_compile tablet_autonomous_evolution_v398.py tablet_autonomous_evolution_v399.py tablet_autonomous_evolution_v400.py
          python tablet_autonomous_evolution_v400.py --self-test
          node --check tablet_autonomy_dashboard_v400.js

      - name: Run V399/V400 targeted regression
        run: |
          set -euo pipefail
          python -m unittest -v             test_tablet_autonomous_evolution_v399.py             test_tablet_autonomy_dashboard_v399.py             test_tablet_autonomous_evolution_v400.py             test_tablet_autonomy_dashboard_v400.py

      - name: Run Tablet GPT sync regression through V393
        run: |
          set -euo pipefail
          python -m unittest -v             test_tablet_gpt_tcg_grader_sync_v377.py             test_tablet_gpt_tcg_grader_sync_v378.py             test_tablet_gpt_tcg_grader_sync_v379.py             test_tablet_gpt_tcg_grader_sync_v380.py             test_tablet_gpt_tcg_grader_sync_v381.py             test_tablet_gpt_tcg_grader_sync_v382.py             test_tablet_gpt_tcg_grader_sync_v383.py             test_tablet_gpt_tcg_grader_sync_v384.py             test_tablet_gpt_tcg_grader_sync_v385.py             test_tablet_gpt_tcg_grader_sync_v386.py             test_tablet_gpt_tcg_grader_sync_v387.py             test_tablet_gpt_tcg_grader_sync_v388.py             test_tablet_gpt_tcg_grader_sync_v389.py             test_tablet_gpt_tcg_grader_sync_v390.py             test_tablet_gpt_tcg_grader_sync_v391.py             test_tablet_gpt_tcg_grader_sync_v392.py             test_tablet_gpt_tcg_grader_sync_v393.py

      - name: Runtime manifest and final tablet verification
        run: |
          set -euo pipefail
          python tablet_runtime_manifest.py --check --compile
          python quality_review_policy.py --check
          bash VERIFY_TABLET_FINAL.sh

      - name: Finalize exact tree and integrity manifest
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/v400-exact-tree-finalizer.yml
          python fault_injection_healing.py --manifest
          git add -A
          python repository_integrity_guard.py
          if git diff --cached --quiet; then
            echo "No exact-tree finalization changes"
            exit 0
          fi
          git commit -m "chore: finalize tablet V400 exact tree"
          git push origin HEAD:feature/tablet-autonomous-evolution-v400
