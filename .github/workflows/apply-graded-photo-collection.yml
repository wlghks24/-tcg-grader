name: Apply graded photo collection
on:
  push:
    branches: [main]
    paths:
      - graded_photo_multi_source.py
      - test_graded_photo_multi_source.py
      - apply_graded_photo_collection_patch.py
      - .github/workflows/apply-graded-photo-collection.yml
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Unit tests
        run: python -m unittest -v test_graded_photo_multi_source.py
      - name: Apply integration patch
        run: python apply_graded_photo_collection_patch.py
      - name: Syntax check
        run: python -m py_compile graded_photo_multi_source.py auto_update_all.py tcg_updater.py
      - name: Commit integration
        run: |
          if git diff --quiet -- auto_update_all.py tcg_updater.py; then
            echo "No integration changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add auto_update_all.py tcg_updater.py
          git commit -m "feat: schedule graded photo corpus collection"
          git push
