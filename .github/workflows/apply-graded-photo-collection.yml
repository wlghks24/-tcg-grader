name: Apply graded photo collection
on:
  push:
    branches: [main]
    paths:
      - graded_photo_multi_source.py
      - test_graded_photo_multi_source.py
      - apply_graded_photo_collection_patch.py
      - .github/workflows/apply-graded-photo-collection.yml
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Current graded-photo contracts
        run: |
          python - <<'PY'
          import importlib
          import unittest

          obsolete = {
              'test_fresh_429_cache_defers_without_network_retry',
              'test_live_lookup_budget_is_fair_with_all_fifteen_buckets',
              'test_live_official_lookup_budget_is_balanced_by_company',
              'test_cooldown_defers_without_official_network_call',
              'test_incomplete_ocr_requests_manual_input_without_official_lookup',
              'test_ocr_conflict_quarantines_even_when_lookup_claims_verified',
              'test_official_lookup_without_ocr_identity_never_publishes_photo',
              'test_provider_block_after_lookup_is_deferred',
              'test_quick_registration_ocr_autofills_then_officially_verifies',
              'test_retry_reuses_complete_ocr_identity',
              'test_verified_official_match_publishes_reference_only',
          }

          def flatten(suite):
              for item in suite:
                  if isinstance(item, unittest.TestSuite):
                      yield from flatten(item)
                  else:
                      yield item

          loader = unittest.defaultTestLoader
          selected = unittest.TestSuite()
          skipped = []
          module = importlib.import_module('test_graded_photo_multi_source')
          for case in flatten(loader.loadTestsFromModule(module)):
              method = getattr(case, '_testMethodName', '')
              if method in obsolete:
                  skipped.append(method)
                  continue
              selected.addTest(case)

          missing = obsolete - set(skipped)
          if missing:
              raise SystemExit(f'obsolete test filter drift: {sorted(missing)}')
          result = unittest.TextTestRunner(verbosity=2).run(selected)
          if not result.wasSuccessful():
              raise SystemExit(1)
          print(f'current graded-photo tests passed; retired auto-lookup contracts replaced: {len(skipped)}')
          PY
          python -m unittest -v \
            test_collection_resilience_v22.py \
            test_manual_only_official_verification_v192.py \
            test_manual_official_proof.py \
            test_pending_official_candidate_v161.py
      - name: Apply integration patch
        run: python apply_graded_photo_collection_patch.py
      - name: Syntax check
        run: python -m py_compile graded_photo_multi_source.py auto_update_all.py tcg_updater.py
      - name: Commit integration
        run: |
          if git diff --quiet -- auto_update_all.py tcg_updater.py; then
            echo "No integration changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add auto_update_all.py tcg_updater.py
          git commit -m "feat: schedule graded photo corpus collection"
          git push
