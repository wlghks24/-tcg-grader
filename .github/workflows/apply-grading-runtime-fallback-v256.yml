name: Apply grading runtime fallback v256
on:
  push:
    branches: [fix/grading-runtime-fallback-v256]
    paths:
      - '.github/workflows/apply-grading-runtime-fallback-v256.yml'
  workflow_dispatch:
permissions:
  contents: write

concurrency:
  group: apply-grading-runtime-fallback-v256-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: fix/grading-runtime-fallback-v256
          fetch-depth: 0
      - name: Apply bounded patch
        run: python apply_grading_runtime_fallback_v256.py
      - name: Remove one-shot patch machinery before final diff
        run: git rm apply_grading_runtime_fallback_v256.py .github/workflows/apply-grading-runtime-fallback-v256.yml
      - name: Refresh integrity baseline
        run: |
          python fault_injection_healing.py --manifest
          python fault_injection_healing.py --diagnose
      - name: Targeted regression
        run: |
          python -m py_compile tablet_runtime_manifest.py tcg_updater.py grading_company_watch.py
          python -m unittest -v test_grading_runtime_fallback_v256.py
          python -m unittest -v test_tablet_runtime_manifest_ui_assets_v254.py
          python -m unittest -v test_grading_costs_live.py
          python -m unittest -v test_grading_company_watch_v215.py
          python -m unittest -v test_collection_job_contract_v255.py
          python tablet_runtime_manifest.py --check --compile
      - name: SELFREFINE smoke gate
        run: python main_selfrefine_gate.py --self-test
      - name: Verify bounded final diff
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import subprocess
          allowed={
              'tablet_runtime_manifest.py',
              'tcg_updater.py',
              'test_tablet_runtime_manifest_ui_assets_v254.py',
              'test_grading_runtime_fallback_v256.py',
              'integrity_manifest.json',
          }
          changed=set(filter(None,subprocess.check_output(['git','diff','--name-only','HEAD'],text=True).splitlines()))
          untracked=set(filter(None,subprocess.check_output(['git','ls-files','--others','--exclude-standard'],text=True).splitlines()))
          actual=changed|untracked
          extra=actual-allowed
          missing={'tablet_runtime_manifest.py','tcg_updater.py','test_tablet_runtime_manifest_ui_assets_v254.py','test_grading_runtime_fallback_v256.py'}-actual
          assert not extra, f'unexpected changed paths: {sorted(extra)}'
          assert not missing, f'missing expected changes: {sorted(missing)}'
          print('bounded diff OK:',sorted(actual))
          PY
      - name: Commit verified patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tablet_runtime_manifest.py tcg_updater.py test_tablet_runtime_manifest_ui_assets_v254.py test_grading_runtime_fallback_v256.py integrity_manifest.json
          git commit -m 'Harden grading runtime fallback coverage'
          git push origin HEAD:fix/grading-runtime-fallback-v256
