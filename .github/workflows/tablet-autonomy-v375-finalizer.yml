                    )
                else:
                    self.assertEqual([], after374)
            else:
                self.assertEqual([], after373)'''
          replace_once("test_tablet_gpt_tcg_grader_sync_v372.py", v372_chain_old, v372_chain_new)

          v373_compare_old = '''            self.assertEqual(later, watched_paths(successor, sc["base_main_sha"], sc["candidate_commit"]))'''
          v373_compare_new = '''            first_hop = watched_paths(contract, CANDIDATE, sc["candidate_commit"])
            self.assertEqual(first_hop, watched_paths(successor, sc["base_main_sha"], sc["candidate_commit"]))'''
          replace_once("test_tablet_gpt_tcg_grader_sync_v373.py", v373_compare_old, v373_compare_new)
          v373_tail_old = '''            self.assertEqual([], watched_paths(successor, sc["candidate_commit"]))'''
          v373_tail_new = '''            after374 = watched_paths(successor, sc["candidate_commit"])
            if after374:
                successor375 = read(ROOT / "TCG_CROSSCHECK/TABLET_GPT_TCG_GRADER_SYNC_CONTRACT_V375.json")
                sc375 = successor375["candidate_sync"]
                self.assertEqual(
                    "TCG_CROSSCHECK/TABLET_GPT_TCG_GRADER_SYNC_CONTRACT_V374.json",
                    successor375["prior_contract"],
                )
                self.assertEqual(
                    "TCG_CROSSCHECK/TABLET_GPT/learning_snapshot_v374_delta.json",
                    successor375["prior_delta_snapshot"],
                )
                self.assertEqual("2b1112318fa23f4e8edd525695ee3711ea715e18", sc375["base_main_sha"])
                self.assertEqual("d7c8577b514abdbbc15ba9323c4c0deb1945efed", sc375["candidate_commit"])
                self.assertEqual(
                    after374,
                    watched_paths(successor375, sc375["base_main_sha"], sc375["candidate_commit"]),
                )
                expected_v375_generation = {
                    "TCG_CROSSCHECK/TABLET_GPT_TCG_GRADER_SYNC_CONTRACT_V375.json",
                    "TCG_CROSSCHECK/TABLET_GPT/learning_snapshot_v375_delta.json",
                    "TCG_CROSSCHECK/TCG_GRADER/tablet_gpt_learning_receipt_v375.json",
                    "test_tablet_gpt_tcg_grader_sync_v375.py",
                }
                self.assertEqual(expected_v375_generation, set(sc375["generation_files"]))
                self.assertTrue(
                    expected_v375_generation.issubset(
