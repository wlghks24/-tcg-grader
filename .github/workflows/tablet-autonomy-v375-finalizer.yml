name: V375 Tablet Autonomy Finalizer

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: tablet-autonomy-v375-finalizer-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  finalize:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'feature/tablet-autonomous-evolution-v375'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feature/tablet-autonomous-evolution-v375
          fetch-depth: 0

      - name: Refuse stale base or wrong branch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "feature/tablet-autonomous-evolution-v375"
          git fetch origin main --no-tags
          test "$(git rev-parse origin/main)" = "2b1112318fa23f4e8edd525695ee3711ea715e18"
          git merge-base --is-ancestor 2b1112318fa23f4e8edd525695ee3711ea715e18 HEAD
          git merge-base --is-ancestor d7c8577b514abdbbc15ba9323c4c0deb1945efed HEAD

      - name: Remove one-shot workflow from final tree first
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -- .github/workflows/tablet-autonomy-v375-finalizer.yml
          git commit -m "ci: remove v375 one-shot finalizer"

      - name: Extend exact historical successor lineage through V375
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              if text.count(old) != 1:
                  raise SystemExit(f"expected exactly one repair target in {path}: found {text.count(old)}")
              p.write_text(text.replace(old, new, 1), encoding="utf-8")

          v369_old = '''                            self.assertEqual(
                                [],
                                watched_paths(successor374, candidate374["candidate_commit"]),
                                "verified v374 successor has uncovered watched changes",
                            )'''
          v369_new = '''                            after374 = watched_paths(successor374, candidate374["candidate_commit"])
                            if after374:
                                successor375, candidate375 = assert_successor_generation(
                                    self,
                                    "TCG_CROSSCHECK/TABLET_GPT_TCG_GRADER_SYNC_CONTRACT_V374.json",
                                    "TCG_CROSSCHECK/TABLET_GPT/learning_snapshot_v374_delta.json",
                                    "TCG_CROSSCHECK/TABLET_GPT_TCG_GRADER_SYNC_CONTRACT_V375.json",
                                )
                                sixth_hop = watched_paths(
                                    successor374,
                                    candidate374["candidate_commit"],
                                    candidate375["candidate_commit"],
                                )
                                self.assertEqual(sorted(sixth_hop), sorted(candidate375["watched_paths"]))
                                self.assertEqual(
                                    [],
                                    watched_paths(successor375, candidate375["candidate_commit"]),
                                    "verified v375 successor has uncovered watched changes",
                                )
                            else:
                                self.assertEqual([], after374)'''
          replace_once("test_tablet_gpt_tcg_grader_sync_v369.py", v369_old, v369_new)

          v370_old = '''                        self.assertEqual(
                            [],
                            watched_paths(successor374, candidate374["candidate_commit"]),
                            "verified v374 successor has uncovered watched changes",
                        )'''
          v370_new = '''                        after374 = watched_paths(successor374, candidate374["candidate_commit"])
                        if after374:
                            successor375, candidate375 = assert_successor_generation(
                                self,
                                "TCG_CROSSCHECK/TABLET_GPT_TCG_GRADER_SYNC_CONTRACT_V374.json",
