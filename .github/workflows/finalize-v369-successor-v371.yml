name: Finalize v369 successor v371

on:
  push:
    branches:
      - fix/v369-successor-delegation-v371
    paths:
      - '.github/workflows/finalize-v369-successor-v371.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact repair branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/v369-successor-delegation-v371
          fetch-depth: 0
      - name: Remove one-shot workflow and rebuild exact manifest
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -- .github/workflows/finalize-v369-successor-v371.yml
          python static_integrity_manifest.py --write integrity_manifest.json
          python static_integrity_manifest.py --check integrity_manifest.json
          python -m unittest -v test_tablet_gpt_tcg_grader_sync_v369.py
          python repository_integrity_guard.py
          git add -- integrity_manifest.json test_tablet_gpt_tcg_grader_sync_v369.py
          git diff --cached --check
          git commit -m 'fix: finalize v369 successor delegation integrity'
          git push origin HEAD:refs/heads/fix/v369-successor-delegation-v371
