name: Daily 06:00 Collection ↔ Instagram Accuracy Audit

on:
  schedule:
    # GitHub cron is UTC. 21:00 UTC = 06:00 KST next day.
    - cron: '0 21 * * *'
  workflow_dispatch:
  pull_request:
    paths:
      - 'daily_collection_instagram_accuracy.py'
      - 'tcg_updater.py'
      - 'collection_source_coverage_v28.py'
      - 'test_collection_source_coverage_v28.py'
      - 'official_direct_discovery.py'
      - 'adaptive_collection_learner.py'
      - 'auto_update_all.py'
      - 'test_0600_operational_refresh_v25.py'
      - 'test_daily_collection_instagram_accuracy.py'
      - 'adaptive_collection_stats.json'
      - 'source_collection_stats.json'
      - 'promo_events.json'
      - 'instagram_tcg_content/**'
      - 'main_crosscheck_export.py'
      - 'selfrefine_crosscheck_gate.py'
      - 'peer_learning_crosscheck_gate.py'
      - 'main_peer_learning_export.py'
      - 'shared_self_learning/peer_learning.py'
      - 'test_peer_learning_crosscheck_v23.py'
      - 'crosscheck_exchange/**'
      - '.github/workflows/daily-0600-collection-instagram-accuracy.yml'
  push:
    branches: [main]
    paths:
      - 'daily_collection_instagram_accuracy.py'
      - 'tcg_updater.py'
      - 'collection_source_coverage_v28.py'
      - 'test_collection_source_coverage_v28.py'
      - 'official_direct_discovery.py'
      - 'adaptive_collection_learner.py'
      - 'auto_update_all.py'
      - 'test_0600_operational_refresh_v25.py'
      - 'test_daily_collection_instagram_accuracy.py'
      - 'adaptive_collection_stats.json'
      - 'source_collection_stats.json'
      - 'promo_events.json'
      - 'instagram_tcg_content/**'
      - 'main_crosscheck_export.py'
      - 'selfrefine_crosscheck_gate.py'
      - 'peer_learning_crosscheck_gate.py'
      - 'main_peer_learning_export.py'
      - 'shared_self_learning/peer_learning.py'
      - 'test_peer_learning_crosscheck_v23.py'
      - 'crosscheck_exchange/**'
      - '.github/workflows/daily-0600-collection-instagram-accuracy.yml'

permissions:
  contents: read

concurrency:
  group: daily-0600-collection-instagram-accuracy-${{ github.event_name }}-${{ github.ref }}
  # Superseded PR commits should not consume the full live-collection budget.
  # Scheduled/main runs remain non-cancellable so an operational audit is never
  # interrupted merely because another event arrives on the same ref.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PYTHONPATH: ${{ github.workspace }}
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'

      - name: Preserve Main vs Instagram isolation
        run: |
          python selfrefine_domain_boundary_guard.py
          python selfrefine_crosscheck_gate.py --self-test
          python peer_learning_crosscheck_gate.py --self-test
          python main_peer_learning_export.py --self-test
          python -m instagram_tcg_content.peer_learning_export --self-test
          python -m unittest -v test_selfrefine_domain_isolation_v18.py test_peer_learning_crosscheck_v23.py
          python -m unittest -v instagram_tcg_content.test_state_isolation_v18

      - name: Verify 06:00 audit regression
        run: |
          python -m py_compile daily_collection_instagram_accuracy.py auto_update_all.py collection_source_coverage_v28.py selfrefine_crosscheck_gate.py peer_learning_crosscheck_gate.py main_peer_learning_export.py main_peer_learning_adoption.py selfrefine_domain_boundary_guard.py shared_self_learning/peer_learning.py instagram_tcg_content/peer_learning_export.py
          python collection_source_coverage_v28.py
          python -c "import daily_collection_instagram_accuracy, auto_update_all, selfrefine_crosscheck_gate, peer_learning_crosscheck_gate"
          python -m unittest -v test_daily_collection_instagram_accuracy.py test_0600_operational_refresh_v25.py test_collection_source_coverage_v28.py

      - name: Refresh bounded live collection state before 06:00 audit
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request' || github.event_name == 'push'
        timeout-minutes: 22
        env:
          TCG_SOURCE_TIMEOUT_CAP: '30'
          TCG_HTTP_TIMEOUT: '30'
        run: |
          python - <<'PY'
          import datetime as dt
          import json
          from pathlib import Path
          import tcg_updater
          import collection_source_coverage_v28

          MAX_HEALTH_AGE_SECONDS = 600
          MAX_FUTURE_SKEW_SECONDS = 300

          def fresh_age_seconds(label, value, now):
              if not value:
                  raise SystemExit(f'06:00 live refresh missing {label} updated_at')
              try:
                  parsed = dt.datetime.fromisoformat(str(value).replace('Z', '+00:00'))
              except ValueError as exc:
                  raise SystemExit(f'06:00 live refresh invalid {label} updated_at: {value!r}') from exc
              if parsed.tzinfo is None:
                  parsed = parsed.replace(tzinfo=dt.timezone.utc)
              age = (now - parsed.astimezone(dt.timezone.utc)).total_seconds()
              if age > MAX_HEALTH_AGE_SECONDS:
                  raise SystemExit(
                      f'06:00 live refresh stale {label} health: age={age:.1f}s '
                      f'(max={MAX_HEALTH_AGE_SECONDS}s)'
                  )
              if age < -MAX_FUTURE_SKEW_SECONDS:
                  raise SystemExit(
                      f'06:00 live refresh future-dated {label} health: age={age:.1f}s '
                      f'(max future skew={MAX_FUTURE_SKEW_SECONDS}s)'
                  )
              return round(age, 1)

          result = tcg_updater.update_cycle('scheduled-0600-audit')
          source = json.loads(Path('source_collection_stats.json').read_text(encoding='utf-8'))
          adaptive = json.loads(Path('adaptive_collection_stats.json').read_text(encoding='utf-8'))
          if not isinstance(source.get('sources'), dict) or not source['sources']:
              raise SystemExit('06:00 live refresh did not persist source-level health')
          if not isinstance(adaptive.get('jobs'), dict) or not adaptive['jobs']:
              raise SystemExit('06:00 live refresh did not persist adaptive collector health')

          now = dt.datetime.now(dt.timezone.utc)
          source_age = fresh_age_seconds('source', source.get('updated_at'), now)
          adaptive_age = fresh_age_seconds('adaptive', adaptive.get('updated_at'), now)
          official_source_coverage = collection_source_coverage_v28.audit_source_stats(
              source, now, max_age_hours=36.0
          )
          if not official_source_coverage.get('ok'):
              raise SystemExit(
                  '06:00 live refresh official-source coverage incomplete: '
                  + json.dumps({
                      'healthy_cells': official_source_coverage.get('healthy_cells'),
                      'missing_cells': official_source_coverage.get('missing_cells'),
                      'degraded_cells': official_source_coverage.get('degraded_cells'),
                  }, ensure_ascii=False)
              )

          critical_results = {}
          report_path = Path('auto_update_report.json')
          if report_path.is_file():
              report = json.loads(report_path.read_text(encoding='utf-8'))
              for row in report.get('results', []):
                  filename = row.get('file')
                  if filename not in {'releases.json', 'market_prices.json', 'promo_events.json', 'exchange_rates.json'}:
                      continue
                  critical_results[filename] = {
                      'ok': bool(row.get('ok')),
                      'status': str(row.get('status') or '')[:240],
                      'remaining_collection_errors': [
                          str(x)[:300] for x in (row.get('remaining_collection_errors') or [])[:5]
                      ],
                      'retry_count': int(row.get('retry_count') or 0),
                  }

          print(json.dumps({
              'source_health_rows': len(source['sources']),
              'source_health_updated_at': source['updated_at'],
              'source_health_age_seconds': source_age,
              'adaptive_updated_at': adaptive['updated_at'],
              'adaptive_health_age_seconds': adaptive_age,
              'auto_update_status': (result.get('auto_update') or {}).get('status'),
              'official_source_coverage': {
                  'expected_cells': official_source_coverage['expected_cells'],
                  'healthy_cells': official_source_coverage['healthy_cells'],
                  'missing_cells': official_source_coverage['missing_cells'],
                  'degraded_cells': official_source_coverage['degraded_cells'],
              },
              'critical_collection_results': critical_results,
          }, ensure_ascii=False))
          PY

      - name: Run daily collection vs Instagram audit
        run: |
          flags=(--strict-policy)
          if [[ "${{ github.event_name }}" == "schedule" ]]; then
            flags+=(--fail-on-degraded)
          fi
          python daily_collection_instagram_accuracy.py \
            --report COLLECTION_INSTAGRAM_ACCURACY_REPORT.json \
            "${flags[@]}"

      - name: Validate audit report artifact
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("COLLECTION_INSTAGRAM_ACCURACY_REPORT.json")
          if not path.is_file():
              raise SystemExit("06:00 audit report is missing")

          payload = json.loads(path.read_text(encoding="utf-8"))
          if payload.get("schema_version") != 1:
              raise SystemExit("unexpected 06:00 audit report schema_version")

          summary = payload.get("summary")
          if not isinstance(summary, dict):
              raise SystemExit("06:00 audit report summary is missing")
          required_summary = {
              "status",
              "health_score",
              "critical_findings",
              "high_findings",
              "medium_findings",
              "repair_action_count",
              "crosscheck_validation_error",
              "learning_crosscheck_validation_error",
              "learning_conflicting_fix",
          }
          missing = sorted(required_summary - set(summary))
          if missing:
              raise SystemExit(f"06:00 audit report summary missing keys: {missing}")
          if summary["status"] not in {"pass", "warning", "degraded", "fail_closed"}:
              raise SystemExit(f"invalid 06:00 audit status: {summary['status']!r}")

          main_collection = payload.get("main_collection")
          if not isinstance(main_collection, dict):
              raise SystemExit("06:00 audit main_collection is missing")
          official_coverage = main_collection.get("official_source_coverage")
          if not isinstance(official_coverage, dict) or official_coverage.get("expected_cells") != 9:
              raise SystemExit("06:00 audit official source coverage contract is missing")
          if official_coverage.get("healthy_cells") != 9 or official_coverage.get("missing_cells") or official_coverage.get("degraded_cells"):
              raise SystemExit(f"06:00 audit official source coverage incomplete: {official_coverage}")

          safety = payload.get("safety")
          if not isinstance(safety, dict):
              raise SystemExit("06:00 audit safety contract is missing")
          expected_safety = {
              "main_instagram_runtime_state_merged": False,
              "provider_health_shared": False,
              "retry_history_shared": False,
              "learning_state_shared": False,
              "learning_summary_shared_only": True,
              "peer_fix_auto_applied": False,
              "peer_prevention_rule_shared": False,
              "verification_auto_promoted": False,
              "conflicting_values_averaged": False,
              "403_429_bypass_allowed": False,
              "passive_factual_and_learning_summary_exchange_only": True,
              "grading_raw_shared": False,
              "grading_calibration_shared": False,
              "pixel_features_shared": False,
              "render_upload_delivery_state_shared": False,
          }
          mismatches = {
              key: {"expected": expected, "actual": safety.get(key)}
              for key, expected in expected_safety.items()
              if safety.get(key) is not expected
          }
          if mismatches:
              raise SystemExit(f"06:00 audit safety contract mismatch: {mismatches}")

          print(
              json.dumps(
                  {
                      "status": summary["status"],
                      "health_score": summary["health_score"],
                      "crosscheck_validation_error": summary["crosscheck_validation_error"],
                  },
                  ensure_ascii=False,
              )
          )
          PY

      - name: Show audit summary
        if: always()
        run: |
          if [ -f COLLECTION_INSTAGRAM_ACCURACY_REPORT.json ]; then
            python -c "import json; p=json.load(open('COLLECTION_INSTAGRAM_ACCURACY_REPORT.json')); print(json.dumps({'summary':p['summary'],'cross_domain':p['cross_domain'],'internal_learning_crosscheck':p.get('internal_learning_crosscheck',{})}, ensure_ascii=False, indent=2))"
          fi

      - name: Upload 06:00 accuracy report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: collection-instagram-accuracy-report
          path: COLLECTION_INSTAGRAM_ACCURACY_REPORT.json
          if-no-files-found: error
          retention-days: 30
