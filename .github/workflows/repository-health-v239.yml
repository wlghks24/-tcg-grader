name: Repository Health v239

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'auto_update_all.py'
      - 'collection_job_contract.py'
      - 'feature_contract.py'
      - 'repository_health_guard.py'
      - 'test_repository_health_guard_v239.py'
      - '.github/workflows/**'
      - 'apply_*step*.py'
  push:
    branches: [main]
    paths:
      - 'auto_update_all.py'
      - 'collection_job_contract.py'
      - 'feature_contract.py'
      - 'repository_health_guard.py'
      - 'test_repository_health_guard_v239.py'
      - '.github/workflows/**'
      - 'apply_*step*.py'

permissions:
  contents: read

concurrency:
  group: repository-health-v239-${{ github.ref }}
  cancel-in-progress: true

jobs:
  health:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'

      - name: Compile guard
        run: python -m py_compile repository_health_guard.py test_repository_health_guard_v239.py collection_job_contract.py

      - name: Run health regression
        run: python -m unittest -v test_repository_health_guard_v239.py

      - name: Always build health diagnostics
        if: always()
        run: python repository_health_guard.py --no-fail --report REPOSITORY_HEALTH_REPORT.json

      - name: Enforce repository invariants
        run: python repository_health_guard.py --report REPOSITORY_HEALTH_REPORT.json

      - name: Upload health report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: repository-health-v239
          path: REPOSITORY_HEALTH_REPORT.json
          if-no-files-found: error
          retention-days: 14

      - name: Summary
        if: always()
        run: |
          {
            echo '## Repository Health v239'
            echo
            echo '- collection SSOT: collection_job_contract.py; exactly 8 jobs required'
            echo '- executor delegation: auto_update_all.JOBS must point to COLLECTION_JOBS'
            echo '- obsolete 7-step mutators: blocked'
            echo '- collection concurrency/timeouts/stale-main guard: required'
            echo '- write-capable apply workflows: reported as debt; never auto-deleted'
          } >> "$GITHUB_STEP_SUMMARY"

  v305-bootstrap:
    if: github.event_name == 'pull_request' && github.head_ref == 'fix/protected-static-data-pipeline-v305'
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout PR head branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'

      - name: Apply protection-safe static pipeline
        run: python v305_apply_protected_static_pipeline.py

      - name: Targeted v305 regression
        run: python -m unittest -v test_protected_static_pipeline_v305.py

      - name: Regenerate exact final-tree integrity manifest
        shell: bash
        run: |
          set -euo pipefail
          python fault_injection_healing.py --manifest
          python fault_injection_healing.py --diagnose
          python -m json.tool integrity_manifest.json >/dev/null
          git diff --check

      - name: Commit verified final tree to PR branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git fetch origin main
          echo '--- staged final-tree paths ---'
          git diff --cached --name-status
          python - <<'PY'
          import subprocess
          required = {
              '.github/workflows/tcg-static-data-refresh.yml',
              '.github/workflows/gpt-tcg-drive-package.yml',
              '.github/workflows/repository-integrity-guard.yml',
              'test_protected_static_pipeline_v305.py',
              'integrity_manifest.json',
              '.github/workflows/v305-protected-static-pipeline-bootstrap.yml',
              'v305_apply_protected_static_pipeline.py',
          }
          optional = {'.github/workflows/repository-health-v239.yml'}
          staged = set(subprocess.check_output(['git', 'diff', '--cached', '--name-only'], text=True).splitlines())
          missing = required - staged
          unexpected = staged - required - optional
          if missing or unexpected:
              raise SystemExit(f'staged surface mismatch: missing={sorted(missing)} unexpected={sorted(unexpected)} staged={sorted(staged)}')
          PY
          # The temporary bootstrap job must not survive in either the working
          # tree or the commit index. Both must be byte-identical to protected
          # main before the final commit is created.
          git diff --exit-code origin/main -- .github/workflows/repository-health-v239.yml
          git diff --cached --exit-code origin/main -- .github/workflows/repository-health-v239.yml
          git commit -m 'ci: make static refresh protection-safe v305'
          git push origin "HEAD:${GITHUB_HEAD_REF}"
