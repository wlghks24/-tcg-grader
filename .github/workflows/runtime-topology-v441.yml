name: Runtime Topology V441

on:
  pull_request:
    paths:
      - 'RUNTIME_TOPOLOGY_POLICY_V441.json'
      - 'test_runtime_topology_policy_v441.py'
      - 'tablet_runtime_manifest.py'
      - 'TABLET_GDRIVE_SYNC.sh'
      - 'TABLET_GDRIVE_SYNC_INSTALL.sh'
      - 'tablet_gdrive_sync.py'
      - 'tablet_gdrive_sync_hardening.py'
      - 'tablet_gdrive_sync_hardening_contextual.py'
      - 'tablet_gdrive_sync_perf_v262.py'
      - 'AGENTS.md'
      - '.github/copilot-instructions.md'
      - '.github/skills/tcg-runtime-topology/SKILL.md'
      - '.github/skills/tcg-skill-router/SKILL.md'
      - '.github/workflows/runtime-topology-v441.yml'
  push:
    branches: [main]
    paths:
      - 'RUNTIME_TOPOLOGY_POLICY_V441.json'
      - 'test_runtime_topology_policy_v441.py'
      - 'tablet_runtime_manifest.py'
      - 'TABLET_GDRIVE_SYNC.sh'
      - 'TABLET_GDRIVE_SYNC_INSTALL.sh'
      - 'tablet_gdrive_sync.py'
      - 'tablet_gdrive_sync_hardening.py'
      - 'tablet_gdrive_sync_hardening_contextual.py'
      - 'tablet_gdrive_sync_perf_v262.py'
      - 'AGENTS.md'
      - '.github/copilot-instructions.md'
      - '.github/skills/tcg-runtime-topology/SKILL.md'
      - '.github/skills/tcg-skill-router/SKILL.md'
      - '.github/workflows/runtime-topology-v441.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: runtime-topology-v441-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Tablet GitHub Drive Topology V441
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'
      - name: Validate topology policy
        run: |
          python -m json.tool RUNTIME_TOPOLOGY_POLICY_V441.json >/dev/null
          python -m py_compile tablet_runtime_manifest.py test_runtime_topology_policy_v441.py
          python -m unittest -v test_runtime_topology_policy_v441.py
      - name: Validate tablet Drive shell entrypoints
        shell: bash
        run: |
          set -euo pipefail
          bash -n TABLET_GDRIVE_SYNC.sh
          bash -n TABLET_GDRIVE_SYNC_INSTALL.sh
