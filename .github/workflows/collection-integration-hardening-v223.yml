name: Collection integration hardening v223

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/collection-integration-hardening-v223.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONPATH: ${{ github.workspace }}
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 2
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'

      - name: Harden last-good grading allowlist and runtime bundle
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def patch(path, old, new):
              p=Path(path); text=p.read_text(encoding='utf-8')
              if new in text:
                  return
              count=text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one anchor, found {count}: {old[:120]!r}')
              p.write_text(text.replace(old,new,1),encoding='utf-8')

          patch('auto_repair_engine.py',
              '        elif filename == "grading_company_updates.json":\n            if data.get("schema_version") != 1:\n',
              '        elif filename == "grading_company_updates.json":\n            import grading_company_watch\n            from urllib.parse import urlsplit\n            if data.get("schema_version") != 1:\n')
          patch('auto_repair_engine.py',
              '            for row in data["sources"].values():\n                validate_public_https_url(row["url"])\n            if any(not isinstance(row,dict) or row.get("verified_official_source") is not True\n',
              '            for row in data["sources"].values():\n                validate_public_https_url(row["url"])\n                parts=urlsplit(row["url"])\n                if parts.scheme != "https" or (parts.hostname or "").lower() not in grading_company_watch.ALLOWED_HOSTS:\n                    return False\n            if any(not isinstance(row,dict) or row.get("verified_official_source") is not True\n')

          patch('runtime_bundle_guard_v143.py',
              '    "update_exchange_rates.py",\n    "graded_photo_multi_source.py",\n',
              '    "update_exchange_rates.py",\n    "grading_company_watch.py",\n    "grading_company_updates.json",\n    "graded_photo_multi_source.py",\n')
          patch('runtime_bundle_guard_v143.py',
              '    "exchange_rates.json",\n    "graded_photo_candidates.json",\n',
              '    "exchange_rates.json",\n    "grading_company_updates.json",\n    "graded_photo_candidates.json",\n')
          patch('runtime_bundle_guard_v143.py',
              '        "verified_collection_job_neural",\n        "collection_learning_hardening_v142",\n',
              '        "verified_collection_job_neural",\n        "grading_company_watch",\n        "collection_learning_hardening_v142",\n')
          patch('runtime_bundle_guard_v143.py',
              '        if "graded_photo_candidates.json" not in getattr(repair, "SAFE_JSON_FILES", set()):\n            issues.append("등급사진 후보 JSON이 자동복구 안전목록에 없습니다")\n        required = getattr(repair, "REQUIRED_JSON_FIELDS", {}).get("graded_photo_candidates.json", {})\n',
              '        if "graded_photo_candidates.json" not in getattr(repair, "SAFE_JSON_FILES", set()):\n            issues.append("등급사진 후보 JSON이 자동복구 안전목록에 없습니다")\n        if "grading_company_updates.json" not in getattr(repair, "SAFE_JSON_FILES", set()):\n            issues.append("감정업체 공식 스냅샷이 자동복구 안전목록에 없습니다")\n        grading_required = getattr(repair, "REQUIRED_JSON_FIELDS", {}).get("grading_company_updates.json", {})\n        if grading_required.get("companies") is not dict or grading_required.get("sources") is not dict:\n            issues.append("감정업체 공식 스냅샷 사전검증 계약이 구버전입니다")\n        required = getattr(repair, "REQUIRED_JSON_FIELDS", {}).get("graded_photo_candidates.json", {})\n')
          patch('runtime_bundle_guard_v143.py',
              '        if files != EXPECTED_JOB_FILES:\n            issues.append("7개 정규 수집 작업 구성이 현재 번들과 맞지 않습니다")\n',
              '        if files != EXPECTED_JOB_FILES:\n            issues.append(f"{len(EXPECTED_JOB_FILES)}개 정규 수집 작업 구성이 현재 번들과 맞지 않습니다")\n')
          patch('runtime_bundle_guard_v143.py',
              '        if safety.get("per_file_postflight_gate") is not True:\n            issues.append("전체수집 작업 신경망의 파일별 postflight 학습 게이트가 없습니다")\n',
              '        if safety.get("per_file_postflight_gate") is not True:\n            issues.append("전체수집 작업 신경망의 파일별 postflight 학습 게이트가 없습니다")\n        neural_jobs=set(getattr(collection_job_neural, "JOB_KEYS", ()))\n        if not EXPECTED_JOB_FILES.issubset(neural_jobs):\n            issues.append("전체수집 작업 신경망이 정규 필수 수집 작업을 모두 포함하지 않습니다")\n')
          PY

      - name: Verify focused and cross-cutting regressions
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile auto_repair_engine.py runtime_bundle_guard_v143.py auto_update_all.py grading_company_watch.py verified_collection_job_neural.py
          python -m unittest -v \
            test_grading_watch_integration_v220.py \
            test_runtime_bundle_guard_v143.py \
            test_verified_collection_job_neural_v212.py \
            test_security_hardening.py \
            test_repository_selfrefine_v13.py
          python runtime_bundle_guard_v143.py
          python feature_contract.py
          python verify_code_map_internal.py

      - name: Commit verified production hardening
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- auto_repair_engine.py runtime_bundle_guard_v143.py
          git diff --cached --check
          git commit -m 'fix: harden grading snapshot recovery and 8-job runtime bundle'
          git push origin HEAD:main
