name: V328 Card Metadata Finalizer R5

on:
  push:
    branches: [fix/card-metadata-market-v328]
    paths: ['.github/workflows/v328-card-metadata-finalizer-r5.yml']

permissions:
  contents: write

concurrency:
  group: v328-card-metadata-finalizer-r5
  cancel-in-progress: false

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/card-metadata-market-v328
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '20'
      - name: Install audited dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Apply v328 without workflow-permission side effects
        shell: bash
        run: |
          set -euo pipefail
          python .github/scripts/finalize_card_metadata_v328.py
          # GitHub Actions token cannot modify workflow files; preserve the existing
          # protected runtime-delivery workflow. v328 is enforced by verify_current_runtime.
          git checkout HEAD -- .github/workflows/runtime-delivery-guard.yml
          python - <<'PY'
          from pathlib import Path
          p=Path('test_card_metadata_market_v328.py')
          text=p.read_text(encoding='utf-8')
          old='''        workflow = (ROOT / ".github/workflows/runtime-delivery-guard.yml").read_text(encoding="utf-8")\n        self.assertIn("verify_card_metadata_classifier_v328.js", workflow)'''
          new='''        runtime = (ROOT / "verify_current_runtime.py").read_text(encoding="utf-8")\n        self.assertIn("card_metadata_classifier_v328", runtime)\n        self.assertIn("verify_card_metadata_classifier_v328.js", runtime)'''
          if new not in text:
              if old not in text:
                  raise SystemExit('test_card_metadata_market_v328.py runtime marker missing')
              text=text.replace(old,new,1)
          p.write_text(text,encoding='utf-8')
          PY
          rm -f .github/scripts/finalize_card_metadata_v328.py
          git add -A
          python fault_injection_healing.py --manifest
      - name: Targeted card metadata identity generation and price validation
        run: |
          set -euo pipefail
          node --check card_metadata_classifier_v328.js
          node verify_card_metadata_classifier_v328.js
          node --check card_identity_recognition.js
          node verify_pokemon_generation_runtime.js
          node --check grade_market_flow.js
          python -m unittest -v test_card_metadata_market_v328.py test_card_identity_ambiguity_v320.py test_card_market_generation_precision_v325.py test_card_region_generation_precision_v306.py test_card_edition_precision_v302.py test_card_market_edition_v297.py test_card_core_provenance_v296.py test_card_tablet_runtime_v300.py
      - name: Browser security and runtime validation
        run: |
          set -euo pipefail
          node verify_browser_runtime.js
          node verify_service_worker_runtime.js
      - name: Tablet runtime and delivery validation
        run: |
          set -euo pipefail
          python verify_link_runtime.py
          python tablet_runtime_manifest.py --check --compile
          python -m unittest -v test_tablet_runtime_manifest_ui_assets_v254.py
      - name: Full integrity and runtime validation
        run: |
          set -euo pipefail
          python repository_integrity_guard.py
          python verify_current_runtime.py
          python feature_contract.py
          git diff --check
      - name: Commit verified non-workflow branch state
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --name-only | grep -q '^.github/workflows/'; then
            echo 'FAIL: workflow-file change unexpectedly staged'
            git diff --cached --name-only
            exit 1
          fi
          git commit -m 'fix: harden card classification generation and price isolation v328'
          git push origin HEAD:fix/card-metadata-market-v328
