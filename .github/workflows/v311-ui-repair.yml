name: V311 UI Repair

on:
  push:
    branches: [ui-v311-clean-polish]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ui-v311-clean-polish
          fetch-depth: 0
      - name: Apply payload and run focused UI tests
        shell: bash
        run: |
          python - <<'PY'
          import base64, re
          from pathlib import Path
          wf=Path('.github/workflows/v311-ui-bootstrap.yml').read_text(encoding='utf-8')
          m=re.search(r'V311_CSS_B64:\s*"([A-Za-z0-9+/=]+)"', wf)
          assert m, 'v311 payload missing'
          block=base64.b64decode(m.group(1)).decode('utf-8')
          p=Path('ui_app_shell_v272.css')
          text=p.read_text(encoding='utf-8')
          marker='/* v311 clean composition refinement.'
          if marker not in text:
              p.write_text(text.rstrip()+'\n'+block+'\n', encoding='utf-8')
          text=p.read_text(encoding='utf-8')
          assert marker in text
          assert text.count('{') == text.count('}')
          assert '--v311-primary:#2563eb' in text
          assert 'body .app-bottom-dock' in text
          assert '.feature-category[open]' in text
          PY
          python -m pip install -q pytest
          python -m pytest -q test_ui_app_shell_v272.py test_tablet_runtime_manifest_ui_assets_v254.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add ui_app_shell_v272.css
          if git diff --cached --quiet; then
            echo 'No CSS changes needed'
          else
            git commit -m 'ui: refine clean composition v311'
            git push origin HEAD:ui-v311-clean-polish
          fi
