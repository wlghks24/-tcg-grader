name: One-shot v238 PSA BGS official source probe

on:
  push:
    branches:
      - selfrefine/psa-bgs-official-source-v238
    paths:
      - '.github/workflows/v238-official-source-probe.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'
      - name: Probe official routes and safe runtime behavior
        run: |
          python - <<'PY'
          import json
          import urllib.error
          import urllib.request
          from urllib.parse import urljoin
          import grading_company_watch as watch

          URLS = [
              'https://www.psacard.com/services/tradingcardgrading',
              'https://www.psacard.com/services/t',
              'https://www.psacard.com/articles',
              'https://www.psacard.com/articles/articleview/15763',
              'https://www.psacard.com/ja-JP/services/tradingcardgrading/grading',
              'https://www.psacard.com/ja-JP/services/fees',
              'https://www.psacard.com/ja-JP/services',
              'https://www.psacard.com/ja-JP/articles',
              'https://www.beckett.com/grading',
              'https://beckett.com/grading',
              'https://www.beckett.com/grading/submit',
              'https://www.beckett.com/news/',
              'https://www.beckett.com/news/beckett-turnaround-time-updates/',
          ]

          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None

          opener = urllib.request.build_opener(NoRedirect)
          headers = {
              'User-Agent': watch.UA,
              'Accept-Language': 'ko-KR,ja-JP;q=0.9,en-US;q=0.8,en;q=0.7',
          }

          def raw_probe(url):
              current = url
              chain = []
              for _ in range(5):
                  req = urllib.request.Request(current, headers=headers)
                  try:
                      with opener.open(req, timeout=20) as r:
                          body = r.read(250000).decode('utf-8', 'ignore')
                          chain.append({'url': current, 'status': r.status, 'location': None, 'bytes': len(body), 'has_dollar': '$' in body, 'has_grading': 'grading' in body.lower()})
                          return chain
                  except urllib.error.HTTPError as exc:
                      loc = exc.headers.get('Location')
                      chain.append({'url': current, 'status': exc.code, 'location': loc})
                      if exc.code in (301, 302, 303, 307, 308) and loc:
                          current = urljoin(current, loc)
                          continue
                      return chain
                  except Exception as exc:
                      chain.append({'url': current, 'error': f'{type(exc).__name__}: {exc}'})
                      return chain
              return chain

          results = []
          for url in URLS:
              row = {'url': url, 'raw_chain': raw_probe(url)}
              try:
                  raw = watch._fetch_raw(url)
                  text = watch._text(raw)
                  row['safe'] = {'status': 'ok', 'bytes': len(raw), 'text_len': len(text), 'head': text[:240]}
              except Exception as exc:
                  row['safe'] = {'status': 'error', 'error': f'{type(exc).__name__}: {exc}'}
              results.append(row)
          print(json.dumps(results, ensure_ascii=False, indent=2))
          PY
