name: Repository Integrity Guard

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'
      - name: Install audited runtime test dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Run tracked repository integrity checks
        run: python repository_integrity_guard.py
      - name: Validate all tracked shell entrypoints
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' path; do
            bash -n -- "$path"
          done < <(git ls-files -z -- '*.sh' '*.command')
      - name: Validate all tracked JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' path; do
            node --check "$path"
          done < <(git ls-files -z -- '*.js')
      - name: Run defensive repository security audit
        run: python security_self_audit.py --no-memory --fail-on high
      - name: Verify security hardening is already applied
        run: python security_hardening_apply.py --check
      - name: Run cross-cutting SELFREFINE contracts
        run: python -m unittest -v test_security_self_audit.py test_security_hardening.py test_runtime_bundle_guard_v143.py test_verified_gap_priority_v11.py test_gap_result_event_supersession_v12.py test_repository_selfrefine_v13.py test_verified_multilabel_coverage_v14.py test_ocr_selfrefine_v15.py test_ocr_multistage_v16.py
      - name: Run grading vision 1-4-8 contracts
        run: |
          node verify_vision_runtime.js
          python verify_vision_calibration.py
          python -m unittest -v test_grading_hierarchy_v17.py test_verified_grade_learning_v135.py test_verified_grade_learning_v135_safe.py
      - name: Run Main vs Instagram SELFREFINE isolation contracts
        run: |
          python selfrefine_domain_boundary_guard.py
          python main_selfrefine_gate.py --self-test
          python main_crosscheck_export.py --self-test
          python -m instagram_tcg_content.crosscheck_export --self-test
          python selfrefine_crosscheck_gate.py --self-test
          python -m instagram_tcg_content.selfrefine_gate
          python -m unittest -v test_selfrefine_domain_isolation_v18.py test_main_selfrefine_state_isolation_v18.py instagram_tcg_content.test_state_isolation_v18 test_verified_code_repair_rules_v19.py test_selfrefine_error_quarantine_v20.py test_secure_self_modify_v21.py
          python verified_code_repair_rules.py --self-test
      - name: Run runtime delivery contracts
        run: python test_runtime_delivery_guards.py
