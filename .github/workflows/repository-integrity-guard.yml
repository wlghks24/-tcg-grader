name: Repository Integrity Guard

on:
  push:
    branches: [main]
    paths:
      - '**/*.py'
      - '**/*.sh'
      - '**/*.js'
      - '**/*.json'
      - '**/*.html'
      - '**/*.yml'
      - '**/*.yaml'
      - 'repository_integrity_guard.py'
      - '.github/workflows/repository-integrity-guard.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Run tracked repository integrity checks
        run: python repository_integrity_guard.py
      - name: Validate all tracked shell scripts
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' path; do
            bash -n -- "$path"
          done < <(git ls-files -z -- '*.sh')
      - name: Validate all tracked JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' path; do
            node --check "$path"
          done < <(git ls-files -z -- '*.js')
