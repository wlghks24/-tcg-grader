name: Repository Integrity Guard

on:
  push:
    branches: [main]
    paths:
      - '**/*.py'
      - '**/*.sh'
      - '**/*.js'
      - '**/*.json'
      - '**/*.html'
      - '**/*.yml'
      - '**/*.yaml'
      - 'repository_integrity_guard.py'
      - '.github/workflows/repository-integrity-guard.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.11'
      - name: Run tracked repository integrity checks
        run: python repository_integrity_guard.py
      - name: Validate all tracked shell scripts
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' path; do
            bash -n -- "$path"
          done < <(git ls-files -z -- '*.sh')
      - name: Validate all tracked JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' path; do
            node --check "$path"
          done < <(git ls-files -z -- '*.js')
