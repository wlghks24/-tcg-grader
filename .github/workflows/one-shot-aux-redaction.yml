name: One Shot Aux Error Redaction

on:
  push:
    branches: [main]
    paths:
      - 'ONE_SHOT_AUX_REDACTION.py'
      - '.github/workflows/one-shot-aux-redaction.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Apply remaining redaction patch
        run: |
          python -m py_compile ONE_SHOT_AUX_REDACTION.py
          python ONE_SHOT_AUX_REDACTION.py
      - name: Compile and verify source contracts
        run: |
          python -m py_compile auto_update_all.py
          python - <<'PY'
          from pathlib import Path
          source = Path('auto_update_all.py').read_text(encoding='utf-8')
          assert "msg=f'{type(exc).__name__}: {exc}'; errors.append(msg)" not in source
          assert 'msg=diagnostic_exception(exc,1200); errors.append(msg)' in source
          assert "errors=[auto_repair_engine.redact_sensitive(x,600) for x in (extra.get('errors') or [])" in source
          print('aux error redaction contracts: OK')
          PY
          git diff --check
      - name: Run tablet preflight
        env:
          TCG_FINAL_SKIP_HEAD_MATCH: '1'
        run: bash VERIFY_TABLET_FINAL.sh
      - name: Commit verified patch and remove one-shot files
        run: |
          git rm ONE_SHOT_AUX_REDACTION.py .github/workflows/one-shot-aux-redaction.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add auto_update_all.py
          git commit -m 'fix: redact auxiliary collector error reports'
          git pull --rebase origin main
          git push origin HEAD:main
