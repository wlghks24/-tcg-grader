name: Apply unified release history backfill
on:
  push:
    paths:
      - 'apply_release_history_backfill_patch.py'
      - 'release_history_backfill.py'
      - '.github/workflows/apply-release-history-backfill.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python apply_release_history_backfill_patch.py
      - run: python -m py_compile update_releases.py release_history_backfill.py
      - name: Commit integration
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add update_releases.py
          git diff --cached --quiet && exit 0
          git commit -m "feat: unify full release history backfill"
          git push
