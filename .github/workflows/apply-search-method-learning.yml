name: Apply adaptive search method routing

# Legacy integrated feature: automatic source mutation is disabled; run manually only.
on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write
  checks: read

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Apply patch
        run: |
          if grep -q 'SearchMethodLearner' multi_channel_agent.py; then
            echo 'Adaptive search routing already integrated; validation only'
          else
            python apply_search_method_learning_patch.py
            python apply_search_method_compat_patch.py
          fi
      - name: Verify syntax
        run: |
          python -m py_compile search_method_learning.py multi_channel_agent.py adaptive_collection_learner.py auto_pipeline_runner.py
      - name: Run focused tests
        run: |
          python -m unittest test_search_method_learning.py
          if [ -f test_adaptive_collection_learner.py ]; then python -m unittest test_adaptive_collection_learner.py; fi
      - name: Verify integration markers
        run: |
          grep -q 'SearchMethodLearner' multi_channel_agent.py
          grep -q 'bing_news_rss' multi_channel_agent.py
          grep -q 'google_news_broad' multi_channel_agent.py
          grep -q 'naver_news_html' multi_channel_agent.py
          grep -q 'search_method_health' multi_channel_agent.py
          grep -q '_normalize_once_result' multi_channel_agent.py
      - name: Commit integrated changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add multi_channel_agent.py .gitignore test_search_method_learning.py
          if ! git diff --cached --quiet; then
            git commit -m 'feat: integrate adaptive multi-method search routing'
            GH_TOKEN="${{ github.token }}" bash scripts/publish_candidate_pr.sh
          fi
