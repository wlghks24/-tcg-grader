name: Apply Collection Audit Fixes v214

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-collection-audit-fixes-v214.yml'

permissions:
  contents: write

jobs:
  patch-test-cleanup:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 2
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Apply bounded source repairs
        run: python apply_collection_audit_fixes_v214.py
      - name: Run targeted regressions
        run: |
          python -m py_compile feature_contract.py update_promo_events.py update_purchase_sources.py validate_external_links.py test_collection_scope_compat_v214.py
          python -m unittest -v test_collection_scope_compat_v214.py test_collector_recovery_v161.py test_social_event_topic_coverage.py test_social_topic_capacity_v213.py test_information_lifecycle_archive_v209.py
          python feature_contract.py
          python repository_integrity_guard.py
      - name: Commit verified repair and remove one-shot helpers
        shell: bash
        run: |
          set -euo pipefail
          rm -f apply_collection_audit_fixes_v214.py
          rm -f .github/workflows/apply-collection-audit-fixes-v214.yml
          git add -A
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: align expanded collection contract and retire dead Pokemon URLs'
          git push origin HEAD:main
