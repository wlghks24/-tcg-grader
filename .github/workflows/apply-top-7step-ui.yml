name: Apply top 7-step UI wording

on:
  push:
    branches: [main]
    paths:
      - 'apply_top_7step_ui_patch.py'
      - '.github/workflows/apply-top-7step-ui.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          fetch-depth: 0
      - name: Apply patch
        run: python apply_top_7step_ui_patch.py
      - name: Verify top 7-step wording
        run: |
          python - <<'PY'
          from pathlib import Path
          text=Path('index.html').read_text(encoding='utf-8')
          assert '환율·등급사진 7단계를 백그라운드에서 수집하고 있습니다.' in text
          assert '서버 백그라운드 7단계 수집 완료' in text
          assert '환율 6단계를 백그라운드에서 수집하고 있습니다.' not in text
          print('top 7-step wording verified')
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "fix: show 7-step collection in top update UI"
            git push origin main
          fi
