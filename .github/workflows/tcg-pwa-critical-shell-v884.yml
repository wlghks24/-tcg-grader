name: TCG PWA Critical Shell V884 Guard

on:
  pull_request:
    paths:
      - 'sw.js'
      - 'verify_service_worker_install_v884.js'
      - 'verify_service_worker_runtime.js'
      - 'test_runtime_hardening_v342.py'
      - '.github/workflows/tcg-pwa-critical-shell-v884.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  critical-shell:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: JavaScript syntax
        run: |
          node --check sw.js
          node --check verify_service_worker_install_v884.js
          node --check verify_service_worker_runtime.js
      - name: Real service-worker lifecycle negative regressions
        run: node verify_service_worker_install_v884.js
      - name: Reviewed V884 successor fail-closed proof
        run: python -m unittest discover -s execution/tests -p 'test_pwa_critical_shell_successor_v884.py' -v
      - name: Existing fetch and offline regressions
        run: node verify_service_worker_runtime.js
      - name: Existing v276/v342 compatibility regressions
        run: python -m unittest -v test_runtime_hardening_v342.py test_ui_version_coherence_v276.py test_tablet_app_dock_v275.py
