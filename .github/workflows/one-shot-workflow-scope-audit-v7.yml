name: One Shot Workflow Scope Audit V7

on:
  push:
    branches: [main]
    paths:
      - 'ONE_SHOT_WORKFLOW_SCOPE_AUDIT_V7.py'
      - '.github/workflows/one-shot-workflow-scope-audit-v7.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: workflow-scope-audit-v7-main
  cancel-in-progress: false

jobs:
  patch-verify-push:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.11'
      - name: Compile deterministic patcher
        run: python -m py_compile ONE_SHOT_WORKFLOW_SCOPE_AUDIT_V7.py
      - name: Apply workflow scope audit hardening
        run: python ONE_SHOT_WORKFLOW_SCOPE_AUDIT_V7.py
      - name: Compile patched security code
        run: python -m py_compile security_hardening_apply.py security_self_audit.py test_security_hardening.py
      - name: Run security regression suite
        run: python -m unittest -v test_security_hardening.py
      - name: Verify deterministic hardening is complete
        run: python security_hardening_apply.py --check
      - name: Run vulnerability audit
        run: python security_self_audit.py --fail-on medium
      - name: Run repository integrity guard
        run: python repository_integrity_guard.py
      - name: Run final tablet preflight
        env:
          TCG_FINAL_SKIP_HEAD_MATCH: '1'
        run: bash VERIFY_TABLET_FINAL.sh
      - name: Verify patch scope and commit
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import subprocess
          allowed={
              'security_hardening_apply.py',
              'security_self_audit.py',
              'test_security_hardening.py',
          }
          changed={line for line in subprocess.check_output(['git','diff','--name-only'], text=True).splitlines() if line}
          unexpected=changed-allowed
          assert not unexpected, f'unexpected changed files: {sorted(unexpected)}'
          assert changed, 'patcher made no source changes'
          print('verified patch scope:', sorted(changed))
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add security_hardening_apply.py security_self_audit.py test_security_hardening.py
          git commit -m 'security: audit quoted branch scopes and unscoped writes'
          git pull --rebase origin main
          git push origin HEAD:main
