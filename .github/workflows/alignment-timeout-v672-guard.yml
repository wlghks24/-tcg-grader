name: V672 Immutable Alignment Timeout Review

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: v672-timeout-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: Historical V659 CI Timeout and V672 Provenance
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      PYTHONPATH: ${{ github.workspace }}
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Verify historical V659 and exact V672 descendant
        run: |
          python -m unittest -v execution.tests.test_alignment_partitions_v659 execution.tests.test_alignment_timeout_successor_v672
