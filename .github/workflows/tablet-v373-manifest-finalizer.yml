name: Tablet V373 Manifest Finalizer

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: tablet-v373-manifest-finalizer-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  finalize:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'feature/tablet-autonomous-evolution-v373'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact PR head branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Verify expected base ancestry
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin +refs/heads/main:refs/remotes/origin/main
          base='24f7fa716d2f0300bd3d42645a279846f03ab53b'
          test "$(git rev-parse origin/main)" = "$base"
          git merge-base --is-ancestor "$base" HEAD

      - name: Commit one-shot workflow deletion locally
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -- .github/workflows/tablet-v373-manifest-finalizer.yml
          git diff --cached --check
          git commit -m 'chore: remove one-shot v373 manifest finalizer'

      - name: Build and verify exact final tree
        shell: bash
        run: |
          set -euo pipefail
          test ! -e .github/workflows/tablet-v373-manifest-finalizer.yml
          python static_integrity_manifest.py --write
          python static_integrity_manifest.py --check
          python repository_integrity_guard.py
          python tablet_autonomous_evolution_v373.py --self-test
          python -m unittest -v test_tablet_autonomous_evolution_v373.py test_tablet_gpt_tcg_grader_sync_v373.py test_tablet_gpt_tcg_grader_sync_v372.py
          python tablet_runtime_manifest.py --check --compile

      - name: Commit manifest and push exact final tree
        shell: bash
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          git add integrity_manifest.json
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git commit -m 'chore: finalize v373 exact-tree integrity manifest'
          fi
          python static_integrity_manifest.py --check
          git push origin "HEAD:refs/heads/${HEAD_REF}"