name: Finalize V377 Autonomy Now
on:
  push:
    branches: ['fix/tablet-autonomy-single-run-v377']
permissions:
  contents: write
concurrency:
  group: v377-finalize-now-${{ github.ref }}
  cancel-in-progress: true
jobs:
  finalize:
    if: github.actor == github.repository_owner
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Guard exact branch and main ancestry
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "fix/tablet-autonomy-single-run-v377"
          git fetch origin +refs/heads/main:refs/remotes/origin/main
          git merge-base --is-ancestor origin/main HEAD
          test "$(git rev-parse origin/main)" = "24cad558d756d57e06a8309c8d5fbc73626f1d45"
      - name: Enforce one heavy lane in V376 core
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('tablet_autonomous_evolution_v376.py')
          s=p.read_text(encoding='utf-8')
          old='''    operational = v375.v374.execute_operational_skill(selected, settled["plan"])
    safe_learning = v375.v374.v373.v372.execute_safe_learning(
        settled["plan"],
        state_path=state_path or (root / v375.v374.v373.v372.STATE_PATH.name),
        now=moment,
    )
'''
          new='''    recipe = str(selected.get("recipe") or "") if isinstance(selected, dict) else ""
    selected_learning = settled["plan"].get("selected_safe_learning_actions") if isinstance(settled.get("plan"), dict) else None
    has_learning = isinstance(selected_learning, list) and bool(selected_learning)
    operational_recipes = {"RECOVER_FRESHNESS", "EXPAND_REGION_COVERAGE", "RECOVER_SOURCE_HEALTH"}
    if recipe in operational_recipes:
        heavy_lane = "operational"
        operational = v375.v374.execute_operational_skill(selected, settled["plan"])
        safe_learning = {"status":"DEFERRED_HEAVY_LANE_OPERATIONAL","results":{},"state":{"status":"NOT_WRITTEN","written":False},"proposals_executed":False,"git_write":False,"source_code_modified":False}
    elif has_learning:
        heavy_lane = "safe_learning"
        operational = {"status":"DEFERRED_HEAVY_LANE_SAFE_LEARNING","executed":False,"verified":True,"recipe":recipe or None}
        safe_learning = v375.v374.v373.v372.execute_safe_learning(
            settled["plan"],
            state_path=state_path or (root / v375.v374.v373.v372.STATE_PATH.name),
            now=moment,
        )
    else:
        heavy_lane = "none"
        operational = v375.v374.execute_operational_skill(selected, settled["plan"]) if recipe == "OBSERVE_ONLY" else {"status":"NO_HEAVY_OPERATION","executed":False,"verified":True,"recipe":recipe or None}
        safe_learning = {"status":"NO_SAFE_LEARNING_ACTION","results":{},"state":{"status":"NOT_WRITTEN","written":False},"proposals_executed":False,"git_write":False,"source_code_modified":False}
    settled["heavy_lane"] = heavy_lane
'''
          if old not in s:
              if 'one_heavy_lane_arbiter_enforced' not in s:
                  raise SystemExit('V376 heavy-lane anchor not found')
          else:
              s=s.replace(old,new,1)
          anchor='    "market_direction_inferred": False,\n})'
          if '"one_heavy_lane_arbiter_enforced": True' not in s:
              if anchor not in s: raise SystemExit('V376 safety anchor not found')
              s=s.replace(anchor,'    "market_direction_inferred": False,\n    "one_heavy_lane_arbiter_enforced": True,\n})',1)
          p.write_text(s,encoding='utf-8')
          PY
          cat > test_tablet_autonomy_heavy_lane_v377.py <<'PY'
          import unittest
          from pathlib import Path
          import tablet_autonomous_evolution_v376 as autonomy
          import tablet_autonomous_evolution_v377 as guard

          class HeavyLaneV377Tests(unittest.TestCase):
              def test_v376_declares_single_heavy_lane(self):
                  self.assertTrue(autonomy.SAFETY["one_heavy_lane_arbiter_enforced"])
                  src=Path('tablet_autonomous_evolution_v376.py').read_text(encoding='utf-8')
                  self.assertIn('heavy_lane = "operational"',src)
                  self.assertIn('heavy_lane = "safe_learning"',src)
                  self.assertIn('DEFERRED_HEAVY_LANE_OPERATIONAL',src)
                  self.assertIn('DEFERRED_HEAVY_LANE_SAFE_LEARNING',src)
              def test_v377_preserves_fail_closed_lock(self):
                  self.assertTrue(guard.SAFETY["single_mutating_cycle_lock_required"])
                  self.assertTrue(guard.SAFETY["concurrent_mutating_cycle_fail_closed"])
                  self.assertFalse(guard.SAFETY["git_write"])
                  self.assertFalse(guard.SAFETY["verification_bypass"])
          if __name__=='__main__': unittest.main(verbosity=2)
          PY
          python -m py_compile tablet_autonomous_evolution_v376.py tablet_autonomous_evolution_v377.py test_tablet_autonomy_heavy_lane_v377.py
          python -m unittest -v test_tablet_autonomous_evolution_v376.py test_tablet_autonomous_evolution_v377.py test_tablet_autonomy_heavy_lane_v377.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tablet_autonomous_evolution_v376.py tablet_autonomous_evolution_v377.py test_tablet_autonomous_evolution_v377.py test_tablet_autonomy_heavy_lane_v377.py main tablet_runtime_manifest.py .gitignore
          if ! git diff --cached --quiet; then git commit -m 'fix: enforce serialized single-heavy-lane autonomy v377'; fi
          echo "CANDIDATE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Regenerate exact V377 sync generation
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json,os
          from datetime import datetime,timedelta,timezone
          from pathlib import Path
          base='24cad558d756d57e06a8309c8d5fbc73626f1d45'; candidate=os.environ['CANDIDATE_SHA']
          lessons=[
            {"lesson_id":"TABLET-GPT-SINGLE-RUN-AUTONOMY-GUARD-V377","subsystem":"tablet_gpt_autonomous_concurrency_control","issue_class":"concurrent_mutating_autonomy_cycles_can_duplicate_execution","trigger_condition":"multiple mutating evolve invocations overlap before transactional journal ownership is exclusive","prevention_rule":"acquire a non-blocking OS exclusive lock before V376; contention or unsafe lock fails closed without invoking V376 or writing shared state; planning-only remains read-only","validation_required":["supported evolve route uses V377","mutating cycles lock before V376","lock contention never invokes V376","physical Tablet and Drive remain unverified without external evidence"],"safety_boundary":"serialization does not widen autonomous permissions"},
            {"lesson_id":"TABLET-GPT-SINGLE-HEAVY-LANE-ARBITER-V377","subsystem":"tablet_gpt_autonomous_execution_budget","issue_class":"one_cycle_can_run_operational_recovery_and_model_learning_together","trigger_condition":"an operational recovery skill and safe-learning action are both eligible in one cycle","prevention_rule":"choose exactly one heavy lane per cycle: operational recovery or safe-learning; never both; preserve V376 transaction/evidence barriers and V377 serialization","validation_required":["operational recovery defers safe learning","safe-learning lane defers operational recovery","V376 journal remains transactional","source writes still require normal PR/CI"],"safety_boundary":"one heavy lane per cycle; no trust/fact/price/grade invention or source auto-write"}
          ]
          digest=hashlib.sha256(json.dumps(lessons,ensure_ascii=False,sort_keys=True,separators=(',',':')).encode()).hexdigest()
          now=datetime.now(timezone.utc).astimezone(timezone(timedelta(hours=9))).isoformat(timespec='seconds')
          prev=json.loads(Path('TCG_CROSSCHECK/TABLET_GPT_TCG_GRADER_SYNC_CONTRACT_V376.json').read_text(encoding='utf-8'))
          gen=['TCG_CROSSCHECK/TABLET_GPT_TCG_GRADER_SYNC_CONTRACT_V377.json','TCG_CROSSCHECK/TABLET_GPT/learning_snapshot_v377_delta.json','TCG_CROSSCHECK/TCG_GRADER/tablet_gpt_learning_receipt_v377.json','test_tablet_gpt_tcg_grader_sync_v377.py']
          delta={"schema_version":prev['schema_version'],"namespace":"TABLET_GPT","snapshot_kind":"learning_delta","run_date_kst":"2026-10-02","built_at":now,"status":"finalized","source_repository":"wlghks24/-tcg-grader","prior_delta":"TCG_CROSSCHECK/TABLET_GPT/learning_snapshot_v376_delta.json","prior_lesson_digest_sha256":"4ffc881e5a91de40d8ff5ce6a0ab174e6edae0469eabc0501d498fbd79feb66f","source_main_sha":base,"share_policy":{"explicit_patch_and_learning_lessons_only":True,"chatgpt_model_weights_exported":False,"raw_grading_calibration_shared":False,"device_local_runtime_memory_overwritten":False,"peer_verified_never_auto_promotes_local":True},"covered_merges":[{"pr":364,"version":"v377-autonomy-base","merge_sha":base}],"lesson_digest_sha256":digest,"lessons":lessons}
          required=list(prev['current_required_merge_prs']); required += [] if 364 in required else [364]
          c=json.loads(json.dumps(prev)); c.update({"purpose":"bind V377 serialized single-heavy-lane autonomy to exact current main while preserving all V376 fail-closed boundaries","prior_contract":"TCG_CROSSCHECK/TABLET_GPT_TCG_GRADER_SYNC_CONTRACT_V376.json","prior_delta_snapshot":"TCG_CROSSCHECK/TABLET_GPT/learning_snapshot_v376_delta.json","delta_snapshot":gen[1],"receiver_receipt":gen[2],"verification_test":gen[3],"current_required_merge_prs":required,"prior_required_lesson_count":69,"delta_required_lesson_count":2,"current_required_lesson_count":71})
          c['rules'].update({"single_mutating_cycle_lock_required":True,"concurrent_mutating_cycle_fail_closed":True,"concurrent_mutating_cycle_state_write_forbidden":True,"concurrent_mutating_cycle_execution_forbidden":True,"one_heavy_lane_arbiter_enforced":True,"closed_loop_max_one_heavy_operation_per_cycle":True})
          c['freshness_watch']['exclude_paths']=list(dict.fromkeys(c['freshness_watch']['exclude_paths']+gen))
          c['candidate_sync']={"base_main_sha":base,"candidate_commit":candidate,"watched_paths":["main","tablet_autonomous_evolution_v376.py","tablet_autonomous_evolution_v377.py","tablet_runtime_manifest.py"],"generation_files":gen,"requires_exact_watched_path_match":True,"post_merge_coverage_allowed":True}
          r={"schema_version":prev['schema_version'],"receiver":"TCG_GRADER","source_namespace":"TABLET_GPT","source_repository":"wlghks24/-tcg-grader","source_main_sha":base,"received_at":now,"status":"SYNCED_VERIFIED","source_snapshots":["TCG_CROSSCHECK/TABLET_GPT/learning_snapshot_v376_delta.json",gen[1]],"prior_lesson_digest_sha256":"4ffc881e5a91de40d8ff5ce6a0ab174e6edae0469eabc0501d498fbd79feb66f","delta_lesson_digest_sha256":digest,"accepted_lesson_ids":[x['lesson_id'] for x in lessons],"alignment_policy":{"same_digest_required":True,"same_lesson_ids_required":True,"same_source_main_required_for_delta":True,"covered_patch_commits_must_be_ancestors":True,"future_watched_main_changes_require_new_delta":True,"pull_request_freshness_check_nonblocking":False,"successor_generation_must_exactly_cover_prior_staleness":True,"device_local_learning_state_merge_required":True,"blind_overwrite_forbidden":True,"peer_verified_never_auto_promotes_local":True},"verification":{"contract_version":"v377","verification_test":gen[3],"verification_mode":"exact_candidate_serialized_single_heavy_lane","verified_result":"TABLET_GPT_TCG_GRADER_MATCH","physical_tablet_runtime_verified":False,"physical_drive_readback_verified":False,"device_reverification_required":True}}
          Path(gen[1]).write_text(json.dumps(delta,ensure_ascii=False,indent=2)+'\n',encoding='utf-8'); Path(gen[0]).write_text(json.dumps(c,ensure_ascii=False,indent=2)+'\n',encoding='utf-8'); Path(gen[2]).write_text(json.dumps(r,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          test=f'''import hashlib,json,unittest\nfrom pathlib import Path\nR=Path(__file__).resolve().parent\nC=R/{gen[0]!r}; D=R/{gen[1]!r}; Q=R/{gen[2]!r}\ndef load(p): return json.loads(p.read_text(encoding="utf-8"))\ndef dg(v): return hashlib.sha256(json.dumps(v,ensure_ascii=False,sort_keys=True,separators=(",", ":")).encode()).hexdigest()\nclass V377Sync(unittest.TestCase):\n def test_generation(self):\n  c,d,r=load(C),load(D),load(Q); self.assertEqual({base!r},d["source_main_sha"]); self.assertEqual({candidate!r},c["candidate_sync"]["candidate_commit"]); self.assertEqual(d["lesson_digest_sha256"],dg(d["lessons"])); self.assertEqual(d["lesson_digest_sha256"],r["delta_lesson_digest_sha256"]); self.assertEqual(2,len(d["lessons"])); self.assertEqual(71,c["current_required_lesson_count"]); self.assertFalse(r["verification"]["physical_tablet_runtime_verified"]); self.assertFalse(r["verification"]["physical_drive_readback_verified"])\n def test_safety(self):\n  c=load(C); [self.assertIs(c["rules"][k],True,k) for k in ("single_mutating_cycle_lock_required","concurrent_mutating_cycle_fail_closed","one_heavy_lane_arbiter_enforced","autonomous_git_write_forbidden","autonomous_verification_bypass_forbidden","autonomous_price_or_grade_invention_forbidden")]\nif __name__=="__main__": unittest.main(verbosity=2)\n'''
          Path(gen[3]).write_text(test,encoding='utf-8')
          PY
          python -m unittest -v test_tablet_autonomous_evolution_v377.py test_tablet_autonomy_heavy_lane_v377.py test_tablet_gpt_tcg_grader_sync_v377.py
          mapfile -t st < <(find . -maxdepth 1 -type f -name 'test_tablet_gpt_tcg_grader_sync_v*.py' -printf '%f\n' | sort -V); python -m unittest -v "${st[@]}"
          git add TCG_CROSSCHECK/TABLET_GPT_TCG_GRADER_SYNC_CONTRACT_V377.json TCG_CROSSCHECK/TABLET_GPT/learning_snapshot_v377_delta.json TCG_CROSSCHECK/TCG_GRADER/tablet_gpt_learning_receipt_v377.json test_tablet_gpt_tcg_grader_sync_v377.py
          git commit -m 'sync: finalize V377 serialized heavy-lane generation'
      - name: Remove one-shot workflow and rebuild final integrity
        shell: bash
        run: |
          set -euo pipefail
          git rm -- .github/workflows/v377-finalize-now.yml
          python static_integrity_manifest.py --write integrity_manifest.json
          python static_integrity_manifest.py --check integrity_manifest.json
          python fault_injection_healing.py --diagnose
          python repository_integrity_guard.py
          python tablet_runtime_manifest.py --check --compile
          git diff --check
          git add integrity_manifest.json .github/workflows/v377-finalize-now.yml
          git commit -m 'fix: reconcile V377 final-tree integrity'
          git push origin "HEAD:${GITHUB_REF_NAME}"
