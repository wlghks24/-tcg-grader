name: Apply runtime hardening v182

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-runtime-hardening-v182.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply v182 hardening
        run: python apply_runtime_hardening_v182.py
      - name: Validate v182 runtime
        run: |
          python test_runtime_resilience_v182.py
          python test_runtime_delivery_guards.py
          python -m py_compile safe_runtime.py tcg_updater.py tcg_updater_v135.py
          bash -n ANDROID_UPDATE_AND_START.sh
          bash -n ANDROID_AUTO_START_INSTALL.sh
          bash -n START_TCG_UPDATER_ANDROID.sh
          node --check sw.js
          node --check multi_market_prices.js
      - name: Commit code hardening
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add safe_runtime.py tcg_updater.py tcg_updater_v135.py
          git diff --cached --quiet && exit 0
          git commit -m 'fix: harden long-running tablet runtime v182'
          git push origin HEAD:main
