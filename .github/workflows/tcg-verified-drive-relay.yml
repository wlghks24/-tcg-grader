name: TCG Verified Drive Delivery Relay

on:
  workflow_run:
    workflows: ["GPT TCG Drive Package"]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  actions: read

concurrency:
  group: tcg-verified-drive-delivery-relay
  cancel-in-progress: false

jobs:
  deliver:
    # workflow_run gets privileged context: NEVER run artifact code or accept PR artifacts.
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.repository.full_name == github.repository &&
      github.event.workflow_run.event != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
      SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - name: Checkout reviewed current main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          persist-credentials: false
      - name: Install Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'
      - name: Reject stale or unexpected source commit
        id: source
        shell: bash
        run: |
          set -euo pipefail
          current="$(git rev-parse HEAD)"
          if [ "$SOURCE_SHA" != "$current" ]; then
            echo "::warning::HOLD: source SHA no longer matches reviewed main; no upload."
            echo "current=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "current=true" >> "$GITHUB_OUTPUT"
      - name: Retrieve producer artifact (not executable)
        if: steps.source.outputs.current == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .tcg_drive_relay_artifact
          gh run download "$SOURCE_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name tcg-gdrive-package --dir .tcg_drive_relay_artifact
      - name: Verify exact 17 JSON files and publish to Google Drive
        id: delivery
        if: steps.source.outputs.current == 'true'
        shell: bash
        env:
          TCG_RCLONE_CONFIG_B64: ${{ secrets.TCG_RCLONE_CONFIG_B64 }}
        run: |
          set -euo pipefail
          if [ -z "${TCG_RCLONE_CONFIG_B64:-}" ]; then
            echo "::warning::HOLD: GitHub secret TCG_RCLONE_CONFIG_B64 is not configured."
            echo "result=HOLD_MISSING_CREDENTIAL" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          sudo apt-get update -qq
          sudo apt-get install -y -qq rclone
          config="$(mktemp)"
          trap 'rm -f -- "$config"' EXIT
          chmod 600 "$config"
          printf '%s' "$TCG_RCLONE_CONFIG_B64" | base64 -d > "$config"
          export RCLONE_CONFIG="$config"
          python - <<'PY'
          import json
          import os
          import tempfile
          from pathlib import Path
          import tablet_gdrive_publish as pub
          import tablet_gdrive_sync as sync

          root = Path(".tcg_drive_relay_artifact")
          manifests = list(root.glob("manifest_*.json"))
          bundles = list(root.glob("TCG_VERIFIED_*.tar.gz"))
          if len(manifests) != 1 or len(bundles) != 1:
              raise SystemExit("HOLD: expected exactly one verified manifest/bundle pair")
          manifest = sync.load_manifest(manifests[0])
          if manifest["main_sha"] != os.environ["SOURCE_SHA"]:
              raise SystemExit("HOLD: artifact source SHA mismatch")
          if manifest["bundle"]["name"] != bundles[0].name:
              raise SystemExit("HOLD: artifact name mismatch")
          if len(manifest["files"]) != 17:
              raise SystemExit("HOLD: not an exact 17-JSON package")
          with tempfile.TemporaryDirectory(prefix="tcg-relay-verify-") as folder:
              stage = Path(folder)
              sync.extract_bundle(bundles[0], stage, manifest)
              for f in manifest["files"]:
                  if sync.sha256(stage / f["name"]) != f["sha256"]:
                      raise SystemExit("HOLD: JSON checksum mismatch")
          result = pub.upload_package(
              bundles[0], manifests[0], manifest,
              remote=os.environ.get("TCG_GDRIVE_REMOTE", sync.DEFAULT_REMOTE),
              remote_root=os.environ.get("TCG_GDRIVE_ROOT", sync.DEFAULT_REMOTE_ROOT))
          print(json.dumps({"result":"DRIVE_READBACK_VERIFIED",
                            "run_id":manifest["run_id"],
                            "retention":result.get("status")},
                           ensure_ascii=False))
          PY
          echo "result=DRIVE_READBACK_VERIFIED" >> "$GITHUB_OUTPUT"
      - name: Record honest delivery state
        if: always()
        shell: bash
        env:
          SOURCE_OK: ${{ steps.source.outputs.current }}
          DELIVERY: ${{ steps.delivery.outputs.result }}
        run: |
          {
            echo "## TCG verified Drive delivery relay"
            echo
            echo "- reviewed main SHA still current: ${SOURCE_OK:-no}"
            echo "- Drive result: ${DELIVERY:-NOT_PUBLISHED}"
            echo "- tablet applied: NOT_VERIFIED; requires valid device receipt"
          } >> "$GITHUB_STEP_SUMMARY"
