name: Temporary Source Patch v230

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/temporary-source-patch-v230.yml'

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 2
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'
      - name: Apply verified source patches
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'expected patch anchor missing: {path}')
              if text.count(old) != 1:
                  raise SystemExit(f'patch anchor not unique: {path}: {text.count(old)}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          replace_once(
              'collection_verification_gate.py',
              '''from urllib.parse import urlparse\n\nROOT = Path(__file__).resolve().parent\nMANDATORY_OUTPUT_FILES = (\n    "releases.json",\n    "market_watch.json",\n    "market_prices.json",\n    "promo_events.json",\n    "purchase_sources.json",\n    "exchange_rates.json",\n    "grading_company_updates.json",\n    "graded_photo_candidates.json",\n)\n''',
              '''from urllib.parse import urlparse\n\nimport auto_update_all\n\nROOT = Path(__file__).resolve().parent\n# Single source of truth: collection verification must follow every mandatory output\n# registered by the production collector. A ninth collector cannot silently bypass this gate.\nMANDATORY_OUTPUT_FILES = tuple(job[2] for job in auto_update_all.JOBS)\n'''
          )
          replace_once(
              'collection_verification_gate.py',
              '''TRANSIENT_RE = re.compile(r"HTTPError: status (?:408|425|429|5(?:00|02|03|04))\\b|URLError|TimeoutError|timed out|connection reset|name resolution|DNS", re.I)''',
              '''TRANSIENT_RE = re.compile(r"HTTPError: status (?:408|425|429|5(?:00|02|03|04))\\b|URLError|TimeoutError|IncompleteRead|RemoteDisconnected|HTTPException|timed out|connection reset|name resolution|DNS", re.I)'''
          )
          replace_once(
              'collection_verification_gate.py',
              '''        errors = [str(x)[:300] for x in (row.get("remaining_collection_errors") or [])]\n        blocked = [x for x in errors if HTTP_BLOCK_RE.search(x)]\n        hard = [x for x in errors if not TRANSIENT_RE.search(x)]\n        if row.get("ok") is not True and hard:\n            findings.append({"severity": "critical", "code": "HARD_COLLECTION_FAILURE", "target": filename, "errors": hard[:5]})\n        elif row.get("ok") is not True or errors:\n            findings.append({"severity": "high", "code": "DEGRADED_COLLECTION_OUTPUT", "target": filename, "blocked_403_429": len(blocked), "errors": errors[:5]})''',
              '''        remaining = [str(x)[:300] for x in (row.get("remaining_collection_errors") or []) if str(x).strip()]\n        historical = [str(x)[:300] for x in (row.get("collection_errors") or []) if str(x).strip()]\n        primary_error = str(row.get("error") or "").strip()[:300]\n        evidence = list(dict.fromkeys(remaining + historical + ([primary_error] if primary_error else [])))\n        status_text = str(row.get("status") or "")\n        restored = "기존 검증자료 유지" in status_text\n        recovered = row.get("recovered_after_retry") is True or row.get("recovered_after_deferred_timeout") is True\n        cooldown = row.get("cooldown_deferred") is True\n        degraded_evidence = bool(evidence or restored or recovered or cooldown)\n        # Only unresolved errors on a failed row can become a hard failure. A successful\n        # retry remains degraded evidence, while a last-good restore can never masquerade\n        # as a fresh success merely because the preserved JSON is structurally valid.\n        active_errors = remaining or (([primary_error] if primary_error else historical) if row.get("ok") is not True else [])\n        blocked = [x for x in evidence if HTTP_BLOCK_RE.search(x)]\n        hard = [x for x in active_errors if not TRANSIENT_RE.search(x)]\n        if row.get("ok") is not True and hard:\n            findings.append({"severity": "critical", "code": "HARD_COLLECTION_FAILURE", "target": filename, "errors": hard[:5]})\n        elif row.get("ok") is not True or degraded_evidence:\n            findings.append({"severity": "high", "code": "DEGRADED_COLLECTION_OUTPUT", "target": filename,\n                             "blocked_403_429": len(blocked), "errors": evidence[:5],\n                             "restored_last_good": restored, "recovered_after_retry": recovered,\n                             "cooldown_deferred": cooldown})'''
          )

          replace_once(
              'release_history_backfill.py',
              '''def run(fetch, html_to_text, collect_onepiece_kr, collect_onepiece_jp, collect_onepiece_us, collect_naruto):\n''',
              '''def _coverage_basis(current_items):\n    """Return unique current + persisted verified release rows for coverage accounting.\n\n    Backfill collectors are intentionally bounded per run. Coverage must therefore be\n    cumulative, otherwise a cell already present in the append-only release history can\n    be falsely reported as missing when that region yields zero rows in this one run.\n    """\n    rows = []\n    persisted = ROOT / "releases.json"\n    try:\n        existing = json.loads(safe_read_text(persisted, max_bytes=8_000_000)) if persisted.exists() else {}\n    except (OSError, ValueError, TypeError, UnicodeError):\n        existing = {}\n    if isinstance(existing, dict):\n        for key in ("items", "archive_items"):\n            value = existing.get(key)\n            if isinstance(value, list):\n                rows.extend(row for row in value if isinstance(row, dict))\n    rows.extend(row for row in (current_items or []) if isinstance(row, dict))\n\n    out, seen = [], set()\n    for row in rows:\n        key = (\n            row.get("game"), row.get("region"), _norm(row.get("name")).casefold(),\n            row.get("release_date"), row.get("release_window"), row.get("source"),\n        )\n        if key in seen:\n            continue\n        seen.add(key)\n        out.append(row)\n    return out\n\n\ndef run(fetch, html_to_text, collect_onepiece_kr, collect_onepiece_jp, collect_onepiece_us, collect_naruto):\n'''
          )
          replace_once(
              'release_history_backfill.py',
              '''    matrix = coverage_progress(items)\n    state["coverage_matrix"] = matrix\n''',
              '''    matrix = coverage_progress(_coverage_basis(items))\n    matrix["coverage_scope"] = "current_run_plus_persisted_verified_history"\n    state["coverage_matrix"] = matrix\n'''
          )
          replace_once('auto_update_all.py', '서로 다른 JSON을 갱신하는 6개 수집기를 제한된 병렬로 실행해 전체 시간을 단축한다.', '서로 다른 JSON을 갱신하는 8개 수집기를 제한된 병렬로 실행해 전체 시간을 단축한다.')
          replace_once('auto_update_all.py', '# 화면/보고서에서는 원래 1~6 단계 순서를 유지한다.', '# 화면/보고서에서는 등록된 1~8 수집기 순서를 유지한다.')

          Path('test_collection_restored_state_guard_v229.py').write_text('''from __future__ import annotations\n\nimport json\nimport tempfile\nimport unittest\nfrom pathlib import Path\n\nimport auto_update_all\nimport collection_verification_gate as gate\n\n\nclass CollectionRestoredStateGuardTests(unittest.TestCase):\n    def _rows(self):\n        return [{"file": name, "ok": True, "remaining_collection_errors": []} for name in gate.MANDATORY_OUTPUT_FILES]\n\n    def _audit(self, rows):\n        with tempfile.TemporaryDirectory() as tmp:\n            root = Path(tmp)\n            (root / "auto_update_report.json").write_text(json.dumps({"results": rows}, ensure_ascii=False), encoding="utf-8")\n            findings = []\n            metrics = gate._audit_auto_update(root, findings)\n        return metrics, findings\n\n    def test_mandatory_outputs_are_production_job_ssot(self):\n        self.assertEqual(tuple(job[2] for job in auto_update_all.JOBS), gate.MANDATORY_OUTPUT_FILES)\n        self.assertEqual(8, len(gate.MANDATORY_OUTPUT_FILES))\n\n    def test_valid_last_good_restore_is_still_degraded(self):\n        rows = self._rows()\n        idx = next(i for i, row in enumerate(rows) if row["file"] == "market_prices.json")\n        rows[idx] = {\n            "file": "market_prices.json", "ok": True,\n            "status": "공식 출처 지연 · 기존 검증자료 유지 · 실패 항목만 재수집 가능",\n            "error": "IncompleteRead(0 bytes read)",\n            "collection_errors": ["IncompleteRead(0 bytes read)"],\n        }\n        _, findings = self._audit(rows)\n        finding = next(x for x in findings if x["target"] == "market_prices.json")\n        self.assertEqual("DEGRADED_COLLECTION_OUTPUT", finding["code"])\n        self.assertTrue(finding["restored_last_good"])\n\n    def test_success_after_retry_is_not_misreported_as_clean(self):\n        rows = self._rows()\n        rows[0] = {\n            "file": "releases.json", "ok": True, "recovered_after_retry": True,\n            "collection_errors": ["URLError: connection reset"], "remaining_collection_errors": [],\n        }\n        _, findings = self._audit(rows)\n        finding = next(x for x in findings if x["target"] == "releases.json")\n        self.assertEqual("DEGRADED_COLLECTION_OUTPUT", finding["code"])\n        self.assertTrue(finding["recovered_after_retry"])\n\n\nif __name__ == "__main__":\n    unittest.main()\n''', encoding='utf-8')

          Path('test_release_history_cumulative_coverage_v229.py').write_text('''from __future__ import annotations\n\nimport json\nimport tempfile\nimport unittest\nfrom pathlib import Path\n\nimport release_history_backfill as backfill\n\n\nclass ReleaseHistoryCumulativeCoverageTests(unittest.TestCase):\n    def test_persisted_verified_cell_is_not_falsely_reported_missing(self):\n        old_root = backfill.ROOT\n        with tempfile.TemporaryDirectory() as tmp:\n            root = Path(tmp)\n            backfill.ROOT = root\n            try:\n                (root / "releases.json").write_text(json.dumps({\n                    "items": [],\n                    "archive_items": [{\n                        "game": "Pokémon", "region": "JP", "name": "既存パック",\n                        "release_date": "2024-07-19",\n                        "source": "https://www.pokemon-card.com/products/",\n                    }],\n                }, ensure_ascii=False), encoding="utf-8")\n                current = [{\n                    "game": "ONE PIECE", "region": "KR", "name": "현재 덱",\n                    "release_date": "2026-09-18", "source": "https://onepiece-cardgame.kr/products.do",\n                }]\n                progress = backfill.coverage_progress(backfill._coverage_basis(current))\n            finally:\n                backfill.ROOT = old_root\n        self.assertGreater(progress["cells"]["Pokémon/JP"]["verified_rows"], 0)\n        self.assertGreater(progress["cells"]["ONE PIECE/KR"]["verified_rows"], 0)\n        self.assertNotIn("Pokémon/JP", progress["missing_verified_cells"])\n        self.assertIn("NARUTO/KR", progress["missing_verified_cells"])\n\n\nif __name__ == "__main__":\n    unittest.main()\n''', encoding='utf-8')
          PY
      - name: Verify patched contracts
        run: |
          python -m py_compile collection_verification_gate.py release_history_backfill.py auto_update_all.py \
            test_collection_restored_state_guard_v229.py test_release_history_cumulative_coverage_v229.py
          python -m unittest -v \
            test_collection_verification_gate.py \
            test_collection_restored_state_guard_v229.py \
            test_release_history_coverage_v4.py \
            test_release_history_cumulative_coverage_v229.py \
            test_market_public_crosscheck_resilience_v228.py \
            test_static_data_publish_gate.py
      - name: Commit verified source patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add collection_verification_gate.py release_history_backfill.py auto_update_all.py \
            test_collection_restored_state_guard_v229.py test_release_history_cumulative_coverage_v229.py
          git diff --cached --check
          git commit -m 'fix: align cumulative coverage and restored-state verification'
          git push origin HEAD:main
