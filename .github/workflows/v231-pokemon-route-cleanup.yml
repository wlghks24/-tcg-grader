name: One-shot v231 Pokemon route cleanup

"on":
  push:
    branches:
      - "selfrefine/fix-8stage-ssot-v230"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout bounded target branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: selfrefine/fix-8stage-ssot-v230
          fetch-depth: 0

      - name: Install repository requirements
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Apply SHA-guarded cleanup
        run: python v231_cleanup.py

      - name: Validate targeted contracts
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile multi_route_event_discovery.py social_event_discovery.py validate_external_links.py tcg_updater.py update_promo_events.py
          python -m unittest -v test_collection_scope_compat_v214.py test_0600_operational_refresh_v25.py test_runtime_bundle_guard_v143.py test_multi_route_event_discovery.py test_social_event_topic_coverage.py
          python test_link_audit_hardening_v184.py
          git diff --check

      - name: Commit bounded fix and remove one-shot files
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/v231-pokemon-route-cleanup.yml v231_cleanup.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add multi_route_event_discovery.py social_event_discovery.py validate_external_links.py tcg_updater.py test_0600_operational_refresh_v25.py test_collection_scope_compat_v214.py .github/workflows/v231-pokemon-route-cleanup.yml v231_cleanup.py
          git diff --cached --check
          git commit -m "fix: finish Pokemon KR route migration and 8-stage idle SSOT"
          git push origin HEAD:selfrefine/fix-8stage-ssot-v230
