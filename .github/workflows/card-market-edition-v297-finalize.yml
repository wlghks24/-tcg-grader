name: Card market edition v297 finalize

on:
  push:
    branches:
      - audit/card-market-edition-evidence-v297

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'
      - name: Apply bounded production patch
        run: python apply_card_market_edition_v297.py
      - name: Syntax and focused card-core regression
        run: |
          node --check grade_market_flow.js
          python -m py_compile test_card_market_edition_v297.py test_card_core_crosscheck_v291.py test_card_core_crosscheck_v292.py test_card_core_crosscheck_v295.py test_card_core_provenance_v296.py
          python -m unittest -v test_card_market_edition_v297.py test_card_core_crosscheck_v291.py test_card_core_crosscheck_v292.py test_card_core_crosscheck_v295.py test_card_core_provenance_v296.py test_psa_probability_market_flow_v252.py test_wyyyes_market_source_v267.py
          node verify_pokemon_generation_runtime.js
      - name: Preserve historical grading parity
        run: |
          python verify_grading_accuracy_v99.py
          python verify_grading_cross_runtime_v99.py
      - name: Remove transient applicator and workflow
        run: |
          rm -f apply_card_market_edition_v297.py
          rm -f .github/workflows/card-market-edition-v297-finalize.yml
      - name: Regenerate and diagnose final integrity tree
        run: |
          python fault_injection_healing.py --manifest
          python fault_injection_healing.py --diagnose
      - name: Commit only verified final files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- grade_market_flow.js test_card_market_edition_v297.py integrity_manifest.json
          git rm --cached --ignore-unmatch apply_card_market_edition_v297.py .github/workflows/card-market-edition-v297-finalize.yml || true
          git diff --cached --check
          git status --short
          git commit -m 'Fail closed unknown market editions for known cards (v297)'
          git push origin HEAD:audit/card-market-edition-evidence-v297
