name: Graded sample strict verification regression

on:
  pull_request:
    paths:
      - grading_self_learning.py
      - test_grading_self_learning.py
      - .github/workflows/grade-verified-regression.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  strict-verified:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout review head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Compile reviewed module
        run: python -m py_compile grading_self_learning.py test_grading_self_learning.py
      - name: Grading calibration regression tests
        run: python -m unittest -v test_grading_self_learning.py
