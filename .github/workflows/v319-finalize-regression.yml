name: V319 Finalize Regression

on:
  push:
    branches: ['fix/card-region-label-alias-v319']
    paths:
      - 'test_ui_version_coherence_v276.py'
      - 'test_tablet_app_dock_v275.py'
      - '.github/workflows/v319-finalize-regression.yml'

permissions:
  contents: write

concurrency:
  group: v319-finalize-regression
  cancel-in-progress: true

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/card-region-label-alias-v319
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Install verification dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Verify repaired semantic cache regressions
        run: |
          python -m unittest -v test_ui_version_coherence_v276.py test_tablet_app_dock_v275.py
          python -m unittest -v test_card_region_label_alias_v319.py test_card_region_conflict_failclosed_v318.py
          python test_runtime_delivery_guards.py
      - name: Remove finalizer and refresh final-tree integrity
        run: |
          git rm -f .github/workflows/v319-finalize-regression.yml
          python - <<'PY'
          from pathlib import Path
          from fault_injection_healing import build_integrity_manifest, diagnose_integrity
          root=Path('.').resolve()
          manifest=root/'integrity_manifest.json'
          build_integrity_manifest(root, manifest)
          result=diagnose_integrity(root, manifest)
          if not result.get('ok'):
              raise SystemExit(result)
          print('v319 final integrity: PASS')
          PY
          git diff --check
      - name: Commit final verified tree
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'test: preserve cache rotation semantics for v319'
          git push origin HEAD:fix/card-region-label-alias-v319
