name: Apply graded photo cumulative patch

on:
  push:
    paths:
      - 'apply_graded_photo_cumulative_patch.py'
      - '.github/workflows/apply-graded-photo-cumulative-patch.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Apply patch
        run: |
          if grep -q "previous_payload=_load(OUT,{})" graded_photo_multi_source.py; then
            echo 'Cumulative candidate preservation already integrated; validation only'
          else
            python apply_graded_photo_cumulative_patch.py
          fi
      - name: Validate syntax
        run: python -m py_compile graded_photo_multi_source.py
      - name: Commit
        run: |
          if git diff --quiet -- graded_photo_multi_source.py; then
            echo 'No changes needed'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add graded_photo_multi_source.py
          git commit -m 'fix: preserve cumulative graded photo candidates'
          git push origin main
