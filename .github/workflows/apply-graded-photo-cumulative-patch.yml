name: Apply graded photo cumulative patch

on:
  push:
    paths:
      - 'apply_graded_photo_cumulative_patch.py'
      - '.github/workflows/apply-graded-photo-cumulative-patch.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply patch
        run: python apply_graded_photo_cumulative_patch.py
      - name: Validate syntax
        run: python -m py_compile graded_photo_multi_source.py
      - name: Commit
        run: |
          if git diff --quiet -- graded_photo_multi_source.py; then
            echo 'No changes needed'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add graded_photo_multi_source.py
          git commit -m 'fix: preserve cumulative graded photo candidates'
          git push origin main
