name: Apply graded photo cumulative patch

# Legacy integrated feature: automatic source mutation is disabled; run manually only.
on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write
  checks: read

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Apply patch
        run: |
          if grep -q "previous_payload=_load(OUT,{})" graded_photo_multi_source.py; then
            echo 'Cumulative candidate preservation already integrated; validation only'
          else
            python apply_graded_photo_cumulative_patch.py
          fi
      - name: Validate syntax
        run: python -m py_compile graded_photo_multi_source.py
      - name: Commit
        run: |
          if git diff --quiet -- graded_photo_multi_source.py; then
            echo 'No changes needed'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add graded_photo_multi_source.py
          git commit -m 'fix: preserve cumulative graded photo candidates'
          GH_TOKEN="${{ github.token }}" bash scripts/publish_candidate_pr.sh
