name: Finalize Legacy Expectations v215

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/finalize-legacy-expectations-v215.yml'

permissions:
  contents: write

concurrency:
  group: finalize-legacy-expectations-v215-main
  cancel-in-progress: true

jobs:
  patch-and-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 3

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'

      - name: Update stale regression expectations
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          p=Path('test_0600_operational_refresh_v25.py')
          text=p.read_text(encoding='utf-8')
          old='''            "https://pokemonkorea.co.kr/2026_battle_tournament3/menu800",\n        )'''
          new='''            "https://new.pokemonkorea.co.kr/card",\n        )'''
          if old not in text:
              raise SystemExit('stale pokemon expectation not found exactly')
          p.write_text(text.replace(old,new,1),encoding='utf-8')

          p=Path('test_graded_photo_runtime.py')
          text=p.read_text(encoding='utf-8')
          old="        self.assertEqual(payload['engine'],'v123-verified-multisource-photo-collection')\n        self.assertEqual(payload['summary']['raw_grade_calibration_eligible'],0)"
          new="        self.assertRegex(payload['engine'],r'^v[0-9]+-[a-z0-9-]+-collection$')\n        self.assertGreaterEqual(int(payload.get('schema_version',0)),8)\n        self.assertEqual(payload['summary']['raw_grade_calibration_eligible'],0)"
          if old not in text:
              raise SystemExit('stale graded-photo engine expectation not found exactly')
          p.write_text(text.replace(old,new,1),encoding='utf-8')
          PY

      - name: Verify targeted regressions
        run: |
          python -m py_compile test_0600_operational_refresh_v25.py test_graded_photo_runtime.py
          python -m unittest -v test_0600_operational_refresh_v25.py test_graded_photo_runtime.py

      - name: Commit patch, rebase clean commit, and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -- .github/workflows/finalize-legacy-expectations-v215.yml
          git add -- test_0600_operational_refresh_v25.py test_graded_photo_runtime.py
          git commit -m 'test: align legacy expectations with current runtime'
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
