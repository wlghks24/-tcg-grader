name: Exhaustive SELFREFINE Guard

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - '*.py'
      - '*.js'
      - '*.sh'
      - '*.json'
      - '*.webmanifest'
      - 'index.html'
      - 'sw.js'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: exhaustive-selfrefine-${{ github.ref }}
  cancel-in-progress: true

jobs:
  exhaustive:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Install all test dependencies
        run: |
          python -m pip install --disable-pip-version-check -r requirements.txt
          python -m pip install --disable-pip-version-check pyyaml
      - name: Audit external GitHub Actions are SHA pinned
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          bad=[]
          total=0
          for path in sorted(Path('.github/workflows').glob('*.y*ml')):
              for lineno,line in enumerate(path.read_text(encoding='utf-8-sig').splitlines(),1):
                  m=re.match(r'\s*-\s*uses:\s*([^#\s]+)',line)
                  if not m:
                      continue
                  spec=m.group(1)
                  total+=1
                  if spec.startswith('./') or spec.startswith('docker://'):
                      continue
                  ref=spec.rsplit('@',1)[1] if '@' in spec else ''
                  if not re.fullmatch(r'[0-9a-fA-F]{40}',ref):
                      bad.append((str(path),lineno,spec))
          print(f'external/local action uses checked: {total}')
          for row in bad:
              print('UNPINNED',*row)
          if bad:
              raise SystemExit(f'unpinned external actions: {len(bad)}')
          PY
      - name: Detect duplicate top-level definitions in active runtime modules
        run: |
          python - <<'PY'
          import ast
          from collections import Counter
          from pathlib import Path
          active=[
              'tcg_updater.py','safe_runtime.py','auto_update_all.py',
              'adaptive_collection_learner.py','collector_self_healing.py',
              'tcg_code_repair_learning.py','social_event_discovery.py',
              'multi_route_event_discovery.py','event_gap_learning.py',
              'repository_integrity_guard.py','security_self_audit.py',
              'validate_external_links.py','library_slab_corpus.py'
          ]
          failures=[]
          for name in active:
              path=Path(name)
              tree=ast.parse(path.read_text(encoding='utf-8-sig'),filename=name)
              defs=[node.name for node in tree.body if isinstance(node,(ast.FunctionDef,ast.AsyncFunctionDef,ast.ClassDef))]
              duplicates=[key for key,count in Counter(defs).items() if count>1]
              print(name,'definitions',len(defs),'duplicates',duplicates)
              if duplicates:
                  failures.append((name,duplicates))
          if failures:
              raise SystemExit(f'duplicate active definitions: {failures}')
          PY
      - name: Run all Python unit tests discovered from repository root
        env:
          TCG_REQUIRE_NODE: '1'
        run: |
          python -m unittest discover -v -p 'test_*.py'
      - name: Re-run current release, runtime, tablet and security gates
        env:
          TCG_REQUIRE_NODE: '1'
        run: |
          python verify_all.py
          python verify_v107_runtime_integration.py
          node verify_browser_runtime.js
          node verify_camera_runtime.js
          node verify_service_worker_runtime.js
          node verify_vision_runtime.js
          python verify_link_runtime.py
          python verify_card_identity_recognition.py
          TCG_FINAL_SKIP_HEAD_MATCH=1 bash VERIFY_TABLET_FINAL.sh
          python security_self_audit.py --fail-on medium
          python main_selfrefine_gate.py
