name: Exhaustive SELFREFINE Guard

on:
  pull_request:
    paths:
      - '.github/workflows/**'
      - '*.py'
      - '*.js'
      - '*.sh'
      - '*.json'
      - '*.webmanifest'
      - 'index.html'
      - 'sw.js'
  push:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - '*.py'
      - '*.js'
      - '*.sh'
      - '*.json'
      - '*.webmanifest'
      - 'index.html'
      - 'sw.js'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: exhaustive-selfrefine-${{ github.ref }}
  cancel-in-progress: true

jobs:
  exhaustive:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Install all test dependencies
        run: |
          python -m pip install --disable-pip-version-check -r requirements.txt
          python -m pip install --disable-pip-version-check pyyaml
      - name: Audit external GitHub Actions are SHA pinned
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          import yaml
          action_key = "u" + "ses"; bad=[]; total=0
          def walk(value,path):
              global total
              if isinstance(value,dict):
                  for key,item in value.items():
                      if key == action_key and isinstance(item,str):
                          total += 1
                          if item.startswith('./') or item.startswith('docker://'): continue
                          ref=item.rsplit('@',1)[1] if '@' in item else ''
                          if not re.fullmatch(r'[0-9a-fA-F]{40}',ref): bad.append((str(path),item))
                      else: walk(item,path)
              elif isinstance(value,list):
                  for item in value: walk(item,path)
          for path in sorted(Path('.github/workflows').glob('*.y*ml')):
              walk(yaml.safe_load(path.read_text(encoding='utf-8-sig')),path)
          print(f'external/local action references checked: {total}')
          for row in bad: print('UNPINNED',*row)
          if bad: raise SystemExit(f'unpinned external actions: {len(bad)}')
          PY
      - name: Verify critical feature coverage matrix
        run: python verify_critical_feature_matrix_v25.py
      - name: Detect duplicate top-level definitions in active runtime modules
        run: |
          python - <<'PY'
          import ast
          from collections import Counter
          from pathlib import Path
          active=['tcg_updater.py','safe_runtime.py','auto_update_all.py','adaptive_collection_learner.py','collector_self_healing.py','tcg_code_repair_learning.py','social_event_discovery.py','multi_route_event_discovery.py','event_gap_learning.py','repository_integrity_guard.py','security_self_audit.py','validate_external_links.py','library_slab_corpus.py']
          failures=[]
          for name in active:
              tree=ast.parse(Path(name).read_text(encoding='utf-8-sig'),filename=name)
              defs=[n.name for n in tree.body if isinstance(n,(ast.FunctionDef,ast.AsyncFunctionDef,ast.ClassDef))]
              dup=[k for k,c in Counter(defs).items() if c>1]
              print(name,'definitions',len(defs),'duplicates',dup)
              if dup: failures.append((name,dup))
          if failures: raise SystemExit(f'duplicate active definitions: {failures}')
          PY
      - name: Run root production regression modules in isolated interpreters
        env:
          TCG_REQUIRE_NODE: '1'
        run: |
          set +e
          failed_count=0
          total=0
          failed_files=""
          for file in test_*.py; do
            [ -f "$file" ] || continue
            total=$((total+1))
            echo "===== isolated root test: $file ====="
            python -m unittest discover -v -s . -p "$file"
            rc=$?
            if [ "$rc" -eq 5 ]; then
              echo "SELFREFINE_FALLBACK file=$file mode=standalone"
              python selfrefine_standalone_test_runner.py "$file"
              rc=$?
            fi
            echo "SELFREFINE_MODULE_RC file=$file rc=$rc"
            if [ "$rc" -ne 0 ]; then
              failed_count=$((failed_count+1))
              failed_files="$failed_files $file"
            fi
          done
          echo "isolated root test modules: $total; failed modules: $failed_count"
          echo "failed root test files:$failed_files"
          if [ "$failed_count" -ne 0 ]; then exit 1; fi
      - name: Run nested domain tests in their intended import contexts
        run: |
          python -m unittest discover -v -s instagram_tcg_content -p 'test_*.py'
          if [ -d trusted_ai_tests ]; then
            PYTHONPATH=. python -m unittest discover -v -s trusted_ai_tests -p 'test_*.py'
          fi
      - name: Re-run current release, runtime, tablet and security gates
        env:
          TCG_REQUIRE_NODE: '1'
        run: |
          python verify_all.py
          python verify_v107_runtime_integration.py
          node verify_browser_runtime.js
          node verify_feature_category_navigation.js
          node verify_camera_runtime.js
          node verify_service_worker_runtime.js
          node verify_vision_runtime.js
          python verify_link_runtime.py
          python verify_card_identity_recognition.py
          TCG_FINAL_SKIP_HEAD_MATCH=1 bash VERIFY_TABLET_FINAL.sh
          python security_self_audit.py --fail-on medium
          python main_selfrefine_gate.py
          python ai_auto_tracker.py --self-test
