name: Card Identity Precision v320

on:
  push:
    branches: [fix/card-identity-precision-v320]

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout audit branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/card-identity-precision-v320
          fetch-depth: 0

      - name: Apply and validate card identity precision hardening
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python -m pip install --disable-pip-version-check pillow
          python .github/scripts/card_identity_precision_v320_fixup.py
          python .github/scripts/card_identity_precision_v320.py
          python .github/scripts/card_identity_precision_v320_postfix.py
          git rm -f .github/scripts/card_identity_precision_v320.py
          git rm .github/scripts/card_identity_precision_v320_fixup.py
          git rm .github/scripts/card_identity_precision_v320_postfix.py
          git rm .github/workflows/card-identity-precision-v320.yml
          python fault_injection_healing.py --manifest
          python -m py_compile card_identity_recognition.py test_card_identity_ambiguity_v320.py test_card_edition_precision_v302.py test_card_region_generation_precision_v306.py verify_current_runtime.py
          node --check card_identity_recognition.js
          node --check grade_market_flow.js
          node verify_pokemon_generation_runtime.js
          python -m unittest -v \
            test_card_identity_ambiguity_v320.py \
            test_card_edition_precision_v302.py \
            test_card_region_generation_precision_v306.py \
            test_card_identity_market_precision_v309.py \
            test_card_region_conflict_failclosed_v318.py \
            test_card_tablet_runtime_v300.py
          python security_self_audit.py --no-memory --fail-on high
          python repository_integrity_guard.py
          git diff --check
          git add -A
          git commit -m 'fix: fail closed on ambiguous card identity and edition v320'
          git push origin HEAD:fix/card-identity-precision-v320
