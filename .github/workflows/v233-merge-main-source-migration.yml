name: One-shot v233 merge main and reapply source migration

on:
  push:
    branches:
      - selfrefine/fix-8stage-ssot-v230
    paths:
      - '.github/workflows/v233-merge-main-source-migration.yml'

permissions:
  contents: write

jobs:
  merge-main:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout target branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: selfrefine/fix-8stage-ssot-v230
          fetch-depth: 0
          persist-credentials: true

      - name: Merge latest main with bounded conflict policy
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          git merge --no-ff --no-commit origin/main || true

          conflicts="$(git diff --name-only --diff-filter=U || true)"
          if [[ -n "$conflicts" ]]; then
            while IFS= read -r file; do
              [[ -z "$file" ]] && continue
              case "$file" in
                promo_events.json|purchase_sources.json|releases.json)
                  git checkout --theirs -- "$file"
                  git add "$file"
                  ;;
                *)
                  echo "Unexpected merge conflict: $file" >&2
                  exit 1
                  ;;
              esac
            done <<< "$conflicts"
          fi

          unresolved="$(git diff --name-only --diff-filter=U || true)"
          if [[ -n "$unresolved" ]]; then
            echo "Unresolved merge conflicts:" >&2
            echo "$unresolved" >&2
            exit 1
          fi

      - name: Reapply offline official-source migrations to newest main snapshots
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          import update_releases as releases
          import update_purchase_sources as purchases
          import update_promo_events as promos

          def load(name):
              return json.loads(Path(name).read_text(encoding='utf-8'))

          def save(name, data):
              Path(name).write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          release_data = load('releases.json')
          for key in ('items', 'archive_items'):
              rows = release_data.get(key, [])
              if not isinstance(rows, list):
                  raise SystemExit(f'{key} must be a list in releases.json')
              release_data[key] = [
                  releases._migrate_pokemon_kr_release_source(row) if isinstance(row, dict) else row
                  for row in rows
              ]
          save('releases.json', release_data)

          purchase_data = load('purchase_sources.json')
          rows = purchase_data.get('sources', [])
          if not isinstance(rows, list):
              raise SystemExit('sources must be a list in purchase_sources.json')
          migrated = []
          for row in rows:
              if not isinstance(row, dict):
                  migrated.append(row)
                  continue
              before_url = str(row.get('url') or '')
              before_ref = str(row.get('official_reference_url') or '')
              clean = purchases._canonicalize_pokemon_kr_source(dict(row))
              changed = before_url != str(clean.get('url') or '') or before_ref != str(clean.get('official_reference_url') or '')
              if changed:
                  for field in ('last_checked_at', 'link_checked_at', 'link_statuses'):
                      clean.pop(field, None)
                  clean['link_status'] = '주소 이전 · 다음 갱신에서 연결상태 재확인'
              migrated.append(clean)
          purchase_data['sources'] = migrated
          save('purchase_sources.json', purchase_data)

          promo_data = load('promo_events.json')
          for key in ('items', 'archive_items'):
              rows = promo_data.get(key, [])
              if not isinstance(rows, list):
                  raise SystemExit(f'{key} must be a list in promo_events.json')
              out = []
              for row in rows:
                  if isinstance(row, dict):
                      row, _ = promos._migrate_pokemon_kr_event_source(row)
                  out.append(row)
              promo_data[key] = out

          for tracker in promos.REGIONAL_MOVIE_TRACKERS:
              identity = (tracker.get('game'), tracker.get('region'), tracker.get('category'), tracker.get('name_ko'))
              for key in ('items', 'archive_items'):
                  rows = promo_data.get(key, [])
                  for idx, row in enumerate(rows):
                      if not isinstance(row, dict):
                          continue
                      row_identity = (row.get('game'), row.get('region'), row.get('category'), row.get('name_ko'))
                      if row_identity == identity:
                          rows[idx] = promos._refresh_movie_tracker(row, tracker)
                          break
                  else:
                      continue
                  break
          save('promo_events.json', promo_data)

          # Executable/current source fields must not retain the retired host.
          for row in [*release_data.get('items', []), *release_data.get('archive_items', [])]:
              if isinstance(row, dict) and str(row.get('source') or '').startswith('https://new.pokemonkorea.co.kr'):
                  raise SystemExit('retired release source survived migration')
          for row in purchase_data.get('sources', []):
              if not isinstance(row, dict):
                  continue
              for field in ('url', 'official_reference_url'):
                  if str(row.get(field) or '').startswith('https://new.pokemonkorea.co.kr'):
                      raise SystemExit(f'retired purchase source survived migration: {field}')
          for row in [*promo_data.get('items', []), *promo_data.get('archive_items', [])]:
              if not isinstance(row, dict):
                  continue
              for field in ('source', 'collection_source', 'verification_source'):
                  if str(row.get(field) or '').startswith('https://new.pokemonkorea.co.kr'):
                      raise SystemExit(f'retired promo source survived migration: {field}')
          PY

      - name: Validate merged contracts
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile update_releases.py update_purchase_sources.py update_promo_events.py tcg_updater.py auto_update_all.py
          python -m unittest -v \
            test_release_history_coverage_v4.py \
            test_collection_scope_compat_v214.py \
            test_0600_operational_refresh_v25.py \
            test_runtime_bundle_guard_v143.py
          python feature_contract.py

      - name: Commit merge and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git add releases.json purchase_sources.json promo_events.json
          git rm .github/workflows/v233-merge-main-source-migration.yml
          git add -A
          if git diff --name-only --diff-filter=U | grep -q .; then
            echo 'Unresolved conflict remains' >&2
            exit 1
          fi
          git commit -m 'merge: sync latest main and preserve official-source migrations'
          git push origin HEAD:selfrefine/fix-8stage-ssot-v230
