name: Fix v342 service worker compatibility marker

on:
  push:
    branches: [fix/runtime-hardening-v341]
    paths:
      - '.github/workflows/fix-v342-sw-contract.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Restore compatibility marker and reconcile final manifest
        shell: bash
        run: |
          set -euo pipefail
          TEMP=.github/workflows/fix-v342-sw-contract.yml
          python - <<'PY'
          from pathlib import Path
          p=Path('sw.js')
          s=p.read_text(encoding='utf-8')
          old='// v342 hardens exact-request offline fallback while preserving the v276 cache ABI.'
          new='// v324 refreshes tablet/PWA identity runtime; v342 hardens exact-request offline fallback while preserving the v276 cache ABI.'
          if old in s:
              s=s.replace(old,new,1)
          elif new not in s:
              raise SystemExit('service-worker compatibility marker anchor missing')
          p.write_text(s,encoding='utf-8')
          PY
          rm -f "$TEMP"
          python - <<'PY'
          from pathlib import Path
          import fault_injection_healing as healing
          root=Path('.').resolve()
          target=root/'integrity_manifest.json'
          payload=healing.build_integrity_manifest(root,target)
          result=healing.diagnose_integrity(root,target)
          if not result.get('ok'):
              raise SystemExit(result)
          temp='.github/workflows/fix-v342-sw-contract.yml'
          if temp in payload.get('files',{}):
              raise SystemExit('temporary workflow leaked into final manifest')
          current={p.relative_to(root).as_posix() for p in healing.tracked_files(root)}
          listed=set(payload.get('files',{}))
          if current != listed:
              raise SystemExit(f'manifest coverage mismatch missing={sorted(current-listed)[:10]} extra={sorted(listed-current)[:10]}')
          print({'manifest_ok':True,'tracked_files':len(current)})
          PY
          node --check sw.js
          python -m unittest -v test_card_collector_edition_alias_v324.py test_runtime_hardening_v341.py test_tablet_scheduled_update_v256.py test_tablet_gpt_tcg_grader_sync_v339.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sw.js integrity_manifest.json
          git diff --cached --check
          git commit -m 'Restore v324 PWA compatibility marker with v342 hardening'
          git push origin HEAD:fix/runtime-hardening-v341
