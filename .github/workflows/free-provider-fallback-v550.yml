name: Free Provider Fallback V550
on:
  pull_request:
    paths:
      - 'market_public_crosscheck.py'
      - 'update_purchase_sources.py'
      - 'purchase_sources.json'
      - 'test_pokemon_official_catalog_v552.py'
      - 'tcg_market_expanded_v487.js'
      - 'test_free_source_fallback_v550.py'
      - 'test_market_crosscheck_unicode_v554.py'
      - 'test_market_crosscheck_exact_identifier_v555.py'
      - 'test_market_cache_provenance_v556.py'
      - 'test_free_fallback_ui_v550.js'
      - '.github/workflows/free-provider-fallback-v550.yml'
  push:
    branches: [main]
    paths:
      - 'market_public_crosscheck.py'
      - 'update_purchase_sources.py'
      - 'purchase_sources.json'
      - 'test_pokemon_official_catalog_v552.py'
      - 'tcg_market_expanded_v487.js'
      - 'test_free_source_fallback_v550.py'
      - 'test_market_crosscheck_unicode_v554.py'
      - 'test_market_crosscheck_exact_identifier_v555.py'
      - 'test_market_cache_provenance_v556.py'
      - 'test_free_fallback_ui_v550.js'
      - '.github/workflows/free-provider-fallback-v550.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: free-provider-fallback-v550-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'
      - name: Verify local cooldown, prior evidence and existing market source behavior
        run: |
          python -m py_compile market_public_crosscheck.py test_free_source_fallback_v550.py test_market_crosscheck_unicode_v554.py test_pokemon_official_catalog_v552.py test_market_crosscheck_exact_identifier_v555.py test_market_cache_provenance_v556.py
          python -m unittest -v \
            test_free_source_fallback_v550.py \
            test_market_crosscheck_unicode_v554.py \
            test_market_crosscheck_exact_identifier_v555.py \
            test_market_cache_provenance_v556.py \
            test_market_public_crosscheck_resilience_v228.py \
            test_market_public_crosscheck_performance_v251.py \
            test_market_source_hub_v268.py \
            test_pokemon_official_catalog_v552.py \
            test_pokemon_kr_official_alias_recovery_v387.py \
            test_pokemon_official_home_v505.py
      - name: Verify tablet manual browser and dated cached price contract
        run: |
          node --check tcg_market_expanded_v487.js
          node test_free_fallback_ui_v550.js
