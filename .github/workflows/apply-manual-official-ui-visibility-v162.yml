name: Restore manual official verification UI v162

on:
  push:
    paths:
      - '.github/workflows/apply-manual-official-ui-visibility-v162.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Restore manual verification panel
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('manual_official_verify_bridge.js')
          text = path.read_text(encoding='utf-8')
          hidden = '.gpd-official-fallback{display:none!important;margin-top:12px;'
          visible = '.gpd-official-fallback{display:block!important;margin-top:12px;'

          if hidden in text:
              text = text.replace(hidden, visible, 1)
          elif visible not in text:
              raise SystemExit('manual official fallback visibility contract not found')

          required = (
              "id='gpdOfficialFallback'",
              '/api/manual-official-proof-status',
              '/api/manual-official-proof',
              '① 공식조회 열기',
              '② 확인화면 등록',
              'data-proof=',
          )
          missing = [item for item in required if item not in text]
          if missing:
              raise SystemExit('manual verification UI contract missing: ' + ', '.join(missing))

          if '.gpd-official-fallback{display:none!important;' in text:
              raise SystemExit('manual verification panel is still force-hidden')

          path.write_text(text, encoding='utf-8')
          print('[OK] 수동 공식검증 등록 패널 표시 복구')
          PY

      - name: Regression checks
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path('manual_official_verify_bridge.js').read_text(encoding='utf-8')
          assert '.gpd-official-fallback{display:block!important;' in text
          assert '.gpd-official-fallback{display:none!important;' not in text
          for token in (
              '/api/manual-official-proof-status',
              '/api/manual-official-proof',
              '① 공식조회 열기',
              '② 확인화면 등록',
              'data-proof=',
              '잘못등록 삭제/취소',
          ):
              assert token in text, token
          print('[OK] 공식조회 열기 + 확인화면 등록 + 삭제/취소 UI 계약 정상')
          PY
          node --check manual_official_verify_bridge.js

      - name: Commit repaired bridge
        run: |
          if git diff --quiet -- manual_official_verify_bridge.js; then
            echo 'Already repaired'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add manual_official_verify_bridge.js
          git commit -m 'fix: show manual official verification registration v162'
          git push origin HEAD:main
