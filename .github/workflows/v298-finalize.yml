name: v298 Finalize Exact PSA9 UI

on:
  push:
    branches:
      - audit/exact-psa9-ui-v298

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run targeted card-core regression
        run: |
          python -m unittest -q \
            test_ui_app_shell_v272.py \
            test_card_probability_ui_v298.py \
            test_card_core_crosscheck_v291.py \
            test_card_core_crosscheck_v292.py \
            test_card_core_crosscheck_v293.py \
            test_card_core_crosscheck_v294.py \
            test_card_edition_market_guard_v295.py \
            test_card_invalid_ux_v295.py \
            test_card_market_no_data_warning_v295.py \
            test_card_core_visual_proof_v297.py \
            test_card_sources_transform_v297.py \
            test_market_provenance_v297.py \
            test_ui_card_core_v297.py \
            test_runtime_grade_market_parity.py \
            test_runtime_grade_market_flow.py \
            test_psa_probability_market_flow.py \
            test_tcg_generation.py \
            test_tcg_card_analysis.py \
            test_tcg_value_engine.py
      - name: Remove temporary finalizer and regenerate integrity manifest
        run: |
          git rm .github/workflows/v298-finalize.yml
          python - <<'PY'
          from pathlib import Path
          import fault_injection_healing as h
          root = Path('.').resolve()
          manifest = root / 'integrity_manifest.json'
          h.build_integrity_manifest(root, manifest)
          result = h.diagnose_integrity(root, manifest)
          assert result['ok'], result
          print({'tracked': len(h.tracked_files(root)), 'checked': result['checked'], 'failed': result['failed']})
          PY
      - name: Commit finalized tree
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ui_app_shell_v272.js test_card_probability_ui_v298.py integrity_manifest.json
          if git diff --cached --quiet; then
            echo 'No finalization changes to commit.'
            exit 0
          fi
          git commit -m 'Finalize exact PSA 9 probability UI guard (v298)'
          git push origin HEAD:audit/exact-psa9-ui-v298
