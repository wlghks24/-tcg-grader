name: One Shot Security Audit V5

on:
  push:
    branches: [main]
    paths:
      - 'ONE_SHOT_SECURITY_AUDIT_V5.py'
      - '.github/workflows/one-shot-security-audit-v5.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: one-shot-security-audit-v5-main
  cancel-in-progress: false

jobs:
  patch-verify-push:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Compile patcher
        run: python -m py_compile ONE_SHOT_SECURITY_AUDIT_V5.py
      - name: Apply audit hardening
        run: python ONE_SHOT_SECURITY_AUDIT_V5.py
      - name: Compile patched security code
        run: python -m py_compile security_hardening_apply.py security_self_audit.py test_security_hardening.py
      - name: Run security regression suite
        run: |
          python -m unittest -v test_security_hardening.py
          python security_hardening_apply.py --check
          python security_self_audit.py --fail-on medium --no-memory
      - name: Verify focused YAML and alias bypass cases
        run: |
          python - <<'PY'
          from pathlib import Path
          import security_hardening_apply as hardening
          import security_self_audit as audit

          for permission in (
              "permissions:\n  contents: 'write'\n",
              "permissions: {contents: write}\n",
              "jobs:\n  patch:\n    permissions: {contents: 'write'}\n",
          ):
              workflow="name: synthetic\non:\n  push:\n    paths: [app.py]\n"+permission
              assert hardening._workflow_has_contents_write(workflow), workflow
              findings=[]
              audit.scan_workflow(workflow,findings,'.github/workflows/synthetic.yml')
              assert any(row.get('rule')=='GHA_CONTENTS_WRITE' for row in findings), findings

          for source in (
              "import subprocess as sp\nsp.run(['echo','x'], shell=True)\n",
              "from subprocess import Popen as launch\nlaunch(['echo','x'], shell=True)\n",
              "from os import system as run_system\nrun_system('echo x')\n",
          ):
              findings=[]
              audit.scan_python(Path('synthetic.py'),source,findings,'synthetic.py')
              assert any(row.get('rule') in {'PY_SHELL_TRUE','PY_DANGEROUS_EXEC'} for row in findings), findings
          print('security audit v5 focused bypass tests: OK')
          PY
      - name: Run final tablet preflight
        env:
          TCG_FINAL_SKIP_HEAD_MATCH: '1'
        run: bash VERIFY_TABLET_FINAL.sh
      - name: Verify formatting
        run: git diff --check
      - name: Commit verified source hardening
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add security_hardening_apply.py security_self_audit.py test_security_hardening.py
          git diff --cached --quiet && { echo 'No source changes to commit'; exit 0; }
          git commit -m 'security: detect quoted workflow writes and aliased shell calls'
          git pull --rebase origin main
          git push origin HEAD:main
