name: BGS redirect diagnostic v227

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bgs-redirect-diagnostic-v227.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Observe Beckett redirect targets without following
        run: |
          python - <<'PY'
          import json
          import urllib.error
          import urllib.parse
          import urllib.request
          from grading_company_watch import ALLOWED_HOSTS, UA
          from safe_runtime import safe_urlopen_no_redirect

          urls = {
              'bgs-pricing-www': 'https://www.beckett.com/grading',
              'bgs-pricing-canonical': 'https://beckett.com/grading',
              'bgs-news-www': 'https://www.beckett.com/news/',
              'bgs-news-canonical': 'https://beckett.com/news/',
          }
          rows = []
          for source_id, url in urls.items():
              req = urllib.request.Request(url, headers={'User-Agent': UA, 'Accept': 'text/html,application/xhtml+xml'})
              try:
                  with safe_urlopen_no_redirect(req, timeout=20, allowed_hosts=ALLOWED_HOSTS) as response:
                      final = response.geturl()
                      rows.append({'source': source_id, 'status': response.status, 'host': urllib.parse.urlsplit(final).hostname, 'redirect_host': None})
              except urllib.error.HTTPError as exc:
                  location = exc.headers.get('Location') if exc.headers else None
                  absolute = urllib.parse.urljoin(url, location or '')
                  rows.append({
                      'source': source_id,
                      'status': exc.code,
                      'host': urllib.parse.urlsplit(url).hostname,
                      'redirect_host': urllib.parse.urlsplit(absolute).hostname if location else None,
                      'redirect_scheme': urllib.parse.urlsplit(absolute).scheme if location else None,
                  })
              except Exception as exc:
                  rows.append({'source': source_id, 'error_type': type(exc).__name__, 'error': str(exc)[:200]})
          print(json.dumps(rows, ensure_ascii=False, indent=2))
          PY
