name: Apply event source expansion v145

on:
  push:
    branches: [main]
    paths:
      - 'apply_event_source_expansion_v145_integration.py'
      - 'apply_event_source_expansion_v145_fix2.py'
      - 'event_source_expansion_v145.py'
      - 'test_event_source_expansion_v145.py'
      - '.github/workflows/apply-event-source-expansion-v145.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install runtime test dependency
        run: python -m pip install --disable-pip-version-check --no-cache-dir -r requirements.txt
      - name: Apply deterministic integration patch
        run: |
          python apply_event_source_expansion_v145_integration.py
          python apply_event_source_expansion_v145_fix2.py
      - name: Compile source expansion runtime
        run: >-
          python -m py_compile
          event_source_expansion_v145.py
          test_event_source_expansion_v145.py
          auto_pipeline_runner.py
          event_priority_watch.py
          event_quick_watch.py
          runtime_bundle_guard_v143.py
          tcg_updater_v135.py
          collection_learning_hardening_v142.py
          collection_learning_hardening_v144.py
          event_source_overlay_v144.py
          adaptive_collection_learner.py
          multi_route_event_discovery.py
      - name: Run event and runtime regression suite
        run: >-
          python -m unittest -v
          test_event_source_expansion_v145.py
          test_event_miss_learning_v144.py
          test_event_quick_watch.py
          test_collection_learning_hardening_v142.py
          test_runtime_bundle_guard_v143.py
      - name: Verify semantic source expansion contracts
        shell: bash
        run: |
          python - <<'PY'
          import adaptive_collection_learner as adaptive
          import event_source_expansion_v145 as expansion
          import multi_route_event_discovery as routes
          import runtime_bundle_guard_v143 as bundle
          status=expansion.apply()
          audit=bundle.require_compatible()
          assert status['patch'] == 145, status
          assert status['static_target_cells'] == 9, status
          assert status['scoped_learned_host_queries'] is True, status
          assert status['verified_evidence_source_learning'] is True, status
          assert status['source_health_feedback'] is True, status
          assert status['rotating_target_windows'] is True, status
          assert status['max_hosts_per_scoped_query'] <= 8, status
          assert status['unverified_source_learning_weight'] == 0.0, status
          assert status['trust_auto_promotion'] is False, status
          assert 'shonenjump.com' in routes.PARTNER_DOMAINS[('원피스 카드','JP')]
          assert 'pokemoncenter.com' in routes.PARTNER_DOMAINS[('포켓몬 카드','US')]
          assert 'bandai-tcg-plus.com' in routes.PARTNER_DOMAINS[('나루토 카드','JP')]
          assert 'shonenjump.com' not in adaptive.GAME_CONFIG['원피스']['official_hosts']
          assert audit['issue_count'] == 0, audit
          print('[OK] v145 bounded 3-game/3-region source expansion contracts')
          PY
          bash -n START_TCG_UPDATER_ANDROID.sh
          bash -n INSTALL_GRADE_LEARNING_V135.sh
          bash -n VERIFY_TABLET_FINAL.sh
      - name: Commit verified runtime changes
        shell: bash
        run: |
          if git diff --quiet -- . ':(exclude).github/workflows/**' ':(exclude)apply_event_source_expansion_v145_integration.py' ':(exclude)apply_event_source_expansion_v145_fix2.py'; then
            echo 'No runtime changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- . ':(exclude).github/workflows/**' ':(exclude)apply_event_source_expansion_v145_integration.py' ':(exclude)apply_event_source_expansion_v145_fix2.py'
          git commit -m 'feat: integrate v145 adaptive source expansion'
          git push origin HEAD:main
