name: Apply CSP refresh v218

on:
  push:
    branches:
      - fix/unify-update-guidance-v218
    paths:
      - .github/workflows/apply-csp-refresh-v218.yml

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/unify-update-guidance-v218
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'
      - name: Refresh exact inline-script CSP hashes
        run: python csp_hash_hardening.py
      - name: Verify CSP and guidance
        run: |
          python csp_hash_hardening.py --check
          python -m unittest -v test_csp_hash_hardening.py test_update_guidance_consistency_v218.py
          git diff --check
      - name: Commit refreshed CSP
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'fix: refresh CSP hashes for unified update guidance'
          git push origin HEAD:fix/unify-update-guidance-v218
