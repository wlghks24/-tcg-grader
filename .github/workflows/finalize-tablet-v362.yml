name: Finalize Tablet GPT v362

on:
  push:
    branches:
      - fix/tablet-receipt-fail-closed-v362
    paths:
      - '.github/workflows/finalize-tablet-v362.yml'

permissions:
  contents: write

concurrency:
  group: finalize-tablet-v362
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Assert exact safe branch
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "wlghks24/-tcg-grader"
          test "$GITHUB_REF_NAME" = "fix/tablet-receipt-fail-closed-v362"
          test "$GITHUB_REF_NAME" != "main"
          git fetch --no-tags origin main
          git merge-base --is-ancestor origin/main HEAD
      - name: Install audited dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Remove one-shot workflow before final-tree verification
        shell: bash
        run: git rm .github/workflows/finalize-tablet-v362.yml
      - name: Rebuild and verify exact-tree integrity manifest
        shell: bash
        run: |
          set -euo pipefail
          python static_integrity_manifest.py --write
          python static_integrity_manifest.py --check
          python repository_integrity_guard.py
      - name: Verify Tablet GPT v361/v362 and all discovered sync generations
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest -v test_tablet_gpt_tcg_grader_sync_v361.py test_tablet_gpt_tcg_grader_sync_v362.py test_tablet_gdrive_sync_perf_v262.py
          mapfile -t tests < <(find . -maxdepth 1 -type f -name 'test_tablet_gpt_tcg_grader_sync_v*.py' -printf '%f\n' | sort -V)
          test "${#tests[@]}" -gt 0
          python -m unittest -v "${tests[@]}"
      - name: Verify no unintended finalizer residue and commit only final tree
        shell: bash
        run: |
          set -euo pipefail
          test ! -e .github/workflows/finalize-tablet-v362.yml
          git diff --check
          git status --short
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add integrity_manifest.json .github/workflows/finalize-tablet-v362.yml
          git commit -m 'Reconcile integrity manifest for Tablet GPT v362'
          git push origin HEAD:fix/tablet-receipt-fail-closed-v362
