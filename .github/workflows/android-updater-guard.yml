name: Android Updater Guard
on:
  push:
    branches: [main]
    paths:
      - 'ANDROID_UPDATE_AND_START.sh'
      - 'ANDROID_RECOVER_UPDATE.sh'
      - 'ANDROID_AUTO_START_INSTALL.sh'
      - 'VERIFY_TABLET_FINAL.sh'
      - '.github/workflows/android-updater-guard.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Validate Android updater shell syntax
        run: |
          bash -n ANDROID_UPDATE_AND_START.sh
          bash -n ANDROID_RECOVER_UPDATE.sh
          bash -n ANDROID_AUTO_START_INSTALL.sh
          bash -n VERIFY_TABLET_FINAL.sh
      - name: Verify runtime-conflict recovery guards are present
        run: |
          grep -Fq '.tcg_runtime_preserved' ANDROID_UPDATE_AND_START.sh
          grep -Fq 'git restore --worktree --source=HEAD' ANDROID_UPDATE_AND_START.sh
          grep -Fq 'git merge --ff-only origin/main' ANDROID_UPDATE_AND_START.sh
          grep -Fq 'restore_runtime_snapshot' ANDROID_UPDATE_AND_START.sh
          grep -Fq 'mktemp -d "$RUNTIME_BACKUP_DIR/' ANDROID_UPDATE_AND_START.sh
          grep -Fq 'if [ -L "$changed" ]; then' ANDROID_UPDATE_AND_START.sh
          grep -Fq 'fatal_restore_error=1' ANDROID_UPDATE_AND_START.sh
          ! grep -Fq 'find "$RUNTIME_BACKUP_DIR"' ANDROID_UPDATE_AND_START.sh
      - name: Verify updater self-bootstrap recovery guard
        run: |
          grep -Fq 'SELF_PATH="ANDROID_UPDATE_AND_START.sh"' ANDROID_UPDATE_AND_START.sh
          grep -Fq 'git diff --quiet origin/main -- "$changed"' ANDROID_UPDATE_AND_START.sh
          grep -Fq '자기복구용 변경으로 안전하게 인정합니다.' ANDROID_UPDATE_AND_START.sh
          grep -Fq 'Android 업데이트 스크립트 자기복구 완료' ANDROID_UPDATE_AND_START.sh
      - name: Verify official remote pinning contracts
        run: |
          grep -Fq 'OFFICIAL_REPO="wlghks24/-tcg-grader"' ANDROID_UPDATE_AND_START.sh
          grep -Fq 'OFFICIAL_HTTPS="https://github.com/wlghks24/-tcg-grader.git"' ANDROID_UPDATE_AND_START.sh
          grep -Fq 'git fetch --prune "$OFFICIAL_HTTPS" main:refs/remotes/origin/main' ANDROID_UPDATE_AND_START.sh
          grep -Fq "OFFICIAL_REPO='wlghks24/-tcg-grader'" ANDROID_RECOVER_UPDATE.sh
          grep -Fq "OFFICIAL_HTTPS='https://github.com/wlghks24/-tcg-grader.git'" ANDROID_RECOVER_UPDATE.sh
          grep -Fq 'git fetch --prune "$OFFICIAL_HTTPS" main:refs/remotes/origin/main' ANDROID_RECOVER_UPDATE.sh
          grep -Fq '공식 GitHub origin 확인: OK' VERIFY_TABLET_FINAL.sh
      - name: Verify fail-closed snapshot restore contracts
        run: |
          python - <<'PY'
          from pathlib import Path
          source=Path('ANDROID_UPDATE_AND_START.sh').read_text(encoding='utf-8')
          assert 'restore_ok=1' in source
          assert '[ "$restore_ok" = "1" ]' in source
          assert 'rm -f "$changed" 2>/dev/null || restore_ok=0' in source
          assert 'cp -p "$snapshot/files/$changed" "$changed" 2>/dev/null || restore_ok=0' in source
          assert 'if [ "$fatal_restore_error" = "1" ]; then' in source
          assert '서버 시작을 중단합니다' in source
          assert 'find "$RUNTIME_BACKUP_DIR"' not in source
          print('Android exact snapshot + fail-closed restore contracts: OK')
          PY
      - name: Prove recovery refuses an altered origin before network execution
        shell: bash
        run: |
          set -euo pipefail
          fixture="$(mktemp -d)"
          cp ANDROID_RECOVER_UPDATE.sh "$fixture/"
          cd "$fixture"
          git init -q -b main
          git config user.name guard
          git config user.email guard@example.invalid
          git remote add origin https://example.invalid/attacker/repo.git
          git add ANDROID_RECOVER_UPDATE.sh
          git commit -qm fixture
          set +e
          bash ./ANDROID_RECOVER_UPDATE.sh >out.txt 2>&1
          rc=$?
          set -e
          test "$rc" -eq 12
          grep -Fq '공식 TCG 저장소' out.txt
          ! grep -Fq '[복구] GitHub main 최신 업데이트 스크립트를 준비합니다' out.txt
      - name: Prove normal updater skips an altered origin but keeps local startup available
        shell: bash
        run: |
          set -euo pipefail
          fixture="$(mktemp -d)"
          cp ANDROID_UPDATE_AND_START.sh "$fixture/"
          cat > "$fixture/START_TCG_UPDATER_ANDROID.sh" <<'SH'
          #!/usr/bin/env bash
          echo '[FIXTURE] local server start preserved'
          exit 0
          SH
          chmod +x "$fixture/START_TCG_UPDATER_ANDROID.sh"
          cd "$fixture"
          git init -q -b main
          git config user.name guard
          git config user.email guard@example.invalid
          git remote add origin https://example.invalid/attacker/repo.git
          git add ANDROID_UPDATE_AND_START.sh START_TCG_UPDATER_ANDROID.sh
          git commit -qm fixture
          bash ./ANDROID_UPDATE_AND_START.sh >out.txt 2>&1
          grep -Fq '원격 코드는 받지 않고 현재 검증된 로컬 버전으로 시작합니다.' out.txt
          grep -Fq '[FIXTURE] local server start preserved' out.txt
      - name: Verify one-shot recovery bootstrap
        run: |
          grep -Fq 'git show origin/main:ANDROID_UPDATE_AND_START.sh' ANDROID_RECOVER_UPDATE.sh
          grep -Fq 'git restore --worktree --source=origin/main -- ANDROID_UPDATE_AND_START.sh' ANDROID_RECOVER_UPDATE.sh
          grep -Fq 'TCG_REPO_DIR="$repo" bash "$tmp"' ANDROID_RECOVER_UPDATE.sh
