name: Tablet GPT TCG Grader Main Alignment

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tablet-gpt-tcg-grader-main-alignment-${{ github.ref }}
  cancel-in-progress: true

jobs:
  alignment:
    name: Tablet GPT TCG Grader Main Alignment
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'

      - name: Verify every discovered Tablet GPT sync generation
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t tests < <(find . -maxdepth 1 -type f -name 'test_tablet_gpt_tcg_grader_sync_v*.py' -printf '%f\n' | sort -V)
          test "${#tests[@]}" -gt 0
          python -m unittest -v "${tests[@]}"

      - name: Verify latest discovered contract, receipt and covered patches
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          import os
          import re
          import subprocess
          from pathlib import Path

          root = Path('.')
          contract_re = re.compile(r'TABLET_GPT_TCG_GRADER_SYNC_CONTRACT_V(\d+)\.json$')
          candidates = []
          for path in (root / 'TCG_CROSSCHECK').glob('TABLET_GPT_TCG_GRADER_SYNC_CONTRACT_V*.json'):
              match = contract_re.fullmatch(path.name)
              if match:
                  candidates.append((int(match.group(1)), path))
          assert candidates, 'no versioned Tablet GPT sync contract'
          version, contract_path = max(candidates)
          contract = json.loads(contract_path.read_text(encoding='utf-8'))
          expected_delta = f'TCG_CROSSCHECK/TABLET_GPT/learning_snapshot_v{version}_delta.json'
          expected_receipt = f'TCG_CROSSCHECK/TCG_GRADER/tablet_gpt_learning_receipt_v{version}.json'
          expected_test = f'test_tablet_gpt_tcg_grader_sync_v{version}.py'
          assert contract['delta_snapshot'] == expected_delta
          assert contract['receiver_receipt'] == expected_receipt
          assert contract['verification_test'] == expected_test
          prior_match = contract_re.fullmatch(Path(contract['prior_contract']).name)
          assert prior_match and int(prior_match.group(1)) < version
          delta_path = root / contract['delta_snapshot']
          receipt_path = root / contract['receiver_receipt']
          test_path = root / contract['verification_test']
          assert delta_path.is_file() and receipt_path.is_file() and test_path.is_file()
          delta = json.loads(delta_path.read_text(encoding='utf-8'))
          receipt = json.loads(receipt_path.read_text(encoding='utf-8'))

          assert delta['schema_version'] == receipt['schema_version'] == contract['schema_version']
          assert delta['source_repository'] == receipt['source_repository'] == 'wlghks24/-tcg-grader'
          assert delta['source_main_sha'] == receipt['source_main_sha']
          assert receipt['status'] == 'SYNCED_VERIFIED'
          assert receipt['verification']['verification_test'] == contract['verification_test']
          assert receipt['verification']['contract_version'] == f'v{version}'
          assert receipt['verification']['verified_result'] == 'TABLET_GPT_TCG_GRADER_MATCH'
          assert delta['share_policy']['chatgpt_model_weights_exported'] is False
          assert delta['share_policy']['raw_grading_calibration_shared'] is False
          assert delta['share_policy']['device_local_runtime_memory_overwritten'] is False
          raw = json.dumps(delta['lessons'], ensure_ascii=False, sort_keys=True, separators=(',', ':'))
          digest = hashlib.sha256(raw.encode('utf-8')).hexdigest()
          assert digest == delta['lesson_digest_sha256'] == receipt['delta_lesson_digest_sha256']
          assert [row['lesson_id'] for row in delta['lessons']] == receipt['accepted_lesson_ids']

          def ancestor(sha: str) -> None:
              subprocess.run(['git', 'cat-file', '-e', f'{sha}^{{commit}}'], check=True)
              subprocess.run(['git', 'merge-base', '--is-ancestor', sha, 'HEAD'], check=True)

          snapshots = [root / 'TCG_CROSSCHECK/TABLET_GPT/learning_snapshot.json']
          snapshots.extend(sorted((root / 'TCG_CROSSCHECK/TABLET_GPT').glob('learning_snapshot_v*_delta.json')))
          for path in snapshots:
              snapshot = json.loads(path.read_text(encoding='utf-8'))
              ancestor(snapshot['source_main_sha'])
              for row in snapshot['covered_merges']:
                  ancestor(row['merge_sha'])

          head = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          print(
              f'TABLET_GPT_TCG_GRADER_CONTRACT_OK version=v{version} '
              f'source={delta["source_main_sha"]} current_head={head}'
          )
          PY

      - name: Fail visibly when watched changes are not covered by the latest verified delta
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import re
          import subprocess
          from pathlib import Path

          root = Path('.')
          pattern = re.compile(r'TABLET_GPT_TCG_GRADER_SYNC_CONTRACT_V(\d+)\.json$')
          candidates = []
          for path in (root / 'TCG_CROSSCHECK').glob('TABLET_GPT_TCG_GRADER_SYNC_CONTRACT_V*.json'):
              match = pattern.fullmatch(path.name)
              if match:
                  candidates.append((int(match.group(1)), path))
          assert candidates, 'no versioned Tablet GPT sync contract'
          version, contract_path = max(candidates)
          contract = json.loads(contract_path.read_text(encoding='utf-8'))
          delta = json.loads((root / contract['delta_snapshot']).read_text(encoding='utf-8'))
          source = delta['source_main_sha']
          head = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()

          subprocess.run(['git', 'merge-base', '--is-ancestor', source, head], check=True)
          if source == head:
              print(f'TABLET_GPT_SYNC_FRESH version=v{version} source={source} head={head}')
              raise SystemExit(0)

          changed = subprocess.check_output(
              ['git', 'diff', '--name-only', f'{source}..{head}'],
              text=True,
          ).splitlines()
          watch = contract['freshness_watch']
          exact = set(watch['exact_paths'])
          prefixes = tuple(watch['path_prefixes'])
          excluded = set(watch['exclude_paths'])

          def watched(path: str) -> bool:
              if path in excluded:
                  return False
              return path in exact or path.startswith(prefixes)

          relevant = sorted(path for path in changed if watched(path))

          # PRs may bundle a new verified sync generation, but it must be anchored
          # to the exact PR base and all four generation files must be part of the PR.
          event_name = os.environ.get('GITHUB_EVENT_NAME', '')
          if event_name == 'pull_request' and relevant:
              payload = json.loads(Path(os.environ['GITHUB_EVENT_PATH']).read_text(encoding='utf-8'))
              base_sha = payload['pull_request']['base']['sha']
              pr_changed = set(subprocess.check_output(
                  ['git', 'diff', '--name-only', f'{base_sha}..{head}'], text=True
              ).splitlines())
              generation_files = {
                  contract_path.as_posix(),
                  contract['delta_snapshot'],
                  contract['receiver_receipt'],
                  contract['verification_test'],
              }
              bundled_sync = source == base_sha and generation_files.issubset(pr_changed)
              if bundled_sync:
                  print(
                      f'TABLET_GPT_PR_SYNC_CANDIDATE_COVERED version=v{version} '
                      f'base={base_sha} head={head} watched_changes={len(relevant)}'
                  )
                  raise SystemExit(0)

          if relevant:
              print('TABLET_GPT_SYNC_STALE', flush=True)
              print(f'latest_contract=v{version}', flush=True)
              print(f'verified_source={source}', flush=True)
              print(f'current_head={head}', flush=True)
              print('watched_changes_after_verified_delta:', flush=True)
              for path in relevant:
                  print(f' - {path}', flush=True)
              raise SystemExit(
                  'Tablet GPT cross-check snapshot is stale: create a verified learning delta before treating alignment as current.'
              )

          print(
              f'TABLET_GPT_SYNC_FRESH_NO_WATCHED_CHANGE version=v{version} '
              f'source={source} head={head} changed_files={len(changed)}'
          )
          PY
