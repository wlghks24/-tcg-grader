name: Tablet GPT TCG Grader Main Alignment

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tablet-gpt-tcg-grader-main-alignment-${{ github.ref }}
  cancel-in-progress: true

jobs:
  alignment:
    name: Tablet GPT TCG Grader Main Alignment
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'

      - name: Verify historical v330 and current v331 delta contracts
        run: python -m unittest -v test_tablet_gpt_tcg_grader_sync_v330.py test_tablet_gpt_tcg_grader_sync_v331.py

      - name: Verify current HEAD contains every covered patch
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import subprocess
          from pathlib import Path

          root = Path('.')
          base = json.loads((root / 'TCG_CROSSCHECK/TABLET_GPT/learning_snapshot.json').read_text(encoding='utf-8'))
          delta = json.loads((root / 'TCG_CROSSCHECK/TABLET_GPT/learning_snapshot_v331_delta.json').read_text(encoding='utf-8'))
          receipt = json.loads((root / 'TCG_CROSSCHECK/TCG_GRADER/tablet_gpt_learning_receipt_v331.json').read_text(encoding='utf-8'))
          contract = json.loads((root / 'TCG_CROSSCHECK/TABLET_GPT_TCG_GRADER_SYNC_CONTRACT_V331.json').read_text(encoding='utf-8'))

          assert delta['schema_version'] == receipt['schema_version'] == contract['schema_version']
          assert delta['source_repository'] == receipt['source_repository'] == 'wlghks24/-tcg-grader'
          assert delta['source_main_sha'] == receipt['source_main_sha']
          assert receipt['status'] == 'SYNCED_VERIFIED'
          assert receipt['verification']['verification_test'] == 'test_tablet_gpt_tcg_grader_sync_v331.py'
          assert receipt['verification']['verified_result'] == 'TABLET_GPT_TCG_GRADER_MATCH'

          def ancestor(sha: str) -> None:
              subprocess.run(['git', 'cat-file', '-e', f'{sha}^{{commit}}'], check=True)
              subprocess.run(['git', 'merge-base', '--is-ancestor', sha, 'HEAD'], check=True)

          ancestor(base['source_main_sha'])
          ancestor(delta['source_main_sha'])
          for snapshot in (base, delta):
              for row in snapshot['covered_merges']:
                  ancestor(row['merge_sha'])

          head = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          print(f'TABLET_GPT_TCG_GRADER_CONTRACT_OK source={delta["source_main_sha"]} current_head={head}')
          PY

      - name: Fail visibly when main has watched changes after the verified delta
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import subprocess
          from pathlib import Path

          root = Path('.')
          delta = json.loads((root / 'TCG_CROSSCHECK/TABLET_GPT/learning_snapshot_v331_delta.json').read_text(encoding='utf-8'))
          contract = json.loads((root / 'TCG_CROSSCHECK/TABLET_GPT_TCG_GRADER_SYNC_CONTRACT_V331.json').read_text(encoding='utf-8'))
          source = delta['source_main_sha']
          head = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()

          subprocess.run(['git', 'merge-base', '--is-ancestor', source, head], check=True)
          if source == head:
              print(f'TABLET_GPT_SYNC_FRESH source={source} head={head}')
              raise SystemExit(0)

          changed = subprocess.check_output(
              ['git', 'diff', '--name-only', f'{source}..{head}'],
              text=True,
          ).splitlines()
          watch = contract['freshness_watch']
          exact = set(watch['exact_paths'])
          prefixes = tuple(watch['path_prefixes'])
          excluded = set(watch['exclude_paths'])

          def watched(path: str) -> bool:
              if path in excluded:
                  return False
              return path in exact or path.startswith(prefixes)

          relevant = sorted(path for path in changed if watched(path))
          if relevant:
              print('TABLET_GPT_SYNC_STALE', flush=True)
              print(f'verified_source={source}', flush=True)
              print(f'current_head={head}', flush=True)
              print('watched_changes_after_verified_delta:', flush=True)
              for path in relevant:
                  print(f' - {path}', flush=True)
              raise SystemExit(
                  'Tablet GPT cross-check snapshot is stale: create a verified learning delta before treating alignment as current.'
              )

          print(
              f'TABLET_GPT_SYNC_FRESH_NO_WATCHED_CHANGE source={source} head={head} '
              f'changed_files={len(changed)}'
          )
          PY
