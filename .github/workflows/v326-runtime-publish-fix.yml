name: V326 Runtime Publication Fix

on:
  push:
    branches: [fix/card-classification-price-generation-v326]
    paths:
      - '.github/workflows/v326-runtime-publish-fix.yml'

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/card-classification-price-generation-v326
          fetch-depth: 1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Apply runtime publication wiring
        run: python apply_v326_runtime_publish_fix.py
      - name: Targeted card and runtime checks
        run: |
          node --check card_metadata_classifier_v326.js
          node verify_card_metadata_classifier_v326.js
          node --check grade_market_flow.js
          node verify_service_worker_runtime.js
          python verify_link_runtime.py
          python tablet_runtime_manifest.py --check --compile
          python -m unittest -v test_tablet_runtime_manifest_ui_assets_v254.py test_card_tablet_runtime_v300.py
      - name: Remove bootstrap files and regenerate final integrity manifest
        run: |
          rm -f apply_v326_runtime_publish_fix.py .github/workflows/v326-runtime-publish-fix.yml
          python fault_injection_healing.py --manifest
          python fault_injection_healing.py --diagnose
          python repository_integrity_guard.py
          python verify_link_runtime.py
          python tablet_runtime_manifest.py --check --compile
          node verify_card_metadata_classifier_v326.js
          git diff --check
      - name: Commit verified final tree
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No v326 runtime publication changes required.'
            exit 0
          fi
          git commit -m 'fix: publish v326 card metadata guard through tablet runtime'
          git push origin HEAD:fix/card-classification-price-generation-v326
