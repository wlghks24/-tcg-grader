name: V295 Final Validation

on:
  push:
    branches:
      - audit/card-core-crosscheck-v295

permissions:
  contents: write

jobs:
  validate-clean:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install current OCR test dependency
        run: python -m pip install --disable-pip-version-check --no-input Pillow
      - name: Verify current-runtime routing regression
        run: python test_current_runtime_verifier_v295.py
      - name: Remove transient diagnostic workflows
        run: git rm -- .github/workflows/v295-runtime-diagnostic.yml .github/workflows/v295-final-validation.yml
      - name: Refresh clean integrity manifest
        run: |
          python - <<'PY'
          from pathlib import Path
          import fault_injection_healing as h
          root=Path('.').resolve()
          h.build_integrity_manifest(root, root/'integrity_manifest.json')
          report=h.diagnose_integrity(root, root/'integrity_manifest.json')
          assert report['ok'] and report['failed']==0, report
          print({'ok': report['ok'], 'checked': report['checked'], 'failed': report['failed']})
          PY
      - name: Commit clean final branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add verify_current_runtime.py test_current_runtime_verifier_v295.py integrity_manifest.json
          git add -u
          git commit -m 'Fix current runtime verifier and finalize v295 audit'
          git push origin HEAD:audit/card-core-crosscheck-v295
      - name: Re-run focused card contracts
        run: |
          python test_card_core_crosscheck_v295.py
          python test_card_core_crosscheck_v292.py
          python test_card_core_crosscheck_v291.py
          python test_psa_probability_market_flow_v252.py
          python test_tablet_runtime_qa_integration.py
          python test_hot_box_hit_runtime_v252.py
          python test_wyyyes_market_source_v267.py
          python test_current_runtime_verifier_v295.py
          node verify_v99_browser_accuracy.js
          python verify_v99_cross_runtime.py
      - name: Full current runtime verifier
        run: python verify_current_runtime.py
