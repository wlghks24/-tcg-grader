name: Temporary Main Alignment Manifest Refresh

on:
  push:
    branches: [qa/auto-main-alignment-v289]
    paths:
      - '.github/workflows/tmp-main-alignment-manifest.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Validate alignment guard and rebuild exact manifest
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/tmp-main-alignment-manifest.yml
          python -m unittest -v test_tablet_gpt_tcg_grader_sync_v289.py
          python - <<'PY'
          import json
          import subprocess
          from pathlib import Path
          snapshot = json.loads(Path('TCG_CROSSCHECK/TABLET_GPT/learning_snapshot.json').read_text(encoding='utf-8'))
          subprocess.run(['git','merge-base','--is-ancestor',snapshot['source_main_sha'],'HEAD'], check=True)
          for row in snapshot['covered_merges']:
              subprocess.run(['git','merge-base','--is-ancestor',row['merge_sha'],'HEAD'], check=True)
          PY
          python fault_injection_healing.py --manifest
          python fault_injection_healing.py --diagnose
          git add -- integrity_manifest.json .github/workflows/tmp-main-alignment-manifest.yml
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore: finalize main alignment guard manifest'
          git push origin HEAD:qa/auto-main-alignment-v289
