name: V353 Regression Finalizer

on:
  push:
    branches:
      - fix/packmagik-edition-parser-v353-20260929

permissions:
  contents: write

concurrency:
  group: v353-regression-finalizer
  cancel-in-progress: false

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          ref: fix/packmagik-edition-parser-v353-20260929

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'

      - name: Verify historical successor logic and current v353 contract
        run: |
          set -euo pipefail
          python -m py_compile test_tablet_gpt_tcg_grader_sync_v351.py test_tablet_gpt_tcg_grader_sync_v352.py test_tablet_gpt_tcg_grader_sync_v353.py
          python -m unittest -v test_tablet_gpt_tcg_grader_sync_v351.py test_tablet_gpt_tcg_grader_sync_v352.py test_tablet_gpt_tcg_grader_sync_v353.py test_update_market_prices_packmagik_v353.py

      - name: Remove one-shot workflow and regenerate final-tree integrity manifest
        run: |
          set -euo pipefail
          git rm -- .github/workflows/v353-regression-finalizer.yml
          python static_integrity_manifest.py --write integrity_manifest.json
          python static_integrity_manifest.py --check integrity_manifest.json
          python repository_integrity_guard.py
          git add -- test_tablet_gpt_tcg_grader_sync_v351.py integrity_manifest.json
          git diff --cached --check

      - name: Commit exact final tree
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'test: finalize strict successor checkpoint regression'
          git push origin HEAD:fix/packmagik-edition-parser-v353-20260929
