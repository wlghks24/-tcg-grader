name: V311 UI Bootstrap

on:
  push:
    branches: [ui-v311-clean-polish]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ui-v311-clean-polish
          fetch-depth: 0
      - name: Apply and validate v311 CSS
        shell: bash
        env:
          V311_CSS_B64: ""
        run: |
          python - <<'PY'
          import base64, os
          from pathlib import Path
          p=Path('ui_app_shell_v272.css')
          text=p.read_text(encoding='utf-8')
          marker='/* v311 clean composition refinement.'
          block=base64.b64decode(os.environ['V311_CSS_B64']).decode('utf-8')
          if marker not in text:
              text=text.rstrip()+"\n"+block+"\n"
              p.write_text(text,encoding='utf-8')
          text=p.read_text(encoding='utf-8')
          assert marker in text
          assert text.count('{') == text.count('}')
          assert '--v311-primary:#2563eb' in text
          assert 'body .app-bottom-dock' in text
          assert '.feature-category[open]' in text
          PY
          python -m pytest -q test_ui_app_shell_v272.py test_tablet_runtime_manifest_ui_assets_v254.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add ui_app_shell_v272.css
          if git diff --cached --quiet; then
            echo 'No CSS changes needed'
          else
            git commit -m 'ui: refine clean composition v311'
            git push origin HEAD:ui-v311-clean-polish
          fi
