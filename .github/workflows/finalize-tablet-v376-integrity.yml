name: Finalize Tablet V376 Integrity

on:
  push:
    branches:
      - 'feature/tablet-autonomous-evolution-v376'

permissions:
  contents: write

concurrency:
  group: finalize-tablet-v376-integrity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  finalize:
    if: github.actor == github.repository_owner
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Require exact V376 feature branch ancestry
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_ACTOR}" = "${GITHUB_REPOSITORY_OWNER}"
          test "${GITHUB_REF_NAME}" = "feature/tablet-autonomous-evolution-v376"
          git fetch origin +refs/heads/main:refs/remotes/origin/main
          git merge-base --is-ancestor origin/main HEAD
          test "$(git rev-parse --abbrev-ref HEAD)" != "main"
      - name: Remove one-shot finalizer from final tree
        shell: bash
        run: |
          set -euo pipefail
          git rm -- .github/workflows/finalize-tablet-v376-integrity.yml
      - name: Validate V376 safety contract and sync lineage
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile tablet_autonomous_evolution_v376.py test_tablet_autonomous_evolution_v376.py test_tablet_gpt_tcg_grader_sync_v376.py
          python -m unittest -v test_tablet_autonomous_evolution_v376.py test_tablet_gpt_tcg_grader_sync_v376.py
          mapfile -t sync_tests < <(find . -maxdepth 1 -type f -name 'test_tablet_gpt_tcg_grader_sync_v*.py' -printf '%f\n' | sort -V)
          test "${#sync_tests[@]}" -gt 0
          python -m unittest -v "${sync_tests[@]}"
      - name: Rebuild exact final-tree integrity manifest
        shell: bash
        run: |
          set -euo pipefail
          python static_integrity_manifest.py --write integrity_manifest.json
          python static_integrity_manifest.py --check integrity_manifest.json
          python fault_injection_healing.py --diagnose
          python repository_integrity_guard.py
          git diff --check
      - name: Commit manifest and finalizer deletion only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- integrity_manifest.json .github/workflows/finalize-tablet-v376-integrity.yml
          mapfile -t changed < <(git diff --cached --name-only | sort)
          printf '%s\n' "${changed[@]}"
          test "${#changed[@]}" -eq 2
          test "${changed[0]}" = ".github/workflows/finalize-tablet-v376-integrity.yml"
          test "${changed[1]}" = "integrity_manifest.json"
          git diff --cached --check
          git commit -m 'fix: reconcile V376 safety contract integrity'
          git push origin "HEAD:${GITHUB_REF_NAME}"
