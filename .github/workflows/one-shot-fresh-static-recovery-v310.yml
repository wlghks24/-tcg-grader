name: One Shot Fresh Static Recovery v310

on:
  push:
    branches: ['ops/fresh-static-recovery-v310']
    paths: ['.github/workflows/one-shot-fresh-static-recovery-v310.yml']

permissions:
  contents: write

concurrency:
  group: fresh-static-recovery-v310
  cancel-in-progress: true

jobs:
  recover:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      PYTHONPATH: ${{ github.workspace }}
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUNBUFFERED: '1'
      TCG_HTTP_TIMEOUT: '30'
      TCG_SOURCE_TIMEOUT_CAP: '30'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ops/fresh-static-recovery-v310
          fetch-depth: 2
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'
      - name: Collect fresh validated TCG data
        run: |
          python - <<'PY'
          import json
          import tcg_updater
          data = tcg_updater.update_cycle('github-pages-static-recovery-v310')
          print(json.dumps({'updated_at': data.get('updated_at'), 'auto_update': data.get('auto_update', {})}, ensure_ascii=False, indent=2))
          PY
      - name: Fail closed before candidate publication
        run: |
          python static_data_publish_gate.py --max-social-age-hours 12 --max-report-age-hours 2 --report STATIC_DATA_PUBLISH_REPORT.json
      - name: Commit clean fresh candidate and self-remove helper
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/one-shot-fresh-static-recovery-v310.yml
          git add -- \
            releases.json promo_events.json supplementary_candidates.json social_event_candidates.json \
            purchase_signals.json social_stock_signals.json market_prices.json market_watch.json purchase_sources.json exchange_rates.json \
            grading_company_updates.json graded_photo_candidates.json source_collection_stats.json adaptive_collection_stats.json \
            auto_update_report.json auto_update_issues.json tcg_live_data.json
          python fault_injection_healing.py --manifest
          git add -- integrity_manifest.json
          python fault_injection_healing.py --diagnose
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'data: recover fresh validated TCG static snapshot v310'
          git push origin HEAD:ops/fresh-static-recovery-v310
