name: External Tool Pilot Offline Tests

on:
  pull_request:
    paths:
      - 'execution/external_tool_pilot_v1.py'
      - 'execution/tests/test_external_tool_pilot_v1.py'
      - '.github/workflows/external-tool-pilot-offline.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: external-tool-pilot-offline-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline-only:
    name: External tool policy unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'
      - name: Compile offline-only review code
        run: python -m py_compile execution/external_tool_pilot_v1.py execution/tests/test_external_tool_pilot_v1.py
      - name: Test URL, source, freshness, encoding and bounded comparisons
        run: python -m unittest discover -s execution/tests -p 'test_external_tool_pilot_v1.py' -v
