name: V683 Collection Backlog
on:
  pull_request:
    paths:
      - 'execution/tablet_collection_backlog_v683.py'
      - 'execution/tests/test_collection_backlog_v683.py'
      - '.github/workflows/v683-collection-backlog.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backlog:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - run: python -m unittest -v execution.tests.test_collection_backlog_v683
