name: v282 Integrity Regenerate

on:
  push:
    branches: [qa/runtime-health-transaction-v282]
    paths:
      - 'collection_runtime_health.py'
      - 'test_collection_runtime_health_concurrency_v282.py'
      - '.github/workflows/collection-verification-guard.yml'
      - '.github/workflows/v282-integrity-regenerate.yml'

permissions:
  contents: write

concurrency:
  group: v282-integrity-regenerate
  cancel-in-progress: true

jobs:
  regenerate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: qa/runtime-health-transaction-v282
          fetch-depth: 1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'
      - name: Remove temporary workflow and regenerate final-tree manifest
        run: |
          rm -f .github/workflows/v282-integrity-regenerate.yml
          python - <<'PY'
          from pathlib import Path
          import fault_injection_healing as healing
          root = Path('.').resolve()
          healing.build_integrity_manifest(root, root / 'integrity_manifest.json')
          result = healing.diagnose_integrity(root, root / 'integrity_manifest.json')
          if not result.get('ok'):
              raise SystemExit(f"integrity regeneration failed: {result}")
          print({'checked': result.get('checked'), 'failed': result.get('failed')})
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A integrity_manifest.json .github/workflows/v282-integrity-regenerate.yml
          if git diff --cached --quiet; then
            echo 'No manifest changes to commit'
            exit 0
          fi
          git commit -m 'chore: regenerate v282 integrity manifest'
          git push origin HEAD:qa/runtime-health-transaction-v282
