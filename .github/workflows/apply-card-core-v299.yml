name: Apply Card Core V299

on:
  push:
    branches:
      - fix/card-core-v299-price-separation
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-card-core-v299
  cancel-in-progress: true

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: fix/card-core-v299-price-separation
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.11'
      - name: Apply bounded v299 card price correctness patch
        run: python .github/apply_card_core_v299.py
      - name: Run targeted card correctness regressions
        run: |
          node --check grade_market_flow.js
          python -m py_compile multi_market_price_collector.py
          python -m unittest -v test_card_market_grade_separation_v299.py test_card_probability_ui_v298.py test_market_reference_sources_v130.py test_card_core_crosscheck_v291.py test_card_core_crosscheck_v292.py test_card_core_crosscheck_v295.py test_card_core_provenance_v296.py test_card_market_edition_v297.py
      - name: Commit bounded v299 changes
        run: |
          if git diff --quiet -- grade_market_flow.js multi_market_price_collector.py test_card_market_grade_separation_v299.py integrity_manifest.json; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add grade_market_flow.js multi_market_price_collector.py test_card_market_grade_separation_v299.py integrity_manifest.json
          git commit -m 'Fix graded-vs-raw market separation and half-grade pricing (v299)'
          git push origin HEAD:fix/card-core-v299-price-separation
