name: Apply graded photo hard timeout
# Legacy integrated feature: automatic source mutation is disabled; run manually only.
on:
  workflow_dispatch:

jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Apply patch
        run: python apply_graded_photo_hard_timeout_patch.py
      - name: Syntax check
        run: python -m py_compile graded_photo_multi_source.py
      - name: Unit tests
        run: python -m unittest -v test_graded_photo_multi_source.py
      - name: Commit fix
        run: |
          if git diff --quiet -- graded_photo_multi_source.py; then
            echo "No collector changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "4189826+github-actions[bot]@users.noreply.github.com"
          git add graded_photo_multi_source.py
          git commit -m "fix: hard-timeout graded photo source workers"
          git push
