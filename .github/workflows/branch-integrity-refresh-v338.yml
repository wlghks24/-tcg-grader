name: Branch Integrity Refresh v338

on:
  push:
    branches:
      - fix/gdrive-retention-v338

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/gdrive-retention-v338
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'
      - name: Remove bootstrap and regenerate exact integrity manifest
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/branch-integrity-refresh-v338.yml
          python - <<'PY'
          from pathlib import Path
          import fault_injection_healing as healing
          root = Path('.').resolve()
          healing.build_integrity_manifest(root, root / 'integrity_manifest.json')
          result = healing.diagnose_integrity(root, root / 'integrity_manifest.json')
          if not result.get('ok'):
              raise SystemExit(result)
          print(result)
          PY
      - name: Commit reconciled manifest and remove bootstrap
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A .github/workflows/branch-integrity-refresh-v338.yml integrity_manifest.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'chore: reconcile v338 integrity manifest'
          git push origin HEAD:fix/gdrive-retention-v338
