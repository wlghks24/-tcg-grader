name: Apply graded photo provider merge
# Legacy integrated feature: automatic source mutation is disabled; run manually only.
on:
  workflow_dispatch:

jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - run: python apply_graded_photo_provider_merge.py
      - run: python -m py_compile graded_photo_multi_source.py
      - name: Commit integrated collector
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add graded_photo_multi_source.py
          git diff --cached --quiet || git commit -m "fix: merge graded photo search providers"
          git push
