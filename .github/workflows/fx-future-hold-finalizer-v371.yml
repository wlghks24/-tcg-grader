name: FX Future Timestamp Hold Finalizer v371

on:
  push:
    branches:
      - 'fix/fx-future-hold-v371'

permissions:
  contents: write

concurrency:
  group: fx-future-hold-finalizer-v371
  cancel-in-progress: false

jobs:
  finalize:
    if: github.actor == github.repository_owner
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      BASE_SHA: a00ebfd3888740ee50c5e86c8ee6008fe8a54908
      BRANCH: fix/fx-future-hold-v371
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Require exact current main and patch source
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin +refs/heads/main:refs/remotes/origin/main
          test "$(git rev-parse origin/main)" = "${BASE_SHA}" || { echo BASE_ADVANCED; exit 20; }
          git merge-base --is-ancestor "${BASE_SHA}" HEAD
          python - <<'PY'
          from pathlib import Path

          market=Path('multi_market_price_collector.py')
          text=market.read_text(encoding='utf-8')
          old="FX_MAX_AGE_SECONDS=72*60*60\nFX_MAX_FUTURE_SKEW_SECONDS=6*60*60\n"
          new="FX_MAX_AGE_SECONDS=72*60*60\n"
          if text.count(old)!=1:
              raise SystemExit('MARKET_FX_CONSTANT_DRIFT')
          text=text.replace(old,new,1)
          old="return -FX_MAX_FUTURE_SKEW_SECONDS <= age <= FX_MAX_AGE_SECONDS"
          new="return 0 <= age <= FX_MAX_AGE_SECONDS"
          if text.count(old)!=1:
              raise SystemExit('MARKET_FUTURE_GUARD_DRIFT')
          market.write_text(text.replace(old,new,1),encoding='utf-8')

          updater=Path('update_exchange_rates.py')
          text=updater.read_text(encoding='utf-8')
          old="if not (-6*60*60 <= age <= 72*60*60):"
          new="if not (0 <= age <= 72*60*60):"
          if text.count(old)!=1:
              raise SystemExit('UPDATER_FUTURE_GUARD_DRIFT')
          updater.write_text(text.replace(old,new,1),encoding='utf-8')
          PY
          python -m py_compile multi_market_price_collector.py update_exchange_rates.py
          python -m unittest -v test_fx_failclosed_recovery_v349.py
      - name: Remove bootstrap and commit exact watched patch
        shell: bash
        run: |
          set -euo pipefail
          git rm -- .github/workflows/fx-future-hold-finalizer-v371.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- multi_market_price_collector.py update_exchange_rates.py
          mapfile -t changed < <(git diff --cached --name-only | sort)
          printf '%s\n' "${changed[@]}"
          test "${#changed[@]}" -eq 3
          test "${changed[0]}" = '.github/workflows/fx-future-hold-finalizer-v371.yml'
          test "${changed[1]}" = 'multi_market_price_collector.py'
          test "${changed[2]}" = 'update_exchange_rates.py'
          git diff --cached --check
          git commit -m 'Fix future FX timestamps to fail closed v371'
          echo "PATCH_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Generate Tablet GPT v371 evidence and regression
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import copy, datetime as dt, hashlib, json, os
          from pathlib import Path
          from zoneinfo import ZoneInfo

          root=Path('.')
          source=os.environ['BASE_SHA']
          candidate=os.environ['PATCH_SHA']
          prior_contract=json.loads((root/'TCG_CROSSCHECK/TABLET_GPT_TCG_GRADER_SYNC_CONTRACT_V370.json').read_text(encoding='utf-8'))
          prior_delta=json.loads((root/'TCG_CROSSCHECK/TABLET_GPT/learning_snapshot_v370_delta.json').read_text(encoding='utf-8'))
          built=dt.datetime.now(ZoneInfo('Asia/Seoul')).isoformat(timespec='seconds')
          lesson={
            'lesson_id':'TABLET-GPT-FX-FUTURE-TIMESTAMP-HOLD-V371',
            'subsystem':'market_price_fx_provenance',
            'issue_class':'future_fx_timestamp_was_tolerated_by_producer_and_consumer',
            'trigger_condition':'persisted or provider FX updated_at/source_timestamp is later than the verifier clock',
            'symptom_summary':'the previous six-hour future-skew allowance could classify future-dated FX evidence as fresh even though the safety contract requires future FX to HOLD',
            'root_cause_class':'clock_skew_allowance_conflicted_with_explicit_future_fx_hold_contract',
            'fix_pattern':'reject any future FX observation at both collection and consumption boundaries while retaining the 72-hour maximum age, positive finite rate checks, exact provenance checks and last-good fail-closed behavior',
            'prevention_rule_id':'TGPT-PREV-FX-FUTURE-TIMESTAMP-HOLD',
            'verification_result':'producer_and_consumer_reject_future_timestamp_without_widening_freshness_or_inventing_rates',
            'regression_pass':True,
            'recurrence_count':1,
            'applicable_scope':'both',
            'confidence_level':'high',
            'physical_tablet_runtime_reverification_required':True,
          }
          lessons=[lesson]
          digest=hashlib.sha256(json.dumps(lessons,ensure_ascii=False,sort_keys=True,separators=(',',':')).encode('utf-8')).hexdigest()
          prior_digest=prior_delta['lesson_digest_sha256']
          delta={
            'schema_version':'1.1-tablet-gpt-tcg-grader-learning-sync',
            'namespace':'TABLET_GPT','snapshot_kind':'learning_delta',
            'run_date_kst':built[:10],'built_at':built,'status':'finalized',
            'source_repository':'wlghks24/-tcg-grader',
            'prior_delta':'TCG_CROSSCHECK/TABLET_GPT/learning_snapshot_v370_delta.json',
            'prior_lesson_digest_sha256':prior_digest,
            'source_main_sha':source,
            'share_policy':{
              'explicit_patch_and_learning_lessons_only':True,
              'chatgpt_model_weights_exported':False,
              'raw_grading_calibration_shared':False,
              'device_local_runtime_memory_overwritten':False,
              'peer_verified_never_auto_promotes_local':True,
            },
            'covered_merges':[{'pr':355,'version':'v371-post-merge-fx-future-timestamp-hold-candidate','merge_sha':source}],
            'lesson_digest_sha256':digest,'lessons':lessons,
          }
          dpath=root/'TCG_CROSSCHECK/TABLET_GPT/learning_snapshot_v371_delta.json'
          dpath.write_text(json.dumps(delta,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          receipt={
            'schema_version':'1.1-tablet-gpt-tcg-grader-learning-sync','receiver':'TCG_GRADER',
            'source_namespace':'TABLET_GPT','source_repository':'wlghks24/-tcg-grader',
            'source_main_sha':source,'received_at':built,'status':'SYNCED_VERIFIED',
            'source_snapshots':['TCG_CROSSCHECK/TABLET_GPT/learning_snapshot_v370_delta.json','TCG_CROSSCHECK/TABLET_GPT/learning_snapshot_v371_delta.json'],
            'prior_lesson_digest_sha256':prior_digest,'delta_lesson_digest_sha256':digest,
            'accepted_lesson_ids':[lesson['lesson_id']],
            'alignment_policy':{
              'same_digest_required':True,'same_lesson_ids_required':True,'same_source_main_required_for_delta':True,
              'covered_patch_commits_must_be_ancestors':True,'future_watched_main_changes_require_new_delta':True,
              'pull_request_freshness_check_nonblocking':False,'successor_generation_must_exactly_cover_prior_staleness':True,
              'device_local_learning_state_merge_required':True,'blind_overwrite_forbidden':True,
              'grading_calibration_auto_import_forbidden':True,'peer_verified_never_auto_promotes_local':True,
            },
            'verification':{
              'contract_version':'v371','verification_test':'test_tablet_gpt_tcg_grader_sync_v371.py',
              'verification_mode':'fx_future_timestamp_strict_hold_exact_successor_alignment',
              'verified_result':'TABLET_GPT_TCG_GRADER_MATCH','physical_tablet_runtime_verified':False,
              'physical_drive_readback_verified':False,'device_reverification_required':True,
            },
          }
          rpath=root/'TCG_CROSSCHECK/TCG_GRADER/tablet_gpt_learning_receipt_v371.json'
          rpath.write_text(json.dumps(receipt,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          contract=copy.deepcopy(prior_contract)
          contract['purpose']='bind strict future-FX rejection at collection and consumption boundaries to the next exact Tablet GPT successor generation without weakening provenance, freshness, fail-closed or protected-main checks'
          contract['prior_contract']='TCG_CROSSCHECK/TABLET_GPT_TCG_GRADER_SYNC_CONTRACT_V370.json'
          contract['prior_delta_snapshot']='TCG_CROSSCHECK/TABLET_GPT/learning_snapshot_v370_delta.json'
          contract['delta_snapshot']='TCG_CROSSCHECK/TABLET_GPT/learning_snapshot_v371_delta.json'
          contract['receiver_receipt']='TCG_CROSSCHECK/TCG_GRADER/tablet_gpt_learning_receipt_v371.json'
          contract['verification_test']='test_tablet_gpt_tcg_grader_sync_v371.py'
          contract['rules']['future_fx_timestamp_must_hold']=True
          contract['rules']['fx_future_skew_allowance_forbidden']=True
          contract['rules']['fx_max_age_72h_must_remain_enforced']=True
          contract['current_required_merge_prs']=list(prior_contract['current_required_merge_prs'])+[355]
          contract['prior_required_lesson_count']=prior_contract['current_required_lesson_count']
          contract['delta_required_lesson_count']=1
          contract['current_required_lesson_count']=prior_contract['current_required_lesson_count']+1
          generation=[
            'TCG_CROSSCHECK/TABLET_GPT_TCG_GRADER_SYNC_CONTRACT_V371.json',
            'TCG_CROSSCHECK/TABLET_GPT/learning_snapshot_v371_delta.json',
            'TCG_CROSSCHECK/TCG_GRADER/tablet_gpt_learning_receipt_v371.json',
            'test_tablet_gpt_tcg_grader_sync_v371.py',
          ]
          contract['freshness_watch']['exclude_paths']=[
            '.github/workflows/tablet-gpt-tcg-grader-main-alignment.yml','integrity_manifest.json',*generation
          ]
          contract['candidate_sync']={
            'base_main_sha':source,'candidate_commit':candidate,
            'watched_paths':['multi_market_price_collector.py'],'generation_files':generation,
            'requires_exact_watched_path_match':True,'post_merge_coverage_allowed':True,
          }
          cpath=root/'TCG_CROSSCHECK/TABLET_GPT_TCG_GRADER_SYNC_CONTRACT_V371.json'
          cpath.write_text(json.dumps(contract,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          test=f'''import datetime as dt\nimport hashlib\nimport json\nfrom pathlib import Path\nimport subprocess\nimport unittest\n\nimport multi_market_price_collector as market\nimport update_exchange_rates as updater\n\nROOT=Path(__file__).resolve().parent\nSOURCE={source!r}\nCANDIDATE={candidate!r}\nPRIOR=ROOT/'TCG_CROSSCHECK/TABLET_GPT/learning_snapshot_v370_delta.json'\nDELTA=ROOT/'TCG_CROSSCHECK/TABLET_GPT/learning_snapshot_v371_delta.json'\nRECEIPT=ROOT/'TCG_CROSSCHECK/TCG_GRADER/tablet_gpt_learning_receipt_v371.json'\nPRIOR_CONTRACT=ROOT/'TCG_CROSSCHECK/TABLET_GPT_TCG_GRADER_SYNC_CONTRACT_V370.json'\nCONTRACT=ROOT/'TCG_CROSSCHECK/TABLET_GPT_TCG_GRADER_SYNC_CONTRACT_V371.json'\nEXPECTED_DIGEST={digest!r}\n\ndef read(path): return json.loads(path.read_text(encoding='utf-8'))\n\ndef watched_paths(contract,source,head='HEAD'):\n    watch=contract['freshness_watch']; exact=set(watch['exact_paths']); prefixes=tuple(watch['path_prefixes']); excluded=set(watch['exclude_paths'])\n    changed=subprocess.check_output(['git','diff','--name-only',f'{{source}}..{{head}}'],text=True).splitlines()\n    return sorted(path for path in changed if path not in excluded and (path in exact or path.startswith(prefixes)))\n\nclass TabletGptTcgGraderSyncV371(unittest.TestCase):\n    def test_lineage_digest_receipt_and_merge_anchor(self):\n        prior,delta,receipt,pc,contract=map(read,(PRIOR,DELTA,RECEIPT,PRIOR_CONTRACT,CONTRACT))\n        self.assertEqual(prior['lesson_digest_sha256'],delta['prior_lesson_digest_sha256'])\n        self.assertEqual(delta['prior_lesson_digest_sha256'],receipt['prior_lesson_digest_sha256'])\n        self.assertEqual(SOURCE,delta['source_main_sha']); self.assertEqual(SOURCE,receipt['source_main_sha'])\n        self.assertEqual([355],[row['pr'] for row in delta['covered_merges']]); self.assertEqual(SOURCE,delta['covered_merges'][0]['merge_sha'])\n        self.assertEqual(set(contract['current_required_merge_prs']),set(pc['current_required_merge_prs'])|{{355}})\n        self.assertEqual(pc['current_required_lesson_count'],contract['prior_required_lesson_count'])\n        self.assertEqual(contract['prior_required_lesson_count']+1,contract['current_required_lesson_count'])\n        raw=json.dumps(delta['lessons'],ensure_ascii=False,sort_keys=True,separators=(',',':')); value=hashlib.sha256(raw.encode()).hexdigest()\n        self.assertEqual(EXPECTED_DIGEST,value); self.assertEqual(value,delta['lesson_digest_sha256']); self.assertEqual(value,receipt['delta_lesson_digest_sha256'])\n        self.assertEqual([row['lesson_id'] for row in delta['lessons']],receipt['accepted_lesson_ids'])\n        self.assertEqual('SYNCED_VERIFIED',receipt['status']); self.assertEqual('TABLET_GPT_TCG_GRADER_MATCH',receipt['verification']['verified_result'])\n        self.assertFalse(receipt['verification']['physical_tablet_runtime_verified']); self.assertFalse(receipt['verification']['physical_drive_readback_verified'])\n        subprocess.run(['git','merge-base','--is-ancestor',SOURCE,'HEAD'],check=True); subprocess.run(['git','merge-base','--is-ancestor',CANDIDATE,'HEAD'],check=True)\n\n    def test_exact_candidate_scope_and_complete_generation(self):\n        contract=read(CONTRACT); candidate=contract['candidate_sync']\n        self.assertEqual(SOURCE,candidate['base_main_sha']); self.assertEqual(CANDIDATE,candidate['candidate_commit'])\n        expected=['multi_market_price_collector.py']; self.assertEqual(expected,watched_paths(contract,SOURCE,CANDIDATE)); self.assertEqual(expected,sorted(candidate['watched_paths']))\n        generation={{'TCG_CROSSCHECK/TABLET_GPT_TCG_GRADER_SYNC_CONTRACT_V371.json','TCG_CROSSCHECK/TABLET_GPT/learning_snapshot_v371_delta.json','TCG_CROSSCHECK/TCG_GRADER/tablet_gpt_learning_receipt_v371.json','test_tablet_gpt_tcg_grader_sync_v371.py'}}\n        self.assertEqual(generation,set(candidate['generation_files'])); self.assertTrue(generation.issubset(set(contract['freshness_watch']['exclude_paths'])))\n        self.assertTrue(candidate['requires_exact_watched_path_match']); self.assertTrue(candidate['post_merge_coverage_allowed']); self.assertEqual([],watched_paths(contract,CANDIDATE))\n\n    def test_future_fx_is_strictly_held_at_both_boundaries(self):\n        future=(dt.datetime.now(dt.timezone.utc)+dt.timedelta(minutes=5)).isoformat()\n        self.assertFalse(market._fresh_fx_timestamp(future))\n        raw=[{{'quote':'KRW','rate':1360.0,'updated_at':future}},{{'quote':'JPY','rate':158.1,'updated_at':future}}]\n        with self.assertRaises(ValueError): updater.parse_source_timestamp(raw)\n        market_text=(ROOT/'multi_market_price_collector.py').read_text(encoding='utf-8')\n        updater_text=(ROOT/'update_exchange_rates.py').read_text(encoding='utf-8')\n        self.assertNotIn('FX_MAX_FUTURE_SKEW_SECONDS',market_text); self.assertIn('return 0 <= age <= FX_MAX_AGE_SECONDS',market_text)\n        self.assertNotIn('-6*60*60 <= age',updater_text); self.assertIn('if not (0 <= age <= 72*60*60):',updater_text)\n        rules=read(CONTRACT)['rules']; self.assertIs(rules['future_fx_timestamp_must_hold'],True); self.assertIs(rules['fx_future_skew_allowance_forbidden'],True); self.assertIs(rules['fx_max_age_72h_must_remain_enforced'],True)\n\nif __name__=='__main__': unittest.main(verbosity=2)\n'''
          (root/'test_tablet_gpt_tcg_grader_sync_v371.py').write_text(test,encoding='utf-8')
          PY
          python -m py_compile test_tablet_gpt_tcg_grader_sync_v371.py
          python -m unittest -v test_fx_failclosed_recovery_v349.py test_tablet_gpt_tcg_grader_sync_v371.py
      - name: Regenerate exact final-tree integrity and full sync validation
        shell: bash
        run: |
          set -euo pipefail
          python static_integrity_manifest.py --write integrity_manifest.json
          python static_integrity_manifest.py --check integrity_manifest.json
          python fault_injection_healing.py --diagnose
          python repository_integrity_guard.py
          mapfile -t sync_tests < <(find . -maxdepth 1 -type f -name 'test_tablet_gpt_tcg_grader_sync_v*.py' -printf '%f\n' | sort -V)
          test "${#sync_tests[@]}" -gt 0
          python -m unittest -v "${sync_tests[@]}"
          git diff --check
      - name: Commit generation and manifest then push branch
        shell: bash
        run: |
          set -euo pipefail
          git add -- \
            TCG_CROSSCHECK/TABLET_GPT_TCG_GRADER_SYNC_CONTRACT_V371.json \
            TCG_CROSSCHECK/TABLET_GPT/learning_snapshot_v371_delta.json \
            TCG_CROSSCHECK/TCG_GRADER/tablet_gpt_learning_receipt_v371.json \
            test_tablet_gpt_tcg_grader_sync_v371.py \
            integrity_manifest.json
          mapfile -t changed < <(git diff --cached --name-only | sort)
          printf '%s\n' "${changed[@]}"
          test "${#changed[@]}" -eq 5
          git diff --cached --check
          git commit -m 'Add Tablet GPT v371 FX future-timestamp guard evidence'
          git fetch origin +refs/heads/main:refs/remotes/origin/main
          test "$(git rev-parse origin/main)" = "${BASE_SHA}" || { echo BASE_ADVANCED_BEFORE_PUSH; exit 21; }
          git push origin "HEAD:${BRANCH}"
