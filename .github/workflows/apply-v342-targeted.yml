name: Apply v342 targeted hardening

on:
  push:
    branches: [fix/runtime-hardening-v341]

permissions:
  contents: write

concurrency:
  group: apply-v342-targeted
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Apply idempotent bounded changes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          p=Path('sw.js')
          s=p.read_text(encoding='utf-8')
          s=s.replace('// v324 refreshes tablet/PWA identity runtime while preserving the v276 cache ABI.', '// v342 hardens exact-request offline fallback while preserving the v276 cache ABI.', 1)
          old="async function unavailableResponse(request){\n  const cached=await caches.match(request,{ignoreSearch:true});\n  if(cached)return request.mode==='navigate'?enhanceNavigationResponse(cached):cached;"
          new="async function unavailableResponse(request){\n  const exact=await caches.match(request);\n  if(exact)return request.mode==='navigate'?enhanceNavigationResponse(exact):exact;\n  const cached=await caches.match(request,{ignoreSearch:true});\n  if(cached)return request.mode==='navigate'?enhanceNavigationResponse(cached):cached;"
          if old in s:
              s=s.replace(old,new,1)
          elif new not in s:
              raise SystemExit('sw fallback anchor missing')
          p.write_text(s,encoding='utf-8')

          p=Path('.github/workflows/tablet-gpt-tcg-grader-main-alignment.yml')
          s=p.read_text(encoding='utf-8')
          old="""          contract = json.loads(contract_path.read_text(encoding='utf-8'))
          delta_path = root / contract['delta_snapshot']
          receipt_path = root / contract['receiver_receipt']
          test_path = root / contract['verification_test']
"""
          new="""          contract = json.loads(contract_path.read_text(encoding='utf-8'))
          expected_delta = f'TCG_CROSSCHECK/TABLET_GPT/learning_snapshot_v{version}_delta.json'
          expected_receipt = f'TCG_CROSSCHECK/TCG_GRADER/tablet_gpt_learning_receipt_v{version}.json'
          expected_test = f'test_tablet_gpt_tcg_grader_sync_v{version}.py'
          assert contract['delta_snapshot'] == expected_delta
          assert contract['receiver_receipt'] == expected_receipt
          assert contract['verification_test'] == expected_test
          prior_match = contract_re.fullmatch(Path(contract['prior_contract']).name)
          assert prior_match and int(prior_match.group(1)) < version
          delta_path = root / contract['delta_snapshot']
          receipt_path = root / contract['receiver_receipt']
          test_path = root / contract['verification_test']
"""
          if old in s:
              s=s.replace(old,new,1)
          elif new not in s:
              raise SystemExit('alignment anchor missing')
          p.write_text(s,encoding='utf-8')

          Path('test_runtime_hardening_v341.py').write_text(r'''from pathlib import Path
          import unittest
          ROOT = Path(__file__).resolve().parent
          class RuntimeHardeningV341Tests(unittest.TestCase):
              @classmethod
              def setUpClass(cls):
                  cls.schedule=(ROOT/'TABLET_SCHEDULED_UPDATE.sh').read_text(encoding='utf-8')
                  cls.sw=(ROOT/'sw.js').read_text(encoding='utf-8')
                  cls.alignment=(ROOT/'.github/workflows/tablet-gpt-tcg-grader-main-alignment.yml').read_text(encoding='utf-8')
              def test_scheduler_identity_and_live_migration(self):
                  for token in ('SCHEDULER_VERSION="daily-2300-kst-v2"','pid_matches_mode()','stop_verified_boot_loop()','read_boot_loop_version()','run_and_reconcile_schedule()','ensure_schedule || true','stale-version:$owner:$owner_version'):
                      self.assertIn(token,self.schedule)
                  self.assertIn('run|now) run_and_reconcile_schedule',self.schedule)
              def test_pwa_exact_fallback_precedes_query_agnostic_fallback(self):
                  exact='const exact=await caches.match(request);'
                  broad='const cached=await caches.match(request,{ignoreSearch:true});'
                  self.assertIn(exact,self.sw); self.assertIn(broad,self.sw)
                  self.assertLess(self.sw.index(exact),self.sw.index(broad))
                  self.assertIn("const CACHE='tcg-v276-network-first-runtime'",self.sw)
              def test_sync_generation_binding(self):
                  for token in ("expected_delta = f'TCG_CROSSCHECK/TABLET_GPT/learning_snapshot_v{version}_delta.json'","assert contract['delta_snapshot'] == expected_delta","assert contract['receiver_receipt'] == expected_receipt","assert contract['verification_test'] == expected_test",'int(prior_match.group(1)) < version'):
                      self.assertIn(token,self.alignment)
          if __name__ == '__main__': unittest.main(verbosity=2)
          '''.replace('\n          ','\n').lstrip(),encoding='utf-8')
          PY
      - name: Targeted verification
        shell: bash
        run: |
          set -euo pipefail
          bash -n TABLET_SCHEDULED_UPDATE.sh
          node --check sw.js
          python -m py_compile test_runtime_hardening_v341.py test_tablet_scheduled_update_v256.py
          python -m unittest -v test_runtime_hardening_v341.py test_tablet_scheduled_update_v256.py test_tablet_gpt_tcg_grader_sync_v339.py
      - name: Commit production changes only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sw.js .github/workflows/tablet-gpt-tcg-grader-main-alignment.yml test_runtime_hardening_v341.py
          if git diff --cached --quiet; then
            echo 'No production changes left to commit.'
            exit 0
          fi
          git commit -m 'Harden PWA fallback and Tablet GPT generation binding v342'
          git push origin HEAD:fix/runtime-hardening-v341
