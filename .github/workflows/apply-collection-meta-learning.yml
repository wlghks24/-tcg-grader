name: Apply collection meta learning

# Legacy integrated feature: automatic source mutation is disabled; run manually only.
on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write
  checks: read

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Apply collection learning patch
        run: python apply_collection_meta_learning.py
      - name: Verify syntax
        run: |
          python -m py_compile collection_meta_learning.py adaptive_collection_learner.py auto_pipeline_runner.py
      - name: Run meta learner tests
        run: |
          python test_collection_meta_learning.py
          if [ -f test_multi_channel_agent.py ]; then python test_multi_channel_agent.py; fi
          if [ -f test_fan_social_learning.py ]; then python test_fan_social_learning.py; fi
      - name: Verify integration markers
        run: |
          grep -q 'coverage-gap:' adaptive_collection_learner.py
          grep -q 'collection_meta_learning.refresh_profile' auto_pipeline_runner.py
          grep -q 'collection_meta_learning.json' .gitignore
      - name: Commit integrated changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add adaptive_collection_learner.py auto_pipeline_runner.py .gitignore
          if ! git diff --cached --quiet; then
            git commit -m 'feat: learn collection diversity and coverage gaps'
            GH_TOKEN="${{ github.token }}" bash scripts/publish_candidate_pr.sh
          fi
