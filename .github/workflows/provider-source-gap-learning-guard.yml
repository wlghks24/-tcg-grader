name: Provider Source Gap Learning Guard

on:
  pull_request:
    paths:
      - 'provider_health_learning.py'
      - 'event_gap_learning.py'
      - 'collection_meta_learning.py'
      - 'test_provider_source_gap_learning_v5.py'
      - 'social_event_discovery.py'
      - 'supplementary_discovery.py'
      - 'multi_route_event_discovery.py'
      - 'update_promo_events.py'
      - 'test_promo_event_keyword_coverage_v5.py'
      - 'multi_channel_agent.py'
      - 'auto_pipeline_runner.py'
      - 'adaptive_collection_learner.py'
      - 'test_extended_discovery_channels_v5.py'
      - 'test_source_gap_taxonomy_v6.py'
      - 'test_source_gap_taxonomy_v7.py'
      - 'test_source_gap_taxonomy_v8.py'
      - 'test_source_gap_taxonomy_v9.py'
      - 'test_source_gap_taxonomy_v10.py'
      - 'test_verified_gap_priority_v11.py'
      - 'test_gap_result_event_supersession_v12.py'
      - 'test_verified_multilabel_coverage_v14.py'
      - '.github/workflows/provider-source-gap-learning-guard.yml'
  push:
    branches: [main]
    paths:
      - 'provider_health_learning.py'
      - 'event_gap_learning.py'
      - 'collection_meta_learning.py'
      - 'test_provider_source_gap_learning_v5.py'
      - 'social_event_discovery.py'
      - 'supplementary_discovery.py'
      - 'multi_route_event_discovery.py'
      - 'update_promo_events.py'
      - 'test_promo_event_keyword_coverage_v5.py'
      - 'multi_channel_agent.py'
      - 'auto_pipeline_runner.py'
      - 'adaptive_collection_learner.py'
      - 'test_extended_discovery_channels_v5.py'
      - 'test_source_gap_taxonomy_v6.py'
      - 'test_source_gap_taxonomy_v7.py'
      - 'test_source_gap_taxonomy_v8.py'
      - 'test_source_gap_taxonomy_v9.py'
      - 'test_source_gap_taxonomy_v10.py'
      - 'test_verified_gap_priority_v11.py'
      - 'test_gap_result_event_supersession_v12.py'
      - 'test_verified_multilabel_coverage_v14.py'
      - '.github/workflows/provider-source-gap-learning-guard.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verified-gap-learning:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Compile source-gap and discovery guards
        run: |
          python -m py_compile \
            provider_health_learning.py \
            event_gap_learning.py \
            collection_meta_learning.py \
            update_promo_events.py \
            multi_channel_agent.py \
            multi_route_event_discovery.py \
            social_event_discovery.py \
            auto_pipeline_runner.py \
            adaptive_collection_learner.py \
            test_provider_source_gap_learning_v5.py \
            test_promo_event_keyword_coverage_v5.py \
            test_extended_discovery_channels_v5.py \
            test_source_gap_taxonomy_v6.py \
            test_source_gap_taxonomy_v7.py \
            test_source_gap_taxonomy_v8.py \
            test_source_gap_taxonomy_v9.py \
            test_source_gap_taxonomy_v10.py \
            test_verified_gap_priority_v11.py \
            test_gap_result_event_supersession_v12.py \
            test_verified_multilabel_coverage_v14.py
      - name: Verify candidate and official coverage stay separated
        run: python -m unittest -v test_provider_source_gap_learning_v5.py
      - name: Verify challenge-style official event headlines remain discoverable
        run: python -m unittest -v test_promo_event_keyword_coverage_v5.py
      - name: Verify extended public discovery remains discovery-only
        run: python -m unittest -v test_extended_discovery_channels_v5.py
      - name: Verify stock entry broadcast and Facebook gap taxonomy
        run: python -m unittest -v test_source_gap_taxonomy_v6.py
      - name: Verify deadline status service and community gap taxonomy
        run: python -m unittest -v test_source_gap_taxonomy_v7.py
      - name: Verify rules access registration services and community taxonomy
        run: python -m unittest -v test_source_gap_taxonomy_v8.py
      - name: Verify results purchase policy and service status gap taxonomy
        run: python -m unittest -v test_source_gap_taxonomy_v9.py
      - name: Verify official price product issue and authenticity gap taxonomy
        run: python -m unittest -v test_source_gap_taxonomy_v10.py
      - name: Verify verified-gap priority consumption and freshness aging
        run: python -m unittest -v test_verified_gap_priority_v11.py
      - name: Verify gap-result reservation and official event supersession
        run: python -m unittest -v test_gap_result_event_supersession_v12.py
      - name: Verify bounded multi-label official coverage
        run: python -m unittest -v test_verified_multilabel_coverage_v14.py
