name: Provider Source Gap Learning Guard

on:
  pull_request:
    paths:
      - 'provider_health_learning.py'
      - 'test_provider_source_gap_learning_v5.py'
      - 'social_event_discovery.py'
      - 'supplementary_discovery.py'
      - 'multi_route_event_discovery.py'
      - '.github/workflows/provider-source-gap-learning-guard.yml'
  push:
    branches: [main]
    paths:
      - 'provider_health_learning.py'
      - 'test_provider_source_gap_learning_v5.py'
      - 'social_event_discovery.py'
      - 'supplementary_discovery.py'
      - 'multi_route_event_discovery.py'
      - '.github/workflows/provider-source-gap-learning-guard.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verified-gap-learning:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Compile source-gap learner
        run: python -m py_compile provider_health_learning.py test_provider_source_gap_learning_v5.py
      - name: Verify candidate and official coverage stay separated
        run: python -m unittest -v test_provider_source_gap_learning_v5.py
