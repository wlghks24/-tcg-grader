name: Lenovo Termux PWA Installation V1004
on:
  pull_request:
    paths:
      - 'INSTALL_LENOVO_TCG_V1004.sh'
      - 'test_lenovo_install_v1004.py'
      - 'docs/tablet/LENOVO_INSTALL_V1004.md'
      - '.github/workflows/lenovo-termux-install-v1004.yml'
      - 'integrity_manifest.json'
  push:
    branches: [main]
    paths:
      - 'INSTALL_LENOVO_TCG_V1004.sh'
      - 'test_lenovo_install_v1004.py'
      - '.github/workflows/lenovo-termux-install-v1004.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: lenovo-install-v1004-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    name: Fail-closed installer tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Static shell parse and safe failed installs
        run: |
          bash -n INSTALL_LENOVO_TCG_V1004.sh
          python -m unittest -v test_lenovo_install_v1004
          python -m py_compile test_lenovo_install_v1004.py
      - name: Verify runtime control-plane manifest
        run: |
          python tablet_runtime_manifest.py --check --compile
          python repository_integrity_guard.py
      # This workflow does not execute on an Android tablet.
