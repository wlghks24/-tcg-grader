name: Runtime delivery guard

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'sw.js'
      - 'multi_market_prices.js'
      - 'safe_runtime.py'
      - 'tcg_updater.py'
      - 'tcg_updater_v135.py'
      - 'auto_update_all.py'
      - 'auto_repair_engine.py'
      - 'error_scenario_lab.py'
      - 'scenario_learning_profiles.json'
      - 'validate_external_links.py'
      - 'grading_cert_verifier.py'
      - 'manual_graded_photo_registration.py'
      - 'manual_official_proof.py'
      - 'manual_official_verify_bridge.js'
      - 'pending_official_candidate_v161.py'
      - 'pending_official_candidate_bridge_v161.js'
      - 'graded_photo_multi_source.py'
      - 'card_identity_reference_catalog.json'
      - 'ANDROID_UPDATE_AND_START.sh'
      - 'ANDROID_AUTO_START_INSTALL.sh'
      - 'START_TCG_UPDATER_ANDROID.sh'
      - 'update_market_prices.py'
      - 'test_link_audit_hardening_v184.py'
      - 'test_link_same_host_fallback_v189.py'
      - 'test_psa_official_proof_grade_v187.py'
      - 'test_graded_photo_game_inference_v188.py'
      - 'test_manual_only_official_verification_v192.py'
      - 'test_manual_official_proof.py'
      - 'test_pending_official_candidate_v161.py'
      - 'test_runtime_delivery_guards.py'
      - 'test_runtime_resilience_v182.py'
      - '.github/workflows/runtime-delivery-guard.yml'
  pull_request:
    paths:
      - 'index.html'
      - 'sw.js'
      - 'multi_market_prices.js'
      - 'safe_runtime.py'
      - 'tcg_updater.py'
      - 'tcg_updater_v135.py'
      - 'auto_update_all.py'
      - 'auto_repair_engine.py'
      - 'error_scenario_lab.py'
      - 'scenario_learning_profiles.json'
      - 'validate_external_links.py'
      - 'grading_cert_verifier.py'
      - 'manual_graded_photo_registration.py'
      - 'manual_official_proof.py'
      - 'manual_official_verify_bridge.js'
      - 'pending_official_candidate_v161.py'
      - 'pending_official_candidate_bridge_v161.js'
      - 'graded_photo_multi_source.py'
      - 'card_identity_reference_catalog.json'
      - 'ANDROID_UPDATE_AND_START.sh'
      - 'ANDROID_AUTO_START_INSTALL.sh'
      - 'START_TCG_UPDATER_ANDROID.sh'
      - 'update_market_prices.py'
      - 'test_link_audit_hardening_v184.py'
      - 'test_link_same_host_fallback_v189.py'
      - 'test_psa_official_proof_grade_v187.py'
      - 'test_graded_photo_game_inference_v188.py'
      - 'test_manual_only_official_verification_v192.py'
      - 'test_manual_official_proof.py'
      - 'test_pending_official_candidate_v161.py'
      - 'test_runtime_delivery_guards.py'
      - 'test_runtime_resilience_v182.py'
      - '.github/workflows/runtime-delivery-guard.yml'

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: runtime-delivery-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install runtime test dependency
        run: python -m pip install pillow
      - name: Verify runtime delivery invariants
        run: |
          python test_runtime_delivery_guards.py
          python test_runtime_resilience_v182.py
          python test_link_audit_hardening_v184.py
          python test_link_same_host_fallback_v189.py
          python test_psa_official_proof_grade_v187.py
          python test_graded_photo_game_inference_v188.py
          python test_manual_only_official_verification_v192.py
          python test_manual_official_proof.py
          python test_pending_official_candidate_v161.py
          python -m py_compile safe_runtime.py tcg_updater.py tcg_updater_v135.py update_market_prices.py validate_external_links.py grading_cert_verifier.py manual_graded_photo_registration.py manual_official_proof.py pending_official_candidate_v161.py graded_photo_multi_source.py auto_update_all.py auto_repair_engine.py error_scenario_lab.py
          bash -n ANDROID_UPDATE_AND_START.sh
          bash -n ANDROID_AUTO_START_INSTALL.sh
          bash -n START_TCG_UPDATER_ANDROID.sh
          node --check multi_market_prices.js
          node --check manual_official_verify_bridge.js
          node --check pending_official_candidate_bridge_v161.js
          node --check sw.js
      - name: Verify generated Termux boot supervisor
        run: |
          bash ANDROID_AUTO_START_INSTALL.sh
          bash -n "$HOME/.termux/boot/TCG_AUTO_START.sh"
          grep -q 'api/v135-health' "$HOME/.termux/boot/TCG_AUTO_START.sh"
          grep -q 'sleep 60' "$HOME/.termux/boot/TCG_AUTO_START.sh"
