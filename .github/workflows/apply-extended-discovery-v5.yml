name: Apply Extended Discovery V5

on:
  push:
    branches: [selfrefine/source-gap-learning-v5]
    paths:
      - '.github/workflows/apply-extended-discovery-v5.yml'

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: selfrefine/source-gap-learning-v5
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Extend bounded public discovery routes
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'{path}: expected source block not found; refusing blind patch')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          replace_once(
              'multi_channel_agent.py',
              '''        "KR": ("행사", "이벤트", "콜라보", "프로모", "프로모카드", "출시", "발매", "재발매", "한정", "증정", "대회", "영화"),\n        "JP": ("イベント", "コラボ", "プロモ", "プロモカード", "発売", "再販", "限定", "配布", "大会", "映画"),\n        "US": ("event", "collab", "collaboration", "promo", "promo card", "release", "restock", "exclusive", "giveaway", "tournament", "movie"),''',
              '''        "KR": ("행사", "이벤트", "챌린지", "도전", "개최", "콜라보", "프로모", "프로모카드", "출시", "발매", "재발매", "한정", "증정", "배포", "특전", "대회", "영화"),\n        "JP": ("イベント", "チャレンジ", "開催", "コラボ", "プロモ", "プロモカード", "発売", "再販", "限定", "配布", "特典", "大会", "映画"),\n        "US": ("event", "challenge", "special mission", "distribution", "collab", "collaboration", "promo", "promo card", "release", "restock", "exclusive", "giveaway", "tournament", "movie"),''',
          )

          replace_once(
              'multi_route_event_discovery.py',
              '''        "event": "행사 이벤트 대회 팝업 페스타 체험회 매장대회 월드챔피언십",''',
              '''        "event": "행사 이벤트 챌린지 도전 개최 대회 팝업 페스타 체험회 매장대회 월드챔피언십",''',
          )
          replace_once(
              'multi_route_event_discovery.py',
              '''        "event": "イベント 大会 ポップアップ フェス 体験会 店舗大会",''',
              '''        "event": "イベント チャレンジ 開催 大会 ポップアップ フェス 体験会 店舗大会",''',
          )
          replace_once(
              'multi_route_event_discovery.py',
              '''        "event": "event tournament pop-up festival demo store championship",''',
              '''        "event": "event challenge special mission tournament pop-up festival demo store championship",''',
          )

          replace_once(
              'social_event_discovery.py',
              '''    "youtube.com", "www.youtube.com", "youtu.be",\n}''',
              '''    "youtube.com", "www.youtube.com", "youtu.be",\n    "tiktok.com", "www.tiktok.com",\n    "twitch.tv", "www.twitch.tv",\n}''',
          )
          replace_once(
              'social_event_discovery.py',
              '''        "en": "event collaboration collab promo pop-up movie film release tournament preorder merchandise card",''',
              '''        "en": "event challenge special mission collaboration collab promo distribution giveaway pop-up movie film release tournament preorder merchandise card streaming twitch tiktok",''',
          )
          replace_once(
              'social_event_discovery.py',
              '''        "ja": "イベント コラボ キャンペーン プロモ ポップアップ 映画 劇場版 発売 大会 グッズ カード",''',
              '''        "ja": "イベント チャレンジ 開催 特典 配布 コラボ キャンペーン プロモ ポップアップ 映画 劇場版 発売 大会 グッズ カード",''',
          )
          replace_once(
              'social_event_discovery.py',
              '''        "ko": "행사 이벤트 콜라보 프로모 팝업 팝업스토어 점프샵 JUMP SHOP 슈에이샤 신세계 영화 극장판 개봉 예약 발매 출시 대회 야구 KBO 굿즈 포토카드 브랜드데이 PLAYGO 재배포 재지급 수령 프로모션팩 신사황",''',
              '''        "ko": "행사 이벤트 챌린지 도전 개최 특전 배포 콜라보 프로모 팝업 팝업스토어 점프샵 JUMP SHOP 슈에이샤 신세계 영화 극장판 개봉 예약 발매 출시 대회 야구 KBO 굿즈 포토카드 브랜드데이 PLAYGO 재배포 재지급 수령 프로모션팩 신사황",''',
          )
          replace_once(
              'social_event_discovery.py',
              '''    if host in {"youtube.com", "www.youtube.com"}:\n        if path.startswith("channel/UC"):\n            return "youtube_channel", path.split("/", 1)[1]\n        if path.startswith("@"):\n            return "youtube_handle", path.split("/", 1)[0]\n    return None''',
              '''    if host in {"youtube.com", "www.youtube.com"}:\n        if path.startswith("channel/UC"):\n            return "youtube_channel", path.split("/", 1)[1]\n        if path.startswith("@"):\n            return "youtube_handle", path.split("/", 1)[0]\n    if host in {"tiktok.com", "www.tiktok.com"}:\n        user = path.split("/", 1)[0].lstrip("@")\n        if user and re.fullmatch(r"[A-Za-z0-9_.]{2,30}", user):\n            return "tiktok", user\n    if host in {"twitch.tv", "www.twitch.tv"}:\n        user = path.split("/", 1)[0]\n        if user and user.lower() not in {"directory", "downloads", "jobs", "p", "videos"} and re.fullmatch(r"[A-Za-z0-9_]{2,30}", user):\n            return "twitch", user\n    return None''',
          )
          replace_once(
              'social_event_discovery.py',
              '''                   "platforms": ["x", "instagram", "youtube"],''',
              '''                   "platforms": ["x", "instagram", "youtube", "tiktok", "twitch"],''',
          )
          replace_once(
              'social_event_discovery.py',
              '''    query = f"({base_expr}) (site:x.com OR site:instagram.com OR site:youtube.com)"''',
              '''    query = f"({base_expr}) (site:x.com OR site:instagram.com OR site:youtube.com OR site:tiktok.com OR site:twitch.tv)"''',
          )
          replace_once(
              'social_event_discovery.py',
              '''            host = _host(source); kind = "x" if "x.com" in host or "twitter.com" in host else ("instagram" if "instagram.com" in host else "youtube")''',
              '''            host = _host(source)\n            if "x.com" in host or "twitter.com" in host:\n                kind = "x"\n            elif "instagram.com" in host:\n                kind = "instagram"\n            elif "tiktok.com" in host:\n                kind = "tiktok"\n            elif "twitch.tv" in host:\n                kind = "twitch"\n            else:\n                kind = "youtube"''',
          )
          replace_once(
              'social_event_discovery.py',
              '''                          "status": "무키 공개검색 · 공식 SNS + 팬/컬렉터/유튜버 X/Instagram/YouTube 후보"}''',
              '''                          "status": "무키 공개검색 · 공식 SNS + 팬/컬렉터/크리에이터 X/Instagram/YouTube/TikTok/Twitch 후보"}''',
          )

          replace_once(
              'auto_pipeline_runner.py',
              '''    "youtube.com": "youtube_public_search", "www.youtube.com": "youtube_public_search", "youtu.be": "youtube_public_search",\n}''',
              '''    "youtube.com": "youtube_public_search", "www.youtube.com": "youtube_public_search", "youtu.be": "youtube_public_search",\n    "tiktok.com": "tiktok_public_search", "www.tiktok.com": "tiktok_public_search",\n    "twitch.tv": "twitch_public_search", "www.twitch.tv": "twitch_public_search",\n}''',
          )
          PY
      - name: Compile and run discovery regressions
        run: |
          python -m py_compile \
            multi_channel_agent.py \
            multi_route_event_discovery.py \
            social_event_discovery.py \
            auto_pipeline_runner.py \
            test_extended_discovery_channels_v5.py
          python -m unittest -v test_extended_discovery_channels_v5.py
          python -m unittest -v test_promo_event_keyword_coverage_v5.py
          python -m unittest -v test_provider_source_gap_learning_v5.py
      - name: Commit discovery fixes
        run: |
          if git diff --quiet -- multi_channel_agent.py multi_route_event_discovery.py social_event_discovery.py auto_pipeline_runner.py; then
            echo 'No source change required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add multi_channel_agent.py multi_route_event_discovery.py social_event_discovery.py auto_pipeline_runner.py
          git commit -m 'selfrefine: expand challenge and public creator discovery routes'
          git push origin HEAD:selfrefine/source-gap-learning-v5
