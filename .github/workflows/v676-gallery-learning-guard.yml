name: V676 Unified Gallery and Learning Gap Guard

on:
  pull_request:
    paths:
      - 'execution/gallery/tablet_unified_gallery_v676.html'
      - 'execution/gallery/tablet_unified_gallery_v676.css'
      - 'execution/gallery/tablet_unified_gallery_v676.js'
      - 'execution/tablet_learning_gap_v676.py'
      - 'execution/tests/test_tablet_learning_gap_v676.py'
      - 'execution/tests/test_tablet_unified_gallery_v676.cjs'
      - '.github/workflows/v676-gallery-learning-guard.yml'
      - 'integrity_manifest.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gallery-learning-offline:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONPATH: '.'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Syntax and schema safety
        run: |
          python -B -m py_compile execution/tablet_learning_gap_v676.py execution/tests/test_tablet_learning_gap_v676.py
          node --check execution/gallery/tablet_unified_gallery_v676.js
          node --check execution/tests/test_tablet_unified_gallery_v676.cjs
      - name: Fail-closed neural readiness unit tests
        run: python -B -m unittest -v execution.tests.test_tablet_learning_gap_v676
      - name: Image and card evidence join regression
        run: node --test execution/tests/test_tablet_unified_gallery_v676.cjs
      - name: Protect prior V674 and V675 behavior
        run: |
          python -B -m unittest -v \
            execution.tests.test_tablet_readonly_preflight \
            tcg_reliability.test_china_catalog_v675
