name: Discover Pokemon Products API v205
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/discover-pokemon-products-api-v205.yml'
permissions:
  contents: read
jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Discover official dynamic product data routes
        env:
          TCG_HTTP_TIMEOUT: '30'
        run: |
          python - <<'PY'
          import html, re, urllib.parse, urllib.request
          import update_releases as u

          page='https://www.pokemon-card.com/products/index.html?productType=expansion'
          raw=u.fetch(page)
          print('PAGE_LEN',len(raw))
          print('--- FORM/ACTION/HREF/SCRIPT HINTS ---')
          patterns=[
            r'<form[^>]{0,600}>', r'<script[^>]+src=["\'][^"\']+["\']',
            r'(?:fetch|axios|XMLHttpRequest|\.json|api|productType|products)[^\n<]{0,280}',
            r'(?:data-[a-z0-9_-]+)=["\'][^"\']{0,250}["\']',
          ]
          for pat in patterns:
            seen=[]
            for m in re.findall(pat,raw,re.I):
              text=m if isinstance(m,str) else ' '.join(m)
              text=html.unescape(text)
              if text not in seen:
                seen.append(text)
              if len(seen)>=80: break
            print('\nPATTERN',pat)
            for x in seen: print(x[:1000])

          scripts=[]
          for src in re.findall(r'<script[^>]+src=["\']([^"\']+)["\']',raw,re.I):
            url=urllib.parse.urljoin(page,html.unescape(src))
            if url not in scripts: scripts.append(url)
          print('\n--- SCRIPT URLS ---')
          for x in scripts: print(x)

          print('\n--- SAME HOST SCRIPT ROUTE HINTS ---')
          ua={'User-Agent':u.HEADERS['User-Agent'],'Accept':'*/*'}
          for url in scripts[:30]:
            host=urllib.parse.urlparse(url).hostname
            if host not in {'pokemon-card.com','www.pokemon-card.com'}:
              print('SKIP_EXTERNAL',url); continue
            try:
              req=urllib.request.Request(url,headers=ua)
              with urllib.request.urlopen(req,timeout=20) as r:
                body=r.read(2_000_000).decode('utf-8','replace')
              print('\nSCRIPT',url,'LEN',len(body))
              hints=[]
              for pat in [
                r'[^"\']{0,100}(?:/api/|api/|\.json|ajax|products[^"\']{0,120}|productType[^"\']{0,120})[^"\']{0,220}',
                r'["\']([^"\']*(?:products|product)[^"\']*(?:json|ajax|api)[^"\']*)["\']',
                r'["\']([^"\']*(?:json|ajax|api)[^"\']*(?:products|product)[^"\']*)["\']',
              ]:
                for m in re.findall(pat,body,re.I):
                  text=m if isinstance(m,str) else ' '.join(m)
                  if text not in hints: hints.append(text)
                  if len(hints)>=120: break
              for h in hints[:120]: print('HINT',h[:1000])
            except Exception as exc:
              print('SCRIPT_ERROR',url,type(exc).__name__,str(exc)[:250])
          PY
