name: Apply Official Inventory Lookup
on:
  push:
    branches: [main]
    paths:
      - inventory_lookup.py
      - inventory_lookup.js
      - inventory_lookup.css
      - apply_inventory_lookup_patch.py
      - test_inventory_lookup.py
      - .github/workflows/apply-inventory-lookup.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Apply integration patch
        run: python apply_inventory_lookup_patch.py
      - name: Validate inventory lookup
        run: |
          python -m py_compile inventory_lookup.py tcg_updater.py
          python -m unittest -v test_inventory_lookup.py
          grep -q 'inventory_lookup.js' index.html
          grep -q "/api/inventory-lookup" tcg_updater.py
      - name: Commit generated files
        run: |
          if git diff --quiet -- index.html tcg_updater.py; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html tcg_updater.py
          git commit -m 'feat: integrate official inventory lookup'
          git push
