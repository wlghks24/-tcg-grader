    branches: ['fix/tablet-autonomy-single-run-v377']
permissions:
  contents: write
concurrency:
  group: v377-repair-lineage-finalizer-${{ github.ref }}
  cancel-in-progress: true
jobs:
  finalize:
    if: github.actor == github.repository_owner
