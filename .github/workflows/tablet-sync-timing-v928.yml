name: Tablet Sync Timing Diagnostics V928

on:
  pull_request:
    paths:
      - 'execution/tablet_sync_performance_v928.py'
      - 'execution/tests/test_tablet_sync_performance_v928.py'
      - '.github/workflows/tablet-sync-timing-v928.yml'
      - 'integrity_manifest.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-sync-timing-tests:
    name: V928 offline sync timing parser tests
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Verify bounded log timing and cancellation semantics
        run: python -m unittest -v execution.tests.test_tablet_sync_performance_v928
