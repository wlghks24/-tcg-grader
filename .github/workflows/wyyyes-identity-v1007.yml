name: V1007 WYYYES Independently Verified Card Identity

on:
  pull_request:
    paths:
      - 'wyyyes_market_source.py'
      - 'card_identity_reference_catalog.json'
      - 'update_market_prices_parallel_v260.py'
      - 'execution/tests/test_wyyyes_verified_identity_v1007.py'
      - 'tablet_runtime_manifest.py'
      - '.github/workflows/wyyyes-identity-v1007.yml'
  push:
    branches: [main]
    paths:
      - 'wyyyes_market_source.py'
      - 'card_identity_reference_catalog.json'
      - 'update_market_prices_parallel_v260.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reviewed-identity:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: V1007 production collector and negative-identity regressions
        run: |
          set -euo pipefail
          python -m py_compile wyyyes_market_source.py update_market_prices_parallel_v260.py
          python -m unittest -v execution.tests.test_wyyyes_verified_identity_v1007 test_wyyyes_market_source_v267 test_market_source_hub_v268
