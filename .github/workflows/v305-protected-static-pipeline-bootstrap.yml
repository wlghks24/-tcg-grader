name: Protected Static Data Pipeline v305 Manifest Reconcile

on:
  pull_request:
    paths:
      - '.github/workflows/v305-protected-static-pipeline-bootstrap.yml'
      - '.github/workflows/tcg-static-data-refresh.yml'
      - '.github/workflows/gpt-tcg-drive-package.yml'
      - '.github/workflows/repository-integrity-guard.yml'
      - 'test_protected_static_pipeline_v305.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  reconcile:
    if: github.event_name == 'pull_request' && github.head_ref == 'fix/protected-static-data-pipeline-v305'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact PR head branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'

      - name: Run targeted v305 regression
        run: python -m unittest -v test_protected_static_pipeline_v305.py

      - name: Build final-surface integrity manifest without temporary bootstrap files
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/v305-protected-static-pipeline-bootstrap.yml v305_apply_protected_static_pipeline.py
          python fault_injection_healing.py --manifest
          python fault_injection_healing.py --diagnose
          python -m json.tool integrity_manifest.json >/dev/null
          git diff --check

      - name: Commit manifest only
        shell: bash
        run: |
          set -euo pipefail
          git restore --staged . 2>/dev/null || true
          git add -- integrity_manifest.json
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'integrity manifest already matches final v305 surface'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore: reconcile v305 integrity manifest'
          git push origin "HEAD:${GITHUB_HEAD_REF}"
