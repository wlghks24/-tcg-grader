name: TCG V001-V879 Reviewed Evidence Matrix

# Historical evidence inventory ONLY. No source mutation, merge, publish, or tablet.
on:
  pull_request:
    paths:
      - 'execution/version_review_matrix.py'
      - 'execution/tests/test_version_review_matrix.py'
      - 'execution/version_review_findings.py'
      - 'execution/historical_v31_v100_forensics.py'
      - 'execution/tests/test_historical_v31_v100_forensics.py'
      - 'execution/historical_v101_v109_forensics.py'
      - 'execution/tests/test_historical_v101_v109_forensics.py'
      - 'execution/tests/test_version_review_findings.py'
      - 'execution/evidence/version_review_findings_v001_v879.json'
      - 'docs/tablet/V001_V879_CONTINUITY_REVIEW_PLAN.md'
      - '.github/workflows/tcg-version-review-matrix.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evidence:
    name: Nine-window 879-slot review-gap gate
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'
      - name: Syntax and isolated matrix regressions
        run: |
          python -m py_compile execution/version_window_audit.py execution/version_review_matrix.py execution/tests/test_version_review_matrix.py
          python -m unittest discover -s execution/tests -p 'test_version_review_matrix.py' -v
          python -m unittest discover -s execution/tests -p 'test_version_review_findings.py' -v
          python -m unittest discover -s execution/tests -p 'test_historical_v31_v100_forensics.py' -v
          python -m unittest discover -s execution/tests -p 'test_historical_v101_v109_forensics.py' -v
      - name: Verify pinned original Git history has no fabricated release approvals
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .tmp
          python execution/historical_v31_v100_forensics.py > .tmp/w001_original_forensics.json
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path(".tmp/w001_original_forensics.json").read_text("utf-8"))
          assert r["original_root_file_count"] == 8
          assert len(r["v31"]["missing_in_first_commit_icons"]) == 3
          assert r["v31"]["report_claims_icon_fix"] is True
          assert r["v100"]["metadata_version"] == 1
          assert r["v100"]["build_label_vs_metadata"] == "MISMATCH"
          assert r["v100"]["explicit_real_photo_limitation"] is True
          assert r["v100"]["real_photo_accuracy_verified"] is False
          assert r["quality_score"] is None and not r["device_verified"]
          print("W001: original v31 PWA asset gap and V100 synthetic report caveat independently reproduced")
          PY
      - name: Inspect V101-V109 pinned reports without executing legacy scripts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .tmp
          python execution/historical_v101_v109_forensics.py > .tmp/w101_report_forensics.json
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path(".tmp/w101_report_forensics.json").read_text("utf-8"))
          assert r["reviewed_historical_report_count"] == 9
          assert r["v101"]["calibration_adopted"] is False
          assert r["v104"]["hardware_camera_verified"] is False
          assert r["v105_v107"]["real_social_credentials_exercised"] is False
          assert r["v108"]["files_scanned"] == 200
          assert r["v108"]["officially_verified_certifications"] == 1
          assert r["v108"]["training_rows_written"] == 0
          assert r["complete_code_reviews"] == 0
          assert r["quality_score"] is None and r["device"] == "DEVICE_UNVERIFIED"
          print("W101: nine pinned report claims analyzed; no device or complete per-version PASS")
          PY
      - name: Build nine immutable-head inventory previews and 879-slot matrix
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .tmp
          previous=""
          for start in 1 101 201 301 401 501 601 701 801; do
            end=$((start + 99))
            target=$(printf '.tmp/window_v%03d_v%03d.json' "$start" "$end")
            if [ -z "$previous" ]; then
              python execution/version_window_audit.py --start "$start" > "$target"
            else
              python execution/version_window_audit.py --start "$start" --previous "$previous" > "$target"
            fi
            previous="$target"
          done
          python execution/version_review_matrix.py --checkpoint-dir .tmp --end-version 879 > .tmp/review_matrix.json
          python execution/version_review_findings.py --latest 879 > .tmp/finding_carry.json
          python - <<'PY'
          import json
          from pathlib import Path
          obj=json.loads(Path(".tmp/review_matrix.json").read_text("utf-8"))
          assert len(obj["window_reviews"]) == 9
          assert len(obj["version_reviews"]) == 879
          assert sum(w["numeric_slots"] for w in obj["window_reviews"]) == 879
          assert obj["window_reviews"][-1]["last"] == 879
          assert all(w["result"] == "NOT_AUDITED" for w in obj["window_reviews"])
          assert all(v["quality_score"] is None for v in obj["version_reviews"])
          assert all(v["current_head_behavior_tests"] == "NOT_VERIFIED" for v in obj["version_reviews"])
          assert obj["physical_tablet_verified"] is False
          for w in obj["window_reviews"]:
              print("REVIEW_GAP",w["first"],w["last"],
                    "token_leads",w["slots_with_main_token_lead"],
                    "without_token_leads",w["slots_without_main_token_lead"],
                    "individually_reviewed",w["individually_completed_code_reviews"],
                    "QUALITY_NOT_RATED")
          ledger=json.loads(Path(".tmp/finding_carry.json").read_text("utf-8"))
          assert ledger["finding_count"] == 17
          assert len(ledger["test_reference_paths"]) >= 2
          assert ledger["test_references_are_execution_proof"] is False
          assert ledger["test_reference_missing_in_checked_head"] == 2
          assert len(ledger["window_carry_forward"]) == 9
          assert ledger["complete_version_reviews"] == 0
          assert ledger["quality_score"] is None
          assert ledger["release_approval"] is False
          assert ledger["device"] == "DEVICE_UNVERIFIED"
          for item in ledger["window_carry_forward"]:
              print("FINDING_CARRY",item["first"],item["last"],
                    "open",len(item["open_carry_forward_ids"]),
                    "history",len(item["historical_repair_record_ids"]))
          print("PASS: 9 contiguous windows, 879 explicit evidence gaps, 17 scoped findings carried; no release or device certified")
          PY
