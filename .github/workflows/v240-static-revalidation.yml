name: One-shot v240 static revalidation

on:
  push:
    branches: [selfrefine/sre-performance-v240]
    paths:
      - 'v240_static_revalidation_patch.py'
      - 'test_sre_runtime_performance_v240.py'
      - '.github/workflows/v240-static-revalidation.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: selfrefine/sre-performance-v240
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'
      - name: Apply ETag revalidation patch
        run: python v240_static_revalidation_patch.py
      - name: Verify performance regression
        run: |
          python -m py_compile tcg_updater.py runtime_sre_metrics.py test_sre_runtime_performance_v240.py
          python -m unittest -v test_sre_runtime_performance_v240.py
      - name: Commit verified patch and remove helpers
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm v240_static_revalidation_patch.py .github/workflows/v240-static-revalidation.yml
          git add tcg_updater.py test_sre_runtime_performance_v240.py runtime_sre_metrics.py
          git commit -m 'perf: add coherent static ETag revalidation'
          git push origin HEAD:selfrefine/sre-performance-v240
