name: Card Precision v321

on:
  push:
    branches:
      - fix/card-edition-consensus-valuation-v321

permissions:
  contents: write

jobs:
  harden-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install OCR image dependency
        run: python -m pip install --disable-pip-version-check pillow
      - name: Apply v321 precision patch
        run: python apply_card_precision_v321.py
      - name: Targeted card regressions
        run: |
          python -m py_compile card_identity_recognition.py card_grading_valuation.py verify_current_runtime.py test_card_precision_v321.py
          node --check card_identity_recognition.js
          python -m unittest -v \
            test_card_precision_v321.py \
            test_card_identity_ambiguity_v320.py \
            test_card_region_conflict_failclosed_v318.py \
            test_card_identity_market_precision_v309.py \
            test_card_core_provenance_v296.py \
            test_card_core_crosscheck_v292.py \
            test_multi_market_price_collector.py
          node verify_pokemon_generation_runtime.js
      - name: Remove bootstrap files and regenerate integrity manifest
        run: |
          rm -f apply_card_precision_v321.py .github/workflows/card-precision-v321.yml
          python - <<'PY'
          from fault_injection_healing import build_integrity_manifest, MANIFEST_PATH
          build_integrity_manifest(target=MANIFEST_PATH)
          print('integrity manifest regenerated')
          PY
      - name: Final repository verification
        run: |
          python repository_integrity_guard.py
          python -m unittest -v \
            test_card_precision_v321.py \
            test_card_identity_ambiguity_v320.py \
            test_card_region_conflict_failclosed_v318.py \
            test_card_identity_market_precision_v309.py \
            test_card_core_provenance_v296.py \
            test_card_core_crosscheck_v291.py \
            test_card_core_crosscheck_v292.py \
            test_card_core_crosscheck_v295.py \
            test_card_market_edition_v297.py \
            test_card_probability_ui_v298.py \
            test_card_regression_gate_v299.py \
            test_card_tablet_runtime_v300.py \
            test_card_edition_precision_v302.py \
            test_card_region_generation_precision_v306.py \
            test_multi_market_price_collector.py
          python security_self_audit.py --no-memory --fail-on high
          python verify_current_runtime.py --passes 1
          git diff --check
      - name: Commit verified v321 tree
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No changes to commit'
            exit 1
          fi
          git commit -m 'fix: harden edition consensus and exact-grade provenance v321'
          git push origin HEAD:fix/card-edition-consensus-valuation-v321
