name: Apply manual-only collector v194

on:
  push:
    branches: [main]
    paths:
      - 'apply_manual_only_collector_v194.py'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependency
        run: python -m pip install pillow
      - name: Apply v194
        run: python apply_manual_only_collector_v194.py
      - name: Verify manual-only collector
        run: |
          python test_manual_only_official_verification_v192.py
          python test_manual_official_proof.py
          python test_psa_official_proof_grade_v187.py
          python -m py_compile graded_photo_multi_source.py grading_cert_verifier.py manual_graded_photo_registration.py manual_official_proof.py
          node --check manual_official_verify_bridge.js
          git diff --check
      - name: Commit runtime changes
        run: |
          if git diff --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add graded_photo_multi_source.py test_manual_only_official_verification_v192.py
          git commit -m 'fix: remove collector auto-cert path and stale trust v194'
          git push
