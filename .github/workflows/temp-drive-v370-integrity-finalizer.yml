name: TEMP Drive v370 Integrity Finalizer

on:
  push:
    branches: [fix/drive-package-freshness-v370]
    paths:
      - '.github/workflows/temp-drive-v370-integrity-finalizer.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: temp-drive-v370-integrity-finalizer
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'
      - name: Verify successor and build exact future manifest
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile test_tablet_gpt_tcg_grader_sync_v370.py
          python -m unittest -v test_tablet_gpt_tcg_grader_sync_v370.py
          temp='.github/workflows/temp-drive-v370-integrity-finalizer.yml'
          git rm --cached -- "$temp"
          python static_integrity_manifest.py --write integrity_manifest.json
          python static_integrity_manifest.py --check integrity_manifest.json
          python fault_injection_healing.py --diagnose
          git reset HEAD -- "$temp"
          git status --short
          git diff --check
      - name: Commit only verified integrity manifest
        shell: bash
        run: |
          set -euo pipefail
          git add -- integrity_manifest.json
          if git diff --cached --quiet; then
            echo 'integrity manifest already exact'
            exit 0
          fi
          if git diff --cached --name-only | grep -vFx 'integrity_manifest.json'; then
            echo 'unexpected staged path' >&2
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'integrity: reconcile Drive freshness v370 successor'
          git push origin HEAD:refs/heads/fix/drive-package-freshness-v370
