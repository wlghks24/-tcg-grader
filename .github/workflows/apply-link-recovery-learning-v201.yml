name: Apply Link Recovery Learning v201
on:
  push:
    branches: [main]
    paths:
      - 'apply_link_recovery_learning_v201.py'
      - '.github/workflows/apply-link-recovery-learning-v201.yml'
permissions:
  contents: write
jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply learned link-recovery patch
        run: python apply_link_recovery_learning_v201.py
      - name: Compile patched modules
        run: python -m py_compile update_purchase_sources.py validate_external_links.py test_link_recovery_learning_v201.py
      - name: Run regression tests
        run: |
          python test_link_audit_hardening_v184.py
          python test_link_same_host_fallback_v189.py
          python test_link_recovery_learning_v201.py
      - name: Check diff
        run: git diff --check
      - name: Commit validated recovery changes
        run: |
          if git diff --quiet -- update_purchase_sources.py validate_external_links.py; then
            echo 'No patch changes needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add update_purchase_sources.py validate_external_links.py
          git commit -m 'fix: learn redirect and template route recovery v201'
          git push origin HEAD:main
