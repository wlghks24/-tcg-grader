name: Apply manual-only UI cleanup v197

on:
  push:
    branches: [main]
    paths:
      - 'apply_manual_only_ui_cleanup_v197.py'
      - '.github/workflows/apply-manual-only-ui-cleanup-v197.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply v197
        run: python apply_manual_only_ui_cleanup_v197.py
      - name: Verify JavaScript syntax
        run: |
          node --check auto_validation_flow.js
          node --check graded_photo_dashboard.js
      - name: Verify manual-only UI contract
        run: |
          python - <<'PY'
          from pathlib import Path
          a=Path('auto_validation_flow.js').read_text(encoding='utf-8')
          g=Path('graded_photo_dashboard.js').read_text(encoding='utf-8')
          for forbidden in ('인증번호 자동검증','인증번호 공식 자동확인','/api/verify-grading-cert','async function verify()'):
              assert forbidden not in a, forbidden
          for required in ('🔐 공식 인증 수동확인','자동 인증조회는 사용하지 않습니다.','공식 조회 열기','https://break.co.kr/certification/'):
              assert required in a, required
          assert '등급사 공식 인증조회로 교차검증합니다.' not in g
          assert '등급사 공식사이트는 사용자가 직접 확인해 검증합니다.' in g
          PY
      - name: Verify clean patch
        run: git diff --check
      - name: Commit runtime UI cleanup
        run: |
          if git diff --quiet -- auto_validation_flow.js graded_photo_dashboard.js; then
            echo 'No runtime change needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add auto_validation_flow.js graded_photo_dashboard.js
          git commit -m 'ui: remove stale automatic cert controls v197'
          git push origin HEAD:main
