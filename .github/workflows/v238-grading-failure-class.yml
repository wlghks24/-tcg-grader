name: One-shot v238 grading source failure classification

on:
  push:
    branches:
      - selfrefine/psa-bgs-official-source-v238
    paths:
      - '.github/workflows/v238-grading-failure-class.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: selfrefine/psa-bgs-official-source-v238
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'
      - name: Apply failure classification
        run: python v238_grading_failure_class_repair.py
      - name: Run grading regression
        run: |
          set -euo pipefail
          python -m py_compile grading_company_watch.py test_grading_company_watch_v215.py
          python -m unittest -v test_grading_company_watch_v215.py test_grading_watch_integration_v220.py
      - name: Commit failure classification
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add grading_company_watch.py test_grading_company_watch_v215.py
          git commit -m 'fix: classify blocked grading source failures'
          git push origin HEAD:selfrefine/psa-bgs-official-source-v238
