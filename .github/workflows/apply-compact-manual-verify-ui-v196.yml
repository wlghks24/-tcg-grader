name: Apply compact manual verify UI v196

on:
  push:
    branches: [main]
    paths:
      - 'apply_compact_manual_verify_ui_v196.py'
      - '.github/workflows/apply-compact-manual-verify-ui-v196.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply v196
        run: python apply_compact_manual_verify_ui_v196.py
      - name: Verify JavaScript syntax
        run: node --check manual_official_verify_bridge.js
      - name: Verify compact UI contract
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('manual_official_verify_bridge.js').read_text(encoding='utf-8')
          assert '자동 인증조회 OFF · 공식사이트 직접확인' not in s
          assert '현재 직접확인이 필요한 완성된 인증정보 항목이 없습니다.' not in s
          assert '수동확인 통합관리:' not in s
          assert "if(!rows.length){box.hidden=true;box.innerHTML='';return}" in s
          for text in ('① 공식조회 열기','② 확인화면 선택','③ 검증완료 등록','잘못등록 삭제/취소'):
              assert text in s, text
          PY
      - name: Verify clean patch
        run: git diff --check
      - name: Commit runtime UI fix
        run: |
          if git diff --quiet -- manual_official_verify_bridge.js; then
            echo 'No runtime change needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add manual_official_verify_bridge.js
          git commit -m 'ui: compact manual verification panel v196'
          git push origin HEAD:main
