name: V317 Full Repo Diagnostic Audit

on:
  push:
    branches: [audit/full-repo-v317]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Repository-wide structural and security audit
        shell: bash
        run: |
          python - <<'PY'
          import ast, json, re, subprocess
          from collections import Counter
          from pathlib import Path

          root=Path('.')
          tracked=subprocess.check_output(['git','ls-files'], text=True).splitlines()
          py=[Path(p) for p in tracked if p.endswith('.py')]
          js=[Path(p) for p in tracked if p.endswith('.js')]
          sh=[Path(p) for p in tracked if p.endswith('.sh')]
          jsn=[Path(p) for p in tracked if p.endswith('.json')]
          yml=[Path(p) for p in tracked if p.startswith('.github/workflows/') and p.endswith(('.yml','.yaml'))]

          failures=[]; warnings=[]
          excluded_parts={'.git','__pycache__','.venv','venv','node_modules','.precollect_stage','.tcg_runtime_preserved','.tcg_last_good'}
          def active(path): return not any(part in excluded_parts for part in path.parts)

          for path in py:
            if not active(path): continue
            text=path.read_text(encoding='utf-8-sig')
            try: tree=ast.parse(text, filename=str(path))
            except SyntaxError as exc:
              failures.append(f'PY_SYNTAX {path}:{exc.lineno} {exc.msg}'); continue
            if not path.name.startswith('test_') and 'archive' not in {p.lower() for p in path.parts}:
              names=[n.name for n in tree.body if isinstance(n,(ast.FunctionDef,ast.AsyncFunctionDef,ast.ClassDef))]
              dup=sorted(k for k,c in Counter(names).items() if c>1)
              if dup: failures.append(f'DUP_TOP_LEVEL {path}: {dup}')
            for node in ast.walk(tree):
              if not isinstance(node, ast.Call): continue
              try: name=ast.unparse(node.func)
              except Exception: name=''
              if name in {'eval','exec','os.system','pickle.load','pickle.loads','marshal.loads'}:
                failures.append(f'DANGEROUS_CALL {path}:{getattr(node,"lineno",1)} {name}')
              if name=='yaml.load':
                loader=None
                for kw in node.keywords:
                  if kw.arg=='Loader':
                    try: loader=ast.unparse(kw.value)
                    except Exception: loader='?'
                if loader not in {'yaml.SafeLoader','SafeLoader'}:
                  failures.append(f'UNSAFE_YAML_LOAD {path}:{getattr(node,"lineno",1)} loader={loader}')
              if name in {'subprocess.run','subprocess.Popen','subprocess.call','subprocess.check_output'}:
                for kw in node.keywords:
                  if kw.arg=='shell' and isinstance(kw.value,ast.Constant) and kw.value.value is True:
                    failures.append(f'SHELL_TRUE {path}:{getattr(node,"lineno",1)}')
              if name in {'requests.get','requests.post','requests.request','httpx.get','httpx.post','httpx.request'}:
                for kw in node.keywords:
                  if kw.arg=='verify' and isinstance(kw.value,ast.Constant) and kw.value.value is False:
                    failures.append(f'TLS_VERIFY_FALSE {path}:{getattr(node,"lineno",1)}')
            for node in ast.walk(tree):
              if isinstance(node, ast.ExceptHandler) and len(node.body)==1 and isinstance(node.body[0],ast.Pass):
                warnings.append(f'SILENT_EXCEPT {path}:{getattr(node,"lineno",1)}')

          def no_dupe_pairs(pairs):
            out={}
            for k,v in pairs:
              if k in out: raise ValueError(f'duplicate JSON key {k!r}')
              out[k]=v
            return out
          def reject_const(v): raise ValueError(f'non-finite JSON constant {v}')
          for path in jsn:
            if not active(path): continue
            try:
              json.loads(path.read_text(encoding='utf-8-sig'), object_pairs_hook=no_dupe_pairs, parse_constant=reject_const)
            except Exception as exc: failures.append(f'JSON_STRICT {path}: {type(exc).__name__}: {exc}')

          for path in js:
            if not active(path): continue
            rc=subprocess.run(['node','--check',str(path)], text=True, capture_output=True)
            if rc.returncode: failures.append(f'JS_SYNTAX {path}: {rc.stderr.strip()[:300]}')
          for path in sh:
            if not active(path): continue
            rc=subprocess.run(['bash','-n',str(path)], text=True, capture_output=True)
            if rc.returncode: failures.append(f'SH_SYNTAX {path}: {rc.stderr.strip()[:300]}')

          sha40=re.compile(r'^[0-9a-fA-F]{40}$')
          try:
            import yaml
          except ImportError:
            subprocess.check_call(['python','-m','pip','install','--disable-pip-version-check','pyyaml'])
            import yaml
          for path in yml:
            try: data=yaml.safe_load(path.read_text(encoding='utf-8-sig'))
            except Exception as exc:
              failures.append(f'YAML_PARSE {path}: {exc}'); continue
            def walk(v):
              if isinstance(v,dict):
                for k,x in v.items():
                  if k=='uses' and isinstance(x,str) and not x.startswith(('./','docker://')):
                    ref=x.rsplit('@',1)[1] if '@' in x else ''
                    if not sha40.fullmatch(ref): failures.append(f'UNPINNED_ACTION {path}: {x}')
                  walk(x)
              elif isinstance(v,list):
                for x in v: walk(x)
            walk(data)

          secret_re=re.compile(r'''(?ix)\b(api[_-]?key|access[_-]?token|bearer[_-]?token|client[_-]?secret|github[_-]?token|password)\b\s*[:=]\s*[\"']([^\"'\n]{12,})[\"']''')
          for p in (Path(x) for x in tracked):
            if not active(p) or p.suffix.lower() not in {'.py','.js','.html','.json','.yml','.yaml','.sh','.bat','.ps1'}: continue
            try: text=p.read_text(encoding='utf-8-sig', errors='replace')
            except OSError: continue
            for m in secret_re.finditer(text):
              value=m.group(2)
              if not any(tok in value for tok in ('${{','${','example','dummy','placeholder','changeme','REDACTED')):
                failures.append(f'EMBEDDED_SECRET_LITERAL {p}:{text[:m.start()].count(chr(10))+1} {m.group(1)}')

          print(f'files: py={len(py)} js={len(js)} sh={len(sh)} json={len(jsn)} workflows={len(yml)}')
          print(f'warnings={len(warnings)} failures={len(failures)}')
          for x in warnings[:80]: print('WARN',x)
          for x in failures: print('FAIL',x)
          if failures: raise SystemExit(1)
          PY
