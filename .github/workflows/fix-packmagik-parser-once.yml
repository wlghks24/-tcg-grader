name: One-shot Pack Magik parser repair

on:
  push:
    branches:
      - fix/packmagik-psa-fallback-20260929

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/packmagik-psa-fallback-20260929
          fetch-depth: 2
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'
      - name: Apply exact parser repair and regression test
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('update_market_prices.py')
          text = path.read_text(encoding='utf-8')
          anchor = '''def kream_label_prices(text:str,label_pattern:str,low:int,high:int,limit:int=12)->list[int]:
              """Read public KREAM transaction rows without mistaking release/shipping prices."""
              values=[int(value.replace(',','')) for value in re.findall(label_pattern+r'\\s*([0-9,]+)원',text,re.I)]
              return [value for value in values if low<=value<=high][:max(1,min(int(limit),30))]
          '''
          helper = '''def kream_label_prices(text:str,label_pattern:str,low:int,high:int,limit:int=12)->list[int]:
              """Read public KREAM transaction rows without mistaking release/shipping prices."""
              values=[int(value.replace(',','')) for value in re.findall(label_pattern+r'\\s*([0-9,]+)원',text,re.I)]
              return [value for value in values if low<=value<=high][:max(1,min(int(limit),30))]

          def packmagik_card_market_price(text:str,card_number:str,card_name:str)->str|None:
              """Read one named card's public Pack Magik market value without crossing into a neighbour card."""
              if not text or not card_number or not card_name:
                  return None
              for match in re.finditer(re.escape(card_number),text,re.I):
                  start=max(0,match.start()-220);end=min(len(text),match.end()+220)
                  window=text[start:end]
                  if re.search(re.escape(card_name),window,re.I) is None:
                      continue
                  price=re.search(r'(?:Market(?:\\s+Value)?|시장가)\\s*\\$([0-9]+(?:\\.[0-9]+)?)',window,re.I)
                  if price:
                      return price.group(1)
              return None
          '''
          if anchor not in text:
              raise SystemExit('kream helper anchor not found')
          text = text.replace(anchor, helper, 1)

          old = '''    try:
                  url='https://www.packmagik.com/cards/op-op14-op14-009-p1';text=html_to_text(fetch(url))
                  m=re.search(r'(?:Market|시장가)\\s*\\$([0-9]+(?:\\.[0-9]+)?)',text,re.I)
                  if m:set_price(db,'KR|창해의 칠걸|HIT','$'+m.group(1),'OP14-009 패러렐 국제판 참고시세','Pack Magik 국제시장','한국판 실거래 아님 · 국제판 시장가 참고',url)
                  else: errors.append('Pack Magik OP14-009: 가격 패턴 0건')
              except NETWORK_ERRORS as e: errors.append('Pack Magik OP14-009: '+diagnostic_exception(e))
          '''
          new = '''    try:
                  url='https://www.packmagik.com/sets/op-op14-en';text=html_to_text(fetch(url))
                  market=packmagik_card_market_price(text,'OP14-009','Trafalgar Law')
                  if market:set_price(db,'KR|창해의 칠걸|HIT','$'+market,'OP14-009 패러렐 국제판 참고시세','Pack Magik 국제시장','한국판 실거래 아님 · 국제판 시장가 참고',url)
                  else: errors.append('Pack Magik OP14-009: 가격 패턴 0건')
              except NETWORK_ERRORS as e: errors.append('Pack Magik OP14-009: '+diagnostic_exception(e))
          '''
          if old not in text:
              raise SystemExit('Pack Magik block anchor not found')
          path.write_text(text.replace(old,new,1),encoding='utf-8')

          Path('test_packmagik_market_parser_v353.py').write_text('''import unittest\n\nimport update_market_prices as market\n\n\nclass PackMagikMarketParserTests(unittest.TestCase):\n    def test_market_label_is_card_local(self):\n        text = "Other Card OP14-001 Market $999.99 Trafalgar Law [Alt Art] The Azure Sea's Seven OP14-009 Market $17.15 PSA 10 $66.50"\n        self.assertEqual(market.packmagik_card_market_price(text, "OP14-009", "Trafalgar Law"), "17.15")\n\n    def test_market_value_label_is_supported(self):\n        text = "Trafalgar Law [Alternate Art] Azure Sea's Seven [Japanese] OP14-009 Market Value $11.49 PSA 10 $63.20"\n        self.assertEqual(market.packmagik_card_market_price(text, "OP14-009", "Trafalgar Law"), "11.49")\n\n    def test_wrong_card_is_not_reused(self):\n        text = "Nami OP14-031 Market $74.53 Trafalgar Law OP14-001 Market $19.99"\n        self.assertIsNone(market.packmagik_card_market_price(text, "OP14-009", "Trafalgar Law"))\n\n\nif __name__ == "__main__":\n    unittest.main()\n''',encoding='utf-8')
          PY
          python -m py_compile update_market_prices.py test_packmagik_market_parser_v353.py
          python test_packmagik_market_parser_v353.py
      - name: Commit repaired final tree without this one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/fix-packmagik-parser-once.yml
          git add update_market_prices.py test_packmagik_market_parser_v353.py
          git commit -m 'fix: repair Pack Magik OP14-009 market parser'
          git push origin HEAD:fix/packmagik-psa-fallback-20260929
