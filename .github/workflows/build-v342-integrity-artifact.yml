name: Build v342 integrity artifact

on:
  push:
    branches: [fix/runtime-hardening-v341]
    paths:
      - '.github/workflows/build-v342-integrity-artifact.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Generate manifest for final tree without this temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/build-v342-integrity-artifact.yml
          python - <<'PY'
          import json
          from pathlib import Path
          import fault_injection_healing as healing
          root=Path('.').resolve()
          target=root/'integrity_manifest.json'
          payload=healing.build_integrity_manifest(root,target)
          result=healing.diagnose_integrity(root,target)
          if not result.get('ok'):
              raise SystemExit(result)
          temp='.github/workflows/build-v342-integrity-artifact.yml'
          if temp in payload.get('files',{}):
              raise SystemExit('temporary workflow leaked into final manifest')
          current={p.relative_to(root).as_posix() for p in healing.tracked_files(root)}
          listed=set(payload.get('files',{}))
          if listed != current:
              raise SystemExit(f'manifest coverage mismatch missing={sorted(current-listed)[:10]} extra={sorted(listed-current)[:10]}')
          print({'manifest_ok':True,'tracked_files':len(current)})
          PY
          bash -n TABLET_SCHEDULED_UPDATE.sh
          node --check sw.js
          python -m unittest -v test_runtime_hardening_v341.py test_tablet_scheduled_update_v256.py test_tablet_gpt_tcg_grader_sync_v339.py
      - name: Upload exact final-tree manifest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: v342-integrity-manifest
          path: integrity_manifest.json
          if-no-files-found: error
          retention-days: 1
