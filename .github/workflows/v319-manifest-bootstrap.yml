name: V319 Manifest Bootstrap

on:
  workflow_dispatch:
  push:
    branches:
      - fix/grading-watch-protected-publish-v319
    paths:
      - '.github/workflows/v319-manifest-bootstrap.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/grading-watch-protected-publish-v319
          fetch-depth: 2

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'

      - name: Validate final workflow contract
        run: |
          python -m py_compile test_grading_company_watch_protected_publish_v319.py fault_injection_healing.py
          python -m unittest -v test_grading_company_watch_protected_publish_v319.py

      - name: Remove bootstrap and regenerate exact final manifest
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/v319-manifest-bootstrap.yml
          python fault_injection_healing.py --manifest
          python fault_injection_healing.py --diagnose
          git add -- integrity_manifest.json
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore: refresh v319 protected-watch integrity snapshot'
          git push origin HEAD:fix/grading-watch-protected-publish-v319
