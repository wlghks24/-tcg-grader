name: Fix Release Parser Syntax v203
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-release-parser-syntax-v203.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Repair Python 3.11 incompatible parser expression
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('update_releases.py')
          s=p.read_text(encoding='utf-8')
          old='''    for title,code,y,m,d,price in pattern.findall(text):\n        row={"game":"ONE PIECE","region":"JP","name":f"{re.sub(r'\\s+',' ',title).strip()} [{code}]",\n             "price":f"¥{price}/팩","status":"공식 확인","source":url}\n'''
          new='''    for title,code,y,m,d,price in pattern.findall(text):\n        clean_title=re.sub(r"\\s+", " ", title).strip()\n        row={"game":"ONE PIECE","region":"JP","name":f"{clean_title} [{code}]",\n             "price":f"¥{price}/팩","status":"공식 확인","source":url}\n'''
          if old not in s:
              raise SystemExit('expected syntax-bug pattern not found')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
      - name: Compile release collector on Python 3.11
        run: python -m py_compile update_releases.py
      - name: Compile core self-healing modules
        run: python -m py_compile collector_self_healing.py auto_update_all.py auto_repair_engine.py tcg_updater.py
      - name: Commit fix
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add update_releases.py
          git commit -m 'fix: restore Python 3.11 release parser compatibility v203'
          git push origin HEAD:main
