name: One-shot v239 provider parser revision

on:
  push:
    branches:
      - selfrefine/psa-bgs-official-source-v238
    paths:
      - '.github/workflows/v239-provider-parser-revision.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: selfrefine/psa-bgs-official-source-v238
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'
      - name: Apply provider parser revision guard
        run: python v239_provider_parser_revision.py
      - name: Verify targeted grading watcher regression
        run: |
          set -euo pipefail
          python -m py_compile grading_company_watch.py test_grading_company_watch_v215.py
          python -m unittest -v test_grading_company_watch_v215.py test_grading_watch_integration_v220.py
          git diff --check
      - name: Commit verified patch and remove one-shot helpers
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm v239_provider_parser_revision.py .github/workflows/v239-provider-parser-revision.yml
          git add grading_company_watch.py test_grading_company_watch_v215.py
          git diff --cached --check
          git commit -m 'fix: isolate grading parser revision baselines'
          git push origin HEAD:selfrefine/psa-bgs-official-source-v238
