name: Apply multi-route TCG discovery

on:
  push:
    branches: [main]
    paths:
      - 'multi_route_event_discovery.py'
      - 'event_gap_learning.py'
      - 'social_event_discovery.py'
      - 'update_promo_events.py'
      - 'promo_events.json'
      - 'social_source_registry.json'
      - 'adaptive_collection_learner.py'
      - 'collection_meta_learning.py'
      - 'test_multi_route_event_discovery.py'
      - 'test_event_gap_learning.py'
      - 'test_social_event_topic_coverage.py'
      - 'test_jump_shop_event_watch.py'
      - 'apply_multi_route_event_patch.py'
      - '.github/workflows/apply-multi-route-event-discovery.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Apply integration patch
        run: python apply_multi_route_event_patch.py
      - name: Verify syntax
        run: |
          python -m py_compile multi_route_event_discovery.py event_gap_learning.py social_event_discovery.py update_promo_events.py
      - name: Run route and regression tests
        run: |
          python -m unittest -v test_multi_route_event_discovery.py
          python -m unittest -v test_event_gap_learning.py
          python -m unittest -v test_social_event_topic_coverage.py
          python -m unittest -v test_jump_shop_event_watch.py
          if [ -f test_playgo_event_watch.py ]; then python -m unittest -v test_playgo_event_watch.py; fi
      - name: Verify integration markers
        run: |
          grep -q 'route_diversity' social_event_discovery.py
          grep -q 'v129-topic-matrix-gap-recovery' social_event_discovery.py
          grep -q 'COVERAGE_TOPICS' multi_route_event_discovery.py
          grep -q 'topic_coverage' social_event_discovery.py
          grep -q 'existing_evidence_host' social_event_discovery.py
          grep -q 'per_group_floor = 4' social_event_discovery.py
      - name: Commit integrated changes
        run: |
          if git diff --quiet -- social_event_discovery.py; then
            echo 'Already integrated'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add social_event_discovery.py
          git commit -m 'feat: integrate resilient multi-route TCG discovery'
          git push
