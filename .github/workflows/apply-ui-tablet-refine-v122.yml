name: Apply UI tablet refine v122
on:
  push:
    branches: [main]
    paths:
      - 'ui_tablet_refine_v122.css'
      - 'apply_ui_tablet_refine_v122.py'
      - 'test_ui_tablet_refine_v122.py'
      - '.github/workflows/apply-ui-tablet-refine-v122.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Apply tablet UI patch
        run: |
          if grep -q 'ui_tablet_refine_v122.css?v=122' index.html; then
            echo 'Tablet UI already integrated; validation only'
          else
            python apply_ui_tablet_refine_v122.py
          fi
      - name: Verify Python syntax
        run: python -m py_compile tcg_updater.py apply_ui_tablet_refine_v122.py test_ui_tablet_refine_v122.py
      - name: Run tablet UI tests
        run: |
          python - <<'PY'
          import test_ui_tablet_refine_v122 as t
          t.test_ui_link_present()
          t.test_server_allows_css()
          t.test_service_worker_caches_css()
          t.test_screenshot_fixes_present()
          print('v122 tablet UI tests passed')
          PY
      - name: Commit integrated files
        run: |
          if git diff --quiet -- index.html tcg_updater.py sw.js; then
            echo 'No integration changes needed'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html tcg_updater.py sw.js
          git commit -m 'style: refine tablet layout from real screenshots'
          git push
