name: V386 Pokemon KR Official Alias Finalizer

on:
  push:
    branches:
      - fix/pokemon-kr-official-source-fallback-v386

permissions:
  contents: write

concurrency:
  group: v386-pokemon-kr-official-alias-finalizer
  cancel-in-progress: true

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Remove one-shot finalizer from final tree
        shell: bash
        run: |
          set -euo pipefail
          git rm -- .github/workflows/v386-pokemon-kr-official-alias-finalizer.yml
      - name: Compile changed collectors
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile             release_history_backfill.py             update_promo_events.py             update_purchase_sources.py             multi_route_event_discovery.py             social_event_discovery.py             validate_external_links.py             test_pokemon_kr_official_alias_recovery_v386.py             test_collection_scope_compat_v214.py             test_release_history_coverage_v4.py             test_0600_operational_refresh_v25.py
      - name: Run Pokémon KR targeted and collection regressions
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest -v             test_pokemon_kr_official_alias_recovery_v386.py             test_collection_scope_compat_v214.py             test_release_history_coverage_v4.py             test_0600_operational_refresh_v25.py
      - name: Confirm Tablet GPT exact lineage remains unaffected
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest -v             test_tablet_gpt_tcg_grader_sync_v383.py             test_tablet_gpt_tcg_grader_sync_v384.py
          python quality_review_policy.py --check
      - name: Rebuild exact integrity manifest
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import fault_injection_healing as healing
          root = Path('.').resolve()
          healing.build_integrity_manifest(root, root / 'integrity_manifest.json')
          PY
          python repository_integrity_guard.py
      - name: Commit exact final tree
        shell: bash
        run: |
          set -euo pipefail
          git status --short
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "chore: finalize V386 complete Pokémon KR route recovery"
          git push origin HEAD:fix/pokemon-kr-official-source-fallback-v386
