name: Workflow Debt Audit v242

on:
  push:
    branches:
      - cleanup/apply-workflow-debt-v242
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'
      - name: Compile audit
        run: python -m py_compile audit_apply_workflow_debt.py
      - name: Classify apply workflow debt
        run: python audit_apply_workflow_debt.py
      - name: Upload audit report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: apply-workflow-debt-audit-v242
          path: APPLY_WORKFLOW_DEBT_AUDIT.json
          if-no-files-found: error
          retention-days: 30
