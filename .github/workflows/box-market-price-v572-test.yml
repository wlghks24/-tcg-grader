name: BOX Market Price Evidence V572
on:
  pull_request:
    branches: [main]
    paths:
      - 'box_knowledge_stats.js'
      - 'box_knowledge_stats.css'
      - 'test_box_market_freshness_v535.py'
      - 'sync_v376_successor_test_support.py'
      - 'TCG_CROSSCHECK/**'
      - 'execution/test_tablet_gpt_tcg_grader_sync_v572.py'
      - '.github/workflows/box-market-price-v572-test.yml'
permissions:
  contents: read
jobs:
  box-price:
    name: BOX Price Evidence & UI Regression
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: JavaScript syntax
        run: node --check box_knowledge_stats.js
      - name: Python source syntax
        run: python -m py_compile sync_v376_successor_test_support.py test_box_market_freshness_v535.py execution/test_tablet_gpt_tcg_grader_sync_v572.py
      - name: Check exact manifest hashes and report useful diagnostics
        run: |
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          m=json.loads(Path("integrity_manifest.json").read_text(encoding="utf-8"))
          paths=["box_knowledge_stats.js","test_box_market_freshness_v535.py","sync_v376_successor_test_support.py",
                 "TCG_CROSSCHECK/TABLET_GPT_TCG_GRADER_SYNC_CONTRACT_V572.json",
                 "TCG_CROSSCHECK/TABLET_GPT/learning_snapshot_v572_delta.json",
                 "TCG_CROSSCHECK/TCG_GRADER/tablet_gpt_learning_receipt_v572.json",
                 "execution/test_tablet_gpt_tcg_grader_sync_v572.py"]
          mismatches=[]
          for path in paths:
              blob=Path(path).read_bytes()
              current={"sha256":hashlib.sha256(blob).hexdigest(),"bytes":len(blob)}
              expected=m["files"].get(path)
              print(path, "current", current,"manifest",expected)
              if current!=expected: mismatches.append(path)
          assert not mismatches, "manifest mismatch: "+",".join(mismatches)
          PY
      - name: BOX price regression & strict successor
        run: |
          python -m unittest -v test_box_market_freshness_v535.py
          python execution/test_tablet_gpt_tcg_grader_sync_v572.py
