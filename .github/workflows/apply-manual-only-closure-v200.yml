name: Apply manual-only closure v200

on:
  push:
    branches: [main]
    paths:
      - 'apply_manual_only_closure_v200.py'
      - '.github/workflows/apply-manual-only-closure-v200.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply v200
        run: python apply_manual_only_closure_v200.py
      - name: Verify syntax
        run: |
          node --check manual_dual_photo_bridge.js
          node --check graded_photo_dashboard.js
          node --check auto_validation_flow.js
          python -m py_compile tcg_updater_v135.py
      - name: Verify manual-only runtime closure
        run: |
          python - <<'PY'
          from pathlib import Path
          dual=Path('manual_dual_photo_bridge.js').read_text(encoding='utf-8')
          dash=Path('graded_photo_dashboard.js').read_text(encoding='utf-8')
          wrapper=Path('tcg_updater_v135.py').read_text(encoding='utf-8')
          ui=Path('auto_validation_flow.js').read_text(encoding='utf-8')
          index=Path('index.html').read_text(encoding='utf-8')
          assert '/api/verify-grading-cert' not in ui
          assert "if path == '/api/verify-grading-cert':" not in wrapper
          assert '_guarded_official_lookup' not in wrapper
          assert 'guarded_verifier' not in wrapper
          assert 'verifier=None' in wrapper
          assert 'verifiedSlabRawLearning:false' in dual
          for bad in ('verifiedSlabRawLearning:true','RAW학습 활성','RAW학습 누적','RAW 결함·등급 보정학습에도 사용'):
              assert bad not in dual, bad
          text='수동 공식검증 캡처는 RAW 등급 보정값에 직접 투입하지 않습니다.'
          assert text in dual
          assert text in dash
          for asset in ('auto_validation_flow.js?v=200','graded_photo_dashboard.js?v=200','manual_dual_photo_bridge.js?v=200'):
              assert asset in index, asset
          PY
      - name: Verify clean patch
        run: git diff --check
      - name: Commit runtime closure
        run: |
          if git diff --quiet -- manual_dual_photo_bridge.js graded_photo_dashboard.js tcg_updater_v135.py index.html; then
            echo 'No runtime change needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add manual_dual_photo_bridge.js graded_photo_dashboard.js tcg_updater_v135.py index.html
          git commit -m 'fix: close manual-only certification paths v200'
          git pull --rebase origin main
          git push origin HEAD:main
