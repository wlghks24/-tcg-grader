name: V957 Offline Catalog Identity Row Isolation

on:
  pull_request:
    paths:
      - 'execution/tablet_catalog_bridge.py'
      - 'execution/tests/test_tablet_catalog_bridge.py'
      - '.github/workflows/v957-catalog-identity-offline.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v957-catalog-${{ github.ref }}
  cancel-in-progress: true

jobs:
  catalog-identity:
    name: V957 Catalog Identity Offline Regression
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'
      - name: Install existing audited image fixture dependency
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Validate malformed metadata cannot hide valid catalog rows
        run: |
          python -m py_compile execution/tablet_catalog_bridge.py execution/tests/test_tablet_catalog_bridge.py
          python -m unittest -v execution.tests.test_tablet_catalog_bridge
          git diff --check
          git diff --exit-code -- market_watch.json market_prices.json releases.json tcg_game_registry.json
