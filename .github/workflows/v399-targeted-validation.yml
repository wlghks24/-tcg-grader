name: V399 Targeted Validation
on:
  push:
    branches:
      - feature/tablet-autonomous-evolution-v396
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Compile V399 and sync support
        run: |
          python -m py_compile             tablet_autonomous_evolution_v399.py             sync_v376_successor_test_support.py             test_tablet_autonomous_evolution_v399.py             test_tablet_autonomy_dashboard_v399.py             test_tablet_gpt_tcg_grader_sync_v392.py
          node --check tablet_autonomy_dashboard_v399.js
      - name: Run V399 targeted tests
        run: |
          python tablet_autonomous_evolution_v399.py --self-test
          python -m unittest -v             test_tablet_autonomous_evolution_v399.py             test_tablet_autonomy_dashboard_v399.py             test_tablet_gpt_tcg_grader_sync_v392.py
      - name: Run sync successor regression V377-V392
        run: |
          python -m unittest -v             test_tablet_gpt_tcg_grader_sync_v377.py             test_tablet_gpt_tcg_grader_sync_v378.py             test_tablet_gpt_tcg_grader_sync_v379.py             test_tablet_gpt_tcg_grader_sync_v380.py             test_tablet_gpt_tcg_grader_sync_v381.py             test_tablet_gpt_tcg_grader_sync_v382.py             test_tablet_gpt_tcg_grader_sync_v383.py             test_tablet_gpt_tcg_grader_sync_v384.py             test_tablet_gpt_tcg_grader_sync_v385.py             test_tablet_gpt_tcg_grader_sync_v386.py             test_tablet_gpt_tcg_grader_sync_v387.py             test_tablet_gpt_tcg_grader_sync_v388.py             test_tablet_gpt_tcg_grader_sync_v389.py             test_tablet_gpt_tcg_grader_sync_v390.py             test_tablet_gpt_tcg_grader_sync_v391.py             test_tablet_gpt_tcg_grader_sync_v392.py
      - name: Runtime manifest and final tablet checks
        run: |
          python tablet_runtime_manifest.py --check --compile
          bash VERIFY_TABLET_FINAL.sh
