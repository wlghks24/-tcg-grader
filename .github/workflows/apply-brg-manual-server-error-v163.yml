name: Apply BRG manual verification fix v163

on:
  push:
    paths:
      - '.github/workflows/apply-brg-manual-server-error-v163.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply BRG fix
        run: python apply_brg_manual_server_error_v163.py

      - name: Validate BRG fix
        run: |
          python -m py_compile pending_official_candidate_v161.py
          node --check pending_official_candidate_bridge_v161.js
          python -m unittest -v test_brg_manual_server_error_v163.py

      - name: Commit BRG fix
        run: |
          if git diff --quiet -- pending_official_candidate_v161.py pending_official_candidate_bridge_v161.js test_brg_manual_server_error_v163.py; then
            echo 'Already applied'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pending_official_candidate_v161.py pending_official_candidate_bridge_v161.js test_brg_manual_server_error_v163.py
          git commit -m 'fix: handle BRG official-site server errors safely v163'
          git push origin HEAD:main
