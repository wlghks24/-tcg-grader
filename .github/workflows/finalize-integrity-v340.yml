name: Finalize Integrity v340

on:
  push:
    branches: [fix/integrity-manifest-completeness-v340]

permissions:
  contents: write

concurrency:
  group: finalize-integrity-v340
  cancel-in-progress: true

jobs:
  finalize:
    if: github.repository == 'wlghks24/-tcg-grader'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact repair branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'

      - name: Compile changed integrity code before finalization
        run: |
          set -euo pipefail
          python -m py_compile repository_integrity_guard.py test_repository_selfrefine_v13.py fault_injection_healing.py

      - name: Remove one-shot workflow and rebuild final-tree manifest
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = "fix/integrity-manifest-completeness-v340"
          git rm -- .github/workflows/finalize-integrity-v340.yml
          python fault_injection_healing.py --manifest
          python repository_integrity_guard.py
          python -m unittest -v test_repository_selfrefine_v13.py
          python verify_fault_injection_healing.py
          git diff --check

      - name: Commit finalized manifest to repair branch only
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = "fix/integrity-manifest-completeness-v340"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- integrity_manifest.json
          if git diff --cached --quiet; then
            echo 'No finalization changes to commit.'
            exit 0
          fi
          git commit -m 'Finalize v340 integrity manifest'
          git push origin "HEAD:${GITHUB_REF_NAME}"
