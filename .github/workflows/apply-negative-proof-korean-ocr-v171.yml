name: Apply Korean official no-record OCR v171

# Legacy integrated feature: automatic source mutation is disabled; run manually only.
on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write
  checks: read

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Install test dependency
        run: python -m pip install --disable-pip-version-check pillow
      - name: Apply patch
        run: python apply_negative_proof_korean_ocr_v171.py
      - name: Verify
        run: |
          python -m py_compile pending_official_candidate_v161.py
          python -m unittest -v test_negative_proof_korean_ocr_v171.py
          grep -F 'kor+eng' pending_official_candidate_v161.py
          grep -F 'korean_tessdata_missing' pending_official_candidate_v161.py
      - name: Commit
        run: |
          if git diff --quiet -- pending_official_candidate_v161.py; then
            echo 'No patch changes needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pending_official_candidate_v161.py
          git commit -m 'fix: read Korean no-record official screenshots v171'
          GH_TOKEN="${{ github.token }}" bash scripts/publish_candidate_pr.sh
