name: Apply Korean official no-record OCR v171

on:
  push:
    branches: [main]
    paths:
      - 'apply_negative_proof_korean_ocr_v171.py'
      - 'test_negative_proof_korean_ocr_v171.py'
      - '.github/workflows/apply-negative-proof-korean-ocr-v171.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Install test dependency
        run: python -m pip install --disable-pip-version-check pillow
      - name: Apply patch
        run: python apply_negative_proof_korean_ocr_v171.py
      - name: Verify
        run: |
          python -m py_compile pending_official_candidate_v161.py
          python -m unittest -v test_negative_proof_korean_ocr_v171.py
          grep -F 'kor+eng' pending_official_candidate_v161.py
          grep -F 'korean_tessdata_missing' pending_official_candidate_v161.py
      - name: Commit
        run: |
          if git diff --quiet -- pending_official_candidate_v161.py; then
            echo 'No patch changes needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pending_official_candidate_v161.py
          git commit -m 'fix: read Korean no-record official screenshots v171'
          git push origin HEAD:main
