<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; connect-src 'self'; img-src 'self'; font-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'; object-src 'none'">
<title>TCG 카드 · BOX · 행사 통합 갤러리 V676</title>
<link rel="stylesheet" href="tablet_unified_gallery_v676.css">
<script src="tablet_unified_gallery_v676.js" defer></script>
</head>
<body>
<main id="fusion-app" class="fusion-shell">
  <header class="fusion-hero">
    <div class="fusion-label">TABLET TCG · READ ONLY</div>
    <h1>내 카드 자료를 <span>한눈에.</span></h1>
    <p>카드 · BOX · 행사와 로컬 이미지를 함께 봅니다. 출처가 없으면 추정하지 않습니다.</p>
    <div class="fusion-hero-foot"><span class="fusion-dot"></span> 기존 자동수집·학습 모델 보호 <a href="/">기존 화면</a></div>
  </header>
  <section class="fusion-toolbar" aria-label="카드 자료 필터">
    <div class="fusion-section-label">게임</div>
    <nav class="fusion-tabs" aria-label="게임 선택">
      <button type="button" data-fusion-filter="game" data-value="ALL" aria-pressed="true">전체</button>
      <button type="button" data-fusion-filter="game" data-value="pokemon" aria-pressed="false">포켓몬</button>
      <button type="button" data-fusion-filter="game" data-value="onepiece" aria-pressed="false">원피스</button>
      <button type="button" data-fusion-filter="game" data-value="naruto" aria-pressed="false">나루토</button>
    </nav>
    <div class="fusion-section-label">국가 · 판본</div>
    <nav class="fusion-tabs" aria-label="국가별 보기">
      <button type="button" data-fusion-filter="region" data-value="ALL" aria-pressed="true">전체</button>
      <button type="button" data-fusion-filter="region" data-value="KR" aria-pressed="false">한국</button>
      <button type="button" data-fusion-filter="region" data-value="JP" aria-pressed="false">일본</button>
      <button type="button" data-fusion-filter="region" data-value="US" aria-pressed="false">미국</button>
      <button type="button" data-fusion-filter="region" data-value="CN" aria-pressed="false">중국</button>
    </nav>
    <div class="fusion-section-label">자료 종류</div>
    <nav class="fusion-tabs" aria-label="자료 종류 선택">
      <button type="button" data-fusion-filter="type" data-value="ALL" aria-pressed="true">전체</button>
      <button type="button" data-fusion-filter="type" data-value="CARD" aria-pressed="false">카드·프로모</button>
      <button type="button" data-fusion-filter="type" data-value="BOX" aria-pressed="false">BOX·제품</button>
      <button type="button" data-fusion-filter="type" data-value="EVENT" aria-pressed="false">행사·콜라보</button>
    </nav>
    <label class="fusion-search-label" for="fusion-query">카드명 · 상품 코드 · 세트 · 세대 검색</label>
    <input id="fusion-query" type="search" maxlength="80" placeholder="예: 피카츄, OPK-14, 30주년">
  </section>
  <section class="fusion-results" aria-live="polite">
    <div class="fusion-result-top">
      <div>
        <h2>자료 갤러리</h2>
        <p id="fusion-status" role="status">로컬 자료 확인 준비 중</p>
      </div>
      <button id="fusion-refresh" type="button">새로고침</button>
    </div>
    <p id="fusion-count" class="fusion-counter">0개 표시</p>
    <div id="fusion-list" class="fusion-grid"></div>
    <button type="button" id="fusion-more" hidden>24개 더 보기</button>
  </section>
  <footer class="fusion-footer">표시가격은 실거래나 예상 매도가가 아닙니다. 등급 예측에는 검증된 실물 앞·뒷면 사진과 독립 평가 데이터가 필요합니다. 이 화면은 정보 조회 전용이며 다운로드·학습·재시작을 실행하지 않습니다.</footer>
</main>
</body>
</html>
